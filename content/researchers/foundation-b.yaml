  - id: researcher.sepp-hochreitner
    version: 1
    displayName: Sepp Hochreitner
    inspirationName: Sepp Hochreiter
    inspirationSummary: LSTM co-inventor and JKU institute head whose gated architecture solved long-range credit assignment, then returned decades later as xLSTM.
    epithet: The Gatekeeper of Memory
    role: Recurrent architectures and long-range credit assignment
    rosterCardSummary: The LSTM co-inventor who gave neural networks gates for long-term memory, then returned decades later with xLSTM rather than declaring the architecture finished.
    biography: >-
      Sepp Hochreiter identified the vanishing-gradient problem in his 1991 diploma work, before
      most of the field had learned to name it. With Jürgen Schmidhuber he developed long short-term
      memory, whose learned gates decide what enters, persists, and leaves a recurrent network. The
      1997 LSTM paper became a foundation for speech and language systems that needed information
      to survive long sequences. The original cell preserved error flow through a constant
      self-connection, while input and output gates protected stored information; xLSTM later added
      exponential gating and revised memory structures for modern scale and throughput. Since 2006
      Sepp has led the Institute for Machine Learning at Johannes Kepler University Linz and directs
      its LIT AI Lab. Decades after LSTM, his team returned with xLSTM, a scalable revision of the
      same architectural family. Apparently a memory mechanism this durable was not going to forget
      its own second act.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.70 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.11, baseSigningCash: 10, auraCost: 16, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 4, reinforcementAgency: 2, multimodality: 4, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 2, alignmentControl: 2, interpretabilityEvals: 5, securityContainment: 0, training: 4, product: 1, management: 2, politics: 1 }
