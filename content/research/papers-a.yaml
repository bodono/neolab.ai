  - id: paper.q-learning
    version: 1
    historicity: real
    gameOrder: 50
    title: "Q-Learning"
    authors: [Christopher J. C. H. Watkins, Peter Dayan]
    publicationYear: 1992
    venue: Machine Learning, Volume 8
    primarySourceUrl: https://doi.org/10.1007/BF00992698
    doi: "10.1007/BF00992698"
    historicalNote: >-
      Published in 1992, this paper formalised Q-learning and proved its convergence, giving
      reinforcement learning a simple, model-free algorithm that remains a reference point for
      the field decades later.
    education:
      playerSummary: >-
        Watkins and Dayan formalised a way for an agent to learn the long-run value of taking a
        given action in a given state, purely from trial and error, without needing a model of
        the environment's dynamics. They proved this estimate converges to the optimal value
        under mild conditions, giving reinforcement learning a rigorous, practical foundation.
      archiveExplanation: >-
        Earlier work on trial-and-error learning lacked a simple algorithm with a clean
        convergence guarantee for delayed, sequential rewards. Watkins and Dayan's Q-learning
        update repeatedly refines an estimate of each state-action pair's long-run value using
        only the reward observed and the estimated value of the next state, requiring no model of
        how the environment behaves.

        The paper proved that, so long as every action is tried in every state sufficiently often,
        this estimate converges to the true optimal values with probability one. That guarantee,
        combined with the algorithm's simplicity, made Q-learning the reference starting point for
        essentially all model-free reinforcement learning that followed, including its much later
        deep-network successors.

        The original algorithm assumed a small, discrete table of states and actions; it said
        nothing about how to scale to the enormous state spaces of real games or robots. Neolab.ai
        treats this paper as the conceptual root of the reinforcement-agency domain, unlocked
        early and cheaply, with the scaling problem left for much later research to solve.
      insideBaseball: The convergence proof holds "with probability one." The research team has learned not to promise this about quarterly deadlines.
