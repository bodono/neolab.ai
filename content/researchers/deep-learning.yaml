  - id: researcher.ash-vashwani
    version: 1
    displayName: Ash Vashwani
    inspirationName: Ashish Vaswani
    inspirationSummary: Transformer paper lead author and Essential AI co-founder and CEO, with research spanning attention, scaling, and sequence modelling.
    epithet: The Attention Cartographer
    role: Architectures, language, and sequence modelling
    rosterCardSummary: A transformer co-architect whose protected focus improves architecture research while attention's parallelism raises fleet-wide throughput.
    biography: >-
      Ashish Vaswani helped replace the sequence modeller's relay race with a room where every token
      can look at every other token. Ashish Vaswani led the eight-author “Attention Is All You
      Need” paper at Google Brain. It introduced the transformer, an encoder-decoder architecture
      based on attention rather than recurrence or convolution, and reported stronger translation
      results with more parallelisable training. The paper demonstrated strong
      translation results after twelve hours of training. He later co-founded Adept with Niki
      Parmar and David Luan to build models that act through software, then co-founded Essential AI
      with Parmar. Essential identifies Vaswani as its CEO and describes its work as open models,
      tooling, reproducible pipelines, and evaluation frameworks for frontier research. Across
      those projects, Vaswani's architectural instinct is consistent: remove the inherited
      bottleneck, test whether the simpler system actually works, and give every token enough
      attention to discover which head has quietly become a committee.
    availability:
      wave: deep-learning
      earliestYear: 2016
      unlockAny: [{ domainLevelAtLeast: 12 }, { discoveredTag: deep-representation-landmark }]
      poolWeight: 0.85
    contract: { band: major, baseSalaryPerCycle: 0.92, baseSigningCash: 8, auraCost: 13, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 4, reinforcementAgency: 1, multimodality: 5, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 2, alignmentControl: 1, interpretabilityEvals: 2, securityContainment: 0, training: 5, product: 2, management: 3, politics: 0 }
    traits: [trait.architecture-simplifier, trait.protected-focus]
    signature:
      id: ability.attend-to-everything
      label: Attend to Everything
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.architectures] }
      rampWeeks: 4
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.parallel-sequence
      label: Parallel Sequence
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.06, stackingGroup: training-throughput }
    compact:
      id: compact.protected-focus
      label: Protected Focus
      requirement: Once assigned to Novel Architectures, retain that assignment for at least thirteen weeks before a voluntary transfer.
      cadence: one-time
      check: { type: minimum-assignment-duration, domain: domain.architectures, weeks: 13 }
      breachEvent: people.compact.protected-focus
    paperHooks:
      ids: [paper.neural-attention-translation, paper.transformer, paper.sparse-mixture-of-experts]
    eventReactions:
      - { triggerTag: recurrent-bottleneck, line: "The sequence is conceptually ordered. The hardware does not need to wait politely for every token." }
      - { triggerTag: architecture-race, line: "Protected focus is not secrecy. Publish the result when we understand which simplification actually mattered." }
      - { triggerTag: attention-interpretability, line: "An attention map is useful evidence. It is not a notarised transcript of cognition." }
    feedLines:
      - Ash removed recurrence and the training scheduler has sent flowers.
      - Eight attention heads are active; the ninth is a meeting about what the first eight learned.
      - Novel Architectures received protected focus and immediately became, by internal estimates, considerably more novel.
      - Sequence training has six percent more throughput and is much easier to draw as rectangles.
      - The positional encoding works. Facilities has stopped rotating the desks as an alternative.
      - Ash asked the architecture team to remove one assumption before adding two trillion parameters.
    portrait:
      assetId: portrait.researcher.ash-vashwani
      brief: Crisp 8-bit editorial portrait; South Asian man with short dark hair and a focused expression, overlaid with orange attention lines connecting a sequence grid; modern and precise, not photoreal.
      altText: Pixel-art portrait of Ash Vashwani over a sequence grid connected by orange self-attention lines.
    sources:
      - https://papers.nips.cc/paper_files/paper/2017/hash/3f5ee243547dee91fbd053c1c4a845aa-Abstract.html
      - https://research.google/pubs/attention-is-all-you-need/
      - https://www.adept.ai/blog/introducing-adept/
      - https://www.essential.ai/about
      - https://www.businesswire.com/news/home/20231211867788/en/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: audited, tone: audited, reviewedOn: 2026-07-29 }

  - id: researcher.ian-goodfriend
    version: 1
    displayName: Ian Goodfriend
    inspirationName: Ian Goodfellow
    inspirationSummary: GAN inventor and Deep Learning textbook co-author whose work helped establish adversarial-example research and machine-learning security.
    epithet: The Adversary's Adversary
    role: Generative modelling and adversarial robustness
    rosterCardSummary: The GAN inventor pairs generative research with adversarial testing, helping the lab find dangerous model weaknesses before outside attackers find them.
    biography: >-
      Ian Goodfellow turns disagreement between models into an experimental apparatus. During his
      doctorate at Université de Montréal with Yoshua Bengio and Aaron Courville, Ian Goodfellow
      led the work introducing generative adversarial networks: a generator learns against a
      discriminator in a two-player minimax game. He also co-authored work showing why small,
      deliberately chosen perturbations can make neural networks confidently misclassify inputs,
      and his own biography records early defences and research on neural-network security and
      privacy. Earlier work connected Stanford research with Andrew Ng and Gary Bradski to Willow
      Garage. With Bengio and Courville, he wrote the textbook “Deep Learning.” Across those
      contributions, one practical habit recurs: every exciting generator deserves an equally
      motivated opponent. Ian Goodfellow's version of congratulations is a red team with a
      reproducible test case, preferably delivered before launch and before anyone has printed the
      benchmark result on a banner.
    availability:
      wave: deep-learning
      earliestYear: 2014
      unlockAny: [{ domainLevelAtLeast: 12 }, { discoveredTag: deep-representation-landmark }]
      poolWeight: 0.95
    contract: { band: lab-defining, baseSalaryPerCycle: 1.16, baseSigningCash: 11, auraCost: 17, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 4, dataRepresentation: 5, reinforcementAgency: 2, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 2, interpretabilityEvals: 5, securityContainment: 5, training: 4, product: 2, management: 3, politics: 1 }
    traits: [trait.adversarial-instinct, trait.robustness-builder]
    signature:
      id: ability.adversarial-pair
      label: Adversarial Pair
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: paired-allocation-at-least, firstTags: [generative, multimodal], secondProgramme: safety.security-containment, eachShareOfRd: 0.10 }
      rampWeeks: 4
      effects:
        - { target: domain.multimodality.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: safety.security-containment.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.attack-before-launch
      label: Attack Before Launch
      effects:
        - { target: lab.incident.hazard, operation: multiply, value: 0.92 }
    compact:
      id: compact.quarterly-red-team
      label: Annual Red Team
      requirement: After the lab fields a model with a Frontier Estimate of 40 or more (roughly Tier 3 Expert Assistant or above), complete one Behavioural Red Team every 52 weeks.
      check: { type: conditional-tagged-action-within, condition: { metric: lab.model.maxActiveFC, atLeast: 40 }, tags: [behavioural-red-team], weeks: 52 }
      breachEvent: people.compact.quarterly-red-team
    paperHooks:
      ids: [paper.generative-adversarial-nets, paper.variational-autoencoder, paper.deep-q-network]
    eventReactions:
      - { triggerTag: synthetic-media-crisis, line: "The generator is capable. The provenance system is optional only if public trust is also optional." }
      - { triggerTag: jailbreak, line: "A successful attack is an evaluation result with unusually motivated data collection." }
      - { triggerTag: red-team-budget, line: "If the model is too important to attack before launch, it is too important to launch." }
    feedLines:
      - Ian's generator improved; the discriminator has filed a technically excellent objection.
      - Annual red-team review has begun and the product demo has become much more educational.
      - An adversarial input changed one pixel and six roadmap priorities.
      - The generator-versus-discriminator office pool is statistically indistinguishable from research morale.
      - Ian reduced incident risk by finding the embarrassing failure before a customer did.
      - Synthetic media quality rose. The provenance watermark meeting has been upgraded from “later” to “today.”
    portrait:
      assetId: portrait.researcher.ian-goodfriend
      brief: Alert 8-bit editorial portrait; white man with short dark hair and glasses, between mirrored pink and blue generator/discriminator panels; clever and adversarial, not photoreal.
      altText: Pixel-art portrait of Ian Goodfriend between opposing generator and discriminator panels.
    sources:
      - https://www.iangoodfellow.com/bio
      - https://papers.nips.cc/paper_files/paper/2014/hash/f033ed80deb0234979a61f95710dbe25-Abstract.html
      - https://arxiv.org/abs/1412.6572
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: audited, tone: audited, reviewedOn: 2026-07-29 }

  - id: researcher.diederik-kingman
    version: 1
    displayName: Diederik Kingman
    inspirationName: Diederik P. Kingma
    inspirationSummary: Variational autoencoder and Adam co-creator, OpenAI founding-team member, and researcher in scalable generative modelling.
    epithet: The Optimiser's Optimiser
    role: Optimisation and probabilistic generative models
    rosterCardSummary: The co-creator of VAEs and Adam inspires a practical optimisation specialist who makes frontier experiments cheaper and easier to reproduce.
    biography: >-
      Diederik P. Kingma makes difficult mathematics unusually easy to put in a training loop.
      Diederik P. Kingma co-authored “Auto-Encoding Variational Bayes,” introducing a practical
      estimator for learning latent-variable models and helping establish the variational
      autoencoder. With Jimmy Ba, he then introduced Adam, an optimiser that adapts parameter
      updates using estimates of the first and second moments of the gradients. His personal
      biography also records work on Glow and variational diffusion models, a University of
      Amsterdam doctorate with Max Welling, membership of OpenAI's founding team, and later
      generative-model research at Google Brain, DeepMind, and Anthropic. VAE and Adam each later
      received an ICLR Test-of-Time award. Across that work, Kingma repeatedly finds the
      calculation slowing everyone down, replaces it with a clean estimator, and makes the default
      setting good enough that the ablation meeting can begin before lunch.
    availability:
      wave: deep-learning
      earliestYear: 2014
      unlockAny: [{ domainLevelAtLeast: 12 }, { discoveredTag: deep-representation-landmark }]
      poolWeight: 1.15
    contract: { band: major, baseSalaryPerCycle: 0.82, baseSigningCash: 8, auraCost: 12, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 5, reinforcementAgency: 1, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 0, scientificAi: 3, alignmentControl: 1, interpretabilityEvals: 2, securityContainment: 0, training: 5, product: 1, management: 2, politics: 0 }
    traits: [trait.elegant-estimator, trait.cheap-ablation]
    signature:
      id: ability.adaptive-moment
      label: Adaptive Moment
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.optimisation-scaling] }
      rampWeeks: 4
      effects:
        - { target: domain.optimisation-scaling.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.training.technicalFailureHazard, operation: multiply, value: 0.96, stackingGroup: hazard }
    passive:
      id: ability.cheap-ablations
      label: Cheap Ablations
      effects:
        - { target: lab.training.frontier.cashCost, operation: multiply, value: 0.95 }
    compact:
      id: compact.training-cadence
      label: The Cadence
      requirement: Never let more than 26 weeks pass without a training run underway. Progress is a property of the loss curve, not the whiteboard.
      check: { type: tagged-action-within, tags: [training-run-underway], weeks: 26 }
      breachEvent: people.compact.training-cadence
    paperHooks:
      ids: [paper.variational-autoencoder, paper.adam, paper.generative-adversarial-nets]
    eventReactions:
      - { triggerTag: unstable-training, line: "The loss is noisy, not mystical. Let us estimate the moments before founding a new theory of failure." }
      - { triggerTag: ablation-budget, line: "A cheap ablation is not a small experiment. It is a large argument with fewer invoices." }
      - { triggerTag: beautiful-loss-curve, line: "Beautiful is useful. Replicated, calibrated and correctly evaluated would be even more beautiful." }
    feedLines:
      - Diederik adjusted two moving averages and stabilised an experiment previously described as “temperamental.”
      - Prototype ablations now cost a shade less compute and generate no excuses at all.
      - The optimiser required little tuning, creating a temporary surplus of tuning opinions.
      - A latent variable has become both interpretable and useful; a small celebration is being amortised across the team.
      - Diederik's run avoided technical failure. Alignment has reminded everyone it is a separate column.
      - The loss curve is beautifully behaved and has been asked not to become smug.
    portrait:
      assetId: portrait.researcher.diederik-kingman
      brief: Clean 8-bit editorial portrait; white man with short light-brown hair, beside a smooth magenta loss curve and two moving-moment gauges; understated and exact, not photoreal.
      altText: Pixel-art portrait of Diederik Kingman beside a smooth loss curve and adaptive-moment gauges.
    sources:
      - https://dpkingma.com/
      - https://arxiv.org/abs/1312.6114
      - https://arxiv.org/abs/1412.6980
      - https://openai.com/index/introducing-openai/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: audited, tone: audited, reviewedOn: 2026-07-29 }

  - id: researcher.andrey-carpathy
    version: 1
    displayName: Andrey Carpathy
    inspirationName: Andrej Karpathy
    inspirationSummary: OpenAI founding member, former Tesla AI director, Stanford CS231n creator, and widely followed neural-network educator.
    epithet: The From-Scratch Explainer
    role: Vision-language engineering, products, and education
    rosterCardSummary: A neural-network educator and builder whose working demos strengthen model launches and whose from-scratch explanations help research travel further.
    biography: >-
      Andrej Karpathy would like the whiteboard explanation to compile. Andrej Karpathy completed a
      Stanford doctorate with Fei-Fei Li on neural networks spanning vision and language, and
      designed and taught CS231n, Stanford's first deep-learning course. He was a founding member
      of OpenAI, then served as Tesla's Director of AI, leading the computer-vision team responsible
      for neural-network training and deployment in Autopilot. He later returned to OpenAI to build
      a team working on mid-training and synthetic data. Alongside that career, his personal site
      publishes lectures, code, and from-scratch projects including micrograd, char-rnn, and
      ConvNetJS. His doctoral publications included image captioning and dense descriptions of
      regions within images and grounded visual-semantic embedding work. Karpathy's educational
      rhythm is consistent: turn the diagram into a small program, turn the program into a visible
      result, and keep explaining until the demo works without a stagehand quietly restarting it.
    availability:
      wave: deep-learning
      earliestYear: 2015
      unlockAny: [{ domainLevelAtLeast: 12 }, { discoveredTag: deep-representation-landmark }]
      poolWeight: 1.20
    contract: { band: lab-defining, baseSalaryPerCycle: 1.06, baseSigningCash: 10, auraCost: 15, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 4, reinforcementAgency: 1, multimodality: 5, reasoningTools: 5, roboticsEmbodiment: 5, scientificAi: 1, alignmentControl: 1, interpretabilityEvals: 3, securityContainment: 0, training: 4, product: 5, management: 4, politics: 2 }
    traits: [trait.demo-craft, trait.explainer-builder]
    signature:
      id: ability.working-demo
      label: The Demo That Ships
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality] }
      rampWeeks: 4
      effects:
        - { target: aura.firstPublicLaunchGain, operation: multiply, value: 1.112 }
    passive:
      id: ability.explainable-excitement
      label: Explainable Excitement
      effects:
        - { target: lab.research.diffusionRate, operation: add, value: 0.25 }
    compact:
      id: compact.build-it-from-scratch
      label: Build It From Scratch
      requirement: Publish one technical explainer every 52 weeks.
      check: { type: tagged-action-within, tags: [explainer], weeks: 52 }
      fulfilmentEffects:
