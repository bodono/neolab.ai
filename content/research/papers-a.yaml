    education:
      playerSummary: >-
        Fawzi and a DeepMind team adapted AlphaZero's self-play, game-playing approach to a
        single-player game of finding efficient tensor decompositions, each corresponding to a
        provably correct matrix-multiplication algorithm. The resulting system, AlphaTensor,
        discovered new algorithms, including one multiplying four-by-four matrices in 47 steps,
        fewer than the standard Strassen algorithm's 49, and thousands of other efficient algorithms
        across various matrix sizes and hardware targets.
      archiveExplanation: >-
        Matrix multiplication underlies an enormous share of modern computing, so even a small
        reduction in the number of required multiplications, at any matrix size, can save real
        computation at scale, but finding better algorithms had proven a genuinely hard combinatorial
        search problem for decades. Fawzi and colleagues reframed algorithm discovery itself as a
        single-player game: an agent proposes a step in a tensor decomposition, and a correct,
        complete decomposition corresponds directly to a provably correct multiplication algorithm.
        Adapting AlphaZero's self-play tree search to this game let AlphaTensor search a vastly
        larger space of candidate algorithms than prior human or brute-force search had covered.

        The system discovered an algorithm for four-by-four matrix multiplication using 47 scalar
        multiplications, an improvement on the standard Strassen algorithm's 49, and went on to find
        thousands of provably correct algorithms across different matrix sizes, some of which the
        team further tuned to run meaningfully faster on specific real hardware such as GPUs and
        TPUs, demonstrating that the space of matrix-multiplication algorithms was richer than
        previously assumed.

