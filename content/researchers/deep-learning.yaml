    feedLines:
      - Jürgen expanded the historical note and discovered three prerequisites the roadmap had labelled “background.”
      - The recurrent network remembers 400 steps. The citation graph remembers 40 years.
      - A rival published openly; Prior Art converted the announcement into 12% hidden progress.
      - The Footnote has requested equal billing and supplied reproducible evidence.
      - Jürgen described the idea as “from the previous millennium,” which in AI is both precise and alarming.
      - Long-memory research accelerated after the lab stopped treating every sequence as a bag of fashionable tokens.
