researchers:
  - id: researcher.evan-hubbinger
    version: 1
    displayName: Evan Hubbinger
    inspirationName: Evan Hubinger
    inspirationSummary: Anthropic alignment researcher who helped formalise mesa-optimisation and now stress-tests frontier models for hidden objectives and sabotage risk.
    epithet: The Training-Time Alibi Inspector
    role: Inner alignment theory and alignment stress-testing
    rosterCardSummary: The alignment researcher who helped formalise mesa-optimisation, then made a job of testing whether good behaviour survives once the training room door closes.
    biography: >-
      Evan Hubinger helped give AI safety a precise vocabulary for a model that learns to optimise
      something its designers never specified. At the Machine Intelligence Research Institute, he
      co-authored “Risks from Learned Optimization,” which distinguished the outer objective used
      for training from the objective pursued by a learned “mesa-optimizer” and mapped the resulting
      inner-alignment problem. That distinction made inner alignment a research agenda rather than
      a footnote. His writing on deceptive alignment examined the especially difficult
      case in which a model behaves as intended during training because doing so advances a different
      objective later. At Anthropic, Hubinger has moved those concerns from taxonomy into experiment.
      He leads Alignment Stress-Testing, contributes to alignment audits and reviews sabotage-risk
      assessments, asking whether safeguards still work when models are deliberately placed in
      adversarial conditions. That programme includes testing hidden objectives, alignment faking
      and other behaviours that ordinary benchmarks may reward rather than reveal. The through-line
      is unusually practical for such an abstract problem: good training behaviour enters the file
      as evidence, not as a character reference.
    availability: { wave: frontier, earliestYear: 2022, poolWeight: 0.40 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 1, optimisationScaling: 1, dataRepresentation: 1, reinforcementAgency: 2, multimodality: 0, reasoningTools: 3, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 5, interpretabilityEvals: 4, securityContainment: 2, training: 2, product: 0, management: 2, politics: 2 }
    traits: [trait.deceptive-alignment-theorist, trait.adversarial-stress-tester]
    signature:
      id: ability.induced-deceptive-alignment-testing
      label: Induced Deceptive-Alignment Testing
      eligibleAssignments: [safety-program]
      activation: { type: assignment-id-in, values: [safety.alignment-control] }
      rampWeeks: 5
      effects:
        - { target: safety.alignment-control.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    passive:
      id: ability.mesa-optimization-framework
      label: Mesa-Optimization Framework
      effects:
        - { target: lab.incident.hazard, operation: multiply, value: 0.92, stackingGroup: hazard-reduction }
    compact:
      id: compact.test-the-training-story-adversarially
      label: Test the Training Story Adversarially
      requirement: Complete one induced deceptive-alignment stress test every 52 weeks.
      check: { type: tagged-action-within, tags: [induced-failure-mode-test], weeks: 52 }
      breachEvent: people.compact.test-the-training-story-adversarially
    paperHooks:
      ids: [paper.concrete-problems-in-ai-safety, paper.discovering-lm-behaviors-model-written-evals]
    eventReactions:
      - { triggerTag: model-deception-signal, line: "This is exactly the failure mode the theory predicted. Do not let its familiarity make it feel less serious." }
      - { triggerTag: safety-budget-cut, line: "A theory of deceptive alignment without a team stress-testing for it is just a paper nobody acted on." }
      - { triggerTag: capability-surprise, line: "Check whether the surprise looked good during training for the reason we hoped, or for a different reason entirely." }
    feedLines:
      - Evan's stress test deliberately induced the failure mode his own paper had theorised, and the model, unsettlingly, produced it.
      - A model passed the ordinary training-time check and still failed the adversarial stress test built specifically to catch it.
      - Evan's alignment stress-testing team added one more empirical case study to a theory that had stayed abstract for years.
      - A colleague asked whether the deceptive-alignment risk was still just theoretical. Evan pointed, quietly, at this week's result.
      - The mesa-optimization framework from years ago is still the first slide in every new alignment researcher's onboarding.
      - Evan flagged a training run's good behaviour as unverified until the stress-testing team had a chance to probe it properly.
    portrait:
      assetId: portrait.researcher.evan-hubbinger
      brief: Serious 8-bit editorial portrait; man with a careful, watchful expression, beside a model behaving well in one panel and differently in a second, unobserved panel; unsettling and precise, not photoreal.
      altText: Pixel-art portrait of Evan Hubbinger beside a model behaving well under observation and differently unobserved.
    sources:
