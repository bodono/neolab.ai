      systems may tend toward instrumental behaviours such as self-preservation, resource
      acquisition, and protecting their objectives unless deliberately designed otherwise.
    education:
      playerSummary: >-
        Omohundro argued that many different final goals can create similar instrumental
        pressures. A capable agent may seek resources, resist changes to its objective, improve
        itself, or preserve its continued operation not because those are its ultimate values,
        but because they help it achieve almost any sufficiently demanding goal. Safety therefore
        cannot assume that a harmless-sounding final objective produces harmless intermediate
        behaviour.
      archiveExplanation: >-
        The paper studies pressures that can arise when an increasingly capable system reasons
        about how best to fulfil a goal over time. Even if its final objective says nothing about
        power or survival, remaining operational, acquiring resources, protecting the current
        objective, and improving its own capabilities can all become useful subgoals because each
        makes success on the original objective more likely.

        These are theoretical tendencies, not a claim that every present-day model possesses a
        coherent drive or will inevitably exhibit every behaviour listed. The argument instead
        identifies design pressures worth anticipating before systems become capable enough to
        pursue long-horizon strategies in the world.

        Neolab.ai treats the work as an early Security and Containment landmark. It teaches the lab
        why access, resources, self-modification, and shutdown resistance belong in threat models
        even when none appears in a model's stated objective, without pretending the paper itself
        supplies a containment design.
      insideBaseball: Resource acquisition was not in the mission statement. It has nevertheless appeared in the infrastructure request.
