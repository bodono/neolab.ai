  - id: researcher.callum-burns
    version: 1
    displayName: Callum Burns
    inspirationName: Collin Burns
    inspirationSummary: Berkeley alignment researcher who developed an unsupervised method for recovering latent knowledge from a language model’s internal activations.
    epithet: The Latent Truth Extractor
    role: Unsupervised honesty and truthfulness research
    rosterCardSummary: A former Rubik’s Cube world-record holder who now solves the harder puzzle of what a model represents internally but declines to say aloud.
    biography: >-
      Collin Burns works on language-model honesty and interpretability at UC Berkeley, where his
      doctoral research is sponsored by Jacob Steinhardt. His best-known paper asked a wonderfully
      awkward question: can a model internally represent the correct answer while saying something
      else? Burns and his co-authors introduced Contrast-Consistent Search, an unsupervised method
      that uses a model’s activations on pairs of opposite statements to recover latent knowledge
      without labelled examples. Across several models and datasets, the method could answer
      yes-or-no questions from internal representations and often outperformed zero-shot prompting.
      The work matters because imitation and human-feedback training can reward answers that repeat
      human mistakes, or mistakes evaluators cannot recognise, even when the model has learned
      information pointing elsewhere. He also studies model honesty and transparency when reliable
      labelled supervision is scarce. Before alignment research, Burns also held the world record
      for a single Rubik’s Cube solve, completing one in 5.25 seconds in 2015. Both achievements
      concern hidden structure, although only one arrives in six colours and can be inspected from
      every side. His research keeps the model’s public answer and internal evidence as two claims
      to test separately.
    availability: { wave: frontier, earliestYear: 2023, poolWeight: 0.40 }
    contract: { band: major, baseSalaryPerCycle: 0.73, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 1, dataRepresentation: 2, reinforcementAgency: 0, multimodality: 0, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 5, interpretabilityEvals: 5, securityContainment: 1, training: 1, product: 0, management: 1, politics: 0 }
    traits: [trait.patient-puzzle-solver, trait.latent-truth-extractor]
    signature:
      id: ability.unsupervised-latent-knowledge-discovery
      label: Unsupervised Latent Knowledge Discovery
      eligibleAssignments: [safety-program]
      activation: { type: assignment-id-in, values: [safety.interpretability-evals] }
      rampWeeks: 4
      effects:
        - { target: safety.interpretability-evals.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.puzzle-solver-patience
      label: Puzzle-Solver Patience
      effects:
        - { target: lab.research.program.base:safety.interpretability-evals.weeklyVarianceWidth, operation: multiply, value: 0.88 }
    compact:
      id: compact.check-what-it-believes-not-just-what-it-says
      label: Check What It Believes, Not Just What It Says
      requirement: Complete one internal-activation honesty check every 52 weeks.
      check: { type: tagged-action-within, tags: [internal-activation-honesty-check], weeks: 52 }
      breachEvent: people.compact.check-what-it-believes-not-just-what-it-says
    paperHooks:
      ids: [paper.discovering-lm-behaviors-model-written-evals, paper.toy-models-of-superposition]
    eventReactions:
      - { triggerTag: model-deception-signal, line: "Check the internal activations, not only the stated answer. Those two things are allowed to disagree, and sometimes do." }
      - { triggerTag: interpretability-breakthrough, line: "A model that says the right thing for the wrong internal reason is a different, more worrying finding than an honest mistake." }
      - { triggerTag: benchmark-record, line: "The model answered correctly. Whether it 'believed' the answer, internally, is still an open and separate question." }
    feedLines:
      - Callum's unsupervised probe found the model's internal activations disagreed quietly with its own stated answer.
      - A yes-or-no question got answered correctly from unlabelled activations alone, with no supervision involved at all.
      - The world-record patience showed up again in how long Callum was willing to sit with one stubborn, ambiguous result.
      - A colleague asked whether the model was lying or simply wrong. Callum's method, for once, could actually distinguish the two.
      - The internal-versus-stated belief gap the compact requires turned up a genuine discrepancy nobody had gone looking for.
      - "Callum solved the underlying puzzle the same patient way he once solved a cube: methodically, and faster than expected."
    portrait:
      assetId: portrait.researcher.callum-burns
      brief: Focused 8-bit editorial portrait; young man with a patient, puzzle-solving expression, beside a model's stated answer and its internal activation pattern shown side by side, subtly disagreeing; quiet and precise, not photoreal.
      altText: Pixel-art portrait of Callum Burns beside a model's stated answer and internal activation pattern shown side by side.
