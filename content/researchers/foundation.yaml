  - id: researcher.leslie-valiante
    version: 1
    displayName: Leslie Valiante
    inspirationName: Leslie Valiant
    inspirationSummary: Turing laureate who defined probably approximately correct learning and reshaped computational learning theory.
    epithet: The Probably Approximately Correct
    role: Learning theory, computational complexity, and biological computation
    rosterCardSummary: Defined what feasible learning means, gave it three carefully chosen words, and left a field several decades of proofs to complete.
    biography: >-
      Leslie Valiant is a Harvard professor whose work connects machine learning and
      computational complexity. His 1984 paper “A Theory of the Learnable” introduced the
      probably approximately correct, or PAC, framework: a mathematical account of when a learner
      can find a sufficiently accurate hypothesis from a feasible number of examples using
      feasible computation. The framework helped establish computational learning theory as a
      field. He also made foundational contributions to complexity theory, including the class
      #P for counting problems, and developed theories of parallel computation and biological
      learning. He has been a member of Harvard's faculty since 1982, working across computer
      science and applied mathematics. In 2010 he received the Turing Award for contributions to
      the theory of computation, including computational learning theory. He later explored
      computational models of biological cognition. His research begins by specifying what
      success, confidence and efficiency mean. Only then does the system receive permission to be
      approximately correct.
