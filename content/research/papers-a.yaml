  - id: paper.random-forests
    version: 1
    historicity: real
    gameOrder: 52
    title: Random Forests
    authors: [Leo Breiman]
    publicationYear: 2001
    venue: Machine Learning, Volume 45
    primarySourceUrl: https://doi.org/10.1023/A:1010933404324
    doi: "10.1023/A:1010933404324"
    historicalNote: >-
      Published in 2001, this paper formalised random forests, an ensemble of randomised decision
      trees that became one of the most widely used, reliably strong general-purpose classifiers
      and regressors in applied machine learning.
    education:
      playerSummary: >-
        Breiman showed that combining many decision trees, each trained on a randomly resampled
        subset of the data and a randomly restricted subset of features, then averaging their
        predictions, produced a classifier that was both highly accurate and resistant to
        overfitting. The technique required little tuning and became a dependable default across
        countless applied problems.
      archiveExplanation: >-
        A single decision tree is easy to interpret but prone to overfitting its training data.
        Breiman's random forests instead grow a large number of trees, each on a bootstrap-resampled
        subset of the training examples and considering only a random subset of features at each
        split, then combine their votes. The randomness decorrelates the trees' individual errors,
        so their averaged prediction is far more stable than any single tree's.

        Breiman proved that a forest's generalisation error converges as more trees are added,
        governed by the strength of the individual trees and the correlation between them, giving
        the method solid theoretical footing alongside its strong empirical performance. It
        required comparatively little hyperparameter tuning and worked well out of the box across
        tabular data, bioinformatics, and countless industrial prediction problems.

        Random forests do not learn hierarchical representations the way deep networks do, and
        they scale awkwardly to unstructured inputs like raw pixels or audio. Neolab.ai treats the
        paper as a modest, dependable data-representation unlock that strengthens the lab's applied
        analytics rather than its frontier capability research.
      insideBaseball: Averaging many imperfect trees outperforms trusting any single perfect-looking one. The board has been informed this applies to forecasts too.
