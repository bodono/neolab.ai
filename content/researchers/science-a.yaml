  - id: researcher.rich-caruano
    version: 1
    displayName: Rich Caruano
    inspirationName: Rich Caruana
    inspirationSummary: Multitask-learning pioneer and interpretable-ML researcher who tests whether an accurate model is right for the right reason.
    epithet: The Wrong-Reason Detector
    role: Multitask learning, interpretable machine learning, and healthcare applications
    rosterCardSummary: A multitask-learning pioneer who distrusts medical models that get the right answer for the wrong reason, especially when the benchmark is trying to look reassuring.
    biography: >-
      Rich Caruana completed his doctorate at Carnegie Mellon, working with Tom Mitchell and Herb
      Simon, and held faculty appointments at Cornell, UCLA's medical school and Carnegie Mellon
      before joining Microsoft Research. His thesis and early papers helped establish multitask
      learning: training related tasks together so that useful structure transfers between them.
      His later work has concentrated on intelligible machine learning, especially for health
      care. In a widely discussed pneumonia-risk example, a highly accurate model learned that
      asthma appeared protective because affected patients received faster, more intensive
      treatment. An interpretable model exposed the misleading pattern before it could be treated
      as medical advice. That case captures his recurring test for high-stakes systems: accuracy
      matters, but so does knowing whether the model reached the right answer for a reason that
      will survive deployment. His broader work includes model compression, ensembles and
      probabilistic prediction. His group developed intelligible generalized additive models whose
      relationships can be inspected, because an accurate answer still needs a reason that survives
      the hospital.
    availability: { wave: frontier, earliestYear: 2018, poolWeight: 0.50 }
