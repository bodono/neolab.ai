    gameOrder: 82
    title: A Simple Framework for Contrastive Learning of Visual Representations
    authors: [Ting Chen, Simon Kornblith, Mohammad Norouzi, Geoffrey Hinton]
    publicationYear: 2020
    venue: arXiv preprint / ICML 2020
    primarySourceUrl: https://arxiv.org/abs/2002.05709
    arxiv: "2002.05709"
    historicalNote: >-
      Posted in 2020, this paper showed that a simplified contrastive self-supervised learning
      recipe, without specialised architectures or memory banks, produced visual representations
      matching a supervised baseline's accuracy.
    education:
      playerSummary: >-
        Chen and colleagues showed that self-supervised visual representation learning could work
        well without specialised architectures or memory banks, using only carefully chosen data
        augmentations, a learnable projection head between representation and loss, and large batch
        sizes trained for longer. The resulting representations, learned without any labels, matched
        a supervised ResNet-50 baseline's accuracy once a simple linear classifier was trained on
        top of them.
      archiveExplanation: >-
        Contrastive self-supervised learning trains a model to recognise that two augmented views
        of the same image are "similar" and views of different images are "different," without
        needing any labels at all. Prior approaches to this idea used increasingly specialised
        architectural tricks and memory banks of past representations to make the contrastive
        objective work well. Chen and colleagues instead identified which ingredients actually
        mattered: strong, carefully composed data augmentations, an additional small nonlinear
        projection head applied before computing the contrastive loss, and simply training with
        larger batches for longer.

        With these ingredients alone, a linear classifier trained on top of the resulting frozen,
        self-supervised representations reached 76.5 percent top-1 accuracy on ImageNet, a
        substantial improvement over previous self-supervised methods and competitive with a fully
        supervised ResNet-50 trained with labels from the start.

        The recipe still required very large batch sizes and long training schedules to reach its
        best results, an expensive trade against its label-free advantage. Neolab.ai treats this as
        a data-representation unlock strengthening the player's ability to exploit unlabelled data
        at scale.
      insideBaseball: The model learns that two crops of the same photo are related without ever being told what either photo shows. Several interns have asked to be trained the same way, budget permitting.
