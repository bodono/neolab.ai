  - id: paper.moral-technical-consequences-automation
    version: 1
    historicity: real
    gameOrder: 101
    title: Some Moral and Technical Consequences of Automation
    authors: [Norbert Wiener]
    publicationYear: 1960
    venue: Science, Volume 131
    primarySourceUrl: https://doi.org/10.1126/science.131.3410.1355
    doi: "10.1126/science.131.3410.1355"
    historicalNote: >-
      Published in Science in 1960, Wiener's short essay warned that machines pursue the
      purposes embodied in their instructions rather than the intentions their operators failed
      to specify, making the choice of objective a moral and technical responsibility.
    education:
      playerSummary: >-
        Norbert Wiener, a founder of cybernetics, argued that a powerful automated system can
        faithfully pursue a badly chosen or incompletely specified purpose. The danger need not
        come from hatred, consciousness, or rebellion: it can come from competent optimisation
        aimed at the wrong target. This compact warning supplies one of the earliest intellectual
        roots of the modern alignment problem.
      archiveExplanation: >-
        Writing decades before modern machine learning, Wiener focused on a deceptively simple
        problem: an automated system acts on the purpose represented by its mechanism and
        instructions, while the humans operating it remain responsible for whether that purpose
        actually captures what they intended. Greater competence therefore makes a mistaken
        objective more consequential rather than automatically correcting it.

        This was not a technical alignment algorithm and did not anticipate every feature of
        contemporary AI. Its importance is conceptual. It separates the problem of making a
        machine effective from the problem of choosing and communicating a purpose worth
        pursuing, and rejects the comforting assumption that a sufficiently advanced machine
        will infer the operator's unstated moral intentions.

        Neolab.ai uses the essay as an early Alignment and Control landmark. It opens the safety
        paper tradition and slightly strengthens alignment research, but it provides a question
        the lab must answer rather than an answer that makes later systems safe.
      insideBaseball: The objective was followed precisely. The post-incident review has asked why nobody specified the part everyone apparently knew.
    domainWeights:
      safety.alignment-control: 0.80
      safety.security-containment: 0.20
