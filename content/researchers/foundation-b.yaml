researchers:
  - id: researcher.alex-krizhensky
    version: 1
    displayName: Alex Krizhensky
    inspirationName: Alex Krizhevsky
    inspirationSummary: AlexNet lead author and CIFAR-10/100 creator whose two-GPU 2012 ImageNet result helped reset modern computer vision.
    epithet: Two GPUs and a Benchmark
    role: Deep convolutional networks and GPU-scale training
    rosterCardSummary: The AlexNet lead author and CIFAR-10/100 creator who used a two-GPU convolutional network to reset ImageNet—and the field's idea of a normal training budget.
    biography: >-
      Alex Krizhevsky made hardware part of the argument. At the University of Toronto, he created
      CIFAR-10 and CIFAR-100 from the 80 Million Tiny Images collection, then joined Ilya Sutskever
      and Geoffrey Hinton on AlexNet. Their 2012 ImageNet system spread a deep convolutional network
      across two GPUs and cut top-five test error to 15.3%, far ahead of the 26.2% runner-up. The
      result did not merely win ILSVRC; it made GPU-trained deep vision the baseline everyone else
      had to answer. Its five convolutional and three fully connected layers used ReLUs, dropout,
      data augmentation, and roughly sixty million parameters—a hardware manifesto. Alex also
      released CUDA implementations behind his experiments, giving other researchers something
      more useful than a slogan: runnable code. Two graphics cards, one benchmark, and a decade of
      computer vision suddenly needed a new plan.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.55 }
    contract: { band: major, baseSalaryPerCycle: 0.78, baseSigningCash: 7, auraCost: 11, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 3, reinforcementAgency: 0, multimodality: 5, reasoningTools: 3, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 5, securityContainment: 0, training: 5, product: 1, management: 1, politics: 0 }
    traits: [trait.hardware-believer, trait.unglamorous-rigour]
    signature:
      id: ability.the-machine-was-the-idea
      label: The Machine Was the Idea
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality, domain.optimisation-scaling] }
      rampWeeks: 4
      effects:
        - { target: domain.optimisation-scaling.researchOutput, operation: multiply, value: 1.03, stackingGroup: programme-rp }
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.04, stackingGroup: gpu-throughput }
    passive:
      id: ability.benchmark-shock
      label: Benchmark Shock
      effects:
        - { target: aura.worldFirstCapabilityPaperGain, operation: multiply, value: 1.08, stackingGroup: aura-gain }
    compact:
      id: compact.two-gpus-and-a-benchmark
      label: Benchmark Before Bragging
      requirement: While he leads Multimodality, complete one GPU-scale vision benchmark run every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: vision-programme, projectTag: vision-benchmark-run, weeks: 52 }
      breachEvent: people.compact.two-gpus-and-a-benchmark
    paperHooks:
      ids: [paper.alexnet, paper.dropout, paper.imagenet-database]
    eventReactions:
      - { triggerTag: research-fad, line: "Fashion changes. The error rate either falls or it doesn't. Rerun it on the bigger machine." }
      - { triggerTag: compute-shortage, line: "The idea was never subtle. It was always going to need more of this." }
      - { triggerTag: benchmark-saturation, line: "Good. Find the next one before the leaderboard starts believing its own headline." }
    feedLines:
      - Alex quietly retrained the baseline overnight and made three days of debate obsolete by breakfast.
      - The dataset has been cleaned again. Alex maintains this is the actual research contribution.
      - A visiting student asked for the secret. Alex pointed at the GPU and said nothing else.
      - The error rate fell by double digits. Alex filed it under "expected, eventually."
      - Someone suggested a more elegant architecture. Alex suggested a bigger one first.
      - The CIFAR images are, once again, being used to debug something far larger than CIFAR.
    portrait:
      assetId: portrait.researcher.alex-krizhensky
      brief: Understated 8-bit editorial portrait; young white man with very short sandy light-brown hair and a plain grey t-shirt, seated before two glowing GPU towers and a sharply falling red error-rate graph; quiet and focused, not photoreal.
      altText: Pixel-art portrait of Alex Krizhensky beside two GPU towers and a sharply falling error-rate graph.
    sources:
