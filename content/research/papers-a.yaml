  - id: paper.highway-networks
    version: 1
    historicity: real
    gameOrder: 56
    title: Highway Networks
    authors: [Rupesh Kumar Srivastava, Klaus Greff, Jürgen Schmidhuber]
    publicationYear: 2015
    venue: arXiv preprint / ICML 2015 Deep Learning Workshop
    primarySourceUrl: https://arxiv.org/abs/1505.00387
    arxiv: "1505.00387"
    historicalNote: >-
      Posted in 2015, this paper introduced gated "information highways" that let very deep
      networks train directly with gradient descent, a direct conceptual precursor to residual
      connections.
    education:
      playerSummary: >-
        Srivastava, Greff, and Schmidhuber introduced learned gating units that let a network
        choose, layer by layer, how much of its input to transform versus pass through unchanged.
        These "information highways" made it practical to train networks hundreds of layers deep
        using ordinary gradient descent, directly ahead of the residual-connection idea that soon
        became standard.
      archiveExplanation: >-
        As networks are stacked deeper, gradients tend to vanish or explode on their way back
        through many layers, making very deep networks notoriously hard to train directly.
        Srivastava, Greff, and Schmidhuber introduced a gating mechanism, inspired by LSTM memory
        cells, that let each layer learn how much of its input to transform and how much to pass
        through unchanged, creating an "information highway" for gradients to flow along largely
        undisturbed.

        This let the authors train plain feed-forward networks hundreds of layers deep directly
        with gradient descent, something that had previously required much more careful
        initialisation or layer-wise pretraining tricks. The gating idea's core insight, that deep
        networks train more easily when given an explicit shortcut path, was highly influential.

        The specific learned gates were soon shown to be less essential than the shortcut
        connection itself, and the field largely moved to the simpler, ungated residual connection
        the following year. Neolab.ai treats this paper as a direct architectural stepping stone:
        it modestly reduces technical training risk and must be understood before the lab can
        discover the deep residual networks that underlie almost everything it builds afterward.
      insideBaseball: The gate learns when to get out of its own way. Several senior researchers have asked their management chain to study this closely.
