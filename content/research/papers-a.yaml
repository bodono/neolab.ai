  - id: paper.alphago
    version: 1
    historicity: real
    gameOrder: 17
    title: Mastering the game of Go with deep neural networks and tree search
    authors:
      - David Silver
      - Aja Huang
      - Chris J. Maddison
      - Arthur Guez
      - Laurent Sifre
      - George van den Driessche
      - Julian Schrittwieser
      - Ioannis Antonoglou
      - Veda Panneershelvam
      - Marc Lanctot
      - Sander Dieleman
      - Dominik Grewe
      - John Nham
      - Nal Kalchbrenner
      - Ilya Sutskever
      - Timothy Lillicrap
      - Madeleine Leach
      - Koray Kavukcuoglu
      - Thore Graepel
      - Demis Hassabis
    publicationYear: 2016
    venue: Nature
    primarySourceUrl: https://doi.org/10.1038/nature16961
    doi: 10.1038/nature16961
    historicalNote: >-
      Published in January 2016, the paper reported AlphaGo's 5–0 match victory over European Go
      champion Fan Hui; the later match against Lee Sedol was a separate public milestone.
    education:
      playerSummary: >-
        AlphaGo combined policy networks, value networks and Monte Carlo tree search to master a
        game whose enormous search space had resisted traditional brute force. It learned first
        from expert games and then from self-play, defeating a professional player in a full-
        sized match. The work demonstrated how learned intuition and explicit planning could
        reinforce one another.
      archiveExplanation: >-
        Go has simple rules but an extraordinary branching factor. Searching every continuation
        is impossible, while strong play depends on difficult judgements about the long-term
        value of a position. Earlier programmes had improved through Monte Carlo tree search,
        but still played below top human level.

        Silver and colleagues built AlphaGo from complementary learned components. A policy
        network proposed promising moves, first learning from expert games and then improving
        through reinforcement learning in self-play. A value network estimated the eventual
        winner from a position. Monte Carlo tree search combined these judgements with simulated
        exploration, focusing computation on consequential branches. The system defeated Fan
        Hui, the reigning European champion, five games to zero—the first defeat of a professional
        player by a computer on a full board without handicap.

        AlphaGo was specialised to one game, not a general intelligence, but the integration of
        pattern recognition, value estimation, planning and self-generated experience was broadly
        influential. Its moves also changed how expert players understood Go. In the game, the
        discovery supplies immense Aura and unlocks planning-heavy research, while the mechanics
        carefully avoid granting general wisdom from a board-game victory. The laboratory gains
        a powerful recipe for domains with clear rules and feedback; transferring it to the messy
        world remains a separate scientific and safety challenge.
