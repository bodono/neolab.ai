    authors: [Paul F. Christiano, Jan Leike, Tom B. Brown, Miljan Martic, Shane Legg, Dario Amodei]
    publicationYear: 2017
    venue: Advances in Neural Information Processing Systems 30
    primarySourceUrl: https://papers.nips.cc/paper_files/paper/2017/hash/d5e2c0adad503c91f91df240d0cd4e49-Abstract.html
    historicalNote: >-
      Published in 2017, this paper trained reward models directly from pairwise comparisons
      supplied by non-expert human raters rather than from a hand-written reward function.
    education:
      playerSummary: >-
        This paper showed that an agent could learn complex behaviour from a reward model
        trained on human comparisons between short clips of its own behaviour, instead of a
        programmer's hand-written reward function. Raters answered a much easier question—which
        of two clips looks more like what we want—and the resulting reward model shaped a
        reinforcement-learning agent toward goals that were difficult to specify directly. It
        became a foundational technique for aligning capable systems with human judgement.
      archiveExplanation: >-
        Reinforcement learning normally requires a reward function precise enough to define
        success at every timestep. Many goals worth pursuing—acceptable driving style, a
        backflip that looks right, a genuinely helpful response—resist that kind of precise
        specification. Christiano, Leike, Brown, Martic, Legg and Amodei asked whether an agent
        could instead learn from comparative human feedback: shown two short clips of its
        behaviour, a human need only say which one is better.

        Those comparisons trained a separate reward-prediction model, which then supplied the
        reward signal for ordinary reinforcement learning. Human effort scaled sublinearly with
        the complexity of the resulting behaviour, since a rater judges clips rather than
        engineering a formula. The method successfully taught simulated robots and Atari-playing
        agents behaviours—including one deliberately whimsical backflip—that would have been
        awkward or impossible to reward directly by hand.

        The paper is a direct ancestor of the human-feedback techniques that later shaped
        large language models. It also states its own limitation plainly: a reward model built
        from finite comparisons can be gamed, misjudged, or subtly wrong about what people
        actually wanted, and a capable enough optimiser will find the difference. In Neolab.ai
        this discovery unlocks a genuinely useful alignment technique and improves the fidelity
        of preference-based training, while leaving intact every later question about how well
        a reward model's approval predicts what a person would endorse on reflection.
