researchers:
  - id: researcher.michael-jordanne
    version: 1
    displayName: Michael I. Jordanne
    inspirationName: Michael I. Jordan
    inspirationSummary: A statistical machine-learning pioneer whose graphical models, variational inference, and Bayesian nonparametrics trained both algorithms and generations of researchers.
    epithet: The Statistical Statesman
    role: Statistical machine learning and probabilistic graphical models
    rosterCardSummary: A statistical machine-learning pioneer whose graphical models, variational inference, and Bayesian nonparametrics trained both algorithms and generations of researchers.
    biography: >-
      Michael I. Jordan has spent four decades making machine learning and statistics answer to
      one another. He was an MIT professor from 1988 to 1998, then held appointments across
      electrical engineering, statistics, and operations research at UC Berkeley; he now also
      works at Inria and the École Normale Supérieure in Paris. His research helped establish
      probabilistic graphical models, variational inference, Bayesian nonparametrics, and formal
      ways to study statistical-computational tradeoffs. He has shaped distributed computation,
      game-theoretic learning, and market design, arguing that intelligent systems must be analysed
      as economic participants, not isolated prediction engines. His students and postdocs include
      Zoubin Ghahramani, David Blei, Andrew Ng, and many other research leaders. Michael's recurring
      question is not merely whether a method works, but which assumptions make it work and what
      guarantee survives when they do not. Fast fields eventually rediscover the value of a
      carefully stated theorem.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.55 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.11, baseSigningCash: 10, auraCost: 16, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 5, reinforcementAgency: 2, multimodality: 2, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 4, alignmentControl: 2, interpretabilityEvals: 5, securityContainment: 0, training: 3, product: 0, management: 5, politics: 3 }
    traits: [trait.formal-rigour, trait.statesman-of-the-field]
    signature:
      id: ability.variational-inference-toolkit
      label: Variational Inference Toolkit
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.reasoning-tools] }
      rampWeeks: 5
      effects:
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.research.program.base:domain.reasoning-tools.weeklyVarianceWidth, operation: multiply, value: 0.82, stackingGroup: variance-width }
    passive:
      id: ability.statistical-guarantee
      label: Statistical Guarantee
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 5 }
    compact:
      id: compact.state-the-guarantee-precisely
      label: State the Guarantee Precisely
      requirement: Publish one research claim with an explicit statistical uncertainty estimate every 52 weeks.
      check: { type: tagged-action-within, tags: [uncertainty-quantified-publication], weeks: 52 }
      breachEvent: people.compact.state-the-guarantee-precisely
    paperHooks:
      ids: [paper.support-vector-networks, paper.random-forests]
    eventReactions:
      - { triggerTag: benchmark-record, line: "A strong benchmark score without a confidence interval is an anecdote. Publish the interval." }
      - { triggerTag: hype-cycle-peak, line: "The mathematics underneath this excitement has not, in fact, changed since last quarter." }
      - { triggerTag: student-departure, line: "Good. That is what the training was for." }
    feedLines:
      - Michael returned a promising result with a politely devastating question about its confidence interval.
      - A former student's lab announced a breakthrough. Michael's only comment was a citation to their dissertation.
      - The variational bound tightened again, and somewhere a decade-old proof felt slightly more finished.
      - Michael declined to call the result a breakthrough until its statistical guarantees were stated in full.
      - A visiting researcher's informal claim was gently, thoroughly, and at some length formalised.
      - The whiteboard filled with graphical-model notation that the rest of the floor has learned to leave alone.
    portrait:
      assetId: portrait.researcher.michael-jordanne
      brief: Composed 8-bit editorial portrait; white man with very short grey hair and a measured expression, beside a probabilistic graphical model diagram with a visible confidence interval; authoritative and precise, not photoreal.
      altText: Pixel-art portrait of Michael I. Jordanne beside a probabilistic graphical model diagram with a confidence interval.
    sources:
