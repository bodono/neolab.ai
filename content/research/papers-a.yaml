  - id: paper.dropout
    version: 1
    historicity: real
    gameOrder: 14
    title: "Dropout: A Simple Way to Prevent Neural Networks from Overfitting"
    authors: [Nitish Srivastava, Geoffrey Hinton, Alex Krizhevsky, Ilya Sutskever, Ruslan Salakhutdinov]
    publicationYear: 2014
    venue: Journal of Machine Learning Research
    primarySourceUrl: https://www.jmlr.org/papers/v15/srivastava14a.html
    historicalNote: >-
      The 2014 JMLR article developed and evaluated dropout as a practical regularisation method
      across vision, speech, text and biological data.
    education:
      playerSummary: >-
        Dropout randomly removes units and their connections during each training step. A network
        cannot rely on one fragile coalition of features, so it learns representations that work
        in many temporary subnetworks. At test time a single adjusted network approximates an
        ensemble. The method provided a simple, effective defence against overfitting in large
        neural systems.
      archiveExplanation: >-
        A large neural network can memorise quirks of its training set instead of learning
        patterns that generalise. Averaging many separately trained models helps, but training
        and serving a huge ensemble is expensive. Srivastava and colleagues proposed an unusual
        approximation: randomly omit each hidden unit, together with its connections, on each
        presentation of a training example.

        Every minibatch therefore trains a different thinned network, while all those networks
        share parameters. A feature cannot depend too strongly on a specific set of partners
        because those partners may disappear on the next update. At test time, using the full
        network with appropriately scaled activations or weights approximates averaging the
        predictions of many subnetworks. The paper reported substantial gains across multiple
        supervised domains.

        Dropout is easy to explain but its effects interact with architecture, data volume and
        normalisation; modern large models do not use one universal dropout recipe. It also does
        not detect a distribution shift or make a biased target desirable. Its value is narrower
        and very practical: reduce co-adaptation and improve generalisation when capacity
        threatens to outrun evidence. In the game, dropout lowers overfitting failures and raises
        reliability modestly. It cannot improve safety evidence for objectives the training set
        never tested.
      insideBaseball: Half the units have been removed at random. Organisational effectiveness is up, creating an awkward precedent.
    domainWeights:
      domain.optimisation-scaling: 0.7
