  - id: paper.support-vector-networks
    version: 1
    historicity: real
    gameOrder: 51
    title: Support-Vector Networks
    authors: [Corinna Cortes, Vladimir Vapnik]
    publicationYear: 1995
    venue: Machine Learning, Volume 20
    primarySourceUrl: https://doi.org/10.1007/BF00994018
    doi: "10.1007/BF00994018"
    historicalNote: >-
      Published in 1995 while both authors were at AT&T Bell Labs, this paper introduced the
      support-vector network, a maximum-margin classifier that dominated much of applied machine
      learning for over a decade before deep learning's resurgence.
    education:
      playerSummary: >-
        Cortes and Vapnik introduced a classifier that maps inputs into a high-dimensional space
        and finds the decision boundary with the widest possible margin between classes, using a
        kernel trick to make that mapping computationally practical. The approach offered strong
        generalisation guarantees and became the default choice for many classification problems
        long before deep networks were practical at scale.
      archiveExplanation: >-
        Many classification problems are not linearly separable in their original representation.
        Cortes and Vapnik showed that data could be implicitly mapped into a much
        higher-dimensional feature space, using kernel functions to avoid ever computing that
        mapping explicitly, and that finding the maximum-margin linear separator in that space
        gave strong, theoretically grounded generalisation performance.

        The resulting support-vector network required only a subset of training points, the
        support vectors, to define its decision boundary, making it memory-efficient and
        surprisingly robust on modestly sized datasets. For over a decade, support-vector machines
        were a default, dependable choice across text classification, bioinformatics, and computer
        vision, especially where labelled data was too scarce for the deep networks of the time to
        outperform them.

        The approach scales poorly to the enormous datasets and representation-learning problems
        that later defined deep learning, and it does not learn its own features the way a neural
        network does. Neolab.ai treats it as a durable, early data-representation unlock rather
        than a capability the player's frontier research will still be actively extending.
      insideBaseball: The margin is maximised. The quarterly budget review margin, less so.
