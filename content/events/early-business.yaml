draftSchema: 1
contentType: decision-events
pack: early-business

# Early-game business decisions, from the first research prototypes (FC 1)
# to the first foundation models (FC 20): hype, hiring, customers, hardware
# and release norms. Every event fires at most once per run.
events:
  # --- Market: AI-washing ---------------------------------------------------
  - id: event.market.ai-washing
    version: 1
    category: market
    severity: decision
    phase: foundation
    trigger: { kind: opportunity }
    prerequisites: { type: compare, metric: player.ai.frontierCapability, op: gte, value: 10 }
    baseWeight: 7
    weightModifiers: []
    cooldown: { group: early-business-ai-washing, weeks: 26 }
    unique: true
    expiryWeeks: 10
    defaultOptionId: product-only
    titleKey: event.market.ai-washing.title
    bodyKey: event.market.ai-washing.body
    educationKey: event.market.ai-washing.education
    evidence:
      - textKey: event.market.ai-washing.evidence.aura
        metric: player.aura.spendable
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: YEAR, source: calendar-year }
    options:
      - id: honest
        labelKey: event.market.ai-washing.honest.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.market.ai-washing.honest.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.fundraising.offerCash, operation: multiply, value: 0.95, durationWeeks: 26, tags: [investor-mood] }
          - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: 3 }
        checks: []
        memories:
          - key: early-business.ai-washing.honest
            subjects: [{ type: player-lab }]
            tags: [honest-labelling]
        confirmationRequired: false
      - id: product-only
        labelKey: event.market.ai-washing.product-only.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.market.ai-washing.product-only.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 5 }
          - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: -2 }
        checks: []
        memories:
          - key: early-business.ai-washing.product-only
            subjects: [{ type: player-lab }]
            tags: [selective-labelling]
        confirmationRequired: false
      - id: everything
        labelKey: event.market.ai-washing.everything.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.market.ai-washing.everything.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 10 }
          - { kind: add-modifier, target: lab.fundraising.offerCash, operation: multiply, value: 1.10, durationWeeks: 26, tags: [investor-mood] }
        checks:
          - id: due-diligence
            likelihoodPromise: { label: likely, successOutcomeIds: [unnoticed] }
            outcomes:
              - id: unnoticed
                minimumInclusive: 0
                maximumExclusive: 0.7
                effects: []
                memories:
                  - key: early-business.ai-washing.everything
                    subjects: [{ type: player-lab }]
                    tags: [ai-washing]
              - id: found-out
                minimumInclusive: 0.7
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -15 }
                  - { kind: add-modifier, target: lab.fundraising.offerCash, operation: multiply, value: 0.90, durationWeeks: 26, tags: [investor-mood] }
                  - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: -3 }
                memories:
                  - key: early-business.ai-washing.found-out
                    subjects: [{ type: player-lab }]
                    tags: [ai-washing, exposed]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [early-business, market, ai-washing, hype]

  # --- People: hiring a university group wholesale --------------------------
  - id: event.people.university-raid
    version: 1
    category: people
    severity: decision
    phase: foundation
    trigger: { kind: opportunity }
    prerequisites: { type: compare, metric: player.ai.frontierCapability, op: gte, value: 1 }
    baseWeight: 7
    weightModifiers: []
    cooldown: { group: early-business-university-raid, weeks: 26 }
    unique: true
    expiryWeeks: 10
    defaultOptionId: hire-two
    titleKey: event.people.university-raid.title
    bodyKey: event.people.university-raid.body
    educationKey: event.people.university-raid.education
    evidence:
      - textKey: event.people.university-raid.evidence.cash
        metric: player.cash
      - textKey: event.people.university-raid.evidence.aura
        metric: player.aura.spendable
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: LEADER, source: player-leader-name }
    options:
      - id: fund
        labelKey: event.people.university-raid.fund.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -5 }
        previewKey: event.people.university-raid.fund.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 5 }
          - { kind: add-modifier, target: lab.research.all.output, operation: multiply, value: 1.05, durationWeeks: 52, tags: [university-partnership] }
        checks: []
        memories:
          - key: early-business.university-raid.funded
            subjects: [{ type: player-lab }]
            tags: [university-partnership, academic-goodwill]
        confirmationRequired: false
      - id: hire-two
        labelKey: event.people.university-raid.hire-two.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.people.university-raid.hire-two.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.costs.fixed, operation: multiply, value: 1.05, durationWeeks: 52, tags: [academic-hires] }
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [academic-hires] }
        checks: []
        memories:
          - key: early-business.university-raid.hired-two
            subjects: [{ type: player-lab }]
            tags: [academic-hires]
        confirmationRequired: false
      - id: hire-all
        labelKey: event.people.university-raid.hire-all.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.people.university-raid.hire-all.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.costs.fixed, operation: multiply, value: 1.15, durationWeeks: 52, tags: [academic-raid] }
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.20, durationWeeks: 26, tags: [academic-raid] }
          - kind: schedule-effects
            dueInWeeks: 52
            effects:
              - { kind: add-modifier, target: lab.research.all.output, operation: multiply, value: 0.95, durationWeeks: 52, tags: [empty-pipeline] }
        checks:
          - id: academic-reaction
            likelihoodPromise: { label: uncertain, successOutcomeIds: [shrugged-off] }
            outcomes:
              - id: shrugged-off
                minimumInclusive: 0
                maximumExclusive: 0.5
                effects: []
                memories:
                  - key: early-business.university-raid.hired-all
                    subjects: [{ type: player-lab }]
                    tags: [academic-raid]
              - id: resented
                minimumInclusive: 0.5
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -10 }
                memories:
                  - key: early-business.university-raid.resented
                    subjects: [{ type: player-lab }]
                    tags: [academic-raid, academic-resentment]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [early-business, people, talent-poaching, academia-industry-tension]

  # --- Market: a CV screener that marks down women --------------------------
  - id: event.market.cv-screener
    version: 1
    category: market
    severity: decision
    phase: foundation
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 10 }
        - { type: compare, metric: player.ai.launched, op: eq, value: 1 }
    baseWeight: 7
    weightModifiers:
      - predicate: { type: compare, metric: player.safety.evalQuality, op: lt, value: 25 }
        multiplier: 2
    cooldown: { group: early-business-cv-screener, weeks: 26 }
    unique: true
    expiryWeeks: 10
    defaultOptionId: patch
    titleKey: event.market.cv-screener.title
    bodyKey: event.market.cv-screener.body
    educationKey: event.market.cv-screener.education
    evidence:
      - textKey: event.market.cv-screener.evidence.evalquality
        metric: player.safety.evalQuality
      - textKey: event.market.cv-screener.evidence.attention
        metric: player.politics.governmentAttention
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: suspend
        labelKey: event.market.cv-screener.suspend.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.market.cv-screener.suspend.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 0.90, durationWeeks: 26, tags: [suspended-screener] }
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 5 }
          - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: 2 }
        checks: []
        memories:
          - key: early-business.cv-screener.suspended
            subjects: [{ type: player-lab }]
            tags: [bias-audit, hiring-discrimination]
        confirmationRequired: false
      - id: patch
        labelKey: event.market.cv-screener.patch.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.market.cv-screener.patch.preview
        immediateEffects: []
        checks:
          - id: proxies
            likelihoodPromise: { label: uncertain, successOutcomeIds: [fixed] }
            outcomes:
              - id: fixed
                minimumInclusive: 0
                maximumExclusive: 0.6
                effects: []
                memories:
                  - key: early-business.cv-screener.patched
                    subjects: [{ type: player-lab }]
                    tags: [hiring-discrimination, surface-fix]
              - id: proxy-found
                minimumInclusive: 0.6
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -10 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 3 }
                memories:
                  - key: early-business.cv-screener.proxy-found
                    subjects: [{ type: player-lab }]
                    tags: [hiring-discrimination, surface-fix, exposed]
        memories: []
        confirmationRequired: false
      - id: leave
        labelKey: event.market.cv-screener.leave.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.market.cv-screener.leave.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 1.05, durationWeeks: 26, tags: [screener-renewal] }
        checks:
          - id: disclosure
            likelihoodPromise: { label: uncertain, successOutcomeIds: [quiet] }
            outcomes:
              - id: quiet
                minimumInclusive: 0
                maximumExclusive: 0.4
                effects: []
                memories:
                  - key: early-business.cv-screener.left
                    subjects: [{ type: player-lab }]
                    tags: [hiring-discrimination, looked-away]
              - id: reported
                minimumInclusive: 0.4
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -15 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 5 }
                  - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 0.90, durationWeeks: 26, tags: [screener-scandal] }
                memories:
                  - key: early-business.cv-screener.reported
                    subjects: [{ type: player-lab }]
                    tags: [hiring-discrimination, looked-away, scandal]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [early-business, market, bias, hiring-discrimination]

