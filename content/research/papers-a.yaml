    title: Toy Models of Superposition
    authors: [Nelson Elhage, Tristan Hume, Catherine Olsson, Nicholas Schiefer, Tom Henighan, Shauna Kravec, Zac Hatfield-Dodds, Robert Lasenby, Dawn Drain, Carol Chen, Roger Grosse, Sam McCandlish, Jared Kaplan, Dario Amodei, Martin Wattenberg, Christopher Olah]
    publicationYear: 2022
    venue: Transformer Circuits Thread / arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/2209.10652
    arxiv: "2209.10652"
    historicalNote: >-
      Posted in 2022, this paper used small, fully analysable toy models to explain polysemanticity,
      individual neurons responding to multiple unrelated features, as networks storing more
      sparse features than they have dimensions by placing them in superposition.
    education:
      playerSummary: >-
        Elhage and colleagues at Anthropic built small toy models simple enough to fully analyse,
        showing that a network with fewer dimensions than the number of sparse features in its data
        can still represent all of them by storing several features in superposition within the
        same directions, at the cost of some interference between them. This offered a clean
        explanation for polysemanticity, individual neurons that appear to respond to several
        unrelated concepts, a major obstacle to interpreting real networks neuron by neuron.
      archiveExplanation: >-
        Interpretability researchers had long observed that individual neurons in trained networks
        often respond to several unrelated concepts at once, a phenomenon called polysemanticity
        that makes neuron-by-neuron interpretation unreliable. Elhage and colleagues built toy
        models small and simple enough to analyse completely, and showed that when the underlying
        data has more sparse features than the model has dimensions to represent them cleanly, the
        model learns to pack multiple features into overlapping, non-orthogonal directions, a
        phenomenon they termed superposition, trading some interference between features for the
        ability to represent many more of them than its dimensionality would naively allow.

        The paper demonstrated a surprising phase change in when superposition emerges as feature
        sparsity varies, and found a suggestive geometric connection to uniform polytopes and to
        adversarial examples, giving interpretability researchers a principled account of why
        individual neurons are so often not cleanly interpretable on their own.

        The toy models were deliberately much simpler than real production networks, and it
        remained an open question exactly how cleanly the same story would transfer to large
        language models. Neolab.ai treats this as a meaningful interpretability-evals unlock
        deepening the lab's understanding of what its own models' internals actually represent.
      insideBaseball: One neuron represents several unrelated concepts at once. The org chart has independently arrived at the same design, entirely without an interpretability team's approval.
