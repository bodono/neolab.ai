        - { target: lab.product.durationWeeks, operation: add, value: -1 }
    passive:
      id: ability.competition-grade-precision
      label: Competition-Grade Precision
      effects:
        - { target: lab.research.program.base:domain.robotics-embodiment.weeklyVarianceWidth, operation: multiply, value: 0.85 }
    compact:
      id: compact.randomise-before-you-collect
      label: Randomise Before You Collect
      requirement: While he leads Robotics & Embodiment, complete one simulation-first domain-randomisation review every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: robotics-programme, projectTag: domain-randomisation-first, weeks: 52 }
      breachEvent: people.compact.randomise-before-you-collect
    paperHooks:
      ids: [paper.dactyl-dexterous-in-hand-manipulation, paper.codex-evaluating-code-models]
    eventReactions:
      - { triggerTag: robot-demo-failure, line: "Widen the randomisation range in simulation before blaming the real robot's hardware." }
      - { triggerTag: simulation-transfer, line: "If it only works in the one simulation you tuned, it was never going to survive contact with reality anyway." }
      - { triggerTag: robotics-team-reorg, line: "The team was dissolved once already. The randomisation habit still made the trip to the next project intact." }
    feedLines:
      - Wojciech widened the simulation's randomisation range and the real robot's failure rate quietly dropped.
      - The Rubik's Cube demonstration is years old now and the team still gets asked about it in every interview.
      - A silver-medal-honed instinct for well-posed problems caught an ambiguity in a robotics benchmark's rules.
      - Wojciech's sim-to-real transfer worked on the very first real-world attempt, which the team still finds slightly suspicious.
      - The disbanded robotics team's alumni keep reappearing, quietly, on each other's new projects.
      - A code-generation benchmark improved, and Wojciech treated it with the same rigour as the old robotics metrics.
    portrait:
      assetId: portrait.researcher.wojciech-zarembo
      brief: Focused 8-bit editorial portrait; Polish man with a calm, precise expression, beside a robotic hand manipulating a small cube, with a simulation randomisation slider nearby; determined and exact, not photoreal.
