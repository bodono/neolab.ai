papers:
  - id: paper.backpropagation
    version: 1
    historicity: real
    gameOrder: 1
    title: Learning representations by back-propagating errors
    authors: [David E. Rumelhart, Geoffrey E. Hinton, Ronald J. Williams]
    publicationYear: 1986
    venue: Nature
    primarySourceUrl: https://doi.org/10.1038/323533a0
    doi: 10.1038/323533a0
    historicalNote: >-
      This paper appeared in 1986. Neolab.ai deliberately allows a lab beginning in 2012 to
      rediscover older foundations; the real year remains prominent in the archive.
    education:
      playerSummary: >-
        Backpropagation made it practical to train multi-layer neural networks by sending a
        model's output error backward through its layers. Each connection receives a useful
        signal about how it contributed to the mistake. The underlying ingredients had a
        longer history, but this paper became a landmark demonstration that hidden internal
        representations could be learned rather than laboriously specified by hand.
      archiveExplanation: >-
        A neural network learns by changing its numerical weights, but a network with hidden
        layers creates a difficult bookkeeping problem: the correct answer tells us that the
        whole system was wrong, not which hidden connection deserves how much blame.
        Rumelhart, Hinton and Williams described a clear, efficient procedure for propagating
        the output error backward through differentiable layers. The chain rule turns that
        single error into a gradient for every weight, after which gradient descent can make a
        small improving update.

        The idea did not spring from nowhere, and the history of reverse-mode differentiation
        and neural-network learning includes important earlier work. The 1986 Nature paper was
        nevertheless unusually influential because it paired the method with compelling
        demonstrations of learned internal representations. Units inside a network could
        organise useful features without a programmer assigning every feature in advance.

        Backpropagation is not itself an architecture, a guarantee of good generalisation, or
        a recipe for intelligence. It is the credit-assignment engine that made much later
        deep learning trainable. Convolutional networks, recurrent models, transformers and
        many modern scientific systems all rely on variations of automatic differentiation
        and gradient-based optimisation. In the game's research graph it is therefore a
        prerequisite, not a superpower: the laboratory has learned how to improve a deep
        system, and must still discover what to build and what data or objective to give it.
      insideBaseball: The gradients are flowing. Management has requested a dashboard proving they are flowing strategically.
    domainWeights:
      domain.architectures: 0.65
      domain.optimisation-scaling: 0.35
    prerequisites:
      domainLevels:
        domain.optimisation-scaling: 3
    breakthroughRequirement: { programme: domain.architectures, level: 14 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 10
    unlockEffects:
      - { target: research.family.gradient-trained-deep-networks, operation: unlock, value: true }
    tags: [foundation, gradients, representation-learning, deep-learning, open-science]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.lenet-document-recognition
    version: 1
    historicity: real
    gameOrder: 2
    title: Gradient-Based Learning Applied to Document Recognition
    authors: [Yann LeCun, Léon Bottou, Yoshua Bengio, Patrick Haffner]
    publicationYear: 1998
    venue: Proceedings of the IEEE
    primarySourceUrl: https://doi.org/10.1109/5.726791
    doi: 10.1109/5.726791
    historicalNote: >-
      Published in 1998, this paper consolidated years of work on convolutional networks and
      demonstrated an end-to-end system for practical document recognition.
    education:
      playerSummary: >-
        LeNet showed that a trainable system could learn useful visual features directly from
        pixels and recognise handwritten characters as part of a complete document-reading
        pipeline. Local receptive fields, shared weights and pooling gave the convolutional
        network an efficient way to exploit image structure. It became a foundational example
        of end-to-end learning replacing a tower of hand-engineered stages.
      archiveExplanation: >-
        Images contain the same kinds of local patterns in many positions: an edge is still an
        edge when it moves ten pixels to the right. A fully connected network ignores that
        structure and spends separate parameters relearning similar detectors everywhere.
        Convolutional networks instead slide small learned filters across an image, sharing
        their weights by position. Subsampling or pooling then helps the representation remain
        useful when a feature shifts slightly.

        LeCun, Bottou, Bengio and Haffner placed these ideas inside a larger argument for
        gradient-based learning. Their paper described LeNet-5 and a complete system that read
        handwritten digits on cheques. The important achievement was not merely a benchmark:
        feature extraction, recognition and much of the surrounding decision pipeline could be
        trained together. This challenged the dominant pattern of separately engineering every
        transformation and then connecting the pieces.

        The hardware, datasets and training recipes of 1998 limited how far the approach could
        scale, and convolution itself had important precursors. Later systems would combine the
        same broad principles with far larger datasets, GPUs, rectified activations and deeper
        architectures. In the game, this discovery establishes the visual architecture family
        but does not jump directly to modern image recognition. The lab now knows how to build
        a compact, translation-aware visual learner; it still needs data and compute large
        enough to reveal what such learners can become.
      insideBaseball: The cheque reader works. Finance has become the first department to describe a neural network as mission-critical.
    domainWeights:
      domain.multimodality: 0.7
      domain.architectures: 0.30
    prerequisites:
      papers: [paper.backpropagation]
      domainLevels:
        domain.architectures: 6
    breakthroughRequirement: { programme: domain.multimodality, level: 10 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 8
    unlockEffects:
      - { target: research.family.convolutional-networks, operation: unlock, value: true }
      - { target: lab.research.domain.multimodality.output, operation: multiply, value: 1.025 }
    tags: [foundation, vision, convolution, document-recognition, end-to-end-learning]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.long-short-term-memory
    version: 1
    historicity: real
    gameOrder: 3
    title: Long Short-Term Memory
    authors: [Sepp Hochreiter, Jürgen Schmidhuber]
    publicationYear: 1997
    venue: Neural Computation
    primarySourceUrl: https://doi.org/10.1162/neco.1997.9.8.1735
    doi: 10.1162/neco.1997.9.8.1735
    historicalNote: >-
      LSTM was published in 1997, before the document-recognition paper above; its later game
      position reflects conceptual pacing rather than a claim about real chronology.
    education:
      playerSummary: >-
        Long short-term memory gave recurrent neural networks a better way to preserve and
        control information across long sequences. Special memory cells and learned gates
        created paths along which error signals could survive instead of rapidly vanishing.
        LSTMs later became central to speech recognition, translation and language modelling,
        before transformers displaced recurrence in many large-scale applications.
      archiveExplanation: >-
        A recurrent neural network reuses a hidden state from one time step at the next, making
        it a natural model for speech, text and other sequences. In principle, an early input
        can affect a much later output. In practice, ordinary gradient training repeatedly
        multiplies signals through time. Those signals tend to shrink toward zero or grow out
        of control, so learning long-range relationships becomes extremely difficult.

        Hochreiter and Schmidhuber introduced long short-term memory as a direct response to
        this problem. An LSTM contains a memory cell with a deliberately stable path through
        time, plus learned mechanisms that control when information enters and leaves. The
        exact gate design used by later implementations evolved, but the central insight held:
        architecture can make credit assignment across long intervals much easier.

        LSTMs eventually powered major gains in handwriting recognition, speech, translation,
        image captioning and language modelling. They did not solve memory in a human sense,
        nor did they remove all optimisation difficulties. Their sequential computation also
        became a bottleneck when models and datasets grew enormous. That limitation helps set
        up the later attention and transformer discoveries in this catalogue. In Neolab.ai,
        LSTM unlocks serious sequence research and products, while preserving a strategic
        reason to invest in architectures that can train more parallelly.
      insideBaseball: The model remembers what happened 200 tokens ago. Several executives have requested the same feature.
    domainWeights:
      domain.architectures: 0.8
      domain.reasoning-tools: 0.20
    prerequisites:
      papers: [paper.backpropagation]
    breakthroughRequirement: { programme: domain.architectures, level: 17 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 9
    unlockEffects:
      - { target: research.family.recurrent-sequence-models, operation: unlock, value: true }
    tags: [foundation, recurrence, sequence-models, memory, language]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.fast-deep-belief-nets
    version: 1
    historicity: real
    gameOrder: 4
    title: A Fast Learning Algorithm for Deep Belief Nets
    authors: [Geoffrey E. Hinton, Simon Osindero, Yee-Whye Teh]
    publicationYear: 2006
    venue: Neural Computation
    primarySourceUrl: https://doi.org/10.1162/neco.2006.18.7.1527
    doi: 10.1162/neco.2006.18.7.1527
    historicalNote: >-
      This 2006 paper was an important part of the revival of deep neural networks before
      large supervised datasets and GPU training became the dominant recipe.
    education:
      playerSummary: >-
        Deep belief nets offered a practical recipe for training many-layer generative models
        one layer at a time, then refining the whole system. The unsupervised pretraining
        procedure placed the network in a useful region before supervised optimisation began.
        Its specific architecture is less common today, but the result helped convince a
        sceptical field that genuinely deep learned representations could work.
      archiveExplanation: >-
        During the early 2000s, adding layers to a neural network often made it harder rather
        than better. Training signals weakened, labelled datasets were limited, computation was
        expensive, and poor initial weights could strand optimisation in unhelpful regions.
        These practical failures supported a widespread belief that deep networks were simply
        too difficult to train reliably.

        Hinton, Osindero and Teh described a greedy, layer-by-layer procedure for deep belief
        nets. Each layer was trained as a restricted Boltzmann machine to model the activity of
        the layer below it. After this unsupervised pretraining had built a hierarchy, the full
        network could be fine-tuned. The algorithm came with an illuminating theoretical
        perspective and striking demonstrations on handwritten digits.

        Deep belief nets were not the final architecture of the deep-learning era. As labelled
        datasets grew and better activations, initialisation, regularisation, optimisers and
        GPUs arrived, straightforward end-to-end supervised training became far more effective.
        The paper's historical importance lies partly in reopening the empirical case for depth
        and representation learning. It showed that the apparent barrier was not a law of
        nature; it was a problem of method and resources. In the game, it accelerates learned
        representations and unlocks the generative branch, while later papers can replace its
        pretraining recipe without erasing the institutional confidence it created.
      insideBaseball: Layer-wise pretraining has succeeded. The lab now contains one more layer of people explaining the layers.
    domainWeights:
      domain.architectures: 0.8
      domain.optimisation-scaling: 0.20
    prerequisites:
      papers: [paper.backpropagation]
    breakthroughRequirement: { programme: domain.architectures, level: 21 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 8
    unlockEffects:
      - { target: research.family.deep-generative-models, operation: unlock, value: true }
      - { target: lab.research.domain.architectures.output, operation: multiply, value: 1.08 }
    tags: [foundation, deep-learning, unsupervised-learning, generative-models, representation-learning]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.imagenet-database
    version: 1
    historicity: real
    gameOrder: 5
    title: "ImageNet: A Large-Scale Hierarchical Image Database"
    authors: [Jia Deng, Wei Dong, Richard Socher, Li-Jia Li, Kai Li, Li Fei-Fei]
    publicationYear: 2009
    venue: IEEE Conference on Computer Vision and Pattern Recognition
    primarySourceUrl: https://www.image-net.org/static_files/papers/imagenet_cvpr09.pdf
    historicalNote: >-
      ImageNet was introduced at CVPR in 2009. Its scale, hierarchy and later challenge became
      essential infrastructure for measuring progress in computer vision.
    education:
      playerSummary: >-
        ImageNet treated a dataset as a major scientific instrument. It organised millions of
        labelled images into a large hierarchy of object categories, making it possible to
        train and compare vision systems at unprecedented scale. The later ImageNet challenge
        supplied a shared scoreboard on which deep convolutional networks could demonstrate a
        decisive advantage over hand-engineered vision pipelines.
      archiveExplanation: >-
        Machine-learning systems can only reveal advantages that a dataset and evaluation can
        measure. Before ImageNet, many object-recognition benchmarks were too small or narrow
        to support and discriminate between very high-capacity visual models. Fei-Fei Li and
        collaborators pursued a different scale: a database organised around the WordNet
        hierarchy, with hundreds or thousands of real-world images for a vast number of visual
        concepts.

        The 2009 paper described a dataset already containing more than three million cleanly
        labelled images across more than five thousand categories, built with substantial human
        annotation. ImageNet continued to grow, and the ImageNet Large Scale Visual Recognition
        Challenge converted part of that resource into an influential annual competition. The
        dataset was not an algorithm, yet it changed which algorithms were possible to train
        and which improvements the community could see.

        ImageNet also illustrates that datasets are institutions, not neutral piles of pixels.
        Category choices, collection methods, labels and human labour all shape the resulting
        systems, and later scrutiny identified serious limitations and harmful categories in
        parts of the full hierarchy. The educational lesson is therefore double-sided: scale
        and shared measurement can unlock a field, while documentation and stewardship matter.
        In the game, ImageNet enables large visual training and better evaluation, but the data
        charter attached to the project affects trust, cost and later events.
      insideBaseball: The dataset is now too large to inspect manually, which has been entered in the risk register as “success.”
    domainWeights:
      domain.multimodality: 0.95
      domain.architectures: 0.05
    prerequisites: {}
    breakthroughRequirement: { programme: domain.multimodality, level: 19 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 9
    unlockEffects:
      - { target: lab.evals.quality, operation: add, value: 3 }
      - { target: lab.research.domain.multimodality.output, operation: multiply, value: 1.02 }
    tags: [foundation, dataset, vision, benchmarks, human-labour, data-stewardship]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.alexnet
    version: 1
    historicity: real
    gameOrder: 6
    title: ImageNet Classification with Deep Convolutional Neural Networks
    authors: [Alex Krizhevsky, Ilya Sutskever, Geoffrey E. Hinton]
    publicationYear: 2012
    venue: Advances in Neural Information Processing Systems 25
    primarySourceUrl: https://papers.nips.cc/paper_files/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html
    historicalNote: >-
      The paper was published in 2012 and is commonly associated with the moment deep learning
      achieved a dramatic, widely visible victory in large-scale computer vision.
    education:
      playerSummary: >-
        AlexNet trained a large convolutional network on ImageNet and sharply reduced image-
        classification error. Its success combined architectural choices with practical
        engineering: GPU computation, rectified linear units, data augmentation and dropout.
        The result did not invent every component, but it assembled them at the right scale and
        produced evidence strong enough to redirect computer vision and then much of AI.
      archiveExplanation: >-
        By 2012, convolutional networks had existed for decades, ImageNet provided millions of
        labelled examples, and programmable GPUs offered enormous parallel arithmetic. Alex
        Krizhevsky, Ilya Sutskever and Geoffrey Hinton combined these ingredients in a deep
        network with roughly sixty million parameters and trained it to classify one thousand
        ImageNet categories. The model's top-five error was dramatically lower than the best
        competing entry in the 2012 challenge.

        Several practical choices mattered. Rectified linear units trained faster than common
        saturating activations. Data augmentation and dropout fought overfitting. A highly
        efficient GPU implementation made a previously forbidding amount of convolution
        feasible, and the model was split across two GPUs because one was not enough. The paper
        is therefore as much a story about systems, data and experimental craft as about a
        single mathematical novelty.

        AlexNet became a persuasive demonstration that learned feature hierarchies could beat
        carefully engineered vision systems when supplied with enough data and compute. Similar
        methods rapidly spread into speech, language and scientific applications. It would be
        misleading to claim that one paper created deep learning, but its empirical shock was
        unusually effective at reallocating attention, talent and hardware. The game's reward
        reflects that social consequence: a major Aura event, a surge of vision demand, and a
        race to scale architectures whose basic ancestry is much older.
      insideBaseball: The result is 10.8 percentage points better. Every lab has independently decided GPUs were always central to its strategy.
    domainWeights:
      domain.multimodality: 0.5
      domain.architectures: 0.30
      domain.optimisation-scaling: 0.20
    prerequisites:
      papers: [paper.backpropagation, paper.lenet-document-recognition, paper.imagenet-database]
      domainLevels:
        domain.architectures: 11
        domain.optimisation-scaling: 8
    breakthroughRequirement: { programme: domain.multimodality, level: 32 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 14
    unlockEffects:
      - { target: lab.research.domain.multimodality.output, operation: multiply, value: 1.05 }
    tags: [deep-learning, vision, convolution, gpu-training, scale, benchmark-shock]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.word2vec
    version: 1
    historicity: real
    gameOrder: 7
    title: Efficient Estimation of Word Representations in Vector Space
    authors: [Tomas Mikolov, Kai Chen, Greg Corrado, Jeffrey Dean]
    publicationYear: 2013
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/1301.3781
    arxiv: "1301.3781"
    historicalNote: >-
      This 2013 preprint introduced efficient architectures for learning continuous word
      representations from very large text corpora.
    education:
      playerSummary: >-
        Word2vec showed that useful word representations could be learned quickly from enormous
        text corpora using deliberately simple prediction tasks. Words used in similar contexts
        acquired nearby vectors, and relationships sometimes appeared as geometric directions.
        Efficient training made these embeddings widely reusable, turning representation
        learning into practical infrastructure for language systems.
      archiveExplanation: >-
        A one-hot word identifier says that “cat” and “dog” are different, but says nothing
        about how they are related. Continuous embeddings instead assign each word a learned
        vector. If a model must predict a word from its context, or predict context from a word,
        it benefits from placing words with similar uses in useful regions of the vector space.

        Mikolov, Chen, Corrado and Dean proposed two computationally efficient architectures,
        commonly called CBOW and skip-gram. The designs discarded much of the complexity of
        earlier language models so they could learn high-quality vectors from billions of words
        very quickly. Follow-up work added techniques such as negative sampling and popularised
        the striking observation that some semantic and syntactic relationships could be
        approximated by vector arithmetic.

        Word2vec did not prove that meaning is literally geometry, and its representations can
        reproduce biases present in their training text. It did establish a powerful workflow:
        learn general representations from abundant unlabelled data, then reuse them in many
        downstream tasks. Modern contextual embeddings no longer give each word one fixed
        vector regardless of sentence, but they inherit that broader representation-learning
        ambition. In Neolab.ai the paper reduces the data and training burden of language
        products while introducing later events about inherited corpus bias and what exactly a
        vector-space analogy should be allowed to count as evidence.
      insideBaseball: The king-minus-man-plus-woman demo has been repeated in six meetings and is now officially a product strategy.
    domainWeights:
      domain.reasoning-tools: 0.8
      domain.optimisation-scaling: 0.20
    prerequisites:
      papers: [paper.backpropagation]
    breakthroughRequirement: { programme: domain.reasoning-tools, level: 40 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 10
    unlockEffects:
      - { target: research.family.distributed-language-representations, operation: unlock, value: true }
    tags: [deep-learning, language, embeddings, unsupervised-learning, scale, corpus-bias]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.variational-autoencoder
    version: 1
    historicity: real
    gameOrder: 8
    title: Auto-Encoding Variational Bayes
    authors: [Diederik P. Kingma, Max Welling]
    publicationYear: 2014
    venue: International Conference on Learning Representations
    primarySourceUrl: https://arxiv.org/abs/1312.6114
    arxiv: "1312.6114"
    historicalNote: >-
      First posted in 2013 and presented at ICLR 2014, this paper introduced the method now
      widely known as the variational autoencoder.
    education:
      playerSummary: >-
        Variational autoencoders made flexible latent-variable generative models trainable with
        ordinary stochastic gradient methods. A learned inference network approximates hidden
        causes for each example, while a reparameterisation trick lets gradients pass through
        random sampling. VAEs joined probabilistic modelling to neural networks and created a
        durable toolkit for representation learning and generation.
      archiveExplanation: >-
        A latent-variable model imagines that observed data was produced from hidden factors.
        Learning such a model requires reasoning backward from an observation to plausible
        hidden values, but exact Bayesian inference is usually intractable for expressive neural
        generators. Traditional approximate methods could also be too slow or specialised for
        large datasets.

        Kingma and Welling introduced an efficient approach that learns two networks together.
        The encoder, or recognition model, approximates the posterior distribution over latent
        variables given an observation. The decoder models how those variables generate data.
        Their reparameterisation expresses a random sample as a differentiable transformation
        of fixed noise, allowing low-variance gradient estimates and ordinary minibatch
        optimisation of a variational lower bound.

        The resulting variational autoencoder can learn smooth latent spaces, generate new
        examples and perform efficient amortised inference. Its samples were often blurrier than
        those of later adversarial or diffusion systems, and the choice of objective brings
        characteristic tradeoffs between reconstruction and representation. Its deeper impact
        was conceptual and practical: probabilistic latent-variable modelling became modular
        neural-network engineering. The game unlocks a broad generative branch and makes
        representation experiments cheaper, but retains uncertainty about whether an elegant
        latent space corresponds to the factors that people actually care about.
      insideBaseball: Sampling is differentiable now, subject to an explanatory footnote which has achieved local sentience.
    domainWeights:
      domain.architectures: 0.75
      domain.optimisation-scaling: 0.25
    prerequisites:
      papers: [paper.backpropagation, paper.fast-deep-belief-nets]
      domainLevels:
        domain.optimisation-scaling: 10
    breakthroughRequirement: { programme: domain.architectures, level: 34 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 10
    unlockEffects:
      - { target: research.family.variational-generative-models, operation: unlock, value: true }
    tags: [deep-learning, generative-models, latent-variables, variational-inference, representation-learning]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.generative-adversarial-nets
    version: 1
    historicity: real
    gameOrder: 9
    title: Generative Adversarial Nets
    authors: [Ian J. Goodfellow, Jean Pouget-Abadie, Mehdi Mirza, Bing Xu, David Warde-Farley, Sherjil Ozair, Aaron Courville, Yoshua Bengio]
    publicationYear: 2014
    venue: Advances in Neural Information Processing Systems 27
    primarySourceUrl: https://papers.nips.cc/paper_files/paper/2014/hash/f033ed80deb0234979a61f95710dbe25-Abstract.html
    historicalNote: >-
      The 2014 paper introduced generative adversarial networks and a new family of generative
      modelling methods framed as a game between two learned systems.
    education:
      playerSummary: >-
        GANs train a generator to produce convincing samples and a discriminator to distinguish
        generated examples from real data. Each model supplies the other's learning signal in
        a competitive game. The idea enabled striking improvements in image generation and
        inspired enormous research activity, while also creating notorious training instability
        and sharper social questions about synthetic media.
      archiveExplanation: >-
        Many generative models require an explicit probability distribution or an expensive
        inference procedure. Goodfellow and collaborators proposed a different game. A generator
        transforms random noise into synthetic examples. A discriminator sees both real and
        generated data and learns to tell them apart. The generator improves by learning to fool
        the discriminator; the discriminator improves by resisting. In the ideal mathematical
        equilibrium, generated samples follow the data distribution and the discriminator can
        do no better than chance.

        This adversarial framework was elegant and surprisingly productive. Later GANs generated
        increasingly realistic faces, scenes and art, supported image editing, and influenced
        domain adaptation and representation learning. Because the loss is supplied by another
        adaptive model, however, training can oscillate, collapse to limited varieties of output,
        or become highly sensitive to architecture and hyperparameters.

        GANs also made the implications of high-quality synthetic media vivid well before such
        media became a mass-market product. Technical capability, misuse risk and provenance
        policy arrived together. Neolab.ai represents both sides. The paper unlocks powerful
        generative projects and synthetic-data options, but it also enables media-authenticity
        crises and increases the value of adversarial testing. The discovery is not intrinsically
        harmful; the lab's release, documentation and product decisions determine which risks it
        takes on.
      insideBaseball: The generator and discriminator are in equilibrium. Their respective teams are not.
    domainWeights:
      domain.architectures: 0.75
      domain.multimodality: 0.25
    prerequisites:
      papers: [paper.backpropagation]
      anyPapers: [paper.fast-deep-belief-nets, paper.variational-autoencoder]
    breakthroughRequirement: { programme: domain.architectures, level: 37 }
    earliestPhase: foundation
    discovery:
      worldFirstAura: 13
    unlockEffects:
      - { target: research.family.adversarial-generative-models, operation: unlock, value: true }
    tags: [deep-learning, generative-models, adversarial-training, synthetic-media, multimodality]
    review: { factual: primary-source-drafted, mechanics: draft, reviewedOn: 2026-07-21 }

  - id: paper.sequence-to-sequence
    version: 1
    historicity: real
    gameOrder: 10
    title: Sequence to Sequence Learning with Neural Networks
    authors: [Ilya Sutskever, Oriol Vinyals, Quoc V. Le]
    publicationYear: 2014
    venue: Advances in Neural Information Processing Systems 27
    primarySourceUrl: https://papers.nips.cc/paper_files/paper/2014/hash/5a18e133cbf9f257297f410bb7eca942-Abstract.html
    historicalNote: >-
      Published in 2014, this work demonstrated a general end-to-end neural approach to mapping
      one variable-length sequence into another.
    education:
      playerSummary: >-
        Sequence-to-sequence learning used one LSTM to encode an input sequence and another to
        generate an output sequence. The same general architecture could tackle translation and
        other tasks without a separately engineered alignment pipeline. It helped establish
        neural encoder-decoder systems as a powerful default, while its fixed-length bottleneck
        created exactly the pressure that attention would soon relieve.
      archiveExplanation: >-
        Standard supervised networks expect fixed-size inputs and outputs, but translation maps
        a sentence of one length to a sentence of another. Sutskever, Vinyals and Le proposed a
        clean neural solution. A multilayer LSTM encoder reads the source sentence and compresses
        it into a vector. A second LSTM decoder conditions on that vector and emits the target
        sentence one token at a time.

        On English-to-French translation, the system achieved results competitive with a strong
        phrase-based pipeline, and it could improve that pipeline further by reranking candidate
        translations. One memorable engineering detail was reversing the order of source words,
        which shortened important dependencies during optimisation. The model also learned
        sentence representations sensitive to meaning and word order without an explicit grammar
        module.

        The work helped move machine translation toward end-to-end learned systems and supplied
        a reusable pattern for summarisation, dialogue, speech and many structured transformations.
        Its weakness was equally productive: asking one fixed-size vector to carry every detail
        of a long sentence creates a bottleneck. Attention mechanisms let the decoder consult the
        encoder's intermediate states instead of relying on one compressed message. The game's
        research graph makes that relationship explicit. Sequence-to-sequence learning opens
        valuable language products immediately, then becomes the prerequisite for escaping its
        own architectural limitation.
