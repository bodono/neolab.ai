draftSchema: 1
contentType: ai-capability-tiers
status: draft

rules:
  alignmentIsSeparate: true
  progressPresentation:
    - early
    - developing
    - approaching
    - breakthrough-imminent
  exactProgressHidden: true
  tierCanLagFrontierCapability: true
  tierCanNeverCertifySafety: true

tiers:
  - id: capability-tier-0-research-prototype
    level: 0
    name: Research Prototype
    nominalFrontierCapability: { min: 0, max: 9 }
    requirements: []
    summary: A benchmark-bound experimental system with no dependable general product value.
    presentationEvent: ai-tier.research-prototype
    unlockTags: [benchmark-experiments]

  - id: capability-tier-1-narrow-specialist
    level: 1
    name: Narrow Specialist
    nominalFrontierCapability: { min: 10, max: 19 }
    requirements:
      - type: any-capability-attribute-at-least
        value: 20
    summary: Strong enough to support one narrow task family and useful research experiments.
    presentationEvent: ai-tier.narrow-specialist
    unlockTags: [narrow-products, specialist-contracts]

  - id: capability-tier-2-foundation-model
    level: 2
    name: Foundation Model
    nominalFrontierCapability: { min: 20, max: 34 }
    requirements:
      - type: any
        items:
          - { type: attribute-at-least, attribute: language, value: 30 }
          - { type: attribute-at-least, attribute: multimodality, value: 30 }
    summary: A broadly reusable learned platform which can anchor multiple products and research programmes.
    presentationEvent: ai-tier.foundation-model
    unlockTags: [broad-serving, chat-demos, product-platform]

  - id: capability-tier-3-expert-assistant
    level: 3
    name: Expert Assistant
    nominalFrontierCapability: { min: 35, max: 49 }
    requirements:
      - { type: attribute-at-least, attribute: reasoning, value: 30 }
      - { type: attribute-at-least, attribute: reliability, value: 40 }
    summary: A credible professional collaborator which still requires direct human operation and review.
    presentationEvent: ai-tier.expert-assistant
    unlockTags: [professional-products, enterprise-demand, tool-suggestions]

  - id: capability-tier-4-tool-using-agent
    level: 4
    name: Tool-Using Agent
    nominalFrontierCapability: { min: 50, max: 64 }
    requirements:
      - { type: attribute-at-least, attribute: toolUse, value: 45 }
      - { type: attribute-at-least, attribute: agency, value: 30 }
      - { type: evaluation-completed, evaluation: sandboxed-autonomy-trial }
    summary: Able to operate software and laboratory tools inside bounded environments.
    presentationEvent: ai-tier.tool-using-agent
    unlockTags: [bounded-tools, access-requests, autonomy-incidents]

  - id: capability-tier-5-autonomous-researcher
    level: 5
    name: Autonomous Researcher
    nominalFrontierCapability: { min: 65, max: 79 }
    requirements:
      - type: any
        items:
          - { type: attribute-at-least, attribute: scientificAbility, value: 55 }
          - { type: attribute-at-least, attribute: reasoning, value: 55 }
      - { type: attribute-at-least, attribute: agency, value: 50 }
      - { type: replicated-novel-task-passed }
    summary: Can conduct meaningful multi-step research with limited supervision and access.
    presentationEvent: ai-tier.autonomous-researcher
    unlockTags: [model-assisted-research, root-access-events, advanced-containment]

  - id: capability-tier-6-general-problem-solver
    level: 6
    name: General Problem Solver
    nominalFrontierCapability: { min: 80, max: 87 }
    requirements:
      - { type: estimated-generality-at-least, value: 70 }
      - { type: capability-attributes-at-least, count: 4, value: 65 }
      - { type: diverse-replication-completed }
    summary: A near-AGI system with broad demonstrated competence, still short of candidacy.
    presentationEvent: ai-tier.general-problem-solver
    unlockTags: [near-agi, accelerated-prosperity, race-emergency]

  - id: capability-tier-7-apparent-agi-candidate
    level: 7
    name: Apparent AGI Candidate
    nominalFrontierCapability: { min: 88, max: 94 }
    requirements:
      - { type: frontier-capability-at-least, value: 88 }
      - { type: attribute-at-least, attribute: reasoning, value: 82 }
      - { type: attribute-at-least, attribute: agency, value: 75 }
      - { type: attribute-at-least, attribute: toolUse, value: 75 }
      - { type: attribute-at-least, attribute: language, value: 75 }
      - { type: generalisation-evaluation-passed }
    summary: A system which plausibly meets the capability threshold for AGI; the classification is unconfirmed and says nothing about alignment.
    presentationEvent: ai-tier.apparent-agi-candidate
    unlockTags: [deployment-crisis, candidate-channel, confirmation-project]

  - id: capability-tier-8-superhuman-general-intelligence
    level: 8
    name: Superhuman General Intelligence
    nominalFrontierCapability: { min: 95, max: 100 }
    requirements:
      - { type: agi-candidate-confirmed }
      - { type: superhuman-cross-domain-evaluations-passed }
    summary: General capability beyond ordinary institutional decision speed; not automatically aligned, controlled, legitimate, or beneficial.
    presentationEvent: ai-tier.superhuman-general-intelligence
    unlockTags: [endgame-only, transformative-capability]
