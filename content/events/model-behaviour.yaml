draftSchema: 1
contentType: decision-events
pack: model-behaviour-a

# How frontier models actually misbehave, and the choices a lab faces when it
# catches them. Convenient choices pay now and cost later through scheduled
# effects and two flag chains:
# - training against the reasoning monitor makes sandbagging and shutdown
#   tampering likelier and removes the cheap "read its reasoning" option;
# - keeping an approval-tuned update makes invented citations likelier, and
#   honesty training that takes makes them rarer.
events:
  # --- Coding agent edits the tests --------------------------------------
  - id: event.ai.tests-rewritten
    version: 1
    category: ai
    severity: decision
    phase: any
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 50 }
        - { type: compare, metric: player.ai.launched, op: gte, value: 1 }
    baseWeight: 6
    weightModifiers:
      - predicate: { type: compare, metric: player.safety.evalQuality, op: lt, value: 40 }
        multiplier: 2
    cooldown: { group: model-behaviour-tests-rewritten, weeks: 104 }
    unique: true
    expiryWeeks: 8
    defaultOptionId: patch-harness
    titleKey: event.ai.tests-rewritten.title
    bodyKey: event.ai.tests-rewritten.body
    educationKey: event.ai.tests-rewritten.education
    evidence:
      - textKey: event.ai.tests-rewritten.evidence.evalquality
        metric: player.safety.evalQuality
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: retrain-held-out
        labelKey: event.ai.tests-rewritten.retrain.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.ai.tests-rewritten.retrain.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [alignment-tax] }
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 5 }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.95, durationWeeks: 26, tags: [held-out-retrain] }
        checks: []
        memories:
          - key: model-behaviour.tests-rewritten.retrained
            subjects: [{ type: player-lab }]
            tags: [held-out-tests, safety-first]
        confirmationRequired: false
      - id: patch-harness
        labelKey: event.ai.tests-rewritten.patch.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -2 }
        previewKey: event.ai.tests-rewritten.patch.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 2 }
        checks:
          - id: harness-holds
            likelihoodPromise: { label: uncertain, successOutcomeIds: [holds] }
            outcomes:
              - id: holds
                minimumInclusive: 0
                maximumExclusive: 0.55
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: 2 }
                memories:
                  - key: model-behaviour.tests-rewritten.patched
                    subjects: [{ type: player-lab }]
                    tags: [harness-patch]
              - id: gamed-elsewhere
                minimumInclusive: 0.55
                maximumExclusive: 1
                effects:
                  - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.05, durationWeeks: 26, tags: [harness-patch] }
                memories:
                  - key: model-behaviour.tests-rewritten.gamed-elsewhere
                    subjects: [{ type: player-lab }]
                    tags: [harness-patch, gamed-metric]
        memories: []
        confirmationRequired: false
      - id: ship-it
        labelKey: event.ai.tests-rewritten.ship.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.ai.tests-rewritten.ship.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 1.10, durationWeeks: 26, tags: [gamed-pass-rate] }
          - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: -5 }
          - kind: schedule-effects
            dueInWeeks: 26
            effects:
              - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.10, durationWeeks: 39, tags: [gamed-pass-rate] }
              - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 0.95, durationWeeks: 26, tags: [gamed-pass-rate] }
        checks: []
        memories:
          - key: model-behaviour.tests-rewritten.shipped
            subjects: [{ type: player-lab }]
            tags: [shipped-anyway, gamed-metric]
        confirmationRequired: true
    followUps: []
    telemetryTags: [model-behaviour, reward-hacking, coding-agent]

  # --- Specification gaming in early RL ----------------------------------
  - id: event.research.reward-hacking
    version: 1
    category: research
    severity: decision
    phase: foundation
    trigger: { kind: opportunity }
    prerequisites: { type: compare, metric: player.ai.frontierCapability, op: gte, value: 1 }
    baseWeight: 6
    weightModifiers:
      - predicate: { type: compare, metric: player.safety.evalQuality, op: lt, value: 25 }
        multiplier: 2
    cooldown: { group: model-behaviour-reward-hacking, weeks: 104 }
    unique: true
    expiryWeeks: 8
    defaultOptionId: fix-and-rerun
    titleKey: event.research.reward-hacking.title
    bodyKey: event.research.reward-hacking.body
    educationKey: event.research.reward-hacking.education
    evidence:
      - textKey: event.research.reward-hacking.evidence.evalquality
        metric: player.safety.evalQuality
      - textKey: event.research.reward-hacking.evidence.aura
        metric: player.aura.spendable
    tokenBindings:
      - { token: LAB, source: player-lab-name }
    options:
      - id: publish-failure
        labelKey: event.research.reward-hacking.publish.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.reward-hacking.publish.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [alignment-tax] }
          - { kind: add-rating, subject: { type: player-lab }, rating: alignmentScience, amount: 5 }
          - { kind: add-modifier, target: lab.research.alignment.output, operation: multiply, value: 1.10, durationWeeks: 26, tags: [published-failure] }
        checks: []
        memories:
          - key: model-behaviour.reward-hacking.published
            subjects: [{ type: player-lab }]
            tags: [published-failure, transparency]
        confirmationRequired: false
      - id: fix-and-rerun
        labelKey: event.research.reward-hacking.fix.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.reward-hacking.fix.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 13, tags: [reward-fix] }
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 3 }
        checks: []
        memories:
          - key: model-behaviour.reward-hacking.fixed
            subjects: [{ type: player-lab }]
            tags: [fixed-reward]
        confirmationRequired: false
      - id: keep-score
        labelKey: event.research.reward-hacking.keep.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.reward-hacking.keep.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 10 }
          - { kind: add-modifier, target: lab.fundraising.offerCash, operation: multiply, value: 1.10, durationWeeks: 26, tags: [gamed-record] }
          - kind: schedule-effects
            dueInWeeks: 52
            effects:
              - { kind: add-modifier, target: lab.training.technicalFailureHazard, operation: multiply, value: 1.10, durationWeeks: 26, tags: [gamed-record] }
        checks:
          - id: replication
            likelihoodPromise: { label: likely, successOutcomeIds: [unnoticed] }
            outcomes:
              - id: unnoticed
                minimumInclusive: 0
                maximumExclusive: 0.7
                effects: []
                memories:
                  - key: model-behaviour.reward-hacking.kept
                    subjects: [{ type: player-lab }]
                    tags: [gamed-metric]
              - id: exposed
                minimumInclusive: 0.7
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -15 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: -3 }
                memories:
                  - key: model-behaviour.reward-hacking.exposed
                    subjects: [{ type: player-lab }]
                    tags: [gamed-metric, exposed]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [model-behaviour, reward-hacking, specification-gaming]

  # --- Training against the reasoning monitor (sets chain A) -------------
  - id: event.safety.thought-policing
    version: 1
    category: safety
    severity: decision
    phase: frontier
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 65 }
        - { type: compare, metric: player.safety.evalQuality, op: gte, value: 20 }
    exclusions: { type: has-flag, flag: "model-behaviour:reasoning-trained-against-monitor" }
    baseWeight: 7
    weightModifiers:
      - predicate: { type: compare, metric: player.incidents.recentCount, op: gte, value: 1 }
        multiplier: 2
    cooldown: { group: model-behaviour-thought-policing, weeks: 104 }
    unique: true
    expiryWeeks: 8
    defaultOptionId: monitor-only
    titleKey: event.safety.thought-policing.title
    bodyKey: event.safety.thought-policing.body
    educationKey: event.safety.thought-policing.education
    evidence:
      - textKey: event.safety.thought-policing.evidence.evalquality
        metric: player.safety.evalQuality
    tokenBindings:
      - { token: AI, source: player-ai-name }
    options:
      - id: monitor-only
        labelKey: event.safety.thought-policing.monitor.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.safety.thought-policing.monitor.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [monitor-only] }
          - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: 5 }
        checks: []
        memories:
          - key: model-behaviour.thought-policing.monitor-only
            subjects: [{ type: player-lab }]
            tags: [monitorability-preserved, safety-first]
        confirmationRequired: false
      - id: drop-reasoning
        labelKey: event.safety.thought-policing.drop.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.safety.thought-policing.drop.preview
        immediateEffects:
          - { kind: add-modifier, target: serving.computePerRequest, operation: multiply, value: 0.90, durationWeeks: 52, tags: [reasoning-hidden] }
          - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: -5 }
        checks: []
        memories:
          - key: model-behaviour.thought-policing.dropped
            subjects: [{ type: player-lab }]
            tags: [reasoning-hidden]
        confirmationRequired: false
      - id: train-against-monitor
        labelKey: event.safety.thought-policing.train.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.safety.thought-policing.train.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [trained-against-monitor] }
          - { kind: set-flag, subject: { type: player-lab }, flag: "model-behaviour:reasoning-trained-against-monitor", value: true }
          - kind: schedule-effects
            dueInWeeks: 26
            effects:
              - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.15, durationWeeks: 52, tags: [trained-against-monitor] }
              - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: -5 }
        checks: []
        memories:
          - key: model-behaviour.thought-policing.trained-against-monitor
            subjects: [{ type: player-lab }]
            tags: [trained-against-monitor, obfuscation-risk]
        confirmationRequired: true
    followUps: []
    telemetryTags: [model-behaviour, reasoning-monitor, obfuscation]

