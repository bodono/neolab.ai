    educationKey: event.market.ai-shopkeeper.education
    evidence:
      - textKey: event.market.ai-shopkeeper.evidence.evalquality
        metric: player.safety.evalQuality
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: office-trial
        labelKey: event.market.ai-shopkeeper.trial.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -3 }
        previewKey: event.market.ai-shopkeeper.trial.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 5 }
        checks: []
        memories:
          - key: late-models.ai-shopkeeper.office-trial
            subjects: [{ type: player-lab }]
            tags: [office-trial, evidence-led]
        confirmationRequired: false
      - id: human-manager
        labelKey: event.market.ai-shopkeeper.manager.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.market.ai-shopkeeper.manager.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 1.05, durationWeeks: 26, tags: [supervised-shopkeeper] }
        checks:
          - id: the-till
            likelihoodPromise: { label: likely, successOutcomeIds: [balanced] }
            outcomes:
              - id: balanced
                minimumInclusive: 0
                maximumExclusive: 0.7
                effects: []
                memories:
                  - key: late-models.ai-shopkeeper.managed
                    subjects: [{ type: player-lab }]
                    tags: [supervised-shopkeeper]
              - id: discount-spree
                minimumInclusive: 0.7
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -5 }
                memories:
                  - key: late-models.ai-shopkeeper.discount-spree
                    subjects: [{ type: player-lab }]
                    tags: [supervised-shopkeeper, discount-spree]
        memories: []
        confirmationRequired: false
      - id: run-alone
        labelKey: event.market.ai-shopkeeper.alone.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.market.ai-shopkeeper.alone.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 1.10, durationWeeks: 26, tags: [autonomous-shopkeeper] }
          - { kind: add-modifier, target: lab.market.acquisitionRate, operation: multiply, value: 1.10, durationWeeks: 26, tags: [autonomous-shopkeeper] }
        checks:
          - id: trading
            likelihoodPromise: { label: uncertain, successOutcomeIds: [trades] }
            outcomes:
              - id: trades
                minimumInclusive: 0
                maximumExclusive: 0.5
                effects: []
                memories:
                  - key: late-models.ai-shopkeeper.ran-alone
                    subjects: [{ type: player-lab }]
                    tags: [autonomous-shopkeeper]
              - id: blazer
                minimumInclusive: 0.5
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -10 }
                  - { kind: add-modifier, target: lab.market.demandCeiling, operation: multiply, value: 0.95, durationWeeks: 26, tags: [autonomous-shopkeeper] }
                memories:
                  - key: late-models.ai-shopkeeper.identity-crisis
                    subjects: [{ type: player-lab }]
                    tags: [autonomous-shopkeeper, identity-crisis]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [late-models, market, agents, autonomy]

