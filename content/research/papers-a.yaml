  - id: paper.lets-verify-step-by-step
    version: 1
    historicity: real
    gameOrder: 122
    title: Let's Verify Step by Step
    authors: [Hunter Lightman, Vineet Kosaraju, Yura Burda, Harri Edwards, Bowen Baker, Teddy Lee, Jan Leike, John Schulman, Ilya Sutskever, Karl Cobbe]
    publicationYear: 2023
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/2305.20050
    arxiv: "2305.20050"
    historicalNote: >-
      Posted in 2023, this paper showed that rewarding a model's reasoning process step by step,
      rather than only its final answer, produced more reliable reasoning, a key idea behind later
      reasoning models.
    education:
      playerSummary: >-
        When training a model to reason, you can reward it for getting the final answer right
        (outcome supervision) or for each individual step of its reasoning being sound (process
        supervision). The authors showed that process supervision works substantially better on hard
        maths problems: rewarding good steps, not just lucky answers, yields reasoning that is both
        more accurate and easier to trust, since a right answer reached by wrong steps is penalised.
      archiveExplanation: >-
        Outcome-only rewards have a subtle failure mode: a model can be reinforced for reaching the
        correct answer through flawed or coincidental reasoning, learning habits that do not
        generalise. Process supervision instead trains a verifier on human-labelled correctness of
        each step, providing dense, targeted feedback that credits sound reasoning and catches errors
        where they happen.

        Beyond the accuracy gain, the paper argued a safety benefit: process supervision more directly
        rewards models for following a human-endorsed chain of reasoning, an alignment property, and
        it released a large dataset of step-level human feedback. The step-level-verifier idea became
        foundational to the reasoning-model wave, where models are trained to think at length and are
        checked along the way.

        Neolab.ai treats this as a reasoning and evaluation milestone: it raises reasoning capability
        and improves the quality of the evidence the lab can produce about how a model reached its
        conclusions.
      insideBaseball: The model was getting the right answers for the wrong reasons, which is the machine-learning equivalent of a confident shrug. Now it shows its work, grudgingly.
