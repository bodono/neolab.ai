    epithet: The Scene Cartographer
    role: 3D scene understanding and spatial intelligence research leadership
    rosterCardSummary: A Vector Institute co-founder whose 3D scene research strengthens spatial intelligence, multimodal research, and model evaluation.
    biography: >-
      Sanja Fidler would like the picture to admit that it came from a three-dimensional room.
      Sanja Fidler earned her doctorate at the University of Ljubljana, held research positions at
      UC Berkeley and the University of Toronto, and joined the University of Toronto faculty after
      working at the Toyota Technological Institute at Chicago. She co-founded the Vector Institute,
      where she is a faculty member and Canada CIFAR AI Chair. NVIDIA appointed her to lead its
      Toronto AI research laboratory, and her research spans object detection, segmentation,
      image-to-image synthesis, 3D reconstruction, and spatial intelligence. Her public research
      pages emphasise structured and three-dimensional scene understanding rather than treating
      vision as a flat label-prediction task. The Vector Institute identifies her as a co-founding
      member and NVIDIA vice president of AI research alongside her Toronto appointment. Her
      research keeps that distinction practical:
      label the chair if useful, reconstruct the room if possible, and ask whether the robot knows
      which side of the chair it is standing on.
