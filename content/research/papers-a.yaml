  - id: paper.lenet-document-recognition
    version: 1
    historicity: real
    gameOrder: 2
    title: Gradient-Based Learning Applied to Document Recognition
    authors: [Yann LeCun, Léon Bottou, Yoshua Bengio, Patrick Haffner]
    publicationYear: 1998
    venue: Proceedings of the IEEE
    primarySourceUrl: https://doi.org/10.1109/5.726791
    doi: 10.1109/5.726791
    historicalNote: >-
      Published in 1998, this paper consolidated years of work on convolutional networks and
      demonstrated an end-to-end system for practical document recognition.
    education:
      playerSummary: >-
        LeNet showed that a trainable system could learn useful visual features directly from
        pixels and recognise handwritten characters as part of a complete document-reading
        pipeline. Local receptive fields, shared weights and pooling gave the convolutional
        network an efficient way to exploit image structure. It became a foundational example
        of end-to-end learning replacing a tower of hand-engineered stages.
      archiveExplanation: >-
        Images contain the same kinds of local patterns in many positions: an edge is still an
        edge when it moves ten pixels to the right. A fully connected network ignores that
        structure and spends separate parameters relearning similar detectors everywhere.
        Convolutional networks instead slide small learned filters across an image, sharing
        their weights by position. Subsampling or pooling then helps the representation remain
        useful when a feature shifts slightly.

        LeCun, Bottou, Bengio and Haffner placed these ideas inside a larger argument for
        gradient-based learning. Their paper described LeNet-5 and a complete system that read
        handwritten digits on cheques. The important achievement was not merely a benchmark:
        feature extraction, recognition and much of the surrounding decision pipeline could be
        trained together. This challenged the dominant pattern of separately engineering every
        transformation and then connecting the pieces.

        The hardware, datasets and training recipes of 1998 limited how far the approach could
        scale, and convolution itself had important precursors. Later systems would combine the
        same broad principles with far larger datasets, GPUs, rectified activations and deeper
        architectures. In the game, this discovery establishes the visual architecture family
        but does not jump directly to modern image recognition. The lab now knows how to build
        a compact, translation-aware visual learner; it still needs data and compute large
        enough to reveal what such learners can become.
      insideBaseball: The cheque reader works. Finance has become the first department to describe a neural network as mission-critical.
    domainWeights:
      domain.multimodality: 0.55
      domain.architectures: 0.30
      domain.data-representation: 0.15
    prerequisites:
      papers: [paper.backpropagation]
      domainLevels:
        domain.multimodality: 5
        domain.architectures: 6
    baseEffort: 80
    earliestPhase: foundation
    discovery:
      worldFirstAura: 8
      commercialValue: 7
      independentRediscovery: true
      diffusion: { openDelayWeeks: 13, openDurationWeeks: 26, controlledDelayWeeks: 26, controlledDurationWeeks: 39 }
