    inspirationSummary: Carnegie Mellon professor whose influential work spans deep generative models, probabilistic graphical models, representation learning, optimisation, and large-scale systems that discover structure in complex data.
    epithet: The Latent Cartographer
    role: Representation learning, probabilistic models, optimisation, and generative AI
    rosterCardSummary: A deep-learning and probabilistic-models expert who maps the latent space carefully enough that the rest of the lab may safely pretend it knows where it is.
    biography: >-
      Ruslan Salakhutdinov is the UPMC Professor of Computer Science at Carnegie Mellon University,
      where his research spans deep learning, probabilistic graphical models, generative models,
      large-scale optimisation, and representation learning. His work helped revive deep generative
      modelling through deep belief networks and later advanced topic models, collaborative
      filtering, multimodal learning, and neural architectures for structured data. He has led
      research in both academia and industry, including serving as Apple’s director of AI research,
      while continuing to develop methods that discover useful latent structure in very large
      datasets. The common thread is disciplined combination: neural networks where flexible
      function approximation helps, probabilistic structure where uncertainty matters, and enough
      optimisation to make the whole arrangement run. He completed his doctorate at the University
      of Toronto during the resurgence of deep learning and later joined Geoffrey Hinton on work
      showing how layered generative models could learn useful structure without extensive labels.
      That foundation informs later research across language, vision, recommendation, and science:
      the representation should expose structure rather than merely absorb scale. Ruslan regards a latent space without a map
      as less a representation than an expensive rumour.
