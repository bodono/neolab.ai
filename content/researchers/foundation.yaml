      probabilistic reasoning, decision-making and the foundations of intelligent systems. With
      Peter Norvig he wrote Artificial Intelligence: A Modern Approach, a textbook used at
      universities around the world—more than 1,500 universities across 135 countries, according
      to his Berkeley biography. He later founded Berkeley's Center for Human-Compatible AI,
      where research examines how intelligent systems can remain uncertain about human
      preferences and act as assistants rather than optimisers of a fully specified objective.
      He has worked on public policy, international security and the governance of autonomous
      systems. Across those settings, the same question keeps returning: if a machine pursues an
      objective very effectively, what evidence shows that the objective represents what people
      actually want—and what happens when it does not?
