      ids: [paper.switch-transformers, paper.masked-autoencoders]
    eventReactions:
      - { triggerTag: compute-windfall, line: "A windfall spent on a hardware-lottery-favoured idea is not the same as a windfall spent on the best idea. Check which one this is." }
      - { triggerTag: scaling-proposal, line: "Show me the result at matched compute and data first. Raw scale advantage hides whether the idea was actually better." }
      - { triggerTag: benchmark-record, line: "A smaller, well-trained model beating a larger one is the more interesting result. Look for that comparison specifically." }
    feedLines:
      - Sarah's matched-resource comparison showed a smaller model beating a much larger one trained with less care.
      - A promising research direction was quietly failing for hardware reasons that had nothing to do with the idea's merit.
      - The model-compression pass cut serving cost noticeably without the accuracy loss the team had budgeted for.
      - Sarah's "hardware lottery" framing settled an argument about why an elegant idea from years ago never took off.
      - A nonprofit she founded is training exactly the kind of technical capacity her own hardware-lottery argument says the field needs.
      - The compact's matched-resource requirement turned a flattering scale-advantage claim into a genuinely useful comparison.
    portrait:
      assetId: portrait.researcher.sarah-hooker
