          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -28 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 25 }
          - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: -12 }
