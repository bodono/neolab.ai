    epithet: The Adversary Hunter
    role: AI and computer security
    rosterCardSummary: The MacArthur Fellow who treats every learned model as useful software—and therefore as software that deserves a serious threat model.
    biography: >-
      Dawn Song is a professor of computer science at UC Berkeley whose research spans computer
      security, privacy, adversarial machine learning, AI safety and decentralised systems. Her
      early work developed approaches to analysing and defending software and networks, including
      systems exposed to attackers trying to evade detection. The MacArthur
      Foundation named her a Fellow in 2010 for contributions to computer security and privacy.
      Berkeley also records her recognition as AMiner’s most-cited scholar in computer security,
      alongside ACM and IEEE fellowships and test-of-time and best-paper awards. As machine
      learning systems became infrastructure, Song brought the same adversarial frame to models:
      capability creates an attack surface, and a confident demonstration is not a threat
      model. She co-founded Oasis Labs to develop privacy-preserving systems for data use.
      The range is broad but the operating question is consistent: who can make this system behave
      differently, and what evidence says they cannot? Every promising door gets a proper
      inspection of its lock.
