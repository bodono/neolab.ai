      later became the workhorse backbone under image diffusion models.
    education:
      playerSummary: >-
        U-Net is a network shape for producing an output image the same size as the input, labelling
        every pixel rather than the whole picture. It compresses the image down through an encoder,
        expands it back up through a decoder, and crucially adds "skip connections" that pass
        fine-grained detail directly across from the encoder so the output stays sharp. It trained
        well from very few labelled examples.
      archiveExplanation: >-
        Segmentation needs a network that both understands global context and preserves local
        precision, two goals that pull in opposite directions. U-Net's symmetric design resolves the
        tension: the contracting path builds up abstract understanding, the expanding path restores
        resolution, and the skip connections reunite the abstract features with the crisp detail that
        pooling would otherwise discard.

        The architecture proved remarkably general. Its clean encoder-decoder-with-skips template
        became the default backbone far beyond microscopy, and a decade later it sat at the centre of
        the image-generation boom: the denoising network inside most diffusion models is a U-Net,
        predicting the noise to remove at each step across the full image.

        Neolab.ai treats U-Net as an architectural multiplier for image work and a prerequisite that
        makes later diffusion-based generation and scientific imaging cheaper and more reliable.
