      - id: carve-out
        labelKey: event.government.restriction.carveout.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -20 }
        previewKey: event.government.restriction.carveout.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -6 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 8 }
        checks:
          - id: carve-out-talks
            likelihoodPromise: { label: unlikely, successOutcomeIds: [granted] }
            outcomes:
              - id: granted
                minimumInclusive: 0
                maximumExclusive: 0.3
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 10 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: -6 }
                  - { kind: add-modifier, target: lab.market.acquisitionRate, operation: multiply, value: 0.8, durationWeeks: 52, tags: [deployment-restriction, carve-out-granted] }
                  - { kind: add-modifier, target: lab.product.durationWeeks, operation: multiply, value: 1.1, durationWeeks: 52, tags: [deployment-restriction, carve-out-granted] }
                  - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.85, durationWeeks: 52, tags: [deployment-restriction, carve-out-granted] }
                memories:
                  - key: government.restriction.carveout.granted
                    subjects: [{ type: player-lab }]
                    tags: [government-response:negotiated, carve-out]
              - id: partial
                minimumInclusive: 0.3
                maximumExclusive: 1
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -12 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 12 }
                  - { kind: add-modifier, target: lab.market.acquisitionRate, operation: multiply, value: 0.5, durationWeeks: 52, tags: [deployment-restriction, carve-out-partial] }
                  - { kind: add-modifier, target: lab.product.durationWeeks, operation: multiply, value: 1.35, durationWeeks: 52, tags: [deployment-restriction, carve-out-partial] }
                  - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.75, durationWeeks: 52, tags: [deployment-restriction, carve-out-partial] }
                memories:
                  - key: government.restriction.carveout.partial
                    subjects: [{ type: player-lab }]
                    tags: [government-response:negotiated, partial-carve-out]
        memories: []
        confirmationRequired: true
      - id: defy
        labelKey: event.government.restriction.defy.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.government.restriction.defy.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -25 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -32 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 28 }
          - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: -8 }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.6, durationWeeks: 52, tags: [deployment-restriction, defied] }
        checks: []
        memories:
          - key: government.restriction.defied
            subjects: [{ type: player-lab }]
            tags: [government-response:refused, defiance]
        confirmationRequired: true
    followUps: []
    telemetryTags: [politics, government-ladder, restriction]

