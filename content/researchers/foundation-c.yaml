      - https://vcresearch.berkeley.edu/faculty/michael-jordan
      - https://ieor.berkeley.edu/people/michael-jordan/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-22 }

  - id: researcher.zubin-ghahramani
    version: 1
    displayName: Zubin Ghahramani
    inspirationName: Zoubin Ghahramani
    inspirationSummary: A Bayesian machine-learning leader who built scalable uncertainty methods, Cambridge institutions, Uber AI Labs, and research programmes at Google DeepMind.
    epithet: The Bayesian Architect
    role: Bayesian machine learning and research leadership
    rosterCardSummary: A Cambridge professor and Google DeepMind vice president whose approximate-inference algorithms taught machines to represent what they were still uncertain about.
    biography: >-
      Zoubin Ghahramani studied at the University of Pennsylvania, completed an MIT doctorate with
      Michael I. Jordan, and worked with Geoffrey Hinton in Toronto before joining the Gatsby
      Computational Neuroscience Unit and the University of Cambridge. His research spans Bayesian
      nonparametrics, Gaussian processes, probabilistic programming, and scalable approximate
      inference: methods for making uncertainty part of a model rather than an apology beneath its
      chart. His Automatic Statistician project asked software to select, fit, criticise, and explain
      statistical models, making uncertainty useful and legible. He was the founding Cambridge
      director of the Alan Turing Institute and co-founded Geometric Intelligence, which became Uber
      AI Labs, before serving as Uber's chief scientist. He later became a vice president at Google
      DeepMind. The institutions grew larger; the point estimate still did not get to travel without
      its posterior.
    availability: { wave: foundation, earliestYear: 2015, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.59, baseSigningCash: 5, auraCost: 8, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 2, dataRepresentation: 5, reinforcementAgency: 1, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 2, alignmentControl: 2, interpretabilityEvals: 4, securityContainment: 0, training: 2, product: 1, management: 5, politics: 4 }
    traits: [trait.principled-uncertainty, trait.research-institution-builder]
    signature:
      id: ability.bayesian-nonparametrics
      label: Bayesian Nonparametrics
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.reasoning-tools] }
      rampWeeks: 5
      effects:
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 5 }
    passive:
      id: ability.institute-builder
      label: Institute Builder
      effects:
        - { target: lab.politics.governmentTrustFloor, operation: add, value: 4}
    compact:
      id: compact.represent-the-uncertainty
      label: Represent the Uncertainty
      requirement: Publish one calibrated uncertainty estimate alongside a capability claim every 52 weeks.
      check: { type: tagged-action-within, tags: [calibrated-uncertainty-publication], weeks: 52 }
      breachEvent: people.compact.represent-the-uncertainty
    paperHooks:
      ids: [paper.variational-autoencoder, paper.masked-autoencoders]
    eventReactions:
      - { triggerTag: model-overconfidence, line: "A confident wrong answer is worse than an honest 'uncertain.' Fix the calibration before the copy." }
      - { triggerTag: institutional-partnership, line: "An institute is a long-term bet on a community, not a press release." }
      - { triggerTag: scaling-proposal, line: "Scale the model. Scale the uncertainty estimate alongside it, or you have only scaled the confidence." }
    feedLines:
      - Zubin asked for the posterior, not just the point estimate, and the meeting ran ten minutes longer.
      - A visiting fellowship application landed on his desk, and by afternoon it had become a small institute.
      - The nonparametric model grew a new component exactly where the data suggested it should.
      - Zubin's approximate inference algorithm converged in half the iterations, again.
      - A confidently wrong forecast was returned for recalibration before it reached the board.
      - Three hundred papers in, Zubin still opens a new one by asking what it is uncertain about.
    portrait:
      assetId: portrait.researcher.zubin-ghahramani
      brief: Warm 8-bit editorial portrait; British-Iranian man with dark hair greying at the temples, beside a Bayesian nonparametric model diagram with a growing number of components; institutional and precise, not photoreal.
      altText: Pixel-art portrait of Zubin Ghahramani beside a Bayesian nonparametric model diagram with a growing number of components.
