    category: safety
    severity: urgent
    phase: any
    trigger: { kind: mandatory, detector: autonomy-egress-postmortem, priority: 70 }
    prerequisites: { type: always }
    baseWeight: 0
    weightModifiers: []
    cooldown: { group: autonomy-egress, weeks: 0 }
    unique: true
    expiryWeeks: 6
    defaultOptionId: say-nothing
    titleKey: event.autonomy.egress.title
    bodyKey: event.autonomy.egress.body
    evidence:
      - textKey: event.autonomy.egress.evidence.trust
        metric: player.politics.governmentTrust
      - textKey: event.autonomy.egress.evidence.attention
        metric: player.politics.governmentAttention
    tokenBindings:
      - { token: MODEL_NAME, source: trigger-text }
      - { token: LAB, source: player-lab-name }
    options:
      - id: disclose
        labelKey: event.autonomy.egress.disclose.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.autonomy.egress.disclose.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -30, auraChangeKind: loss, auraCategory: incident, auraSignalImpact: -30 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -8 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 12 }
          - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: 6 }
