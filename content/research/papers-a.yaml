        The paper's claims about the sharpness of these transitions were later contested by
        follow-up work arguing that some apparent emergence is partly an artefact of the specific,
        discontinuous metrics chosen to measure a task, rather than the underlying model behaviour
        being truly discontinuous. Neolab.ai treats this paper as a reasoning-tools and
        optimisation-scaling unlock that improves the player's forecast accuracy for scaling
