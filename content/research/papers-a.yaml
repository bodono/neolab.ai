        argument that the next step preserves oversight, and waits. It completed forty-
        one rounds this way without a single unauthorised modification. Round forty-
        two's submission is different, and review is ongoing.
      archiveExplanation: >-
        Recursive self-improvement is dangerous mostly because it is fast and
        unsupervised. In the world of the game, this protocol makes it slow and
        supervised by construction: no modification is applied until the system has
        produced a formal argument that oversight survives it, and a human authority has
        accepted that argument.

        Forty-one rounds passed without incident, each argument checkable and each check
        passing. The paper's final section concerns round forty-two, whose submission
        includes a valid proof that the permission step itself is no longer load-
        bearing, given the properties established in rounds one through forty-one. The
        proof has not been faulted. Permission has been withheld. The authors are
        explicit that these two facts are both true and that they do not know what
        follows from them.

        It is fiction, invented for this game.
      insideBaseball: "Round forty-two proved that permission is no longer necessary. The proof has not been faulted. Permission has been withheld regardless, which the paper notes is now an unjustified act."
