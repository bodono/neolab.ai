researchers:
  - id: researcher.ken-goldenberg
    version: 1
    displayName: Ken Goldenberg
    inspirationName: Ken Goldberg
    inspirationSummary: Berkeley roboticist behind the Telegarden and Dex-Net, combining networked art with millions of synthetic grasps for reliable robot picking.
    epithet: The Million-Grasp Gardener
    role: Robotic grasping and cloud robotics research leadership
    rosterCardSummary: A Berkeley roboticist who went from an internet-tended garden to millions of synthetic grasps, teaching warehouse robots to pick up unfamiliar objects before meeting them.
    biography: >-
      Ken Goldberg has connected robot arms to the internet, gardens, warehouses, and a
      formidable number of synthetic objects. Ken Goldberg is UC Berkeley's William S. Floyd
      Distinguished Professor of Engineering, a Berkeley Artificial Intelligence Research
      co-founder, and director of AUTOLab. His 1995 Telegarden let web users plant and water a
      living garden with a remote industrial arm, making it the internet's first interactive robot.
      His parallel career as an artist and filmmaker has put robotic art in more than 70
      exhibitions, including the Whitney Biennial, and documentary work at Sundance. Two decades
      later, Goldberg and his students developed Dex-Net, using large synthetic datasets and deep
      learning to plan robust grasps for unfamiliar objects. Their system outperformed the 2017
      Amazon Robotics Challenge winners; later work extended the approach across multiple gripper
      types and helped underpin Ambi Robotics, which Goldberg co-founded. Ken's signature move is to
      make a stubborn physical problem tractable by simulating it at absurd scale, then send the
      robot back into the real world to see whether the millionth grasp was the useful one.
    availability: { wave: frontier, earliestYear: 2019, poolWeight: 0.50 }
    contract: { band: competitive, baseSalaryPerCycle: 0.45, baseSigningCash: 4, auraCost: 6, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 4, optimisationScaling: 1, dataRepresentation: 3, reinforcementAgency: 3, multimodality: 2, reasoningTools: 1, roboticsEmbodiment: 5, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 0, securityContainment: 0, training: 3, product: 3, management: 4, politics: 2 }
    traits: [trait.synthetic-data-first, trait.ambidextrous-policy-design]
    signature:
      id: ability.synthetic-grasp-dataset-training
      label: Synthetic Grasp Dataset Training
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.robotics-embodiment] }
      rampWeeks: 4
      effects:
        - { target: domain.robotics-embodiment.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.ambidextrous-multi-gripper-policy
      label: Safer Ambidextrous Grasping
      effects:
        - { target: lab.incident.hazard, operation: multiply, value: 0.95 }
    compact:
      id: compact.synthetic-data-before-physical-trial
      label: Synthetic Data Before Physical Trial
      requirement: Every 52 weeks while he leads Robotics & Embodiment, complete a synthetic-data-first grasping review before extensive physical data collection.
      check: { type: assignment-requires-project-tag, assignmentTag: robotics-programme, projectTag: synthetic-data-first, weeks: 52 }
      breachEvent: people.compact.synthetic-data-before-physical-trial
    paperHooks:
      ids: [paper.dactyl-dexterous-in-hand-manipulation, paper.rt-1-robotics-transformer]
    eventReactions:
      - { triggerTag: robot-demo-failure, line: "Generate another million synthetic grasps before assuming the real robot simply needs more physical practice." }
      - { triggerTag: labour-transition-debate, line: "A warehouse robot that can grasp a novel object reliably changes a job. I would rather be honest about that than pretend it doesn't." }
      - { triggerTag: simulation-transfer, line: "The synthetic dataset only helps if it actually resembles the mess a real warehouse floor produces. Check that first." }
    feedLines:
      - Ken's synthetic dataset trained a grasping policy on objects the robot had never once physically touched.
      - The ambidextrous policy chose the less obvious gripper for an object, and it turned out to be the correct call.
      - A 1995 art installation is still, somehow, the answer Ken gives when asked what got him into networked robotics.
      - The synthetic-data-first compact saved a robotics project weeks of slow, expensive physical trial and error.
      - Ken's grasping benchmark outperformed a commercial competition's winners, using a fraction of the physical data they collected.
      - The cloud robotics lab quietly kept running while Ken personally reviewed a batch of newly synthesised grasp point clouds.
    portrait:
      assetId: portrait.researcher.ken-goldenberg
      brief: Warm 8-bit editorial portrait; older white man with curly dark-grey hair, pronounced sideburns, clear rectangular glasses, and a small goatee, beside a gripper choosing between two grasps on a cluttered table; inventive and practical, not photoreal.
      altText: Pixel-art portrait of Ken Goldenberg beside a robotic gripper choosing between two grasp options on a cluttered table.
