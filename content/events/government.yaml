  - id: event.government.licensing-action
    version: 2
    category: politics
    severity: urgent
    phase: any
    trigger: { kind: mandatory, detector: government-licensing, priority: 55 }
    # A lab still in reasonable standing gets the ordinary licence review;
    # see licensing-second-look for a lab the regulator has stopped trusting.
    prerequisites:
      { type: compare, metric: player.politics.governmentTrust, op: gte, value: 30 }
    baseWeight: 0
    weightModifiers: []
    cooldown: { group: government-intervention, weeks: 0 }
    unique: false
    expiryWeeks: 6
    defaultOptionId: stall
    titleKey: event.government.licensing.title
    bodyKey: event.government.licensing.body
    evidence:
      - textKey: event.government.licensing.evidence.pressure
        metric: player.politics.interventionPressure
      - textKey: event.government.licensing.evidence.attention
        metric: player.politics.governmentAttention
    tokenBindings:
      - { token: LAB, source: player-lab-name }
    options:
      - id: accept
        labelKey: event.government.licensing.accept.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -6 }
        previewKey: event.government.licensing.accept.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 9 }
          - { kind: add-modifier, target: lab.product.durationWeeks, operation: multiply, value: 1.08, tags: [licensing-compliance] }
        checks: []
        memories:
          - key: government.licensing.accepted
            subjects: [{ type: player-lab }]
            tags: [government-response:satisfied, licensed]
        confirmationRequired: false
      - id: negotiate
        labelKey: event.government.licensing.negotiate.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -4 }
        previewKey: event.government.licensing.negotiate.preview
        immediateEffects: []
        checks:
          - id: negotiation
            likelihoodPromise: { label: uncertain, successOutcomeIds: [narrowed] }
            outcomes:
              - id: narrowed
                minimumInclusive: 0
                maximumExclusive: 0.55
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 5 }
                memories:
                  - key: government.licensing.narrowed
                    subjects: [{ type: player-lab }]
                    tags: [government-response:negotiated, scope-narrowed]
              - id: unchanged
                minimumInclusive: 0.55
                maximumExclusive: 1
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 1 }
                  - { kind: add-modifier, target: lab.product.durationWeeks, operation: multiply, value: 1.12, tags: [licensing-compliance] }
                memories:
                  - key: government.licensing.unchanged
                    subjects: [{ type: player-lab }]
                    tags: [government-response:negotiated, scope-unchanged]
        memories: []
        confirmationRequired: false
      - id: stall
        labelKey: event.government.licensing.stall.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.government.licensing.stall.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -11 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 8 }
        checks: []
        memories:
          - key: government.licensing.refused
            subjects: [{ type: player-lab }]
            tags: [government-response:refused, unlicensed]
        confirmationRequired: true
    followUps: []
    telemetryTags: [politics, government-ladder, licensing]

  - id: event.government.deployment-restriction
    version: 3
    category: politics
    severity: urgent
