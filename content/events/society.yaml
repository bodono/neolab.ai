  - id: event.research.debate-trial
    version: 1
    category: research
    severity: decision
    phase: frontier
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 65 }
        - { type: compare, metric: player.safety.safetyCulture, op: gte, value: 35 }
    baseWeight: 6
    weightModifiers:
      - predicate:
          { type: compare, metric: player.safety.practicalControl, op: lt, value: 40 }
        multiplier: 2
    cooldown: { group: society-debate-trial, weeks: 52 }
    unique: true
    expiryWeeks: 8
    defaultOptionId: pilot
    titleKey: event.research.debate-trial.title
    bodyKey: event.research.debate-trial.body
    educationKey: event.research.debate-trial.education
    evidence:
      - textKey: event.research.debate-trial.evidence.control
        metric: player.safety.practicalControl
      - textKey: event.research.debate-trial.evidence.culture
        metric: player.safety.safetyCulture
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: fund-trial
        labelKey: event.research.debate-trial.fund-trial.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.debate-trial.fund-trial.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.90, durationWeeks: 26, tags: [debate-trial] }
          - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: 3 }
        checks:
          - id: trial-result
            likelihoodPromise: { label: uncertain, successOutcomeIds: [promising] }
            outcomes:
              - id: promising
                minimumInclusive: 0
                maximumExclusive: 0.55
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: alignmentScience, amount: 10 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: 4 }
                memories:
                  - key: research.debate-trial.promising
                    subjects: [{ type: player-lab }]
                    tags: [invested-in-safety, scalable-oversight]
              - id: inconclusive
                minimumInclusive: 0.55
                maximumExclusive: 1
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: alignmentScience, amount: 3 }
                memories:
                  - key: research.debate-trial.inconclusive
                    subjects: [{ type: player-lab }]
                    tags: [invested-in-safety, scalable-oversight]
        memories: []
        confirmationRequired: false
      - id: pilot
        labelKey: event.research.debate-trial.pilot.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.debate-trial.pilot.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: alignmentScience, amount: 3 }
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 13, tags: [debate-pilot] }
        checks: []
        memories:
          - key: research.debate-trial.piloted
            subjects: [{ type: player-lab }]
            tags: [scalable-oversight, pilot]
        confirmationRequired: false
      - id: decline
        labelKey: event.research.debate-trial.decline.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.debate-trial.decline.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 13, tags: [debate-declined] }
          - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: -3 }
          - { kind: set-flag, subject: { type: player-lab }, flag: "society:products-first", value: true }
        checks: []
        memories:
          - key: research.debate-trial.declined
            subjects: [{ type: player-lab }]
            tags: [deferred-safety, products-first]
        confirmationRequired: false
    followUps: []
    telemetryTags: [research, oversight, alignment]

  - id: event.research.synthetic-data
