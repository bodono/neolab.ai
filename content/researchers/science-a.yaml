      activation: { type: assignment-domain-in, values: [domain.scientific-ai] }
      rampWeeks: 4
      effects:
        - { target: domain.scientific-ai.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.rare-disease-low-sample-diagnosis
      label: Rare-Disease Low-Sample Diagnosis
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    compact:
      id: compact.encode-the-known-biology-dont-wait-for-more-data
      label: Encode the Known Biology, Don't Wait for More Data
      requirement: Every 52 weeks while she leads Scientific AI, complete one knowledge-graph representation review.
      check: { type: assignment-requires-project-tag, assignmentTag: scientific-ai-programme, projectTag: knowledge-graph-representation, weeks: 52 }
      breachEvent: people.compact.encode-the-known-biology-dont-wait-for-more-data
