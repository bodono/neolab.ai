    role: Reinforcement learning, health applications, and reproducibility
    rosterCardSummary: A rigorous reinforcement-learning leader who narrows experimental variance, rewards replicated discoveries, and makes the entire lab's science easier to trust.
    biography: >-
      Jo Pineau has built a career around intelligent systems that must work under uncertainty
      and research cultures that must show their work. At McGill, her contributions span
      reinforcement learning, planning under partial observability and applications to health
      care, where technical elegance matters only when joined to careful validation. She has led
      major academic and industrial research organisations while remaining a forceful advocate
      for open, reproducible science. Her work helped drive the NeurIPS reproducibility programme,
      including code submission, checklists and systematic study of what conference incentives
      can improve. Jo's leadership makes rigour feel enabling rather than bureaucratic. A result
      that can be rerun travels farther, teaches more people and survives contact with institutions
      that cannot rely on the original author's intuition. She brings statistical judgement,
      organisational credibility and the wonderful habit of asking whether the spectacular curve
      appeared twice.
