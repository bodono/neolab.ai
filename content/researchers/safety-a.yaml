  - id: researcher.bess-barnes
    version: 1
    displayName: Bess Barnes
    inspirationName: Elizabeth (Beth) Barnes
    inspirationSummary: Founder and CEO of METR, the independent evaluation organisation that measures what frontier AI agents can actually accomplish before capability claims become surprises.
    epithet: The No-Surprises Auditor
    role: Frontier model evaluations and autonomous-capability testing
    rosterCardSummary: The METR founder who turns “we do not think it can do that” into an independent test, a task horizon and an answer.
    biography: >-
      Elizabeth (Beth) Barnes founded and leads METR, an independent organisation that designs and
      runs evaluations of frontier generative-AI systems. Before METR, she worked with DeepMind’s
      chief scientist on scaling laws for forecasting deep-learning progress. At OpenAI, she helped
      develop safety targets, studied scalable oversight and evaluated code models for misalignment
      before release. METR’s work measures what increasingly agentic systems can accomplish on
      realistic, extended tasks, including how the length of tasks they complete changes as models
      improve. The organisation also conducts pre-release evaluations and external reviews for
      frontier developers while maintaining independent funding. That combination gives a public
      capability claim something stronger than either a benchmark screenshot or a laboratory’s own
      confidence. Barnes has turned the sentence “we would know if it could do that” into a research
      programme with task definitions, time horizons and recorded results. It is difficult work to
      make surprises measurable before they become incidents; METR exists to put them on the
      calendar first. Her team publishes methods and results so outside researchers can examine the
      measurements and limits.
