    colour: "#dd5f63"

safetyPrograms:
  - id: safety.alignment-control
    name: Alignment and Control
    description: Training objectives, oversight, corrigibility, control protocols, and methods for keeping powerful systems directed toward intended ends.
    colour: "#59c97c"
  - id: safety.interpretability-evals
    name: Interpretability and Evals
    description: Understanding model internals and building measurements that can reveal capability, deception, bias, and dangerous behaviour.
    colour: "#4ea7ef"
  - id: safety.security-containment
    name: Security and Containment
    description: Access control, sandboxing, red teaming, incident response, model-weight security, and barriers to unauthorised action.
    colour: "#ae7ee8"

