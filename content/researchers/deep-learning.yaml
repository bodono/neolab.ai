researchers:
  - id: researcher.ilya-suchkeeper
    version: 1
    displayName: Ilya Suchkeeper
    inspirationName: Ilya Sutskever
    inspirationSummary: AlexNet and sequence-to-sequence co-author, OpenAI co-founder and former chief scientist, and co-founder of Safe Superintelligence Inc.
    epithet: The Scaling Oracle
    role: Sequence models and frontier training
    rosterCardSummary: An AlexNet and sequence-to-sequence co-author whose scaling instinct raises fleet-wide throughput and keeps frontier runs technically on track.
    biography: >-
      Ilya Sutskever looks at a scaling curve and asks whether it is large enough to teach the
      lab something new. Ilya Sutskever studied mathematics and completed a computer-science
      doctorate with Geoffrey Hinton at the University of Toronto. With Alex Krizhevsky and Hinton,
      he co-authored the 2012 AlexNet work that transformed
      ImageNet computer vision. At Google Brain, he co-authored sequence-to-sequence learning with
      Oriol Vinyals and Quoc Le, demonstrating neural translation with an encoder-decoder
      architecture. In 2015 he co-founded OpenAI, where he served as research director and later
      chief scientist as large generative models moved into public use. In 2024 he co-founded Safe
      Superintelligence Inc., whose stated sole focus is building safe superintelligence. That
      record keeps two questions unusually close: what new capability appears at greater scale,
      and what evidence would justify calling the resulting system controlled rather than merely
      capable.
    availability:
      wave: deep-learning
      earliestYear: 2013
      unlockAny: [{ domainLevelAtLeast: 12 }, { discoveredTag: deep-representation-landmark }]
      poolWeight: 0.55
    contract: { band: lab-defining, baseSalaryPerCycle: 1.2, baseSigningCash: 12, auraCost: 17, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 4, reinforcementAgency: 2, multimodality: 5, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 2, alignmentControl: 5, interpretabilityEvals: 2, securityContainment: 1, training: 5, product: 2, management: 4, politics: 1 }
    traits: [trait.scaling-intuition, trait.frontier-seriousness]
    signature:
      id: ability.scaling-intuition
      label: Scaling Intuition
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.optimisation-scaling] }
      rampWeeks: 4
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.06 }
    passive:
      id: ability.clean-run
      label: Clean Run
      effects:
        - { target: lab.training.technicalFailureHazard, operation: multiply, value: 0.968 }
    compact:
      id: compact.guaranteed-cluster
      label: Guaranteed Cluster
      requirement: Complete one dedicated cluster-capacity review every 52 weeks.
      check: { type: tagged-action-within, tags: [capacity-review], weeks: 52 }
      fulfilmentEffects:
        - { target: researcher.moraleTarget, operation: add, value: 3 }
      breachEvent: people.compact.guaranteed-cluster
    paperHooks:
      ids: [paper.alexnet, paper.sequence-to-sequence, paper.transformer]
    eventReactions:
      - { triggerTag: frontier-run-proposal, line: "The run is large enough to answer the question. We should now ensure the question is worthy of the run." }
      - { triggerTag: alignment-schism, line: "Scientific disagreement is not the failure mode. Losing the ability to describe it clearly would be." }
      - { triggerTag: candidate-confirmation, line: "The evidence says candidate. It does not say controlled, aligned, or ready." }
    feedLines:
      - Ilya looked at the scaling curve for a long time and moved one point on the training plan.
      - The frontier run is noticeably shorter and approximately twice as existentially discussed.
      - Sequence models have acquired a destination, a decoder, and a rapidly increasing cluster reservation.
      - Ilya requested a fifth of R&D compute with the calm of someone requesting the scientifically relevant minimum.
      - The candidate-confirmation memo acquired five more caveats and the room became quieter.
      - The clean run completed on schedule. Safety has correctly declined to interpret this as a moral property.
    portrait:
      assetId: portrait.researcher.ilya-suchkeeper
      brief: Intense 8-bit editorial portrait; white man with a high, deeply receded hairline and close dark hair at the sides, wearing a concentrated expression and lit by a violet scaling curve and compact cluster diagram; visionary and serious, not photoreal.
      altText: Pixel-art portrait of Ilya Suchkeeper before a violet scaling curve and compute-cluster diagram.
    sources:
      - https://www.utoronto.ca/news/ilya-sutskever-leader-ai-and-its-responsible-development-receives-u-t-honorary-degree
      - https://papers.nips.cc/paper_files/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html
      - https://papers.nips.cc/paper_files/paper/2014/hash/5a18e133cbf9f257297f410bb7eca942-Abstract.html
