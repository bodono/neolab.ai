  - id: researcher.sarah-hooker
    version: 1
    displayName: Sarah Hooker
    inspirationName: Sara Hooker
    inspirationSummary: Hardware-aware machine-learning researcher who named the hardware lottery and now builds efficient systems that adapt in real time.
    epithet: The Hardware Lottery Auditor
    role: Model efficiency, hardware-aware machine learning, and research leadership
    rosterCardSummary: The efficiency researcher who named the hardware lottery and keeps checking whether the winning idea merely had the right accelerator.
    biography: >-
      Sara Hooker is a machine-learning researcher focused on efficiency, interpretability and
      the interaction between algorithms and hardware. After research at Google Brain, she led
      Cohere Labs, where work included efficient models and multilingual open research. Her paper
      “The Hardware Lottery” argued that research ideas can succeed or fail partly because they
      fit the available software and accelerators, not simply because they are intrinsically
      better. She completed a computer-science doctorate at Mila under Hugo Larochelle and Aaron
      Courville. She later co-founded Adaption Labs, whose research centres efficiency, real-time
      learning and systems designed around latency, memory, cost and energy constraints. Across
      those projects, compute budgets are treated as design inputs rather than footnotes appended
      after the leaderboard. At Cohere Labs she also helped lead Aya, an open multilingual model
      covering 101 languages, and research on compression, interpretability and the environmental
      costs of machine learning. Her work on “The Low-Resource Double Bind” examined how efficiency
      constraints can compound data scarcity for underserved languages. A larger model may still
      win; it is simply asked to race at matched resources before receiving the trophy.
    availability: { wave: frontier, earliestYear: 2020, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.4, baseSigningCash: 3, auraCost: 5, overrideExplanation: Priced on overall measured research strength. }
