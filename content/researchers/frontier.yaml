  - id: researcher.kelsey-finn
    version: 1
    displayName: Kelsey Finn
    inspirationName: Chelsea Finn
    inspirationSummary: Stanford roboticist, MAML co-creator, IRIS lab director, and Physical Intelligence co-founder working on agents that learn new behaviours from limited experience.
    epithet: The Few-Shot Roboticist
    role: Robotics, meta-learning, and adaptation
    rosterCardSummary: A robotics and meta-learning pioneer who taught models how to learn, then sent them into a room with a robot arm to check whether they had learned anything useful.
    biography: >-
      Chelsea Finn is a Stanford computer-science and electrical-engineering professor whose IRIS lab
      studies intelligence through robotic interaction at scale. After an MIT bachelor's and
      Berkeley PhD, she worked with Google Brain and Google DeepMind before co-founding Physical
      Intelligence. Her research connects visual perception, manipulation, reinforcement learning
      and meta-learning: methods that help an agent acquire a new task from little data rather than
      begin again from scratch. She co-created model-agnostic meta-learning, or MAML, which
      optimises a model so a small number of gradient steps can adapt it to a new task. The same
      ambition runs through her work on self-supervising robots, policies that transfer between
      machines, and large shared robot datasets. Every elegant learning-to-learn claim eventually
      receives the same practical exam: a robot arm, an unfamiliar object and no conveniently
      pre-labelled demonstration. The benchmark now has fingerprints.
    availability:
      wave: frontier
      earliestYear: 2018
      unlockAny: [{ facilityOwned: facility.robotics-lab-1 }, { domainUnlocked: domain.robotics-embodiment }, { yearAtLeast: 2017 }]
      poolWeight: 0.85
    contract: { band: major, baseSalaryPerCycle: 0.73, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 4, reinforcementAgency: 5, multimodality: 3, reasoningTools: 1, roboticsEmbodiment: 5, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 0, securityContainment: 0, training: 4, product: 3, management: 4, politics: 1 }
    traits: [trait.meta-learning, trait.physical-grounding]
    signature:
      id: ability.learn-how-to-learn
      label: Learn How to Learn
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.robotics-embodiment] }
      rampWeeks: 4
      effects:
        - { target: domain.robotics-embodiment.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.fast-adaptation
      label: Fast Adaptation
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    compact:
      id: compact.reality-privileges
      label: Reality Privileges
      cadence: one-time
      requirement: Complete Robotics Lab I within 26 weeks of hiring her.
      check: { type: facility-owned-within, facility: facility.robotics-lab-1, weeks: 26 }
      breachEvent: people.compact.reality-privileges
    paperHooks:
      ids: [paper.model-agnostic-meta-learning]
    eventReactions:
      - { triggerTag: wrong-drawer, line: "Good. The policy adapted. Unfortunately it adapted to the evaluator standing beside the correct drawer." }
      - { triggerTag: sim-to-real-gap, line: "The simulator taught the prior. Reality is now providing the update and several new safety rails." }
      - { triggerTag: repeated-robotics-project, line: "Transfer is only interesting when the next task is genuinely different. Change the object, room and success criterion." }
    feedLines:
      - Kelsey taught the robot how to learn; the robot has requested a less repetitive onboarding task.
      - The next robotics project adapted faster because the previous one left reusable experience rather than only debris.
      - A physical trial discovered that simulated gravity had been unusually supportive.
      - Robotics output rose and the correct drawer remains a probabilistic concept.
      - The prototype uses the same compute budget and considerably more safety tape.
      - Kelsey changed the task, the room and the object. The policy adapted before the committee did.
    portrait:
      assetId: portrait.researcher.kelsey-finn
      brief: Bright 8-bit editorial portrait; white woman with long brown hair beside a small robot arm adapting between three coloured objects, with a looping meta-learning arrow; energetic and rigorous, not photoreal.
      altText: Pixel-art portrait of Kelsey Finn beside a robot arm adapting between three objects under a looping learning arrow.
    sources:
      - https://profiles.stanford.edu/chelsea-finn
      - https://robotics.stanford.edu/~cbfinn/
      - https://arxiv.org/abs/1703.03400
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }
