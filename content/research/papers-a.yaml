  - id: paper.denoising-diffusion-probabilistic-models
    version: 1
    historicity: real
    gameOrder: 29
    title: Denoising Diffusion Probabilistic Models
    authors: [Jonathan Ho, Ajay Jain, Pieter Abbeel]
    publicationYear: 2020
    venue: Advances in Neural Information Processing Systems 33
    primarySourceUrl: https://arxiv.org/abs/2006.11239
    arxiv: "2006.11239"
    historicalNote: >-
      Posted and presented in 2020, this paper trained high-quality image generators by learning
      to reverse a gradual, fixed noising process.
    education:
      playerSummary: >-
        Diffusion models generate data by learning to reverse a simple, fixed process that
        gradually adds noise to an image until nothing recognisable remains. A trained network
        predicts, one small step at a time, how to remove a little of that noise, and repeating
        the process from pure noise produces a new sample. This paper's results were competitive
        with strong generative-adversarial baselines and set up the diffusion approach that later
        image generators built upon.
      archiveExplanation: >-
        Generative adversarial networks could produce striking samples but were often unstable
        to train, while earlier likelihood-based generative models sometimes produced blurrier
        results. Ho, Jain and Abbeel built on a diffusion probabilistic framework: define a fixed
        forward process that incrementally adds Gaussian noise to data over many steps, then
        train a neural network to reverse that process one small step at a time.

        Because each reverse step only has to remove a small amount of noise, the prediction
        target is comparatively easy to learn, and the authors showed a particular
        simplified training objective—closely related to denoising score matching—produced
        high-quality samples competitive with strong GAN baselines on image benchmarks of the
        time, without adversarial training's characteristic instability.

        The approach required many sequential steps to generate one sample, making it slower at
        inference than a single GAN forward pass; later work addressed that cost with faster
        samplers and latent-space variants. Diffusion's core idea—learn to reverse a simple,
        well-understood corruption process—proved remarkably general and became the foundation
        for a wave of high-fidelity image, audio and video generators. In Neolab.ai this paper
        unlocks a robust, stable generative research branch and meaningfully improves synthetic-
        media product quality, feeding directly into the higher-resolution generative work that
        follows it.
      insideBaseball: The model has been trained to remove noise. Someone in Legal has asked whether this technique also applies to the comments section.
