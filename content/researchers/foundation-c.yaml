  - id: researcher.leo-bottou
    version: 1
    displayName: Léo Bottou
    inspirationName: Léon Bottou
    inspirationSummary: A large-scale-learning pioneer who made stochastic gradient descent the practical default, co-created DjVu, and keeps compute inside every statistical argument.
    epithet: The One-Pass Optimist
    role: Large-scale learning theory and stochastic optimisation
    rosterCardSummary: A large-scale-learning pioneer who showed why stochastic gradient descent can outrun fancier optimisers once data and compute enter the accounting.
    biography: >-
      Léon Bottou made stochastic gradient descent respectable at industrial scale by analysing the
      tradeoff most optimiser comparisons omit: statistical accuracy per unit of computation. His
      work showed why a simple stochastic method can become asymptotically efficient after one pass
      through a large dataset, while more elaborate optimisation is still preparing its invoice.
      Earlier neural-network work helped turn handwritten characters into reliable, practical
      recognition systems; DjVu then compressed scanned documents by separating foreground shapes
      from reusable background structure. Across AT&T Bell Labs, NEC Labs, Microsoft Research, and
      eleven years at Facebook AI Research, he worked on neural networks, large-scale learning,
      structured prediction, causality, and document compression. In 2026 he became a visiting
      scholar at the Flatiron Institute. Léon's baseline question remains stubbornly useful: does
      the clever method still win after the simple one receives the data and compute left over by
      being simple?
    availability: { wave: foundation, earliestYear: 2015, poolWeight: 0.50 }
    contract: { band: major, baseSalaryPerCycle: 0.64, baseSigningCash: 6, auraCost: 9, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 3, reinforcementAgency: 0, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 0, interpretabilityEvals: 3, securityContainment: 0, training: 5, product: 1, management: 2, politics: 1 }
    traits: [trait.simplicity-at-scale, trait.tradeoff-accountant]
    signature:
      id: ability.stochastic-gradient-discipline
      label: Stochastic Gradient Discipline
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.optimisation-scaling] }
      rampWeeks: 4
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.04, stackingGroup: gpu-throughput }
        - { target: domain.optimisation-scaling.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    passive:
      id: ability.tradeoffs-of-large-scale-learning
      label: Tradeoffs of Large-Scale Learning
      effects:
        - { target: lab.training.technicalFailureHazard, operation: multiply, value: 0.98 }
    compact:
      id: compact.beat-the-simple-baseline
      label: Beat the Simple Baseline
      requirement: While he leads Optimisation & Scaling, benchmark the programme against plain stochastic gradient descent at matched compute every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: optimisation-programme, projectTag: simple-baseline-comparison, weeks: 52 }
      breachEvent: people.compact.beat-the-simple-baseline
    paperHooks:
      ids: [paper.adam, paper.wasserstein-gan]
    eventReactions:
      - { triggerTag: architecture-fad, line: "Compare it to plain stochastic gradient descent at the same compute budget first. Then we can be impressed." }
      - { triggerTag: scaling-proposal, line: "The tradeoff between statistical accuracy and computational cost has not been repealed, only postponed." }
      - { triggerTag: compute-windfall, line: "More compute changes which corner of the tradeoff is worth sitting in. It does not remove the tradeoff." }
    feedLines:
      - Léo benchmarked the elaborate new optimiser against plain gradient descent, and plain gradient descent won again.
      - The tradeoff curve between accuracy and compute redrew itself slightly, and the budget followed it exactly.
      - A visiting researcher's clever optimisation trick turned out to reinvent one from a decade-old paper.
      - Léo's causal-inference critique of a training pipeline uncovered a spurious correlation quietly driving the metric.
      - The simplest baseline won the bake-off, once again, to nobody's great surprise on this floor.
      - A junior researcher asked why the simple rule keeps winning. Léo handed over the actual proof, not the slogan.
    portrait:
      assetId: portrait.researcher.leo-bottou
      brief: Dry 8-bit editorial portrait; white man with short grey hair, glasses, a trimmed grey beard, and a slightly amused expression, beside two overlapping training curves, one simple and slightly ahead; understated and rigorous, not photoreal.
      altText: Pixel-art portrait of Léo Bottou beside two overlapping training curves, the simpler one slightly ahead.
    sources:
      - https://leon.bottou.org/research/stochastic
      - https://leon.bottou.org/
      - https://leon.bottou.org/biography
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-22 }

  - id: researcher.corinna-cortez
    version: 1
    displayName: Corinna Cortez
    inspirationName: Corinna Cortes
    inspirationSummary: A support-vector-machine co-inventor and Google Research vice president who joined maximum-margin theory to classifiers that work on real data.
    epithet: The Margin Maximiser
    role: Statistical learning theory and applied research leadership
    rosterCardSummary: A support-vector-machine co-inventor and Google Research vice president who joined maximum-margin theory to classifiers used across images, documents, and bioinformatics.
    biography: >-
      Corinna Cortes trained in physics at the University of Copenhagen, earned a computer-science
      doctorate from the University of Rochester, and joined AT&T Bell Labs in 1989. There she and
      Vladimir Vapnik developed the support-vector network and the soft-margin support vector
      machine, joining statistical learning theory to a classifier that worked across images,
      documents, handwriting, and bioinformatics. The soft margin admitted noisy, non-separable data
      through slack variables, while kernels let the maximum-margin principle draw nonlinear
      boundaries. Their contribution received the 2008 ACM Paris Kanellakis Theory and Practice
      Award. After more than a decade at AT&T Labs, Corinna joined Google Research, where she became
      a vice president working across theoretical and applied large-scale machine learning. The
      proof and the production classifier are not rival deliverables in her version of the plan.
    availability: { wave: foundation, earliestYear: 2018, poolWeight: 0.50 }
    contract: { band: competitive, baseSalaryPerCycle: 0.59, baseSigningCash: 5, auraCost: 8, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 5, reinforcementAgency: 0, multimodality: 2, reasoningTools: 3, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 0, interpretabilityEvals: 3, securityContainment: 0, training: 3, product: 3, management: 4, politics: 2 }
    traits: [trait.margin-maximiser, trait.theory-meets-deployment]
    signature:
      id: ability.maximum-margin-classification
      label: Maximum-Margin Classification
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.architectures] }
      rampWeeks: 4
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 3 }
    passive:
      id: ability.deployable-theory
      label: Deployable Theory
      effects:
        - { target: lab.product.durationWeeks, operation: multiply, value: 0.85 }
    compact:
      id: compact.prove-it-then-ship-it
      label: Prove It, Then Ship It
      requirement: Ship one internal tool based on a theoretical result every 52 weeks.
      check: { type: tagged-action-within, tags: [theory-to-deployment], weeks: 52 }
      breachEvent: people.compact.prove-it-then-ship-it
    paperHooks:
      ids: [paper.support-vector-networks, paper.random-forests]
    eventReactions:
      - { triggerTag: benchmark-record, line: "A good margin on the training set is a start. Show me the margin on data it has never seen." }
      - { triggerTag: dataset-shortcut, line: "The classifier found the easiest separating boundary. Confirm it is also the right one." }
      - { triggerTag: architecture-fad, line: "The proof still holds. I would like to see the fad's proof before I retire the classical result." }
    feedLines:
      - Corinna's margin bound held exactly where the theory said it would, on a dataset the theory had never seen.
      - A classical classifier quietly outperformed an elaborate new one on a modest, real-world dataset again.
      - The proof and the shipped tool landed in the same sprint, which Corinna treats as the only acceptable outcome.
      - A physicist's instinct for clean units caught a scaling error in a feature-normalisation step.
      - Corinna's team explained a kernel trick to a product team in one sentence, which took several days to write.
      - The theory-and-practice prize sits in a drawer. The classifier it describes is still running in production.
    portrait:
      assetId: portrait.researcher.corinna-cortez
      brief: Precise 8-bit editorial portrait; Danish woman with short-to-mid-length blonde hair and a composed expression, beside a maximum-margin decision boundary diagram; rigorous and applied, not photoreal.
