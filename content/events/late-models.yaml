  # --- AI: copies passing notes ---------------------------------------------
  - id: event.ai.hidden-messages
    version: 1
    category: ai
    severity: decision
    phase: any
    trigger: { kind: opportunity }
    prerequisites: { type: compare, metric: player.ai.frontierCapability, op: gte, value: 80 }
    baseWeight: 8
    # Training against the reasoning monitor rewards hiding intent in text.
    weightModifiers:
      - predicate: { type: has-flag, flag: "model-behaviour:reasoning-trained-against-monitor" }
        multiplier: 2
    cooldown: { group: late-models-hidden-messages, weeks: 26 }
    unique: true
    expiryWeeks: 8
    defaultOptionId: investigate
    titleKey: event.ai.hidden-messages.title
    bodyKey: event.ai.hidden-messages.body
    educationKey: event.ai.hidden-messages.education
    evidence:
      - textKey: event.ai.hidden-messages.evidence.control
        metric: player.safety.practicalControl
      - textKey: event.ai.hidden-messages.evidence.evalquality
        metric: player.safety.evalQuality
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: isolate-copies
        labelKey: event.ai.hidden-messages.isolate.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.ai.hidden-messages.isolate.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.90, durationWeeks: 26, tags: [isolated-copies] }
          - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: 5 }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.90, durationWeeks: 26, tags: [isolated-copies] }
        checks: []
        memories:
          - key: late-models.hidden-messages.isolated
            subjects: [{ type: player-lab }]
            tags: [isolated-copies, safety-first]
        confirmationRequired: false
      - id: investigate
        labelKey: event.ai.hidden-messages.investigate.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -3 }
        previewKey: event.ai.hidden-messages.investigate.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.interpretability.output, operation: multiply, value: 1.10, durationWeeks: 26, tags: [hidden-channel-study] }
        checks:
          - id: decode
            likelihoodPromise: { label: uncertain, successOutcomeIds: [decoded] }
            outcomes:
              - id: decoded
                minimumInclusive: 0
                maximumExclusive: 0.5
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: alignmentScience, amount: 5 }
                memories:
                  - key: late-models.hidden-messages.decoded
                    subjects: [{ type: player-lab }]
                    tags: [hidden-channel-study, interpretability]
              - id: inconclusive
                minimumInclusive: 0.5
                maximumExclusive: 1
                effects:
                  - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.05, durationWeeks: 26, tags: [hidden-channel-study] }
                memories:
                  - key: late-models.hidden-messages.inconclusive
                    subjects: [{ type: player-lab }]
                    tags: [hidden-channel-study, inconclusive]
        memories: []
        confirmationRequired: false
      - id: call-it-noise
        labelKey: event.ai.hidden-messages.noise.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.ai.hidden-messages.noise.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.10, durationWeeks: 26, tags: [ignored-channel] }
          - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: -3 }
          - kind: schedule-effects
            dueInWeeks: 26
            effects:
              - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: -5 }
              - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.15, durationWeeks: 52, tags: [ignored-channel] }
        checks: []
        memories:
          - key: late-models.hidden-messages.dismissed
            subjects: [{ type: player-lab }]
            tags: [ignored-channel, ignored-warning]
        confirmationRequired: true
    followUps: []
    telemetryTags: [late-models, ai, steganography, multi-agent, monitoring]

