  - id: researcher.alyosha-efrossi
    version: 1
    displayName: Alyosha Efrossi
    inspirationName: Alexei Efros
    inspirationSummary: ACM Prize recipient and Berkeley professor whose data-driven vision research includes texture synthesis, visual matching, and CycleGAN.
    epithet: The Data-Driven Image Alchemist
    role: Data-driven computer vision and unpaired image-to-image translation
    rosterCardSummary: An ACM Prize recipient whose data-driven vision work turns large image collections and unpaired examples into research instruments.
    biography: >-
      Alexei Efros treats a large image collection as an instrument rather than a storage problem.
      Alexei Efros earned his doctorate at UC Berkeley and returned there as a faculty
      member after appointments at Carnegie Mellon University and École Normale Supérieure. His
      Berkeley biography describes research in data-driven computer vision, graphics, and machine
      learning, including texture synthesis, visual matching, and using large collections of
      unlabelled images to recover structure. He co-authored CycleGAN, which learns mappings
      between visual domains without paired examples by imposing cycle consistency—the source of
      the field's unusually durable horse-and-zebra demonstration. The ACM Prize in Computing
      recognised his work in image synthesis and analysis. Earlier texture-synthesis research
      generated new images by resampling local patches from one example rather than fitting a
      parametric model. Across that work, Efros keeps the data-first method: look for the answer in
      real visual variation before hand-designing it, then check that the learned mapping preserves
      more than its ability to produce an excellent zebra at the review meeting.
