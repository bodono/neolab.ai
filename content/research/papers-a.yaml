  - id: paper.alphazero
    version: 1
    historicity: real
    gameOrder: 20
    title: A general reinforcement learning algorithm that masters chess, shogi, and Go through self-play
    authors: [David Silver, Thomas Hubert, Julian Schrittwieser, Ioannis Antonoglou, Matthew Lai, Arthur Guez, Marc Lanctot, Laurent Sifre, Dharshan Kumaran, Thore Graepel, Timothy Lillicrap, Karen Simonyan, Demis Hassabis]
    publicationYear: 2018
    venue: Science
    primarySourceUrl: https://doi.org/10.1126/science.aar6404
    doi: 10.1126/science.aar6404
    historicalNote: >-
      The Science paper was published in 2018 and described AlphaZero, a single algorithm trained
      from the rules of chess, shogi or Go without human game data.
    education:
      playerSummary: >-
        AlphaZero generalised the self-play and search recipe across chess, shogi and Go. Starting
        with only each game's rules, it trained a neural network to guide Monte Carlo tree search
        and improved from games against itself. The result removed AlphaGo's dependence on human
        examples and showed that one learning algorithm could reach superhuman play in several
        complex but precisely specified worlds.
      archiveExplanation: >-
        AlphaGo combined human game records, separate policy and value components, self-play and
        tree search. AlphaGo Zero later showed that Go could be mastered without human examples.
        AlphaZero simplified and generalised that approach across three games with different
        boards, rules and strategic traditions: chess, shogi and Go.

        For each game, a neural network predicts both promising moves and the likely winner from
        a position. Monte Carlo tree search uses those predictions to focus exploration. Completed
        self-play games then train the network, producing a cycle in which a stronger model
        generates stronger experience. The algorithm began with the rules rather than recorded
        expert moves and achieved superhuman performance against leading specialised programmes.

        The word “general” in the title refers to one algorithm working across this family of
        games. The environments still have exact rules, clear outcomes, cheap simulation and no
        hidden human stakeholders. Real institutions rarely offer that luxury. This boundary is
        essential to the paper's lesson, not a reason to diminish the achievement. In Neolab.ai,
        AlphaZero unlocks a potent general self-play recipe and raises reasoning potential, while
        any attempt to apply it to open-ended social or scientific objectives must pass separate
        evaluation, alignment and consequence checks. Winning three games is evidence of a
        general method; it is not a certificate of general benevolence.
      insideBaseball: Human openings are no longer required. Human press interviews remain on the critical path.
