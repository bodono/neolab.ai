  - id: paper.imagenet-database
    version: 1
    historicity: real
    gameOrder: 5
    title: "ImageNet: A Large-Scale Hierarchical Image Database"
    authors: [Jia Deng, Wei Dong, Richard Socher, Li-Jia Li, Kai Li, Li Fei-Fei]
    publicationYear: 2009
    venue: IEEE Conference on Computer Vision and Pattern Recognition
    primarySourceUrl: https://www.image-net.org/static_files/papers/imagenet_cvpr09.pdf
    historicalNote: >-
      ImageNet was introduced at CVPR in 2009. Its scale, hierarchy and later challenge became
      essential infrastructure for measuring progress in computer vision.
    education:
      playerSummary: >-
        ImageNet treated a dataset as a major scientific instrument. It organised millions of
        labelled images into a large hierarchy of object categories, making it possible to
        train and compare vision systems at unprecedented scale. The later ImageNet challenge
        supplied a shared scoreboard on which deep convolutional networks could demonstrate a
        decisive advantage over hand-engineered vision pipelines.
      archiveExplanation: >-
        Machine-learning systems can only reveal advantages that a dataset and evaluation can
        measure. Before ImageNet, many object-recognition benchmarks were too small or narrow
        to support and discriminate between very high-capacity visual models. Fei-Fei Li and
        collaborators pursued a different scale: a database organised around the WordNet
        hierarchy, with hundreds or thousands of real-world images for a vast number of visual
        concepts.

        The 2009 paper described a dataset already containing more than three million cleanly
        labelled images across more than five thousand categories, built with substantial human
        annotation. ImageNet continued to grow, and the ImageNet Large Scale Visual Recognition
        Challenge converted part of that resource into an influential annual competition. The
        dataset was not an algorithm, yet it changed which algorithms were possible to train
        and which improvements the community could see.

        ImageNet also illustrates that datasets are institutions, not neutral piles of pixels.
        Category choices, collection methods, labels and human labour all shape the resulting
        systems, and later scrutiny identified serious limitations and harmful categories in
        parts of the full hierarchy. The educational lesson is therefore double-sided: scale
        and shared measurement can unlock a field, while documentation and stewardship matter.
        In the game, ImageNet enables large visual training and better evaluation, but the data
        charter attached to the project affects trust, cost and later events.
      insideBaseball: The dataset is now too large to inspect manually, which has been entered in the risk register as “success.”
    domainWeights:
