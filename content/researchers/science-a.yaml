      - Katie's sparse-data reconstruction algorithm turned noisy, incomplete sensor readings into a genuinely coherent image.
      - A viral moment threatened to credit one person for a result the full team actually produced, and Katie redirected it immediately.
      - The algorithm-sensor co-design compact caught a project treating the sensor as fixed when redesigning it would have helped more.
      - Katie's imaging system observed a phenomenon nobody's existing telescope had been specifically built to capture.
      - A journalist asked, again, about the black hole image. Katie's answer, again, named the whole collaboration first.
      - The world-first announcement this quarter listed every contributing team member by name, exactly as the compact requires.
