    education:
      playerSummary: >-
        Wei and colleagues showed that providing a large language model with a handful of example
        problems solved via explicit step-by-step reasoning, rather than only the final answer,
        substantially improved its accuracy on arithmetic, commonsense, and symbolic reasoning
        tasks. Notably, this "chain of thought" benefit appeared reliably only once the underlying
        model was large enough.
      archiveExplanation: >-
        Language models had generally struggled with multi-step reasoning problems when prompted
        only with question-and-final-answer examples. Wei and colleagues instead included a few
        worked examples in the prompt showing an explicit chain of intermediate reasoning steps
        leading to the answer, an approach requiring no additional training, only a different
        choice of prompt.

