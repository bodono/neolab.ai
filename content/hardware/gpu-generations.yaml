schemaVersion: 1
contentType: gpu-generations
status: draft

designContract:
  playerFacingResource: physical GPUs
  allocationUnit: GPUs/week
  purchaseUnit: physical GPUs
  rule: >-
    Every number presented as GPUs is a count of physical accelerators. The
    simulation may derive workload throughput from generation-specific factors,
    but it must never rename that derived value CU or present it as owned hardware.
  throughputFormula: >-
    workloadThroughput = sum(allocatedGpuCountByGeneration * workloadFactor) *
    availability * powerMultiplier * interconnectMultiplier
  displayRule: >-
    Show percentage and physical GPUs/week on every allocation control. Show the
    generation mix nearby. Put estimated relative throughput only in an expanded
    comparison tooltip or procurement dossier.
  balanceDisclaimer: >-
    Training and serving factors are fictional gameplay coefficients, not FLOPS,
    benchmark results, product claims, or predictions. They are versioned balance
    data and use Kepler = 1.0 solely to preserve useful ratios inside the game.
  futureHardwareRule: >-
    Hardware after Rubin uses fictional manufacturers and names and is labelled
    FICTIONAL HARDWARE everywhere it appears.

generations:
  - id: gpu.kepler
    displayName: Kepler
    manufacturer: Viridian
    historicity: real
    nominalYear: 2012
    unlockAtWorldFrontierCapability: 0
    trainingFactor: 1.0
    servingFactor: 1.0
    powerPerThousand: 1.00
    interconnectTier: 1
    reliability: 62
    gameCostMillionsPerThousand: 0.9
    gameOperatingCostMillionsPerThousandPerCycle: 0.06
    deliveryWeeks: 5
    summary: "The opening-era workhorse: cheap, familiar, power-hungry and quickly outclassed for frontier training."
    education: "The real Kepler-class Tesla K40 (2013) packed 7.1 billion transistors and 2,880 CUDA cores on a 28nm die for about 4.3 teraFLOP/s of FP32 compute, with 12 GB of GDDR5 at 288 GB/s. Deep learning's first wave — including the era's landmark vision models — was trained on hardware like this, built for graphics and repurposed for matrix multiplication."
    announcement: "Ladies and gentlemen — the K40. Twelve gigabytes of memory, 2,880 cores, and a secret: the researchers buying our gaming chips are not playing games. We made it for graphics. They made it for the future. I wore this jacket specially."
    source: https://www.nvidia.com/en-gb/technologies/

  - id: gpu.maxwell
    displayName: Maxwell
    manufacturer: Viridian
    historicity: real
    nominalYear: 2014
    unlockAtWorldFrontierCapability: 8
    trainingFactor: 1.5
    servingFactor: 1.8
    powerPerThousand: 0.82
    interconnectTier: 1
    reliability: 67
    gameCostMillionsPerThousand: 1.3
    gameOperatingCostMillionsPerThousandPerCycle: 0.09
    deliveryWeeks: 6
    summary: An efficiency-led refresh that makes a convincing serving fleet but only a modest frontier-training step.
    education: "The real Maxwell generation (Tesla M40, 3,072 CUDA cores) was an efficiency play: far more work per watt than Kepler, but almost no double-precision hardware — a bet that neural networks would not miss it. They did not. The industry learned that AI cares about throughput and memory, not scientific-computing tradition."
    announcement: "People ask me, Jensen, why is Maxwell so efficient? Because performance per watt IS performance. We deleted the double-precision units and nobody training a neural network noticed. That silence? That silence is the sound of a market being born."
    source: https://www.nvidia.com/en-gb/technologies/

  - id: gpu.pascal
    displayName: Pascal
    manufacturer: Viridian
    historicity: real
    nominalYear: 2016
    unlockAtWorldFrontierCapability: 18
    trainingFactor: 3.0
    servingFactor: 4.0
    powerPerThousand: 0.90
    interconnectTier: 2
    reliability: 72
    gameCostMillionsPerThousand: 2.3
    gameOperatingCostMillionsPerThousandPerCycle: 0.17
    deliveryWeeks: 7
    summary: The first large jump of the campaign, rewarding labs that have already invested in power, networking and procurement.
    education: "The real Pascal P100 (2016) was the first chip in this lineage designed with deep learning squarely in mind: 9.3 teraFLOP/s FP32, 18.7 at half precision, and the debut of HBM2 stacked memory — 16 GB at 720 GB/s, triple Maxwell's bandwidth — plus NVLink so GPUs could finally gossip at speed. Half precision entering the datasheet headline was the tell: training, not graphics, now drove the roadmap."
    announcement: "For years you duct-taped gaming cards together and called it science. No more. Pascal is the first GPU we built FOR you — stacked HBM2 memory, NVLink so your GPUs can talk without asking the CPU for permission. Now buy enough of them to make the accountants nervous."
    source: https://www.nvidia.com/en-gb/technologies/

  - id: gpu.volta
    displayName: Volta
    manufacturer: Viridian
    historicity: real
    nominalYear: 2017
    unlockAtWorldFrontierCapability: 28
    trainingFactor: 7.0
    servingFactor: 7.0
    powerPerThousand: 1.05
    interconnectTier: 3
    reliability: 77
    gameCostMillionsPerThousand: 4.7
    gameOperatingCostMillionsPerThousandPerCycle: 0.36
    deliveryWeeks: 8
    summary: Purpose-built AI acceleration turns cluster access into a strategic advantage and makes power planning a board-level issue.
    education: "The real Volta V100 (2017) introduced the Tensor Core — dedicated matrix-multiply hardware — and with it 125 teraFLOP/s for deep learning, an order of magnitude over anything before. This is the moment 'AI accelerator' became a category. Nearly every landmark model of the late 2010s was trained on racks of these."
    announcement: "This is not a GPU. I want to be very clear about this. This is 125 trillion operations per second of dedicated AI machinery with some graphics attached out of respect for our heritage. We call them Tensor Cores. You will call them mandatory."
    source: https://www.nvidia.com/en-gb/technologies/

  - id: gpu.turing
    displayName: Turing
    manufacturer: Viridian
    historicity: real
    nominalYear: 2018
    unlockAtWorldFrontierCapability: 38
    trainingFactor: 8.0
    servingFactor: 11.0
    powerPerThousand: 0.94
    interconnectTier: 3
    reliability: 79
    gameCostMillionsPerThousand: 5.3
    gameOperatingCostMillionsPerThousandPerCycle: 0.42
    deliveryWeeks: 7
    summary: A serving-friendly generation whose practical economics may beat its more glamorous training reputation.
    education: "The real Turing generation (2018) pushed tensor cores down into inference cards like the T4: modest power, excellent serving economics. Its lesson was commercial rather than scientific — the money in AI hardware is not only in training giant models but in cheaply answering billions of queries afterwards."
    announcement: "Everyone wants to talk about training. Nobody wants to talk about the electricity bill for answering four billion questions a day. Turing talks about the electricity bill. Inference is where the money lives, and I have never been embarrassed to know where the money lives."
    source: https://www.nvidia.com/en-gb/technologies/

  - id: gpu.ampere
    displayName: Ampere
    manufacturer: Viridian
    historicity: real
    nominalYear: 2020
    unlockAtWorldFrontierCapability: 48
    trainingFactor: 20.0
    servingFactor: 27.0
    powerPerThousand: 1.18
    interconnectTier: 4
    reliability: 84
    gameCostMillionsPerThousand: 11.5
    gameOperatingCostMillionsPerThousandPerCycle: 1.0
    deliveryWeeks: 10
    summary: "Scaling becomes industrial: expensive accelerators only pay off when the lab can feed, cool and coordinate them."
    education: "The real Ampere A100 (2020) carried 54.2 billion transistors, 312 teraFLOP/s at FP16, and up to 80 GB of HBM2e at 2 TB/s — and could partition itself into seven isolated GPUs for sharing. GPT-3-era models made clusters of thousands of A100s the standard unit of frontier ambition, and 'how many A100s?' became a serious interview question."
    announcement: "Fifty-four billion transistors. You can slice one A100 into seven little GPUs, like a very expensive cake, or gang thousands together into one enormous computer. Either way — and I have run the numbers personally — the more you buy, the more you save."
    source: https://www.nvidia.com/en-gb/technologies/

  - id: gpu.hopper
    displayName: Hopper
    manufacturer: Viridian
    historicity: real
    nominalYear: 2022
    unlockAtWorldFrontierCapability: 58
    trainingFactor: 50.0
    servingFactor: 68.0
    powerPerThousand: 1.34
    interconnectTier: 5
    reliability: 88
    gameCostMillionsPerThousand: 25
    gameOperatingCostMillionsPerThousandPerCycle: 2.4
    deliveryWeeks: 12
    summary: Frontier-scale clusters become both scientific instruments and geopolitical objects with very demanding supporting infrastructure.
    education: "The real Hopper H100 (2022) put 80 billion transistors on TSMC's 4nm process, added FP8 tensor cores, and fed them with HBM3 at over 3 TB/s. It is the chip the modern LLM boom actually ran on: export-controlled, allocated like a strategic commodity, and briefly more discussed than most heads of state."
    announcement: "Named for Grace Hopper, who found the first computer bug and invented the compiler. The H100 is now discussed by defence ministries, which I am told is a normal thing to happen to a chip. Eighty billion transistors. Allocation is by lottery. The lottery is not random."
    source: https://www.nvidia.com/en-gb/technologies/

  - id: gpu.blackwell
    displayName: Blackwell
    manufacturer: Viridian
    historicity: real
    nominalYear: 2024
    unlockAtWorldFrontierCapability: 68
    trainingFactor: 110.0
    servingFactor: 175.0
    powerPerThousand: 1.52
    interconnectTier: 6
    reliability: 90
    gameCostMillionsPerThousand: 50
    gameOperatingCostMillionsPerThousandPerCycle: 5.5
    deliveryWeeks: 15
    summary: A giant-system era in which networking, cooling and allocation politics matter almost as much as accelerator count.
    education: "The real Blackwell B200 (2024) fused two dies of 104 billion transistors each across a 10 TB/s bridge so they behave as one 208-billion-transistor GPU, with 192 GB of HBM3e at 8 TB/s. At this scale the chip is the easy part — the product is really the rack, the network, and the gigawatt of power behind it."
    announcement: "We wanted a bigger chip. Physics said no. So we made two chips, connected them with ten terabytes a second, and informed them they were one chip. They believed us. 208 billion transistors believe us. Named for David Blackwell, a giant of probability — appropriate, given our supply chain."
    source: https://www.nvidia.com/en-gb/technologies/

  - id: gpu.rubin
    displayName: Rubin
    manufacturer: Viridian
    historicity: real
    nominalYear: 2026
    unlockAtWorldFrontierCapability: 78
    trainingFactor: 220.0
    servingFactor: 390.0
    powerPerThousand: 1.68
    interconnectTier: 7
    reliability: 92
    gameCostMillionsPerThousand: 90
    gameOperatingCostMillionsPerThousandPerCycle: 10.5
    deliveryWeeks: 18
    summary: The last real generation in the launch campaign; vertically integrated rack-scale systems reward long-range infrastructure bets.
    education: "The real Rubin generation (2026) reached full production with 336 billion transistors on 3nm, 288 GB of HBM4 at 22 TB/s, and rack-scale NVLink at 3.6 TB/s — sold less as chips than as complete AI factories. Beyond this point, this timeline's hardware diverges from ours."
    announcement: "Vera Rubin proved most of the universe is invisible. Fitting — because you will never see this GPU. It ships inside a rack, inside a pod, inside an AI factory, inside a power-purchase agreement. You are not buying a chip anymore. You are buying infrastructure with an opinion."
    source: https://nvidianews.nvidia.com/news/nvidia-vera-rubin-platform

  # Internal IDs retain their original names so existing saves continue to load.
  - id: gpu.markov
    displayName: Markov
    manufacturer: Viridian
    historicity: fictional
    label: FICTIONAL HARDWARE
    nominalYear: 2028
    unlockAtWorldFrontierCapability: 86
    trainingFactor: 600.0
    servingFactor: 1250.0
    powerPerThousand: 1.82
    interconnectTier: 9
    reliability: 92
    gameCostMillionsPerThousand: 210
    gameOperatingCostMillionsPerThousandPerCycle: 27
    deliveryWeeks: 24
    summary: A fictional post-Rubin design whose predictive fabric moves workloads, power and cooling before the next state arrives.
    education: "FICTIONAL. Named for Andrey Markov, whose chains model systems in which the next state depends on the current one. A plausible post-Rubin design: a chiplet mesh forecasts short-horizon workload transitions, reroutes data before congestion forms, and shifts cooling before the heat arrives. At this scale the accelerator is no longer a component inside the data centre; the entire data centre is part of its scheduler."
    announcement: "Andrey Markov taught us that the next state depends only on the current state. The current state is that you need more GPUs. Markov predicts the workload, reroutes the fabric, and moves the cooling before the heat arrives. The more you buy, the more probable the saving."

  - id: gpu.kolmogorov
    displayName: Kolmogorov
    manufacturer: Viridian
    historicity: fictional
    label: FICTIONAL HARDWARE
    nominalYear: 2031
    unlockAtWorldFrontierCapability: 94
    trainingFactor: 1400.0
    servingFactor: 3100.0
    powerPerThousand: 1.95
    interconnectTier: 10
    reliability: 93
    gameCostMillionsPerThousand: 425
    gameOperatingCostMillionsPerThousandPerCycle: 60
    deliveryWeeks: 28
    summary: The fictional endgame generation, coordinating an entire sovereign compute complex as one machine.
    education: "FICTIONAL. Named for Andrey Kolmogorov, whose work connected probability to the complexity of the shortest program capable of describing an object. Here the object is a sovereign compute complex: optical fabric, memory, arithmetic, power and cooling compiled into one system. It is sold by treaty rather than purchase order, cooled by rivers, and audited by three governments at once. The datasheet is classified; the power bill is not."
    announcement: "Kolmogorov asked for the shortest complete description of an object. The shortest complete description of this machine is 'all of it.' The longer description is classified. The fabric is optical, the power contract is sovereign, and the cooling map has a coastline. You are buying the whole class."

