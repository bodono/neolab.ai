    epithet: The Motion Reader
    role: Computer vision, video understanding, action recognition, and robust descriptors
    rosterCardSummary: A vision pioneer who taught machines to recognise what is happening across frames, then kept changing the camera until the answer deserved confidence.
    biography: >-
      Cordelia Schmid is an Inria Research Director and a leading figure in computer vision. Her
      foundational work on robust local image descriptors helped make visual matching reliable
      across changes in scale, viewpoint, and illumination. She went on to shape object
      recognition, image retrieval, action recognition, and video understanding, building methods
      that connect local visual evidence to the structure of an unfolding scene. At Inria she is a
      member of the WILLOW team, and since 2018 she has also held a joint appointment with Google
      Research. Her honours include major European research prizes, the Longuet-Higgins Prize, and
      the 2025 ACM Athena Lecturer Award for foundational contributions to computer vision. Cordelia
      has also trained and collaborated with an unusually broad generation of vision researchers,
      helping turn robust recognition from an isolated technique into a durable research community.
      She will happily accept that the model recognised a person; she will then ask what the person is
      doing, why the model believes it, and whether the answer survives the next camera angle.
