  - id: researcher.mike-lewiston
    version: 1
    displayName: Mike Lewiston
    inspirationName: Mike Lewis
    inspirationSummary: Meta AI natural-language researcher who led BART's denoising pretraining work and helped combine strategic planning with dialogue in CICERO.
    epithet: The Denoising Pretrainer
    role: Sequence-to-sequence pretraining and strategic-language-model research
    rosterCardSummary: The BART lead who made a pretraining objective out of messing up text, then helped an AI negotiate at the Diplomacy table.
    biography: >-
      Mike Lewis found productive use for making a mess of a sentence. At Meta AI, he led BART, a
      denoising sequence-to-sequence model trained by corrupting text and reconstructing the
      original. Its transformer encoder-decoder combines the bidirectional context
      associated with BERT and the left-to-right generation associated with GPT, then transfers
      across summarisation, translation, question answering, and comprehension. Lewis came to Meta
      after a University of Washington postdoc with Luke Zettlemoyer and an Edinburgh doctorate
      with Mark Steedman that joined distributional and logical approaches to semantics. He
      helped build CICERO, pairing strategic planning with controllable dialogue so an AI could
      cooperate and negotiate with human Diplomacy players. The through-line is flexibility without
      hand-waving: one objective should survive several task families, and fluent persuasion should
      agree with the plan. Mike's models may scramble the sentence first, but they are
      expected to clean up after themselves.
    availability: { wave: scaling, earliestYear: 2019, poolWeight: 0.55 }
    contract: { band: major, baseSalaryPerCycle: 0.64, baseSigningCash: 6, auraCost: 9, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 3, reinforcementAgency: 1, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 3, securityContainment: 0, training: 4, product: 2, management: 3, politics: 1 }
    traits: [trait.unify-bidirectional-and-autoregressive, trait.strategic-language-agent-builder]
    signature:
      id: ability.denoising-sequence-pretraining
      label: Denoising Sequence Pretraining
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.architectures, domain.optimisation-scaling] }
      rampWeeks: 4
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.strategic-negotiation-agent
      label: Strategic Negotiation Agent
      effects:
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    compact:
      id: compact.one-flexible-objective-not-many-narrow-ones
      label: One Flexible Objective, Not Many Narrow Ones
      requirement: While he leads Architectures, validate one pretraining objective on two different downstream task families every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: architecture-programme, projectTag: cross-task-objective-validation, weeks: 52 }
      breachEvent: people.compact.one-flexible-objective-not-many-narrow-ones
    paperHooks:
      ids: [paper.bert, paper.text-to-text-transfer-transformer]
    eventReactions:
      - { triggerTag: architecture-fad, line: "A single flexible pretraining objective that transfers everywhere beats three narrow ones tuned separately." }
      - { triggerTag: benchmark-record, line: "Check whether the pretraining objective transfers to a genuinely different downstream task before celebrating the score." }
      - { triggerTag: strategic-game-negotiation, line: "A convincing negotiation requires both the language and the strategy to be honest about the same plan." }
    feedLines:
      - Mike's denoising objective transferred cleanly from summarisation to a translation task nobody had tuned it for.
      - The strategic language agent proposed a negotiation a human player found, to their own surprise, genuinely persuasive.
      - A narrow, task-specific pretraining objective lost, again, to Mike's single flexible one at matched compute.
      - Mike's pretraining lead role on the open-weight model family produced a checkpoint the open-source community adopted immediately.
      - The noising function got one more corruption type added, and the reconstruction task got, predictably, more useful.
      - A negotiation-game agent built on Mike's architecture kept its stated strategic plan honest under real human pressure.
    portrait:
      assetId: portrait.researcher.mike-lewiston
      brief: Focused 8-bit editorial portrait; white man with short dark-brown hair and a calm, methodical expression, beside a corrupted sentence being reconstructed token by token; flexible and unifying, not photoreal.
      altText: Pixel-art portrait of Mike Lewiston beside a corrupted sentence being reconstructed token by token.
    sources:
      - https://ai.meta.com/people/209431298931133/mike-lewis/
      - https://ai.meta.com/research/publications/bart-denoising-sequence-to-sequence-pre-training-for-natural-language-generation-translation-and-comprehension/
      - https://ai.meta.com/research/cicero/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-22 }

  - id: researcher.tomas-brown
    version: 1
    displayName: Tomas Brown
    inspirationName: Tom Brown
    inspirationSummary: GPT-3 lead author and Anthropic co-founder and chief compute officer whose engineering work turns scaling claims into reproducible training runs.
    epithet: The Scale Engineer
    role: Large-scale language-model engineering and compute infrastructure leadership
    rosterCardSummary: GPT-3's lead author and Anthropic's chief compute officer, for whom a scaling law is only as persuasive as the training system underneath it.
    biography: >-
      Tom Brown helped turn language-model scaling from a suggestive curve into a consequential
      engineering result. At OpenAI he led the work behind GPT-3 and was lead author of "Language
      Models are Few-Shot Learners." The paper trained a 175-billion-parameter autoregressive model
      and showed that many tasks could be specified through text and demonstrations without
      gradient updates. Brown also co-authored OpenAI's neural scaling-laws work, which measured
      predictable relationships among loss, model size, data, and training compute. He later
      co-founded Anthropic, a public-benefit AI company, and became its chief compute officer,
      responsible for the infrastructure beneath its model programme. His contribution is not
      simply enthusiasm for bigger machines; it is the discipline required to make a run stable,
      measurable, and worth believing. Tom treats compute as apparatus rather
      than scenery. If a scaling claim arrives without instrumentation, reproducibility, and an
      honest account of the run, he is inclined to regard it as an extremely expensive anecdote.
    availability: { wave: scaling, earliestYear: 2020, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.45, baseSigningCash: 4, auraCost: 6, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 5, dataRepresentation: 2, reinforcementAgency: 1, multimodality: 1, reasoningTools: 3, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 2, interpretabilityEvals: 1, securityContainment: 1, training: 5, product: 2, management: 4, politics: 3 }
    traits: [trait.scale-engineer, trait.founding-conviction]
    signature:
      id: ability.frontier-training-infrastructure
      label: Frontier Training Infrastructure
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.optimisation-scaling] }
      rampWeeks: 5
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.06, stackingGroup: training-throughput }
        - { target: lab.training.technicalFailureHazard, operation: multiply, value: 0.968, stackingGroup: hazard-reduction }
    passive:
      id: ability.honestly-measured-scaling-claim
      label: Honestly Measured Scaling Claim
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 5 }
    compact:
      id: compact.instrument-the-run-honestly
      label: Instrument the Run Honestly
      requirement: Complete one compute-and-cost accounting disclosure every 52 weeks.
      check: { type: tagged-action-within, tags: [compute-accounting-disclosure], weeks: 52 }
      breachEvent: people.compact.instrument-the-run-honestly
    paperHooks:
      ids: [paper.gpt3-few-shot-learners, paper.megatron-lm]
    eventReactions:
      - { triggerTag: scaling-proposal, line: "Show me the compute accounting alongside the capability claim, or the claim is not finished yet." }
      - { triggerTag: compute-windfall, line: "A windfall is only as useful as the infrastructure that can actually turn it into a well-run training run." }
      - { triggerTag: training-run-failure, line: "Instrument the failure as carefully as we would have instrumented the success. That is where the real lesson is." }
    feedLines:
      - Tomas's infrastructure team caught a hardware fault hours before it would have corrupted the whole training run.
      - The compute accounting for the latest frontier run published cleanly alongside its capability claims, exactly as required.
      - A founding-era engineering habit, measure everything, instrument everything, still runs the data centre floor.
      - Tomas reviewed the scaling proposal and asked, first, for the infrastructure plan behind the compute request.
      - The chief compute officer title barely changes Tomas's actual daily habit of walking the server floor personally.
      - A training run finished ahead of schedule, and Tomas's team treated that as a scheduling anomaly worth investigating, not just a win.
    portrait:
      assetId: portrait.researcher.tomas-brown
      brief: Grounded 8-bit editorial portrait; white man with short brown hair and a trimmed beard, beside a data centre floor diagram with a compute accounting ledger; infrastructural and precise, not photoreal.
      altText: Pixel-art portrait of Tomas Brown beside a data centre floor diagram with a compute accounting ledger.
