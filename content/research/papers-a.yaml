    historicalNote: >-
      Published in 2014, this work demonstrated a general end-to-end neural approach to mapping
      one variable-length sequence into another.
    education:
      playerSummary: >-
        Sequence-to-sequence learning used one LSTM to encode an input sequence and another to
        generate an output sequence. The same general architecture could tackle translation and
        other tasks without a separately engineered alignment pipeline. It helped establish
        neural encoder-decoder systems as a powerful default, while its fixed-length bottleneck
        created exactly the pressure that attention would soon relieve.
      archiveExplanation: >-
        Standard supervised networks expect fixed-size inputs and outputs, but translation maps
        a sentence of one length to a sentence of another. Sutskever, Vinyals and Le proposed a
        clean neural solution. A multilayer LSTM encoder reads the source sentence and compresses
        it into a vector. A second LSTM decoder conditions on that vector and emits the target
        sentence one token at a time.

        On English-to-French translation, the system achieved results competitive with a strong
        phrase-based pipeline, and it could improve that pipeline further by reranking candidate
        translations. One memorable engineering detail was reversing the order of source words,
        which shortened important dependencies during optimisation. The model also learned
        sentence representations sensitive to meaning and word order without an explicit grammar
        module.

        The work helped move machine translation toward end-to-end learned systems and supplied
        a reusable pattern for summarisation, dialogue, speech and many structured transformations.
        Its weakness was equally productive: asking one fixed-size vector to carry every detail
        of a long sentence creates a bottleneck. Attention mechanisms let the decoder consult the
        encoder's intermediate states instead of relying on one compressed message. The game's
        research graph makes that relationship explicit. Sequence-to-sequence learning opens
        valuable language products immediately, then becomes the prerequisite for escaping its
        own architectural limitation.
