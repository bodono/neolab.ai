        evaluated, expanding the known trove of plausible stable materials far beyond what prior
        discovery efforts had catalogued.
      archiveExplanation: >-
        Discovering new stable materials, for batteries, superconductors, catalysts, or countless
        other applications, has traditionally relied on a combination of chemical intuition and
        slow, expensive experimental or first-principles computational screening, sharply limiting
        how much of the vast space of possible crystal structures could be explored. Merchant and
        colleagues trained graph neural networks to predict a candidate structure's
        thermodynamic stability directly from its composition and structure, using active-learning
        cycles that repeatedly generated new candidates, screened them, and retrained the model on
        the results to improve its accuracy over successive rounds.

        Applied at scale, the resulting pipeline evaluated 2.2 million candidate crystal
        structures and identified roughly 381,000 predicted to be stable, a roughly forty-five-fold
        increase over the number of such stable materials catalogued across the entire prior
        history of materials science, including many structures that had escaped previous human
        chemical intuition entirely.

