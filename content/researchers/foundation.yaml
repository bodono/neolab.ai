    role: Alignment, governance, and coalition building
    rosterCardSummary: A pre-eminent AI scholar who strengthens alignment research or coalition diplomacy and makes serious external governance unusually credible and affordable.
    biography: >-
      Stewart Russel has shaped how generations understand artificial intelligence and how the
      field understands its responsibilities. A physicist by training and a long-time Berkeley
      professor, he has contributed across probabilistic reasoning, decision-making and the
      foundations of intelligent systems. His textbook with Peter Norvig became the standard map
      of the field for students and practitioners around the world. Stewart then pressed beyond
      the conventional assumption that an intelligent machine should optimise a fixed human-
      supplied objective. His work on beneficial and human-compatible AI asks how systems can
      remain uncertain about human preferences and defer appropriately to people. He has brought
      the same clarity to public policy, international security and the governance of autonomous
      systems. Stewart's special authority comes from joining technical depth to civic patience:
      he can explain a formal control problem to a research team, then explain its institutional
      stakes to a room that writes laws.
