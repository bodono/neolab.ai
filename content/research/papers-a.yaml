        reasoning benchmarks, but the benefit emerged reliably only in sufficiently large language
        models; smaller models often produced fluent but incoherent reasoning chains without the
        accuracy improvement. The result reframed prompting itself as a serious lever for eliciting
        latent reasoning capability that scale alone had already trained into the model.

        Chain-of-thought prompting elicits reasoning behaviour rather than guaranteeing its
        correctness, and a fluent-looking chain can still reach a wrong answer. Neolab.ai treats
        this as a foundational reasoning-tools unlock underpinning much of the player's later
        prompting and agentic-reasoning research.
