        catastrophically wrong on inputs an adversary controls, which matters enormously once such
        systems are deployed where someone benefits from fooling them. The paper launched a long
        research programme on attacks, defences, and the uncomfortable finding that robustness and
        accuracy can trade off against each other.

        Neolab.ai treats this as the origin of the Security and Containment domain: the moment the
        field learned that "it works in testing" and "it cannot be made to fail on purpose" are
        different claims. It improves evidence quality and unlocks adversarial-robustness work.
