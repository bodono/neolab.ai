    title: Training Compute-Optimal Large Language Models
    authors: [Jordan Hoffmann, Sebastian Borgeaud, Arthur Mensch, Elena Buchatskaya, Trevor Cai, Eliza Rutherford, Diego de Las Casas, Lisa Anne Hendricks, Johannes Welbl, Aidan Clark, Tom Hennigan, Eric Noland, Katie Millican, George van den Driessche, Bogdan Damoc, Aurelia Guy, Simon Osindero, Karen Simonyan, Erich Elsen, Jack W. Rae, Oriol Vinyals, Laurent Sifre]
    publicationYear: 2022
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/2203.15556
    arxiv: "2203.15556"
    historicalNote: >-
      Posted in 2022, this paper trained a large family of language models to estimate compute-
      optimal scaling and introduced Chinchilla, a smaller model trained on proportionally more
      data than contemporaries of similar compute budget.
    education:
      playerSummary: >-
        This paper re-examined how a fixed training-compute budget should be split between model
        size and training-data volume, training over four hundred models across a wide range of
        sizes and data budgets to fit revised scaling curves. It concluded that many contemporary
        large language models were meaningfully undertrained relative to their size, and its
        smaller, more data-rich Chinchilla model outperformed several larger contemporaries
        trained on comparatively less data.
      archiveExplanation: >-
        Earlier scaling-law work suggested model size should grow somewhat faster than training-
        data size for a fixed compute budget, and the frontier language models that followed grew
        accordingly large relative to their training-data volume. Hoffmann and colleagues
        revisited this question with a substantially larger and more systematic sweep, training
        over four hundred models spanning a wide range of parameter counts and token budgets.

        Fitting careful scaling curves to this data, the authors concluded that model size and
        training-data size should in fact scale in roughly equal proportion for compute-optimal
        training—implying that many existing large models were undertrained relative to their
        size, with data volume as the more binding constraint. Their resulting Chinchilla model,
        trained with fewer parameters but substantially more data than contemporaries of similar
        training compute, outperformed those larger models on a wide range of downstream tasks.

        The finding reshaped frontier training strategy: for the same compute budget, a smaller,
        more thoroughly trained model could be both cheaper to run at inference time and more
        capable than a larger, comparatively undertrained one. It also quietly raised the
        importance of data supply as a strategic bottleneck, since compute-optimal training
        consumes text at a much higher rate. Neolab.ai converts this discovery into materially
        better training efficiency and lower serving cost per unit of capability, while making
        high-quality training data a more actively contested resource.
      insideBaseball: The smaller model wins. The larger, more expensive model's team has requested that this finding remain, for now, at the discussion stage.
