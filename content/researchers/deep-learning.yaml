  - id: researcher.niki-parmer
    version: 1
    displayName: Niki Parmer
    inspirationName: Niki Parmar
    inspirationSummary: Transformer and Image Transformer co-author who co-founded Adept and Essential AI to turn large models into useful systems.
    epithet: The Attention-to-Action Builder
    role: Transformer architectures and scaled sequence modelling
    rosterCardSummary: A transformer co-author who carries attention across modalities, then asks what useful system the lab plans to build next.
    biography: >-
      Niki Parmar helps attention leave the language laboratory and find something useful to do.
      Niki Parmar co-authored “Attention Is All You Need,” which introduced the transformer, and
      then “Image Transformer,” which applied self-attention to image generation. Her
      Image Transformer generated images autoregressively while modelling each pixel's conditional
      distribution. Her later research included stand-alone self-attention for vision, replacing spatial
      convolutions with attention operations. Parmar co-founded Adept with Ashish Vaswani and David
      Luan to build models that act through software, then co-founded Essential AI with Vaswani.
      Essential describes its work as open models, tooling, reproducible pipelines, and evaluation
      frameworks intended to make frontier research useful. Across those projects, Parmar keeps an
      architecture-to-action through-line: test attention in another modality, make the system
      reproducible, and ask whether anybody can use it. A beautiful attention map earns respectful
      interest; a working tool earns the next meeting.
    availability: { wave: deep-learning, earliestYear: 2016, poolWeight: 0.70 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 3, reinforcementAgency: 1, multimodality: 4, reasoningTools: 3, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 1, interpretabilityEvals: 1, securityContainment: 0, training: 4, product: 4, management: 3, politics: 1 }
