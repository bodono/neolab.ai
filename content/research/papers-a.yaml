        split a fixed compute budget between a larger model and more training data. The result
        turned scaling from an intuition into a quantitative planning tool.
      archiveExplanation: >-
        Before this paper, labs scaled language models substantially through experience and
        intuition rather than a quantitative theory of returns. Kaplan, McCandlish and colleagues
        trained a large family of transformer language models across a wide range of sizes,
        dataset sizes and compute budgets, and fit the resulting loss curves.

        The central finding was a strikingly smooth set of power-law relationships: loss
        decreased predictably as any one of model size, dataset size or compute increased, with
        comparatively weak dependence on many architectural details. The paper further argued
        that, for a fixed compute budget, model size should be scaled somewhat faster than
        training-data size to reach an efficient frontier—guidance that shaped how the next
        generation of frontier models was planned, before later work revised the precise ratios.

        Scaling laws did not guarantee that every capability would emerge smoothly, nor that
        larger models were automatically safer, more truthful or better aligned with operator
        intent; the paper measured loss, not values. Its practical contribution was converting an
        expensive trial-and-error scaling decision into a plannable investment with forecastable
        returns. In Neolab.ai this discovery makes frontier training runs measurably more
        predictable and improves the return on large compute commitments, while leaving entirely
        open whether the resulting model's objectives match what the lab actually wanted.
