    version: 1
    historicity: real
    gameOrder: 83
    title: Masked Autoencoders Are Scalable Vision Learners
    authors: [Kaiming He, Xinlei Chen, Saining Xie, Yanghao Li, Piotr Dollár, Ross Girshick]
    publicationYear: 2021
    venue: arXiv preprint / CVPR 2022
    primarySourceUrl: https://arxiv.org/abs/2111.06377
    arxiv: "2111.06377"
    historicalNote: >-
      Posted in 2021, this paper masked a large majority of an image's patches and trained an
      asymmetric encoder-decoder to reconstruct them, giving vision transformers an efficient,
      scalable self-supervised pretraining recipe.
    education:
      playerSummary: >-
        He and colleagues adapted masked-language-model-style pretraining to vision: randomly
        masking a very high proportion of an image's patches and training an asymmetric
        encoder-decoder, where the heavy encoder only ever sees the small visible fraction of
        patches, to reconstruct the missing pixels. The approach trained large vision transformers
        efficiently and reached strong accuracy on standard image benchmarks.
      archiveExplanation: >-
        Masked-language-model pretraining had proven a highly effective, simple self-supervised
        recipe for text, but images are far more spatially redundant than language, so masking a
        small fraction of patches, the natural analogue, gives away too much through the
        surrounding, unmasked context to force useful learning. He and colleagues instead masked a
        very high proportion of each image's patches, typically around three-quarters, making
        reconstruction a genuinely difficult, meaningfully self-supervisory task.

        The architecture was deliberately asymmetric: the expensive encoder only ever processed the
        small set of visible patches, while a lightweight decoder reconstructed the full image from
        the encoder's output plus mask tokens, letting the heavy computation scale to large models
        efficiently, roughly three times faster than symmetric alternatives. A large vision
        transformer pretrained this way reached 87.8 percent accuracy on ImageNet, demonstrating
        that self-supervised masking, done with the right masking ratio for the modality, scaled
        vision models much as it had scaled language models.

        The high masking ratio and reconstruction objective are specific to images and do not
        transfer directly to other modalities without modification. Neolab.ai treats this as a
        data-representation unlock that meaningfully reduces the labelled-data burden of the
        player's vision research.
      insideBaseball: Three-quarters of the image is hidden and the model still reconstructs it convincingly. The redacted quarterly report has not fared as well.
