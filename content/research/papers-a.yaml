        Standard convolutions apply full filters across every input channel simultaneously, which
        is expensive. Howard and colleagues instead factored this into a depthwise convolution,
        filtering each channel separately, followed by a cheap pointwise convolution that combined
        the results, cutting computation and parameter counts substantially with only a modest
        accuracy cost. Two simple global hyperparameters then let a model builder trade accuracy
        against latency and size along a smooth curve.

        This mattered because most deep learning research at the time optimised purely for
        accuracy on powerful hardware, largely ignoring the compute and memory budgets of phones,
        cameras, and other embedded devices. MobileNets gave practitioners a principled, tunable
        way to deploy strong vision models within a fixed resource budget rather than the largest
        model available.

        The efficiency gains came from architecture design rather than any fundamentally new
        capability, and larger, more expensive models still won on raw accuracy. Neolab.ai treats
        this as an optimisation-scaling unlock focused on inference efficiency and deployment cost,
        complementing rather than replacing the player's capability-focused architecture research.
