    title: Self-Consistency Improves Chain of Thought Reasoning in Language Models
    authors: [Xuezhi Wang, Jason Wei, Dale Schuurmans, Quoc Le, Ed Chi, Sharan Narang, Aakanksha Chowdhery, Denny Zhou]
    publicationYear: 2022
    venue: arXiv preprint / ICLR 2023
    primarySourceUrl: https://arxiv.org/abs/2203.11171
    arxiv: "2203.11171"
    historicalNote: >-
      Posted in 2022, this paper replaced single-path greedy chain-of-thought decoding with
      sampling many reasoning paths and taking the most common final answer, improving accuracy
      substantially across reasoning benchmarks.
    education:
      playerSummary: >-
        Wang and colleagues improved chain-of-thought prompting by sampling several different
        reasoning paths for the same question, rather than committing to a single greedily
        decoded path, and then selecting the final answer most reasoning paths agreed on. The
        change produced large accuracy gains across arithmetic and commonsense reasoning
        benchmarks at the cost of extra inference compute.
      archiveExplanation: >-
        A single chain-of-thought reasoning path, generated by greedily picking the most likely
        next token at each step, can wander down an incorrect line of reasoning and commit to it.
        Wang and colleagues instead sampled a diverse set of reasoning paths for the same question,
        letting the model explore different lines of reasoning, and then took the final answer
        that the largest number of sampled paths agreed on, marginalising out the individual
        reasoning traces rather than trusting any single one.

        This self-consistency approach produced striking accuracy improvements across popular
        arithmetic and commonsense reasoning benchmarks compared to standard greedy chain-of-thought
        decoding, establishing that spending more inference-time compute on sampling and voting
        could meaningfully substitute for training-time improvements on reasoning tasks.

        The technique multiplies inference cost by the number of sampled paths, and it assumes the
        correct answer is at least reachable by some sampled reasoning path in the first place.
        Neolab.ai treats this as a reasoning-tools unlock that improves the reliability of the
        player's model outputs at a real, ongoing serving-cost tradeoff.
      insideBaseball: The model votes with itself several times before answering. Board meetings have tried this. Convergence remains elusive.
