      - https://crfm.stanford.edu/helm/index.html
      - https://crfm.stanford.edu/helm/classic/v0.2.2/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-22 }

  - id: researcher.luke-zettlemeyer
    version: 1
    displayName: Luke Zettlemeyer
    inspirationName: Luke Zettlemoyer
    inspirationSummary: University of Washington professor and Meta FAIR senior research director whose empirical semantics research spans meaning representations, pretraining, multilingual NLP, and BART.
    epithet: The Meaning Recoverer
    role: Computational semantics and large-scale language model pretraining
    rosterCardSummary: A University of Washington professor and Meta FAIR research director who politely asks fluent models to prove they understood the sentence.
    biography: >-
      Luke Zettlemoyer has spent his career asking language models what, precisely, they think a
      sentence means. He is a professor in the University of Washington's Paul G. Allen School and
      a senior research director at Meta FAIR, combining academic work on empirical computational
      semantics with large-scale model research. His programme builds representations of meaning
      and tests them through semantic parsing, question answering, information extraction,
      multilingual NLP, and self-supervised pretraining. Zettlemoyer co-authored BART, which
      corrupts text and trains a sequence-to-sequence model to reconstruct it, unifying ideas from
      bidirectional encoders and autoregressive decoders in one adaptable recipe. He also
      co-authored RoBERTa and has helped lead FAIR's Seattle research community while continuing to
      teach and advise at Washington. Across those scales, his standard remains admirably
      old-fashioned: fluent language is welcome, but meaning must still show its working. If a
      model produces a beautiful answer to a subtly different question, Luke notices the
      difference before the applause finishes. His research makes semantics empirical without
      pretending that meaning is simple.
    availability: { wave: scaling, earliestYear: 2018, poolWeight: 0.55 }
    contract: { band: major, baseSalaryPerCycle: 0.68, baseSigningCash: 6, auraCost: 9, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 3, reinforcementAgency: 0, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 1, interpretabilityEvals: 4, securityContainment: 0, training: 4, product: 1, management: 4, politics: 2 }
    traits: [trait.computational-semantics, trait.dual-academia-industry-leadership]
    signature:
      id: ability.empirical-computational-semantics
      label: Empirical Computational Semantics
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.reasoning-tools, domain.architectures] }
      rampWeeks: 4
      effects:
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.multilingual-pretraining-lead
      label: Multilingual Pretraining Lead
      effects:
        - { target: domain.data-representation.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    compact:
      id: compact.check-the-meaning-not-just-the-fluency
      label: Check the Meaning, Not Just the Fluency
      requirement: Complete one semantic-representation evaluation every 52 weeks.
      check: { type: tagged-action-within, tags: [semantic-representation-evaluation], weeks: 52 }
      breachEvent: people.compact.check-the-meaning-not-just-the-fluency
    paperHooks:
      ids: [paper.bert, paper.retrieval-augmented-generation]
    eventReactions:
      - { triggerTag: model-overconfidence, line: "A fluent answer and a correctly parsed meaning are not always the same claim. Check which one you actually have." }
      - { triggerTag: scaling-proposal, line: "Multilingual pretraining is not one language's pretraining done many times. The transfer story needs its own evidence." }
      - { triggerTag: talent-poaching, line: "I teach the introductory course every year specifically so this negotiation is not one-sided." }
    feedLines:
      - Luke's semantic parser recovered the intended meaning of a question the fluent answer had subtly missed.
      - A multilingual pretraining run transferred better than expected to a language it had barely seen.
      - The Allen School lecture hall filled again, and several of this year's students will likely lead labs of their own.
      - Luke's dual academia-industry role meant a research question got answered from both directions at once.
      - A presidency of the field's computational linguistics association came and went; the teaching schedule did not change.
      - The semantic representation evaluation caught a meaning error the accuracy benchmark had confidently overlooked.
    portrait:
      assetId: portrait.researcher.luke-zettlemeyer
      brief: Scholarly 8-bit editorial portrait; white man with shoulder-length grey hair, glasses and a full short beard, beside a sentence resolving into a structured semantic parse tree; precise and dual-affiliated, not photoreal.
      altText: Pixel-art portrait of Luke Zettlemeyer beside a sentence resolving into a structured semantic parse tree.
    sources:
