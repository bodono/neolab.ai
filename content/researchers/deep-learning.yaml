    paperHooks:
      ids: [paper.alexnet, paper.sequence-to-sequence, paper.transformer]
    eventReactions:
      - { triggerTag: live-demo, line: "The impressive version is the one where we do not hide the loading time or the second prompt." }
      - { triggerTag: autonomous-systems, line: "The edge cases are not at the edge. They are simply less photogenic." }
      - { triggerTag: technical-explainer, line: "If we cannot rebuild the idea in a small clean system, we may be borrowing confidence from the large one." }
    feedLines:
      - Andrey rebuilt the model from scratch and found the assumption hiding in line 147.
      - The demo now works live, unscripted, and in front of a deeply nervous product manager.
      - A technical explainer earned widespread goodwill and caused six engineers to delete unnecessary frameworks.
      - Productisation earned more public excitement because the research code finally agreed to become software.
      - The vision-language model described the lab accurately and the board aspirationally.
      - Andrey's live-coding session produced a model, a curriculum and a minor shortage of whiteboard space.
    portrait:
      assetId: portrait.researcher.andrey-carpathy
