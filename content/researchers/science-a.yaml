      label: Geometric Deep Learning Framework
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.architectures, domain.scientific-ai] }
      rampWeeks: 4
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: domain.scientific-ai.researchOutput, operation: multiply, value: 1.03 }
    passive:
      id: ability.symmetry-preserving-generalisation
      label: Symmetry-Preserving Validation
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 3 }
    compact:
      id: compact.find-the-underlying-symmetry
      label: Find the Underlying Symmetry
      requirement: Every 52 weeks while he leads Architectures, complete one symmetry analysis.
      check: { type: assignment-requires-project-tag, assignmentTag: architecture-programme, projectTag: symmetry-analysis, weeks: 52 }
