researchers:
  - id: researcher.noah-goodmann
    version: 1
    displayName: Noah Goodmann
    inspirationName: Noah Goodman
    inspirationSummary: Stanford cognitive scientist and probabilistic-programming pioneer who turns formal models of thought into executable programs.
    epithet: The Mind-as-Code Programmer
    role: Probabilistic programming and computational cognitive science
    rosterCardSummary: A Stanford cognitive scientist who writes models of human thought as executable programs, because apparently even beliefs deserve a debugger.
    biography: >-
      Noah Goodman is a Stanford professor of psychology, with courtesy appointments in computer
      science and linguistics, and directs the Computation and Cognition Lab. He studied computer
      science and cognitive science at Harvard, completed a doctorate in mathematics at the
      University of Texas at Austin and undertook postdoctoral research at MIT. His work combines
      behavioural experiments with probability, statistics and logic to model human cognition,
      including language understanding, social reasoning and concept learning. He has helped
      develop probabilistic programming tools that let researchers express generative theories of
      thought as executable models and compare their predictions with human behaviour. Tools from
      that research community include WebPPL, a language designed for probabilistic models and
      inference. The approach treats beliefs, meanings and inferences as objects that can be
      specified precisely enough to run, inspect and revise. His Rational Speech Acts framework
      models speakers and listeners reasoning recursively about one another, turning pragmatic
      language into a quantitative prediction problem for observable behaviour. Apparently even a
      theory of mind benefits from a debugger.
    availability: { wave: frontier, earliestYear: 2020, poolWeight: 0.45 }
    contract: { band: major, baseSalaryPerCycle: 0.64, baseSigningCash: 6, auraCost: 9, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 3, optimisationScaling: 0, dataRepresentation: 3, reinforcementAgency: 0, multimodality: 0, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 2, alignmentControl: 5, interpretabilityEvals: 5, securityContainment: 0, training: 1, product: 1, management: 3, politics: 1 }
    traits: [trait.cognition-as-computation, trait.probabilistic-programming-builder]
    signature:
      id: ability.probabilistic-programming-for-cognition
      label: Probabilistic Programming for Cognition
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.reasoning-tools] }
      rampWeeks: 4
      effects:
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.social-reasoning-model
      label: Bayesian Theory of Mind
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    compact:
      id: compact.model_the_reasoning_process_not_just_the_output
      label: Model the Reasoning Process, Not Just the Output
      requirement: Every 52 weeks while he leads Reasoning & Tools, complete one generative-reasoning-process review.
      check: { type: assignment-requires-project-tag, assignmentTag: reasoning-programme, projectTag: generative-reasoning-process-model, weeks: 52 }
      breachEvent: people.compact.model-the-reasoning-process-not-just-the-output
    paperHooks:
      ids: [paper.discovering-lm-behaviors-model-written-evals, paper.chain-of-thought-prompting]
    eventReactions:
      - { triggerTag: model-overconfidence, line: "A good input-output score does not tell you whether the underlying reasoning process resembles anything like belief updating. Model that directly." }
      - { triggerTag: benchmark-saturation, line: "Ask what a principled model of social reasoning would predict here before assuming the benchmark has genuinely been solved." }
      - { triggerTag: agi-declaration-pressure, line: "Human cognition itself is only partially understood as a computational process. Be careful what standard you are claiming this clears." }
    feedLines:
      - Noah's generative reasoning model predicted a pattern in the benchmark that the input-output numbers alone had missed.
      - The probabilistic programming language expressed a cognitive model in a dozen lines that would have taken pages of equations.
      - A social-reasoning experiment in the Computation and Cognition Lab quietly informed how the reasoning-tools team framed its next study.
      - Noah's model of concept learning matched a genuinely surprising pattern in how a language model generalised from few examples.
      - A visiting linguist and a visiting computer scientist both left Noah's lab meeting with the same equation written down.
      - The compact's process-modelling requirement turned an otherwise ordinary benchmark result into an actual cognitive hypothesis.
    portrait:
      assetId: portrait.researcher.noah-goodmann
      brief: Thoughtful 8-bit editorial portrait; white man with curly brown hair, glasses, and a warm inquisitive expression, beside a probabilistic program expressing a small model of belief updating; academic and precise, not photoreal.
      altText: Pixel-art portrait of Noah Goodmann beside a probabilistic program expressing a small model of belief updating.
