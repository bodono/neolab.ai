        language model using new, comparatively small trainable layers, rather than training a
        multimodal model entirely from scratch. The resulting Flamingo model could take
        arbitrarily interleaved sequences of images, video, and text and rapidly adapt to new
        visual tasks from just a handful of examples in its prompt.
      archiveExplanation: >-
        Training a multimodal vision-language model entirely from scratch is expensive and risks
        wasting the capability already present in large pretrained vision-only and language-only
        models. Alayrac and colleagues instead froze a strong pretrained vision encoder and a
        strong pretrained language model, and inserted new, comparatively lightweight trainable
        layers between them designed to let the language model attend over visual features at
        whatever point they appeared in an interleaved sequence of images and text.

