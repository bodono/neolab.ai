  - id: researcher.deepak-pathark
    version: 1
    displayName: Deepak Pathark
    inspirationName: Deepak Pathak
    inspirationSummary: Carnegie Mellon roboticist who made prediction error an intrinsic reward, then co-founded Skild AI to build a general-purpose robotics foundation model.
    epithet: The Agent's Chief Curiosity Officer
    role: Curiosity-driven exploration and embodied reinforcement learning
    rosterCardSummary: A Carnegie Mellon roboticist who made an agent's own surprise pay its reward bill, then let it explore until useful skills emerged without an itemised request.
    biography: >-
      Deepak Pathak turned an agent's surprise into its allowance. Deepak Pathak is the Raj Reddy
      Associate Professor at Carnegie Mellon, working across computer vision, machine learning, and
      robotics, and co-founder and CEO of Skild AI. He earned IIT Kanpur's computer-science gold
      medal before beginning his Berkeley doctorate in 2014. During his Berkeley PhD with Alyosha
      Efros and Trevor Darrell, he helped introduce an intrinsic-curiosity module that rewards an
      agent for prediction errors in a learned feature space. It enabled exploration without
      external rewards and was later studied across dozens of benchmark environments, alongside
      work on zero-shot imitation for real robots. After research at Meta AI and a Berkeley postdoc,
      he joined Carnegie Mellon, where his group studies agents that learn from raw sensory data and
      their own experience. Skild AI extends that ambition to a general-purpose robotics foundation
      model. Deepak's agents do not need an itemised itinerary; give them a world, reward the things
      they fail to predict, and keep an eye on what they decide is interesting.
    availability: { wave: frontier, earliestYear: 2018, poolWeight: 0.50 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 4, optimisationScaling: 1, dataRepresentation: 2, reinforcementAgency: 5, multimodality: 2, reasoningTools: 1, roboticsEmbodiment: 5, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 0, securityContainment: 0, training: 3, product: 2, management: 3, politics: 1 }
    traits: [trait.curiosity-as-reward, trait.self-supervised-explorer]
    signature:
      id: ability.curiosity-driven-exploration
      label: Curiosity-Driven Exploration
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.reinforcement-agency, domain.robotics-embodiment] }
      rampWeeks: 4
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.self-supervised-prediction-error-signal
      label: Self-Supervised Prediction-Error Signal
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 3 }
    compact:
      id: compact.let-the-agent-be-curious
      label: Let the Agent Be Curious
      requirement: Every 52 weeks while he leads Reinforcement Learning & Agency, complete an intrinsic-curiosity-signal review.
      check: { type: assignment-requires-project-tag, assignmentTag: reinforcement-programme, projectTag: intrinsic-curiosity-signal, weeks: 52 }
      breachEvent: people.compact.let-the-agent-be-curious
    paperHooks:
      ids: [paper.world-models, paper.dactyl-dexterous-in-hand-manipulation]
    eventReactions:
      - { triggerTag: robot-demo-failure, line: "Check whether the agent's own prediction error flagged this scenario as surprising before it failed. That surprise is useful data." }
      - { triggerTag: reward-hacking, line: "An agent rewarded for its own surprise will chase novelty for its own sake. Make sure that novelty was actually useful." }
      - { triggerTag: simulation-transfer, line: "A curious agent that has explored a wide range of unexpected states in simulation usually handles the real world's surprises better too." }
    feedLines:
      - Deepak's curiosity signal drove the agent to explore a corner of the environment nobody had specifically rewarded it to find.
      - A robot with no external reward at all still learned a genuinely useful skill, purely by chasing its own prediction error.
      - The intrinsic curiosity compact caught a sparse-reward project that would otherwise have explored almost nothing at all.
      - Deepak's rope-manipulation robot learned a manoeuvre through self-supervised curiosity that no demonstration had shown it.
      - A co-founded robotics venture kept the same curiosity-driven instinct alive well outside the original academic lab.
      - An audio-visual association experiment let an agent learn where to look purely by following what surprised it most.
    portrait:
      assetId: portrait.researcher.deepak-pathark
      brief: Curious 8-bit editorial portrait; brown-skinned South Asian man with short black hair and an inquisitive smile, beside a robot exploring toward an unexpected sensor reading; energetic and self-driven, not photoreal.
      altText: Pixel-art portrait of Deepak Pathark beside a robot exploring toward an unexpected, surprising sensor reading.
