        - { target: generalStaff.onboardingCashCost, operation: multiply, value: 0.90, duration: next-cycle }
      breachEvent: people.compact.build-it-from-scratch
    paperHooks:
      ids: [paper.alexnet, paper.sequence-to-sequence, paper.transformer]
      affinityTags: [vision-language, neural-network-tooling]
    facilityHooks: [facility.inference-centre, facility.conference-centre]
    endgameHooks: [ending.miracle-terms-and-conditions-apply, ending.public-knowledge]
