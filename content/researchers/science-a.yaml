  - id: researcher.emmanuel-candez
    version: 1
    displayName: Emmanuel Candez
    inspirationName: Emmanuel Candès
    inspirationSummary: Stanford mathematician and statistician whose compressed-sensing work proved sparse signals can be recovered from surprisingly few measurements.
    epithet: The Fewer-Measurements Magician
    role: Compressed sensing, high-dimensional statistics, and inverse problems
    rosterCardSummary: A Stanford statistician who proved that fewer measurements can be enough, provided the signal is sparse and somebody remembered to state the assumptions.
    biography: >-
      Emmanuel Candès helped overturn the assumption that reliable reconstruction always requires
      collecting a dense set of measurements. A Stanford professor of mathematics and statistics,
      with a courtesy appointment in electrical engineering, he develops mathematical frameworks
      for signal processing, imaging, high-dimensional statistics, and inverse problems. His
      seminal work on compressed sensing established rigorous conditions under which a sparse
      signal can be recovered from surprisingly few measurements, turning sparsity from an
      informal engineering hunch into a precise and widely applicable principle. That perspective
      now informs imaging systems, statistical estimation, scientific computing, and modern data
      analysis, especially where measurements are expensive or incomplete. Emmanuel's research
      instinct asks what hidden low-dimensional structure makes an apparently underdetermined
      problem solvable, then proves exactly when the reconstruction can be trusted rather than
      relying on a convenient empirical success alone.
