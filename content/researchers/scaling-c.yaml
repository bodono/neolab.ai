  - id: researcher.melany-mitchell
    version: 1
    displayName: Melany Mitchell
    inspirationName: Melanie Mitchell
    inspirationSummary: Santa Fe Institute complexity scientist and author whose work on analogy and conceptual abstraction asks what machine understanding amounts to beyond benchmark performance.
    epithet: The Analogy Architect
    role: AI understanding, analogy-making, and public science communication
    rosterCardSummary: A Santa Fe Institute complexity scientist who studies analogy and keeps asking the benchmark winner the delightfully difficult follow-up—what did it understand?
    biography: >-
      Melanie Mitchell studies intelligence that refuses to fit neatly inside a
      leaderboard. At the Santa Fe Institute, her research centres on conceptual abstraction,
      analogy-making, visual recognition, and the question of what it would mean for an AI
      system to understand rather than merely answer. Her work treats analogy as a core cognitive
      ability: mapping a new situation onto prior structure, flexibly and in context. Mitchell has
      written widely for nonspecialists, including "Artificial Intelligence: A
      Guide for Thinking Humans," bringing arguments about learning and understanding into
      discussion without sanding off their uncertainty. That makes her scepticism constructive. A
      benchmark can establish that a system
      succeeded on a benchmark; it cannot, by itself, settle what concepts the system formed or
      how those concepts will transfer. Melanie is perfectly happy to admire a striking result.
      She simply keeps the experiment running long enough to discover whether the machine admired
      it too, or only recognised the answer key.
    availability: { wave: scaling, earliestYear: 2018, poolWeight: 0.50 }
    contract: { band: major, baseSalaryPerCycle: 0.64, baseSigningCash: 6, auraCost: 9, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 3, optimisationScaling: 0, dataRepresentation: 2, reinforcementAgency: 0, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 5, interpretabilityEvals: 5, securityContainment: 0, training: 1, product: 1, management: 2, politics: 3 }
    traits: [trait.analogy-sceptic, trait.public-science-communicator]
    signature:
      id: ability.analogy-based-abstraction-testing
      label: Analogy-Based Abstraction Testing
      eligibleAssignments: [safety-program]
      activation: { type: assignment-id-in, values: [safety.interpretability-evals] }
      rampWeeks: 4
      effects:
        - { target: safety.interpretability-evals.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.public-translation-of-ai-claims
      label: Public Translation of AI Claims
      effects:
        - { target: lab.politics.governmentTrustFloor, operation: add, value: 3}
    compact:
      id: compact.a-benchmark-score-is-not-understanding
      label: A Benchmark Score Is Not Understanding
      requirement: Complete one analogy-transfer evaluation every 52 weeks.
      check: { type: tagged-action-within, tags: [analogy-transfer-evaluation], weeks: 52 }
      breachEvent: people.compact.a-benchmark-score-is-not-understanding
    paperHooks:
      ids: [paper.discovering-lm-behaviors-model-written-evals, paper.emergent-abilities-of-llms]
    eventReactions:
      - { triggerTag: benchmark-record, line: "Test whether the concept transfers to a genuinely new analogy before calling this understanding." }
      - { triggerTag: agi-declaration-pressure, line: "I have watched this exact overclaim happen before, more than once. The pattern is familiar even when the model is new." }
      - { triggerTag: government-hearing, line: "Translate the claim honestly for the room. Overclaiming in front of policymakers costs the whole field credibility later." }
    feedLines:
      - Melany's analogy-transfer test caught a model that had memorised the pattern but missed the underlying concept.
      - A confident claim of genuine understanding was, once again, met with one carefully chosen counter-example.
      - Melany's public explanation of a capability claim reached more people than the original paper's abstract ever will.
      - A journalist's overclaim about the lab's latest model got a polite, precise correction before it spread further.
      - The Santa Fe Institute whiteboard filled with an analogy neither the model nor, initially, the team had considered.
      - Forty years into this question, Melany still finds a new way a benchmark number fails to answer it.
    portrait:
      assetId: portrait.researcher.melany-mitchell
      brief: Thoughtful 8-bit editorial portrait; white woman with short dark hair, glasses and a calm, sceptical expression, beside two analogous situations mapped onto each other with a question mark between them; measured and communicative, not photoreal.
      altText: Pixel-art portrait of Melany Mitchell beside two analogous situations mapped onto each other with a question mark.
    sources:
