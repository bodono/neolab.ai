        with gradient descent, and it learned to infer simple algorithms, such as copying, sorting,
        and associative recall, directly from example input-output pairs, without being told the
        underlying procedure. This showed that neural networks could be pushed toward genuinely
        algorithmic, rather than purely pattern-matching, behaviour.

