  - id: paper.fast-deep-belief-nets
    version: 1
    historicity: real
    gameOrder: 4
    title: A Fast Learning Algorithm for Deep Belief Nets
    authors: [Geoffrey E. Hinton, Simon Osindero, Yee-Whye Teh]
    publicationYear: 2006
    venue: Neural Computation
    primarySourceUrl: https://doi.org/10.1162/neco.2006.18.7.1527
    doi: 10.1162/neco.2006.18.7.1527
    historicalNote: >-
      This 2006 paper was an important part of the revival of deep neural networks before
      large supervised datasets and GPU training became the dominant recipe.
    education:
      playerSummary: >-
        Deep belief nets offered a practical recipe for training many-layer generative models
        one layer at a time, then refining the whole system. The unsupervised pretraining
        procedure placed the network in a useful region before supervised optimisation began.
        Its specific architecture is less common today, but the result helped convince a
        sceptical field that genuinely deep learned representations could work.
      archiveExplanation: >-
        During the early 2000s, adding layers to a neural network often made it harder rather
        than better. Training signals weakened, labelled datasets were limited, computation was
        expensive, and poor initial weights could strand optimisation in unhelpful regions.
        These practical failures supported a widespread belief that deep networks were simply
        too difficult to train reliably.

        Hinton, Osindero and Teh described a greedy, layer-by-layer procedure for deep belief
        nets. Each layer was trained as a restricted Boltzmann machine to model the activity of
        the layer below it. After this unsupervised pretraining had built a hierarchy, the full
        network could be fine-tuned. The algorithm came with an illuminating theoretical
        perspective and striking demonstrations on handwritten digits.

        Deep belief nets were not the final architecture of the deep-learning era. As labelled
        datasets grew and better activations, initialisation, regularisation, optimisers and
        GPUs arrived, straightforward end-to-end supervised training became far more effective.
        The paper's historical importance lies partly in reopening the empirical case for depth
        and representation learning. It showed that the apparent barrier was not a law of
        nature; it was a problem of method and resources. In the game, it accelerates learned
        representations and unlocks the generative branch, while later papers can replace its
        pretraining recipe without erasing the institutional confidence it created.
      insideBaseball: Layer-wise pretraining has succeeded. The lab now contains one more layer of people explaining the layers.
    domainWeights:
      domain.data-representation: 0.45
      domain.architectures: 0.35
      domain.optimisation-scaling: 0.20
    prerequisites:
      papers: [paper.backpropagation]
      domainLevels:
        domain.data-representation: 8
        domain.architectures: 8
    baseEffort: 95
    earliestPhase: foundation
    discovery:
