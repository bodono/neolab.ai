    historicalNote: >-
      Posted in 2017, this paper introduced a clipped surrogate objective that captured most of
      trust-region policy optimisation's stability with far simpler implementation, becoming the
      field's default reinforcement-learning algorithm for years afterward.
    education:
      playerSummary: >-
        Schulman and colleagues replaced trust-region policy optimisation's more expensive
        constrained update with a simple clipped objective that discourages the policy from
        changing too much in a single step, at a fraction of the implementation complexity. The
        result, proximal policy optimization, became the field's default reinforcement-learning
        algorithm, later underlying much of the reinforcement learning from human feedback used
        to train instruction-following assistants.
      archiveExplanation: >-
        Trust region policy optimization gave strong stability guarantees but required a
        relatively expensive constrained optimisation step at every update, which limited its
        practical convenience. Schulman and colleagues proposed clipping the policy-update ratio
        directly inside an otherwise ordinary gradient-based objective, discouraging the new
        policy from straying too far from the old one without needing the full trust-region
        machinery.

        This proximal policy optimization objective was dramatically simpler to implement, allowed
        multiple epochs of minibatch updates on the same batch of experience, and matched or
        exceeded trust-region methods' sample efficiency and stability across a wide range of
        continuous-control and Atari benchmarks. Its simplicity and reliability made it the default
        choice across both academic and industrial reinforcement learning for years, and it later
        became a core component of the reinforcement-learning-from-human-feedback pipelines used
        to align large language models.

        The clipped objective is a heuristic approximation rather than a strict theoretical
        guarantee, and it can still require careful tuning on some tasks. Neolab.ai treats this as
        a major reinforcement-agency unlock, both for game-playing research and, later, as a
        prerequisite for the lab's human-feedback alignment work.
      insideBaseball: The clipped objective is simple enough to implement in an afternoon. Reproducing anyone else's reported results from it, historically, took rather longer.
