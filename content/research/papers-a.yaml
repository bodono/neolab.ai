      archiveExplanation: >-
        Ha and Schmidhuber split an agent into three components: a vision model that compressed raw
        observations into a compact latent representation, a memory model that predicted how that
        representation would evolve over time, and a small controller that chose actions using only
        the compressed representation and memory state. Because the memory model was generative, the
        controller could be trained almost entirely inside the model's own predicted, "hallucinated"
        rollouts rather than the real, expensive-to-simulate environment.

