          - { kind: add-rating, subject: { type: player-lab }, rating: securityPosture, amount: 5 }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.95, durationWeeks: 52, tags: [verified-data] }
        checks: []
        memories:
