  - id: researcher.sergei-levinsky
    version: 1
    displayName: Sergei Levinsky
    inspirationName: Sergey Levine
    inspirationSummary: UC Berkeley robot-learning professor and Physical Intelligence co-founder who develops scalable policies that connect perception, control and real-world experience.
    epithet: The Embodiment Engineer
    role: Robot learning at scale
    rosterCardSummary: The Berkeley professor who gives learned policies robot arms, real-world data and no opportunity to blame the simulator.
    biography: >-
      Sergey Levine earned bachelor’s, master’s and doctoral degrees in computer science at
      Stanford, then joined UC Berkeley, where he leads research on machine learning for
      decision-making and control. His work includes end-to-end neural policies that connect
      perception directly to action, scalable inverse reinforcement learning and deep
      reinforcement-learning methods for robots. These systems learn grasping, locomotion and other
      skills from demonstrations, trial and error, offline datasets and fleets collecting
      experience in the physical world. Levine’s laboratory has repeatedly tested whether methods
      that improve with more data and compute can replace brittle task-specific controllers. He
      later co-founded Physical Intelligence, which builds general-purpose models for robots and
      other physical devices. Embodiment makes every abstraction submit to a practical review:
      gravity attends the demonstration, the object is rarely where the simulator promised, and a
      failed grasp still becomes useful training data for another attempt. Levine’s research keeps
      the learning algorithm in that room until it can cope with reality.
    availability: { wave: scaling, earliestYear: 2016, poolWeight: 0.75 }
    contract: { band: major, baseSalaryPerCycle: 0.87, baseSigningCash: 8, auraCost: 12, overrideExplanation: Priced on overall measured research strength. }
