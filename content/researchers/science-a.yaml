  - id: researcher.mikhail-bronsteen
    version: 1
    displayName: Mikhail Bronsteen
    inspirationName: Michael Bronstein
    inspirationSummary: Oxford geometric-deep-learning pioneer who unifies graphs, shapes, proteins and other non-Euclidean data through symmetry.
    epithet: The Symmetry Detective
    role: Geometric deep learning and non-Euclidean representation
    rosterCardSummary: An Oxford professor who asks what symmetry a supposedly novel architecture is respecting, then discovers it has been geometric deep learning all along.
    biography: >-
      Michael Bronstein is the DeepMind Professor of Artificial Intelligence at the University of
      Oxford and founding scientific director for AI at Vienna's Aithyra Institute. He completed
      his doctorate at the Technion, later held a professorship at Imperial College London and led
      graph-learning research at Twitter. His work helped establish geometric deep learning, a
      framework for understanding neural architectures through the symmetries and structure of
      their domains. That viewpoint connects convolutional networks, graph neural networks and
      methods for data on shapes, manifolds and other non-Euclidean spaces. His current interests
      include graph learning, 3D shape analysis, protein design and non-human species
      communication. He has also held visiting appointments at Stanford, MIT and Harvard and
      affiliations with institutes for advanced study. His honours include the Royal Academy of
      Engineering Silver Medal, the Royal Society Wolfson Research Merit Award and an EPSRC Turing
      AI fellowship. He also founded several technology companies, including Fabula AI, which
      Twitter acquired in 2019. When a new architecture arrives claiming complete novelty, the
      first useful question is often more orderly: which symmetry has it quietly learned to
      respect?
    availability: { wave: frontier, earliestYear: 2019, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
