    version: 1
    historicity: real
    gameOrder: 112
    title: Computing Machinery and Intelligence
    authors: [Alan M. Turing]
    publicationYear: 1950
    venue: Mind
    primarySourceUrl: https://doi.org/10.1093/mind/LIX.236.433
    doi: 10.1093/mind/LIX.236.433
    historicalNote: >-
      Published in 1950, decades before any machine could attempt it. Neolab.ai treats it as the
      founding question the whole research tree is an answer to; the real year is shown prominently.
    education:
      playerSummary: >-
        Turing replaced the unanswerable question "can machines think?" with an operational test: a
        human interrogator, exchanging typed messages, tries to tell a machine from a person. If the
        machine cannot be reliably distinguished, Turing argued, insisting it does not "really" think
        becomes a matter of prejudice rather than science. The paper also anticipates and rebuts nine
        objections that are still argued about today.
      archiveExplanation: >-
        The paper's lasting contribution is not the imitation game itself but the move it makes:
        turning a metaphysical dispute into a behavioural criterion that experiments could, in
        principle, settle. Turing sets aside the question of inner experience and asks only what a
        system can do, a stance that quietly underwrites every benchmark and evaluation the field
        would later build.

        Turing then works through the objections in advance: the theological objection, the
        "heads in the sand" objection, arguments from mathematical limits, from consciousness, and
        from various claimed human exclusives. His replies are careful rather than triumphant, and
        he is candid that the case is not proof. He even sketches machine learning, suggesting it
        might be easier to build a child-machine and educate it than to specify an adult mind
        directly, a paragraph that reads today like a mission statement for the entire industry.

        Neolab.ai places this at the root of the graph. It confers no capability by itself: it is the
        question the laboratory exists to answer, and discovering it sharpens how the lab thinks
        about evidence, evaluation, and what would even count as success.
      insideBaseball: The founding document of the field is a rebuttal to nine objections, which means the discourse was pre-loaded with the discourse.
