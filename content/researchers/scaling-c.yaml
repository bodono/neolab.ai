researchers:
  - id: researcher.percy-liange
    version: 1
    displayName: Percy Liange
    inspirationName: Percy Liang
    inspirationSummary: Stanford computer scientist, CRFM director, and HELM co-creator who makes foundation models answer to broad, reproducible evaluation rather than one flattering score.
    epithet: The Holistic Evaluator
    role: Foundation model evaluation and benchmark design
    rosterCardSummary: "Stanford's foundation-model evaluator, armed with an open leaderboard and the mildly inconvenient belief that accuracy is only one question."
    biography: >-
      Percy Liang made foundation-model evaluation broad enough to be usefully awkward. A Stanford
      computer-science professor and director of the Center for Research on Foundation Models, he
      studies how to make powerful models accessible, reproducible, and understandable. His group
      created HELM, an open framework that runs models through standardised scenarios and reports
      several metrics together: accuracy, calibration, robustness, fairness, bias, toxicity, and
      efficiency. That shared protocol makes comparisons possible without letting a provider choose
      only the benchmark on which its model looks heroic. Liang's earlier work ranges across
      semantics, reasoning, grounding, learning theory, interpretability, and human interaction;
      CodaLab Worksheets extended the same instinct to reproducible computational research. The
      result is an unusually practical form of academic independence: publish the prompts,
      predictions, metrics, and omissions, then let everyone inspect the trade-offs. Percy does not
      object to a very good accuracy number. He merely asks it to bring six colleagues, its
      calibration record, and enough documentation to survive contact with the leaderboard. The
      benchmark remains open enough for others to reproduce.
    availability: { wave: scaling, earliestYear: 2018, poolWeight: 0.55 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 1, optimisationScaling: 2, dataRepresentation: 2, reinforcementAgency: 0, multimodality: 2, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 2, interpretabilityEvals: 5, securityContainment: 1, training: 2, product: 1, management: 4, politics: 3 }
    traits: [trait.holistic-evaluator, trait.academia-as-independent-check]
    signature:
      id: ability.holistic-evaluation-framework
      label: Holistic Evaluation Framework
      eligibleAssignments: [safety-program, capability-program]
      activation: { type: assignment-domain-in, values: [safety.interpretability-evals, domain.reasoning-tools] }
      rampWeeks: 4
      effects:
        - { target: safety.interpretability-evals.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 6 }
    passive:
      id: ability.standardised-cross-provider-benchmarking
      label: Standardised Cross-Provider Benchmarking
      effects:
        - { target: lab.evaluation.cashCost, operation: multiply, value: 0.88 }
    compact:
      id: compact.measure-more-than-accuracy
      label: Measure More Than Accuracy
      requirement: Complete one holistic evaluation covering efficiency, bias, and toxicity every 52 weeks.
      check: { type: tagged-action-within, tags: [holistic-multi-metric-evaluation], weeks: 52 }
      breachEvent: people.compact.measure-more-than-accuracy
    paperHooks:
      ids: [paper.discovering-lm-behaviors-model-written-evals, paper.gpt3-few-shot-learners]
    eventReactions:
      - { triggerTag: benchmark-record, line: "One number on one benchmark is not evaluation. Show me the efficiency, the bias, and the toxicity metrics alongside it." }
      - { triggerTag: model-overconfidence, line: "A holistic evaluation exists precisely so a single flattering number cannot substitute for the whole picture." }
      - { triggerTag: academia-industry-tension, line: "Academia does not need a product roadmap to justify measuring this properly. That is the entire point of the centre." }
    feedLines:
      - Percy's holistic evaluation flagged a bias metric the accuracy leaderboard had never once reported.
      - A model that topped the accuracy leaderboard came in solidly mid-table once the full evaluation suite ran.
      - The cross-provider leaderboard added a new model, and, predictably, a new uncomfortable comparison alongside it.
      - Percy declined to call a launch ready until the toxicity and efficiency numbers sat next to the headline accuracy result.
      - A rival lab quietly adopted the same holistic framework after publicly dismissing it the previous year.
      - The centre's open-source evaluation code got a pull request from a lab it had, that same week, mildly embarrassed.
    portrait:
      assetId: portrait.researcher.percy-liange
      brief: Precise 8-bit editorial portrait; East Asian man with neatly combed short black hair and a calm, thorough expression, beside a multi-metric evaluation dashboard with several bars, not just one; rigorous and independent, not photoreal.
      altText: Pixel-art portrait of Percy Liange beside a multi-metric evaluation dashboard with several distinct bars.
    sources:
