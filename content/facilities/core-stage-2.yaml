  # ---------------------------------------------------------------------------
  # The collaboration ladder. Knowledge diffusion is zero until the lab builds
  # somewhere for people to overhear each other; these three raise it toward
  # its ceiling. They are, in order, the forward pass of a transformer rebuilt
  # as architecture by an organisation that would genuinely rather construct a
  # building than schedule a conversation.
  # ---------------------------------------------------------------------------

  - id: facility.embedding-space
    displayName: The Embedding Space
    family: collaboration
    tier: 3
    cashCostMillions: 200
    operatingCostMillionsPerCycle: 0.9
    durationWeeks: 20
    prerequisiteFacilityIds: [facility.staff-commons-1]
    supportedOwnedGpuCount: 0
    scoreTag: core-tier-3
    tags: [core-tier-3, infrastructure, morale, collaboration, star-slot]
    campusModule: embedding-space-hall
    summary: An open floor where every team's work is projected on the walls, on the theory that people who can see each other's problems occasionally solve them. Named by a researcher who thought it was funny and then could not make anyone stop.
    modifiers:
      - { target: lab.research.diffusionRate, operation: add, value: 0.25 }
      - { target: researcher.departurePressure, operation: multiply, value: 0.9 }

  - id: facility.cross-attention-atrium
    displayName: The Cross-Attention Atrium
    family: collaboration
    tier: 4
    bonusMajorProjectSlots: 1
    cashCostMillions: 1080
    operatingCostMillionsPerCycle: 3
    durationWeeks: 26
    prerequisiteFacilityIds: [facility.embedding-space, facility.headquarters-2]
    supportedOwnedGpuCount: 0
    scoreTag: late-game
    tags: [late-game, infrastructure, collaboration, prestige, star-slot]
    campusModule: cross-attention-atrium
    summary: Six floors of walkways facing inward, so that everyone can attend to everyone else at once. Architecturally magnificent, acoustically a catastrophe, and responsible for more accidental collaborations than the entire seminar programme.
    modifiers:
      - { target: lab.research.diffusionRate, operation: add, value: 0.4 }
      - { target: lab.research.all.output, operation: multiply, value: 1.05 }

  - id: facility.shared-kv-cache
    displayName: The Shared KV Cache
    family: collaboration
    tier: 4
    cashCostMillions: 6000
    operatingCostMillionsPerCycle: 10
    durationWeeks: 34
    prerequisiteFacilityIds: [facility.cross-attention-atrium, facility.data-centre-3]
    supportedOwnedGpuCount: 0
