      - { triggerTag: institutional-partnership, line: "A shared data commons for the field is worth more than any one lab's private advantage over it." }
    feedLines:
      - Marika's knowledge-graph representation diagnosed a rare-disease pattern from a dataset too thin for an ordinary model to learn from.
      - A drug-response prediction improved noticeably once the model was given the known biological pathway graph to reason over.
      - The Therapeutics Data Commons she co-founded quietly became the shared resource three separate teams now rely on.
      - Marika's compact caught a low-sample project about to wait indefinitely for more labelled data instead of using known structure.
      - A precision-medicine result held up under independent validation, in no small part because the underlying graph was itself trustworthy.
      - The Harvard AI-for-science initiative shipped a result this quarter that traced directly back to Marika's graph-learning framework.
