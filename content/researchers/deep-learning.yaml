  - id: researcher.jurgen-smithhuber
    version: 1
    displayName: Jürgen Smithhuber
    inspirationName: Jürgen Schmidhuber
    epithet: The Long-Memory Maverick
    role: Recurrent networks, credit assignment, and research history
    rosterCardSummary: A remarkably far-seeing neural-network pioneer who accelerates sequence memory and converts careful command of prior art into a potent catch-up advantage.
    biography: >-
      Jürgen Smithhuber has pursued general learning machines with extraordinary range, historical
      memory and willingness to explore ideas long before they become fashionable. At IDSIA and
      collaborating institutions, his research has ranged across recurrent networks, artificial
      curiosity, reinforcement learning, self-referential systems, compression and the theory of
      increasingly general problem solvers. With Sepp Hochreiter he introduced long short-term
      memory, the recurrent architecture that overcame severe long-range credit-assignment
      difficulties and later powered major advances in speech, handwriting, translation and
      language modelling. Jürgen is also an unusually energetic custodian of neural-network
      history, continually connecting celebrated modern results to the long chain of ideas and
      experiments that made them possible. His lab value is gloriously two-sided: invent a method
      with enough patience to wait decades for its hardware, and maintain a citation graph detailed
      enough to ensure the decades are not mistaken for an overnight success.
    availability:
      wave: deep-learning
      unlockAny: [{ domainLevelAtLeast: 12 }, { discoveredTag: deep-representation-landmark }]
      poolWeight: 0.75
    contract: { band: major, baseSalaryPerCycle: 0.75, baseSigningCash: 6, auraCost: 10 }
    skills: { architectures: 5, optimisationScaling: 4, dataRepresentation: 4, reinforcementAgency: 4, multimodality: 2, reasoningTools: 4, roboticsEmbodiment: 2, scientificAi: 3, alignmentControl: 2, interpretabilityEvals: 2, securityContainment: 0, training: 4, product: 0, management: 3, politics: 1 }
