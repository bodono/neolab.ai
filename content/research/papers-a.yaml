  - id: paper.adam
    version: 1
    historicity: real
    gameOrder: 13
    title: "Adam: A Method for Stochastic Optimization"
    authors: [Diederik P. Kingma, Jimmy Ba]
    publicationYear: 2015
    venue: International Conference on Learning Representations
    primarySourceUrl: https://arxiv.org/abs/1412.6980
    arxiv: "1412.6980"
    historicalNote: >-
      Posted in 2014 and presented at ICLR 2015, Adam became one of the most widely used
      optimisers in deep learning.
    education:
      playerSummary: >-
        Adam adapts the learning rate of each parameter using moving estimates of the gradient's
        mean and squared magnitude. It is computationally efficient, memory-conscious and often
        works well with limited tuning, especially for noisy or sparse gradients. Adam did not
        make optimisation automatic, but it became a remarkably durable default for training
        neural networks.
      archiveExplanation: >-
        Stochastic gradient descent updates a model using noisy gradients from minibatches. One
        global learning rate may be too large for some parameters and too small for others, and
        the appropriate scale can change during training. Earlier adaptive methods addressed
        parts of this problem but brought their own tradeoffs.

        Kingma and Ba introduced adaptive moment estimation, or Adam. The algorithm maintains an
        exponentially decaying estimate of each parameter's first moment—the mean gradient—and
        second raw moment—the squared gradient. Bias corrections account for the fact that these
        estimates begin at zero. Their ratio supplies a parameter-specific update that combines
        momentum-like direction with adaptive scaling. Adam is straightforward to implement and
        works well with large datasets, sparse gradients and non-stationary objectives.

        No optimiser is universally best. Adam can generalise differently from carefully tuned
        stochastic gradient descent, and later analysis identified limitations in the original
        convergence claims and inspired variants. Its practical influence is nevertheless hard
        to overstate: it reduced the amount of optimiser expertise needed to make a new model
        train at all. Neolab.ai treats that as dependable infrastructure rather than a flashy
        capability jump. Runs become shorter and somewhat less likely to fail technically, but
        alignment, data quality and architecture remain separate problems that a convenient
        optimiser cannot solve.
      insideBaseball: The default optimiser now has default hyperparameters. Entire experimental sections have become 30% shorter.
    domainWeights:
      domain.optimisation-scaling: 0.8
      domain.architectures: 0.20
