  - id: researcher.nick-carlini
    version: 1
    displayName: Nick Carlino
    inspirationName: Nicholas Carlini
    inspirationSummary: Machine-learning security researcher and co-creator of the Carlini–Wagner attack, whose adversarial testing repeatedly turns confident defences into better experiments.
    epithet: The Adversarial Attacker
    role: Adversarial machine learning and AI security research
    rosterCardSummary: The Carlini–Wagner co-creator who treats every undefeated defence as a courteous invitation to improve the threat model.
    biography: >-
      Nicholas Carlini earned his doctorate at UC Berkeley under David Wagner, bringing the habits
      of computer security into machine learning just as
      neural networks were acquiring a much larger attack surface. With Wagner, he developed the
      Carlini–Wagner attack, a family of optimisation-based adversarial-example attacks that became
      a demanding benchmark for proposed defences. Carlini has since worked at Google Brain, Google
      DeepMind and Anthropic on the security and privacy of machine-learning systems. His research
      has broken published adversarial defences, extracted information from models and tested
      whether increasingly capable systems create new forms of attack. The productive part is not
      the headline that something broke; it is the carefully specified threat model and reproducible
      method that let everyone build a stronger defence afterwards. His homepage also hosts compact
      programming and security projects, a useful reminder that technical curiosity scales from
      tiny puzzles to frontier models. A defence earns confidence only after meeting an attacker
      who read the footnotes.
    availability: { wave: frontier, earliestYear: 2021, poolWeight: 0.50 }
    contract: { band: competitive, baseSalaryPerCycle: 0.4, baseSigningCash: 3, auraCost: 5, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 1, optimisationScaling: 1, dataRepresentation: 1, reinforcementAgency: 0, multimodality: 1, reasoningTools: 3, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 1, interpretabilityEvals: 3, securityContainment: 5, training: 1, product: 0, management: 2, politics: 1 }
