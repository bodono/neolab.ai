  - id: paper.feature-visualization
    version: 1
    historicity: real
    gameOrder: 137
    title: Feature Visualization
    authors: [Chris Olah, Alexander Mordvintsev, Ludwig Schubert]
    publicationYear: 2017
    venue: Distill
    primarySourceUrl: https://distill.pub/2017/feature-visualization/
    doi: 10.23915/distill.00007
    historicalNote: >-
      Published in Distill in 2017, this article consolidated activation-maximisation techniques
      into a reference on visualising what individual neurons and channels respond to, and became
      the practical groundwork for the circuits research that followed it.
    education:
      playerSummary: >-
        Feature visualisation generates synthetic images that maximally activate a chosen neuron,
        channel or layer inside a trained vision network, turning an abstract weight matrix into a
        picture a person can look at. Careful regularisation is needed to stop the optimisation
        producing meaningless high-frequency noise. The resulting atlas gave researchers a direct,
        if partial, view of what a network had learned to detect.
      archiveExplanation: >-
        A trained network is a very large table of numbers, and knowing that a unit responds
        strongly to certain inputs does not explain what that unit represents. Olah, Mordvintsev
        and Schubert inverted the usual question: instead of searching a fixed dataset for images a
        unit happens to like, optimise an image from scratch to activate it as strongly as possible.

        Naive gradient ascent on activation produces adversarial-looking noise rather than
        interpretable structure, because a high-dimensional input space contains many directions
        that excite a single unit without resembling anything. The article worked through the
        regularisation, transformation robustness and preconditioning needed to keep the
        optimisation in an interpretable regime, and catalogued how those choices trade against
        each other. That is the contribution: not the idea of maximising an activation, which
        predates it, but a usable recipe and an honest account of its failure modes.

        The images are not a complete explanation. A unit's optimal stimulus can mislead, and later
        work showed meaning often lives in combinations of units rather than any single one. Feature
        visualisation nonetheless handed the field a reusable microscope and a shared vocabulary for
        describing what vision models detect, from edges in early layers to object parts in deeper
        ones. In Neolab.ai it opens activation-based interpretability and strengthens the lab's
        evidence quality, while the structural claims about how features compose into algorithms
        wait for the circuits research it makes possible.
      insideBaseball: The optimiser found what the neuron wants to see. The neuron's taste turns out to be stranger than anyone expected.
    domainWeights:
      safety.interpretability-evals: 0.55
      domain.architectures: 0.25
      domain.multimodality: 0.20
