      label: Textbook Clarity
      effects:
        - { target: lab.research.program.base:domain.reinforcement-agency.weeklyVarianceWidth, operation: multiply, value: 0.90 }
    compact:
      id: compact.general-formalism
      label: General Formalism
      requirement: Complete one open research-charter review every 52 weeks.
      check: { type: tagged-action-within, tags: [open-research-charter], weeks: 52 }
