        to seven times faster pretraining at equal compute, and successfully scaled to
        trillion-parameter models, distilling down to smaller dense models with much of the
        quality gain retained. It demonstrated that sparsity, done simply, could be a genuinely
        practical scaling lever rather than only a theoretical one.

        Sparse models still require careful load-balancing to avoid some experts going unused, and
        the enormous total parameter count demands substantial memory even though compute per
        token stays low. Neolab.ai treats this as a major optimisation-scaling unlock, letting the
        player's largest training runs trade total parameters for compute more favourably.
