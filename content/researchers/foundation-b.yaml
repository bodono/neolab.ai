        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    passive:
      id: ability.the-idea-had-a-second-act
      label: The Idea Had a Second Act
      effects:
        - { target: researcher.moraleTarget, operation: add, value: 4 }
    compact:
      id: compact.a-real-memory-cell
      label: A Real Memory Cell
      requirement: While he leads Architectures, complete one long-range sequence-memory stress test every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: architecture-programme, projectTag: sequence-memory-stress-test, weeks: 52 }
      breachEvent: people.compact.a-real-memory-cell
    paperHooks:
      ids: [paper.long-short-term-memory, paper.sequence-to-sequence]
    eventReactions:
      - { triggerTag: research-fad, line: "The architecture that works quietly for thirty years rarely trends. It is not thereby wrong." }
      - { triggerTag: vanishing-signal, line: "That is the original problem, wearing new clothes. The gates still know what to do with it." }
      - { triggerTag: legacy-architecture-debate, line: "An old idea is not obligated to be finished. Ask it a new question first." }
    feedLines:
      - Sepp redrew the original gating diagram from 1997 and found it still correct.
      - The modernised memory cell trained faster and remembered further. Sepp called this "overdue."
      - A visiting student asked whether recurrence was dead. Sepp asked whether the question was well-posed.
      - The vanishing-gradient problem returned in a new architecture. Sepp recognised it immediately.
      - Sepp's institute produced a scaling curve nobody expected from a "classical" method.
      - The gate values are, once again, doing exactly what they were designed to do three decades ago.
    portrait:
      assetId: portrait.researcher.sepp-hochreitner
      brief: Precise 8-bit editorial portrait; middle-aged white man with glasses and short grey hair, beside a gated memory-cell diagram with a glowing persistent pathway; methodical and quietly proud, not photoreal.
      altText: Pixel-art portrait of Sepp Hochreitner beside a gated memory-cell diagram with a glowing long-range pathway.
