      - Demis Hassabis
    publicationYear: 2015
    venue: Nature
    primarySourceUrl: https://doi.org/10.1038/nature14236
    doi: 10.1038/nature14236
    historicalNote: >-
      The Nature paper appeared in 2015, following a 2013 workshop paper that first presented
      the deep Q-network approach on Atari games.
    education:
      playerSummary: >-
        DQN combined Q-learning with a deep convolutional network so one agent could learn many
        Atari games directly from pixels and scores. Experience replay and a separate target
        network stabilised an otherwise fragile learning process. The result connected visual
        representation learning to sequential decision-making and made general-purpose learned
        agents feel substantially less hypothetical.
      archiveExplanation: >-
        Reinforcement learning asks an agent to choose actions whose consequences may arrive much
        later. Q-learning estimates the long-term value of taking each action in a state, but
        classic versions relied on compact state descriptions or hand-designed features. Atari
        presents raw pixels, delayed rewards and dozens of games with different dynamics.

        Mnih and colleagues trained a convolutional deep Q-network from screen images and game
        scores. Two stabilising ideas were crucial. Experience replay stored transitions and
        sampled them in a shuffled order, reducing harmful correlations in sequential data. A
        target network supplied slower-moving learning targets, preventing the system from
        chasing values that changed at every update. With the same basic architecture and
        hyperparameters, DQN reached human-comparable or better performance on many of 49 games.

        The achievement did not produce one agent that understood games as people do. It was
        data-hungry, could be brittle to small changes, and optimised the provided reward rather
        than an independently understood intention. Those caveats are central to its educational
        value. DQN showed that deep representations and reinforcement learning could work together
        at scale, while foreshadowing the safety problem of capable systems pursuing measurable
        objectives. In the game it unlocks agent training and large product opportunities, but
        also enables reward-hacking events rather than silently equating better scores with better
        judgement.
