    publicationYear: 2019
    venue: Proceedings of NAACL-HLT 2019
    primarySourceUrl: https://arxiv.org/abs/1810.04805
    arxiv: "1810.04805"
    historicalNote: >-
      First posted in 2018 and presented at NAACL-HLT in 2019, BERT popularised deep bidirectional
      pretraining followed by lightweight task-specific fine-tuning.
    education:
      playerSummary: >-
        BERT pretrained a deep transformer to predict randomly masked words using context from
        both directions at once, then fine-tuned the same network for many separate language
        tasks with minimal task-specific machinery. The bidirectional objective produced
        unusually strong general-purpose representations, and the paper's fine-tuning recipe
        set a template that much of applied natural language processing adopted for years.
      archiveExplanation: >-
        Earlier language-model pretraining typically predicted the next word left-to-right,
        which limits a representation to context on one side. Devlin, Chang, Lee and Toutanova
        instead pretrained with a masked-language-modelling objective: some tokens are hidden,
        and the model must predict them using both preceding and following context, together
        with a second objective predicting whether one sentence follows another.

        The resulting bidirectional representations transferred unusually well. A single
        pretrained BERT model could be fine-tuned with an additional output layer to reach
        state-of-the-art results across a wide range of question-answering and language-
        understanding benchmarks, without heavily customised architectures for each task. This
        combination—expensive bidirectional pretraining once, cheap fine-tuning many times—
        became a dominant practical pattern.

        BERT is an encoder-only design; it was not built to generate long free-form text the way
        later decoder-based language models were, and its benchmark-leading results also invited
        scrutiny of what the benchmarks themselves were measuring. Its lasting contribution was
        organisational as much as architectural: it showed that one well-pretrained bidirectional
        transformer could serve as reusable infrastructure across an entire field's evaluation
        suite. In Neolab.ai, BERT strengthens general language understanding and evaluation
        tooling, and meaningfully cheapens every product built by fine-tuning rather than
        training from scratch.
