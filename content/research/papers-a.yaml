    arxiv: "1808.00177"
    historicalNote: >-
      Posted in 2018, this paper trained a robotic hand to reorient objects using reinforcement
      learning entirely in randomised simulation, transferring the resulting policy directly to a
      physical robot with no real-world training.
    education:
      playerSummary: >-
        A robotics team trained a human-like robotic hand to reorient objects held in its palm
        using reinforcement learning run entirely inside a simulated environment whose physical
        properties, such as friction and object appearance, were extensively randomised. The
        resulting policy transferred directly to a physical robot hand despite never having trained
        on the real world, and the hand exhibited humanlike manipulation strategies it was never
        explicitly taught.
      archiveExplanation: >-
        Training dexterous manipulation policies directly on physical robot hardware is slow,
        expensive, and can damage the hardware, while a policy trained purely in one fixed
        simulation typically fails on the real robot because of small, unmodelled differences
        between simulation and reality. This work addressed that gap with domain randomisation:
        rather than training in one carefully matched simulation, the team randomised the
        simulation's physical properties, friction, object dimensions, appearance, and more, across
        an enormous range during training, forcing the learned policy to become robust to exactly
        the kind of variation separating any one simulation from the real world.

        The resulting policy, trained with no human demonstrations and no real-world training
        data at all, transferred successfully to reorienting objects on a physical Shadow Dexterous
        Hand, and the emergent behaviour included humanlike strategies such as finger gaiting and
        controlled use of gravity that the training process never explicitly specified.

        Domain randomisation required an extensive simulation-engineering effort to cover a
        realistic enough range of variation, and the approach's compute cost scaled with how much
        randomisation robustness was required. Neolab.ai treats this as a major
        robotics-embodiment unlock demonstrating sim-to-real transfer as a practical, load-bearing
        technique.
