      - { triggerTag: simulation-transfer, line: "Simulation is a hypothesis about the real world. Test it there before trusting it anywhere else." }
      - { triggerTag: labour-transition-debate, line: "Capability and consequence are two separate questions, and I will not pretend the second one is solved by the first." }
    feedLines:
      - Sergei's fleet logged another ten thousand grasp attempts overnight, mostly successful, all of them useful.
      - The policy trained on real robot data generalised to an object nobody had specifically included.
      - A hand-engineered controller was quietly retired once the learned policy simply performed better.
      - Sergei rejected a beautiful simulation result until it was tested on an actual, uncooperative robot arm.
      - The embodiment programme absorbed another domain's dataset and found it, unexpectedly, useful.
      - A demo failed live. Sergei logged it, smiled slightly, and called it "Tuesday's training data."
