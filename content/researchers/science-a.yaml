  - id: researcher.stephen-boyde
    version: 1
    displayName: Stephen Boyde
    inspirationName: Stephen Boyd
    inspirationSummary: Stanford optimisation professor, textbook author and open-source-tool builder who turns problems into variables, objectives and constraints.
    epithet: The Objective-and-Constraints Evangelist
    role: Convex optimisation, control, and accessible mathematical tooling
    rosterCardSummary: "A Stanford optimisation professor who can turn almost any unruly proposal into three headings: variables, objective, constraints—and would like those headings before lunch."
    biography: >-
      Stephen Boyd has been a Stanford electrical-engineering professor since 1985. His research
      spans control, signal processing, machine learning and finance, connected by the use of
      convex optimisation to expose tractable structure in difficult design problems. With Lieven
      Vandenberghe he wrote Convex Optimization, a standard graduate text whose book, slides and
      exercises are available online. His group also helped create open-source modelling systems
      including CVX and CVXPY, which let users state optimisation problems in mathematical form
      while software handles their conversion for reliable solvers. His teaching has carried the
      same approach across many disciplines and earned Stanford's Walter J. Gores Award. The
      open-source toolchain also includes CVXGEN, used in applications including SpaceX's Falcon
      landing systems. The working ritual is concise enough for a whiteboard and demanding enough
      for a research programme: define the variables, objective and constraints; then find out
      whether the frightening problem was convex all along—and publish notes for other fields.
