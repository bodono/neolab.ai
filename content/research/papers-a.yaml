  - id: paper.flashattention-io-aware
    version: 1
    historicity: real
    gameOrder: 119
    title: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness"
    authors: [Tri Dao, Daniel Y. Fu, Stefano Ermon, Atri Rudra, Christopher Ré]
    publicationYear: 2022
    venue: NeurIPS
    primarySourceUrl: https://arxiv.org/abs/2205.14135
    arxiv: "2205.14135"
    historicalNote: >-
      Posted in 2022, FlashAttention sped up transformer attention and cut its memory use by being
      careful about GPU memory movement, enabling much longer context windows.
    education:
      playerSummary: >-
        Attention is the transformer's core operation, and the standard implementation wasted time
        shuttling a large intermediate matrix back and forth to slow GPU memory. FlashAttention
        computes exactly the same result but reorganises the work to keep data in fast on-chip memory,
        never materialising the full matrix. It is not an approximation: it is the same attention,
        faster and far lighter on memory, which made longer context windows practical.
      archiveExplanation: >-
        The key realisation is that attention on modern hardware is bottlenecked not by arithmetic but
        by memory traffic between the GPU's large slow memory and its small fast memory.
        FlashAttention uses tiling to process attention in blocks that fit in fast memory and a clever
        online softmax to combine blocks without ever writing the giant attention matrix out, cutting
        memory use from quadratic to linear in sequence length while producing bit-for-bit exact
        results.

        Because it is exact, adoption was frictionless: it became a drop-in replacement baked into the
        standard training stacks. The memory savings directly enabled the long-context models that
        followed, and its IO-aware philosophy influenced how the field writes performance-critical
        kernels.

        Neolab.ai treats FlashAttention as a training-and-serving efficiency multiplier that raises
        effective compute and makes longer-context models affordable.
      insideBaseball: The breakthrough was that the numbers were in the wrong drawer. Nobody changed the maths; everyone changed the plumbing.
