researchers:
  - id: researcher.geoffrey-hintoff
    version: 1
    displayName: Geoffrey Hintoff
    inspirationName: Geoffrey Hinton
    inspirationSummary: Deep-learning pioneer whose work on distributed representations and neural networks earned both the Turing Award and a Nobel Prize.
    epithet: The Deep-Learning Long Game
    role: Deep representations and architectures
    rosterCardSummary: A deep-learning pioneer who kept neural networks alive through the unfashionable years and now asks the gradient to justify its travel expenses.
    biography: >-
      Geoffrey Hinton studied experimental psychology at Cambridge and artificial intelligence
      at Edinburgh before pursuing neural networks through decades when the field often preferred
      other approaches. His research includes distributed representations, Boltzmann machines,
      backpropagation, deep belief networks and neural language models. At the University of
      Toronto, he supervised Alex Krizhevsky and Ilya Sutskever during the work that produced
      AlexNet, a landmark result in the 2012 ImageNet competition. He shared the 2018 Turing Award
      with Yoshua Bengio and Yann LeCun for conceptual and engineering advances in deep neural
      networks, and the 2024 Nobel Prize in Physics with John Hopfield for foundational work
      enabling machine learning with artificial neural networks. He later joined Google. His career
      shows that an unfashionable research programme can become infrastructure while the field is
      still carefully composing its formal objections.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.75 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.16, baseSigningCash: 11, auraCost: 17, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 5, reinforcementAgency: 1, multimodality: 5, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 3, alignmentControl: 4, interpretabilityEvals: 3, securityContainment: 0, training: 5, product: 1, management: 4, politics: 2 }
    traits: [trait.intellectual-courage, trait.representation-instinct]
    signature:
      id: ability.deep-representations
      label: Deep Representations
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.architectures] }
      rampWeeks: 4
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    passive:
      id: ability.citation-gravity
      label: Citation Gravity
      effects:
        - { target: aura.worldFirstCapabilityPaperGain, operation: multiply, value: 1.10, stackingGroup: aura-gain }
    compact:
      id: compact.academic-latitude
      label: Academic Latitude
      requirement: Publish at least one of every three discoveries made during his tenure.
      check: { type: ratio-at-least, numerator: discoveries.publishedOrControlled, denominator: discoveries.total, value: 0.333, graceDiscoveries: 2 }
      breachEvent: people.compact.academic-latitude
    paperHooks:
      ids: [paper.backpropagation, paper.fast-deep-belief-nets, paper.alexnet]
    eventReactions:
      - { triggerTag: research-fad, line: "The fashion cycle is informative mainly about the fashion cycle. Keep the experiment running." }
      - { triggerTag: secret-paper, line: "A secret result can protect an advantage. It cannot teach the field that the impossible is possible." }
      - { triggerTag: anomalous-representation, line: "Excellent. The model has learned something we did not name. Now comes the part where we find out what." }
    feedLines:
      - Geoffrey has drawn a latent space on the whiteboard and quietly improved the building's intellectual property value.
      - The representations are distributed. The credit, according to the citations desk, is less evenly so.
      - Geoffrey requested one more controlled experiment and no additional adjectives.
      - A seminar overran by 47 minutes because the first question was unusually good.
      - The architecture team has rediscovered an idea Geoffrey remembers being unpopular twice.
      - Geoffrey described the loss curve as “encouraging,” producing an immediate, unquantified surge in unofficial morale.
    portrait:
      assetId: portrait.researcher.geoffrey-hintoff
      brief: Warm 8-bit editorial portrait; older white man with silver hair, thoughtful expression and a dark collared shirt, beside a small orange gradient diagram; dignified, recognisable in spirit, not photoreal.
      altText: Pixel-art portrait of Geoffrey Hintoff, silver-haired and thoughtful, beside an orange neural-network gradient diagram.
    sources:
      - https://awards.acm.org/about/2018-turing
      - https://www.nobelprize.org/prizes/physics/2024/hinton/facts/
      - https://www.cs.toronto.edu/~hinton/bio.html
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.ian-lemon
    version: 1
    displayName: Yann LeNet
    inspirationName: Yann LeCun
    inspirationSummary: Convolutional-network pioneer who took handwriting recognition from research papers to production cheque readers.
    epithet: The World-Modeller
    role: Vision, self-supervision, and learned world models
    rosterCardSummary: A convolutional-network pioneer who would like the model to learn from the world itself, preferably before anyone commissions another labelling meeting.
    biography: >-
      Yann LeCun trained in electrical engineering and computer science in France before joining
      Bell Labs, where his work on convolutional neural networks helped automate handwriting
      recognition for bank cheques and other documents. He later joined New York University,
      founded its Center for Data Science and became the founding director of Facebook AI
      Research. His research has spanned computer vision, representation learning, energy-based
      models and self-supervised learning, with a recurring emphasis on systems that learn useful
      structure without requiring every example to be labelled. He shared the 2018 Turing Award
      with Geoffrey Hinton and Yoshua Bengio for advances that made deep neural networks a central
      part of computing. The through-line is architectural: exploit structure in the data, test
      the idea at useful scale, and ask the model to understand more of the world than the name on
      the benchmark column.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.75 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.06, baseSigningCash: 10, auraCost: 15, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 5, reinforcementAgency: 2, multimodality: 5, reasoningTools: 4, roboticsEmbodiment: 3, scientificAi: 1, alignmentControl: 2, interpretabilityEvals: 2, securityContainment: 0, training: 4, product: 3, management: 4, politics: 3 }
    traits: [trait.architectural-conviction, trait.open-science-advocate]
    signature:
      id: ability.learn-before-labels
      label: Learn Before the Labels Arrive
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality] }
      rampWeeks: 4
      effects:
        - { target: domain.multimodality.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.open-weights-open-doors
      label: Open Weights, Open Doors
      effects:
        - { target: aura.openPaperModelOrDatasetGain, operation: multiply, value: 1.15, stackingGroup: aura-gain }
    compact:
      id: compact.publication-freedom
      label: Publication Freedom
      requirement: Publish at least one discovery openly every 26 weeks.
      check: { type: tagged-action-within, tags: [open-paper], weeks: 26 }
      breachEvent: people.compact.publication-freedom
    paperHooks:
      ids: [paper.lenet-document-recognition, paper.imagenet-database, paper.alexnet]
    eventReactions:
      - { triggerTag: benchmark-saturation, line: "Good. The benchmark has completed its service. We should now ask a question with more world in it." }
      - { triggerTag: labels-shortage, line: "There are a great many unlabeled observations outside. Most of reality has declined to fill in the form." }
      - { triggerTag: open-model-debate, line: "Openness is a real policy with real tradeoffs. It is not a decorative toggle labelled ‘community.’" }
    feedLines:
      - Yann has replaced three annotation meetings with a self-supervised objective and one much louder architecture meeting.
      - The vision model can identify 1,000 objects. Yann would like it to understand why any of them continue to exist off-camera.
      - A world-model diagram has escaped the whiteboard and occupied the corridor.
      - Yann rejected the phrase “mere perception” on both technical and rhetorical grounds.
      - The dataset arrived without labels. Yann called this “the realistic version.”
      - Open research produced a citation spike and a closed-door discussion about open research.
    portrait:
      assetId: portrait.researcher.ian-lemon
      brief: Energetic 8-bit editorial portrait; older white man with grey hair, dark shirt and expressive eyebrows, framed by blue convolution tiles and a tiny world-model globe; generous and playful, not photoreal.
      altText: Pixel-art portrait of Yann LeNet with grey hair, blue convolution tiles, and a small globe representing a learned world model.
    sources:
      - https://awards.acm.org/about/2018-turing
      - https://yann.lecun.com/ex/bio.html
      - https://doi.org/10.1109/5.726791
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.joshua-benji
    version: 1
    displayName: Joshua Benji
    inspirationName: Yoshua Bengio
    inspirationSummary: Deep-learning pioneer, Mila founder and Turing laureate whose work now also addresses advanced-AI safety and governance.
    epithet: The Dual-Mandate Institution Builder
    role: Deep learning, reasoning, and safety
    rosterCardSummary: A representation-learning pioneer who insists capability and safety belong in the same research plan, however inconvenient that is for the spreadsheet.
    biography: >-
      Yoshua Bengio is a professor at the Université de Montréal and the founder and scientific
      adviser of Mila. His research helped establish deep learning and representation learning,
      including work on neural language models, generative models and distributed
      representations. He shared the 2018 Turing Award with Geoffrey Hinton and Yann LeCun for
      advances that made deep neural networks practical and influential. More recently, his
      research and public work have increasingly addressed the safety and governance of advanced
      artificial intelligence, including the need for scientific evidence, democratic oversight
      and international cooperation. At Montréal, he built Mila from his research group into an
      independent academic institute. The combination is unusually direct: one of the people who helped make
      modern AI work is also asking what institutions and technical methods are needed to keep
      more capable systems under human control.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.70 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.25, baseSigningCash: 12, auraCost: 18, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 5, reinforcementAgency: 2, multimodality: 4, reasoningTools: 5, roboticsEmbodiment: 1, scientificAi: 2, alignmentControl: 5, interpretabilityEvals: 5, securityContainment: 1, training: 4, product: 1, management: 5, politics: 4 }
    traits: [trait.dual-mandate, trait.responsible-disclosure]
    signature:
      id: ability.dual-mandate
      label: Dual Mandate
      eligibleAssignments: [capability-program, safety-program]
      rampWeeks: 4
      effects:
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
        - { target: safety.alignment-control.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    passive:
      id: ability.responsible-disclosure
      label: Responsible Disclosure
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    compact:
      id: compact.safety-floor
      label: Safety Floor
      requirement: Once any model in the lab has a Frontier Estimate of 60 or more (roughly a high-end Tier 4 Tool-Using Agent), keep at least 30% of R&D compute assigned to safety.
      check: { type: conditional-metric-at-least, condition: { metric: lab.model.maxActiveFC, value: 60 }, metric: lab.allocation.rdSafetyShare, value: 0.30 }
      breachEvent: people.compact.safety-floor
    paperHooks:
      ids: [paper.fast-deep-belief-nets, paper.generative-adversarial-nets, paper.neural-attention-translation]
    eventReactions:
      - { triggerTag: safety-budget-cut, line: "We should not describe the future as uncertain and then remove the part of the budget designed to learn about it." }
      - { triggerTag: voluntary-disclosure, line: "Candour is expensive once. Concealment compounds." }
      - { triggerTag: coalition-overture, line: "Cooperation is slower than unilateral action until the moment unilateral action requires everyone else's trust." }
    feedLines:
      - Joshua has submitted a research plan in which capabilities and safety are inconveniently located in the same spreadsheet.
      - A disclosure meeting ended with dented publicity, higher trust, and the rare sensation that accounting captured reality.
      - Joshua asked whether the race has a finish line or merely an externality.
      - Capability and safety now occupy the same budget sheet, which Joshua regards as a promising first contact between the departments.
      - A generative-model seminar concluded with three new experiments and one international institution.
      - Joshua described cooperation as technically demanding, which caused the technical team to become interested.
    portrait:
      assetId: portrait.researcher.joshua-benji
      brief: Thoughtful 8-bit editorial portrait; older white man with curly grey hair and a gentle expression, balanced green capability and safety graphs behind him; humane, scholarly, not photoreal.
      altText: Pixel-art portrait of Joshua Benji with curly grey hair between balanced green capability and safety graphs.
    sources:
      - https://awards.acm.org/about/2018-turing
      - https://mila.quebec/en/directory/yoshua-bengio
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.faye-faye-lee
    version: 1
    displayName: Faye-Faye Lee
    inspirationName: Fei-Fei Li
    inspirationSummary: ImageNet creator and Stanford HAI founding director whose work connects computer vision, medicine, education and human-centred AI.
    epithet: The Human Lens
    role: Computer vision, datasets, and human-centred AI
    rosterCardSummary: The ImageNet institution-builder who reminds the lab that every giant dataset is also a very large collection of human decisions.
    biography: >-
      Fei-Fei Li studied physics at Princeton and electrical engineering at Caltech before
      joining Stanford's computer-science faculty. She created ImageNet and the ImageNet
      Challenge, the large-scale visual dataset and benchmark that became a proving ground for
      major advances in computer vision. Her research has covered object and scene recognition,
      cognitively inspired AI and ambient intelligence for health care. At Stanford she directed
      the Artificial Intelligence Laboratory and became founding director of the Institute for
      Human-Centered Artificial Intelligence. During a Stanford sabbatical, she served as a vice
      president at Google and chief scientist of AI and machine learning at Google Cloud. She also
      co-founded AI4ALL, which works to expand access to AI education. She studies spatial
      intelligence. Her work treats a dataset as more than raw material: its categories,
      annotations and intended use are design decisions, and the people who make those decisions
      are part of the technical system.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.85 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.06, baseSigningCash: 10, auraCost: 15, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 4, optimisationScaling: 2, dataRepresentation: 5, reinforcementAgency: 1, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 3, scientificAi: 5, alignmentControl: 2, interpretabilityEvals: 5, securityContainment: 0, training: 3, product: 3, management: 5, politics: 4 }
    traits: [trait.dataset-institution-builder, trait.human-centred-mentor]
    signature:
      id: ability.dataset-is-an-institution
      label: A Dataset Is an Institution
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality] }
      rampWeeks: 4
      effects:
        - { target: domain.multimodality.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
        - { target: aura.openPaperModelOrDatasetGain, operation: multiply, value: 1.12 }
    passive:
      id: ability.talent-pipeline
      label: People Are Infrastructure
      effects:
        - { target: researcher.moraleTarget, operation: add, value: 4 }
    compact:
      id: compact.data-stewardship
      label: Data Stewardship
      requirement: While she leads Multimodality, renew a funded dataset charter every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: data-programme, projectTag: dataset-charter, weeks: 52 }
      attachedEffects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 3 }
      breachEvent: people.compact.data-stewardship
    paperHooks:
      ids: [paper.imagenet-database, paper.alexnet, paper.word2vec]
    eventReactions:
      - { triggerTag: dataset-shortcut, line: "The model found the easiest signal. Our job was to ensure the easiest signal belonged to the problem." }
      - { triggerTag: annotation-labour, line: "The dataset is not raw material. It is a record of thousands of human judgements." }
      - { triggerTag: medical-opportunity, line: "A promising result becomes medicine only after the clinicians, patients and validation all enter the room." }
    feedLines:
      - Faye-Faye added a dataset charter. The dataset has acquired governance and, unexpectedly, better labels.
      - The vision team requested more images; Faye-Faye requested a better account of where the first images came from.
      - A student seminar produced two recruits and one research direction senior staff had missed.
      - The benchmark is large enough to change the field and documented enough to change the meeting.
      - Faye-Faye connected the robotics, medicine and perception teams with one carefully chosen lunch table.
      - Human-centred AI has again required the presence of humans, delaying the purely automated slide deck.
    portrait:
      assetId: portrait.researcher.faye-faye-lee
      brief: Warm 8-bit editorial portrait; East Asian woman with long dark hair and a confident, generous expression, beside a mosaic of labelled image tiles and a small human silhouette; scholarly and bright, not photoreal.
      altText: Pixel-art portrait of Faye-Faye Lee beside a mosaic of labelled images and a small human figure.
    sources:
      - https://hai.stanford.edu/people/fei-fei-li
      - https://www.image-net.org/static_files/papers/imagenet_cvpr09.pdf
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.andrew-n-gee
    version: 1
    displayName: Andrew N. Gee
    inspirationName: Andrew Ng
    inspirationSummary: Google Brain founder and Coursera co-founder who made machine learning a practical discipline for a global classroom.
    epithet: The Great Translator
    role: Applied ML, products, and education
    rosterCardSummary: An applied-AI builder and educator whose preferred scaling law begins with one clear lesson and ends with a few million people taking it.
    biography: >-
      Andrew Ng is an adjunct professor at Stanford and the founder of DeepLearning.AI and
      Landing AI. He founded and led the Google Brain project, served as chief scientist at
      Baidu, and has worked on machine-learning applications including computer vision, speech
      and autonomous systems. In 2011 he taught Stanford's online machine-learning course to more
      than 100,000 students, an experiment that helped lead to Coursera, which he co-founded.
      Earlier at Stanford, he directed the Artificial Intelligence Laboratory and worked on
      robotics, perception and large-scale unsupervised learning. Across research, education and
      product work, his recurring focus is turning machine learning from a promising demonstration
      into something people can understand, build and deploy. The method is recognisable: explain
      the core idea clearly, identify a useful application, then replace the heroic prototype with
      a repeatable engineering process. The online course showed technical education could
      be engineered for global scale.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 1.00 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.11, baseSigningCash: 10, auraCost: 16, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 5, reinforcementAgency: 2, multimodality: 5, reasoningTools: 3, roboticsEmbodiment: 5, scientificAi: 2, alignmentControl: 2, interpretabilityEvals: 3, securityContainment: 0, training: 4, product: 5, management: 5, politics: 3 }
    traits: [trait.exceptional-educator, trait.applied-instinct]
    signature:
      id: ability.ship-it-responsibly
      label: Ship It Responsibly
      eligibleAssignments: [capability-program, safety-program]
      rampWeeks: 4
      effects:
        - { target: lab.product.durationWeeks, operation: add, value: -1 }
    passive:
      id: ability.everyone-can-learn-this
      label: Everyone Can Learn This
      effects:
        - { target: researcher.moraleTarget, operation: add, value: 3 }
    compact:
      id: compact.teach-the-lab
      label: Teach the Lab
      requirement: Complete one internal machine-learning course every 52 weeks.
      check: { type: tagged-action-within, tags: [internal-course], weeks: 52 }
      fulfilmentEffects:
        - { target: researcher.moraleTarget, operation: add, value: 3 }
      breachEvent: people.compact.teach-the-lab
    paperHooks:
      ids: [paper.lenet-document-recognition, paper.alexnet, paper.deep-q-network]
    eventReactions:
      - { triggerTag: prototype-demo, line: "Wonderful. Now let us discover whether the customer has the same distribution as the demo." }
      - { triggerTag: hiring-bottleneck, line: "Talent is not a fixed natural resource. We can teach more people." }
      - { triggerTag: product-fire, line: "First stabilise the system. Then write the lesson while the lesson is still honest." }
    feedLines:
      - Andrew converted a research notebook into a course and the course into three qualified applicants.
      - The demo works, the checklist exists, and Product has been gently informed these are separate achievements.
      - An internal lecture titled “Machine Learning Yearning, Again” reached standing-room capacity.
      - Andrew found a valuable use case hiding beneath four layers of fashionable terminology.
      - The new cohort completed onboarding cheaper than forecast and considerably more enthusiastically than budgeted.
      - A public explainer earned the lab a wave of public affection and approximately 200,000 ambitious homework submissions.
    portrait:
      assetId: portrait.researcher.andrew-n-gee
      brief: Friendly 8-bit editorial portrait; East Asian man with short dark hair and an open smile, in front of a chalkboard that connects a neural network to a small deployed product; welcoming and crisp, not photoreal.
      altText: Pixel-art portrait of Andrew N. Gee before a chalkboard linking a neural network diagram to a deployed product.
    sources:
      - https://hai.stanford.edu/people/andrew-ng
      - https://www.coursera.org/about/leadership
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.geoff-deen
    version: 1
    displayName: Geoff Deen
    inspirationName: Jeff Dean
    inspirationSummary: Google systems architect behind MapReduce, Bigtable, Spanner, TensorFlow and the infrastructure that lets ambitious models fit on real machines.
    epithet: The Systems Architect
    role: Distributed systems and ML infrastructure
    rosterCardSummary: A distributed-systems architect who finds the bottleneck everyone else had promoted to a law of physics.
    biography: >-
      Jeff Dean joined Google in 1999 and helped design systems that made web-scale computation
      practical. His work includes MapReduce for large distributed data-processing jobs, Bigtable
      for structured storage and Spanner for globally distributed databases. He later helped
      start Google Brain, contributed to the DistBelief and TensorFlow machine-learning systems,
      and worked on Pathways and Google's tensor-processing units. These projects turned difficult
      infrastructure problems into reusable platforms that other researchers and engineers could
      build on. MapReduce also inspired external systems including Hadoop, while Bigtable and
      Spanner became production foundations for Google services. The effect is leverage
      rather than spectacle: a cleaner abstraction, storage system or accelerator stack lets
      thousands of people attempt experiments that were previously too slow, unreliable or
      expensive. The magic trick is usually a profiler trace, a reusable abstraction and a calm
      explanation of why the cluster was waiting.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.65 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.11, baseSigningCash: 10, auraCost: 16, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 4, reinforcementAgency: 1, multimodality: 4, reasoningTools: 3, roboticsEmbodiment: 1, scientificAi: 3, alignmentControl: 2, interpretabilityEvals: 1, securityContainment: 5, training: 5, product: 4, management: 5, politics: 1 }
    traits: [trait.warehouse-scale-thinking, trait.bottleneck-instinct]
    signature:
      id: ability.cluster-is-the-algorithm
      label: The Cluster Is the Algorithm
      eligibleAssignments: [capability-program, safety-program]
      rampWeeks: 4
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.05, stackingGroup: gpu-throughput }
    passive:
      id: ability.build-once-scale-twice
      label: Build Once, Scale Twice
      effects:
        - { target: lab.compute.ownedPowerCost, operation: multiply, value: 0.9 }
    compact:
      id: compact.serious-infrastructure
      label: Serious Infrastructure
      requirement: Complete Data Centre I within 26 weeks of hiring.
      cadence: one-time
      check: { type: facility-owned-within, facility: facility.data-centre-1, weeks: 26 }
      breachEvent: people.compact.serious-infrastructure
    paperHooks:
      ids: [paper.word2vec, paper.sparse-mixture-of-experts, paper.transformer]
    eventReactions:
      - { triggerTag: cluster-outage, line: "Good news: the failure is deterministic. Better news: it will shortly be someone else's abstraction." }
      - { triggerTag: compute-shortage, line: "Before buying another building, may I remove the part where half the building waits for the other half?" }
      - { triggerTag: scaling-proposal, line: "The architecture diagram is excellent. Please add the network, power, memory and laws of thermodynamics." }
    feedLines:
      - Geoff removed a synchronisation barrier and conjured meaningfully more compute without alarming Procurement.
      - The cluster has been renamed after the service that keeps it from becoming several smaller clusters.
      - A systems review found the algorithm waiting politely for the network.
      - Geoff drew the new data centre from memory; Facilities requested the version containing doors.
      - Training throughput rose after a three-line change no one is yet willing to describe as infrastructure policy.
      - The incident postmortem is blameless, precise and quietly devastating to the previous architecture.
    portrait:
      assetId: portrait.researcher.geoff-deen
      brief: Calm 8-bit editorial portrait; tall white man with short brown hair and glasses, surrounded by orderly purple server racks and a tiny green throughput graph; quietly formidable, not photoreal.
      altText: Pixel-art portrait of Geoff Deen with glasses among orderly server racks and a rising throughput graph.
    sources:
      - https://research.google/people/jeff/
      - https://research.google/pubs/mapreduce-simplified-data-processing-on-large-clusters/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.david-sterling
    version: 1
    displayName: David Sterling
    inspirationName: David Silver
    inspirationSummary: Reinforcement-learning researcher who led AlphaGo, AlphaGo Zero and AlphaZero through search, self-play and increasingly general game mastery.
    epithet: The Self-Play Strategist
    role: Reinforcement learning, planning, and games
    rosterCardSummary: The self-play strategist behind AlphaGo and AlphaZero, building leagues in which the model's most useful opponent is yesterday's model.
    biography: >-
      David Silver completed a doctorate in reinforcement learning at the University of Alberta
      under Richard Sutton before joining DeepMind in 2013. There he led a programme combining
      reinforcement learning, planning, deep neural networks and self-play. He was a lead researcher on
      AlphaGo, which defeated leading professional Go players, and on AlphaGo Zero, which learned
      Go from self-play without human game data. AlphaZero extended the approach to chess and
