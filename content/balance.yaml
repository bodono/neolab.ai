# GDD section 29.4. Multipliers become sourced modifiers on the run.
difficulties:
  - id: difficulty.fellowship
    displayName: Fellowship
    revenueMultiplier: 1.20
    fixedCostMultiplier: 0.85
    rivalProgressMultiplier: 0.85
    incidentPressureMultiplier: 0.75
    displayedEstimateQualityBonus: 8
  - id: difficulty.standard
    displayName: Standard
    revenueMultiplier: 1.00
    fixedCostMultiplier: 1.00
    rivalProgressMultiplier: 1.00
    incidentPressureMultiplier: 1.00
    displayedEstimateQualityBonus: 0
  - id: difficulty.frontier
    displayName: Frontier
    revenueMultiplier: 0.92
    fixedCostMultiplier: 1.00
    rivalProgressMultiplier: 1.12
    incidentPressureMultiplier: 1.15
    displayedEstimateQualityBonus: -5
  - id: difficulty.unhinged-scaling
    displayName: Unhinged Scaling
    revenueMultiplier: 0.88
    fixedCostMultiplier: 1.00
    rivalProgressMultiplier: 1.25
    incidentPressureMultiplier: 1.30
    displayedEstimateQualityBonus: 0

# GDD section 29.1. An early emphasis, not a permanent class.
mandates:
  - id: mandate.build-the-science
    displayName: Build the Science
    effects:
      - { target: lab.research.capabilityInfrastructure, operation: add, value: 12 }
      - { target: lab.paper.extraCandidatesRevealed, operation: add, value: 1 }
      - { target: lab.market.startingDemand, operation: multiply, value: 0.80 }
  - id: mandate.build-the-business
    displayName: Build the Business
    effects:
      - { target: lab.finance.cash.starting, operation: add, value: 6.0 }
      - { target: lab.contracts.starterContract, operation: add, value: 1 }
      - { target: lab.culture.safety.starting, operation: add, value: -8 }
  - id: mandate.build-it-right
    displayName: Build It Right
    effects:
      - { target: lab.culture.safety.starting, operation: add, value: 10 }
      - { target: lab.evals.quality.starting, operation: add, value: 8 }
      - { target: lab.politics.governmentTrust.starting, operation: add, value: 5 }
      - { target: lab.compute.workloadThroughput, operation: multiply, value: 0.90 }
