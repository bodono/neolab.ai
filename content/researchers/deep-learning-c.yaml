  - id: researcher.nando-de-freita
    version: 1
    displayName: Nando de Freita
    inspirationName: Nando de Freitas
    inspirationSummary: Bayesian optimisation researcher and former Oxford, UBC, Google DeepMind, and Microsoft AI leader whose work spans inference and generative models.
    epithet: The Bayesian Generalist
    role: Bayesian optimisation, generative modelling, and research leadership
    rosterCardSummary: A Bayesian optimisation researcher whose academic and industrial leadership connects efficient search, generative modelling, and applied AI.
    biography: >-
      Nando de Freitas treats an expensive experiment as a reason to choose the next experiment
      carefully. Nando de Freitas earned his doctorate at Cambridge, completed postdoctoral work
      with Stuart Russell at UC Berkeley, and held professorships at the University of British
      Columbia and Oxford. His Oxford biography records work in Bayesian inference, optimisation,
      and deep learning, as well as co-founding Dark Blue Labs, which Google acquired before he
      joined DeepMind. He began his training at the University of the Witwatersrand in South
      Africa. He later became a vice president at Microsoft AI. Across academic and industrial
      research, his work has connected probabilistic modelling and Bayesian optimisation with
      neural and generative systems. The practical lesson is direct: when evaluations cost serious
      compute, use the results to choose the next point rather than decorating a grid. Nando is
      perfectly willing to search widely; he simply prefers that the search remember what it
      learned.
    availability: { wave: deep-learning, earliestYear: 2014, poolWeight: 0.50 }
