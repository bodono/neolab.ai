  - id: researcher.been-kimm
    version: 1
    displayName: Been Kimm
    inspirationName: Been Kim
    inspirationSummary: Google DeepMind director, interpretability researcher and TCAV co-creator who makes neural-network decisions explainable through human concepts rather than raw features.
    epithet: The Concept Translator
    role: Interpretability and human-AI communication
    rosterCardSummary: The TCAV co-creator who lets people question a model in concepts they recognise instead of requesting directions to neuron 47,219.
    biography: >-
      Been Kim is a director and principal scientist at Google DeepMind focused on interpretability:
      methods for understanding models and models designed to be interpretable from the start. She
      earned master’s and doctoral degrees at MIT. With Martin Wattenberg, Justin Gilmer, Carrie Cai,
      James Wexler, Fernanda Viégas and Rory Sayres, Kim developed Testing with Concept Activation
      Vectors, or TCAV. The method tests how sensitive a model’s prediction is to a
      human-understandable concept represented by examples, offering an explanation at a level such
      as “striped” or “wheeled” rather than at the level of individual pixels or neurons. Her wider
      work studies concept-based explanations, human-centred evaluation and the scientific
      foundations needed to say that an explanation is useful. Kim has also served the Women in
      Machine Learning community and taught interpretability tutorials at major conferences for
      wider audiences. A
      saliency map may be colourful, but her work asks whether the person making the decision can
      actually use what it says.
