  - id: researcher.quoc-v-lee
    version: 1
    displayName: Quoc V. Lee
    inspirationName: Quoc V. Le
    inspirationSummary: Google researcher whose work spans large-scale unsupervised learning, sequence-to-sequence models, neural architecture search, and efficient AutoML.
    epithet: The Automated Architect
    role: Neural architecture search and large-scale unsupervised learning
    rosterCardSummary: A Google researcher who helped teach machines to propose neural architectures, then worked to make the search cheaper and the resulting models stronger.
    biography: >-
      Quoc V. Le asks whether the architecture meeting can itself become a learning problem. Quoc
      V. Le completed his Stanford doctorate with Andrew Ng and joined Google Research, where his research
      has covered large-scale unsupervised learning, sequence modelling, computer vision, and
      automated machine learning. With Ilya Sutskever and Oriol Vinyals, he co-authored
      sequence-to-sequence learning for neural translation. With Barret Zoph, he developed neural
      architecture search using reinforcement learning to generate candidate architectures; later
      work explored weight sharing and other ways to reduce search cost. Google's research record
      also includes his work on large-scale neural simulations and efficient mixture-of-experts
      systems. His earlier work used large-scale neural simulations to learn image concepts from
      unlabelled frames sampled from YouTube videos. Across that body of work, Le treats
      architecture choice as a learning problem: automate enough of the search to make instinct
      compete against evidence. Quoc still attends the meeting, but the search tree gets the first
      proposal.
    availability: { wave: deep-learning, earliestYear: 2016, poolWeight: 0.55 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 3, reinforcementAgency: 2, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 0, securityContainment: 0, training: 4, product: 2, management: 3, politics: 1 }
    traits: [trait.automate-the-design-loop, trait.prolific-scale-builder]
    signature:
      id: ability.neural-architecture-search
      label: Neural Architecture Search
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.architectures, domain.optimisation-scaling] }
      rampWeeks: 4
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.weight-sharing-search-efficiency
      label: Weight-Sharing Search Efficiency
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.04 }
    compact:
      id: compact.let-the-search-decide
      label: Let the Search Decide
      requirement: While he leads Architectures, complete one automated-search baseline comparison every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: architecture-programme, projectTag: automated-search-baseline, weeks: 52 }
      breachEvent: people.compact.let-the-search-decide
    paperHooks:
      ids: [paper.sequence-to-sequence, paper.switch-transformers]
    eventReactions:
      - { triggerTag: architecture-fad, line: "Let the search process propose a hundred variants before a human commits to one by instinct." }
      - { triggerTag: compute-windfall, line: "More compute means a wider architecture search, not just a bigger fixed model. Spend some of it there." }
      - { triggerTag: scaling-proposal, line: "The search found this shape reliably reused across three separate tasks. That is a stronger signal than one good benchmark." }
    feedLines:
      - Quoc's search process proposed an architecture nobody on the team would have hand-designed, and it worked.
      - The weight-sharing search finished in a fraction of the compute the naive version would have needed.
      - A hand-tuned architecture lost, again, to whatever the automated search process proposed overnight.
      - Quoc's sequence-to-sequence framework quietly still underpins the translation pipeline three architectures later.
      - A founding-era Google Brain habit, running the search before trusting the instinct, is still house style here.
      - The search space grew by one more dimension, and somewhere a GPU cluster's night got noticeably busier.
    portrait:
      assetId: portrait.researcher.quoc-v-lee
      brief: Focused 8-bit editorial portrait; Vietnamese man with short dark hair and a calm, methodical expression, beside a neural architecture search tree branching into candidate designs; automated and prolific, not photoreal.
      altText: Pixel-art portrait of Quoc V. Lee beside a neural architecture search tree branching into candidate designs.
    sources:
      - https://research.google/people/quocle/
      - https://ai.stanford.edu/~quocle/
      - https://arxiv.org/abs/1611.01578
      - https://arxiv.org/abs/1802.03268
      - https://research.google/blog/using-machine-learning-to-explore-neural-network-architecture/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: audited, tone: audited, reviewedOn: 2026-07-29 }

  - id: researcher.sammy-benji
    version: 1
    displayName: Sammy Benji
    inspirationName: Samy Bengio
    inspirationSummary: Torch co-author and former Google Brain research leader whose career spans machine learning, open-source tools, evaluation, and research management.
    epithet: The Open-Source Steward
    role: Machine learning research leadership and open-source tooling
    rosterCardSummary: A Torch co-author and long-serving research leader who strengthens evaluation culture and keeps useful scientific tools open.
    biography: >-
      Samy Bengio arrives with an evaluation checklist and enough open-source history to ask who
      will maintain the tooling after the paper. Samy Bengio earned his doctorate at the University
      of Montréal and co-authored Torch, an early machine-learning library built around a scripting
      language and C implementations. His personal and EPFL biographies describe research across
      neural networks, representation learning, speech, vision, and sequence modelling, as well as
      leadership of a large part of Google Brain and later work as a senior director of machine
      learning research at Apple. They also record extensive service as an editor and conference
      organiser, including programme-chair and general-chair roles at NeurIPS. He remains an adjunct
      professor at EPFL in Lausanne. Those contributions share an emphasis on verifiable research
      practice: build tools other researchers can inspect, evaluate claims before celebrating them,
      and keep the research organisation legible enough that scientific disagreement can improve
      the work. Samy's preferred headline is still a reproducible result.
    availability: { wave: deep-learning, earliestYear: 2016, poolWeight: 0.50 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.11, baseSigningCash: 10, auraCost: 16, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 3, reinforcementAgency: 2, multimodality: 2, reasoningTools: 4, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 5, interpretabilityEvals: 5, securityContainment: 2, training: 3, product: 2, management: 4, politics: 3 }
    traits: [trait.principled-dissent, trait.replication-discipline]
    signature:
      id: ability.rigorous-evaluation-culture
      label: Rigorous Evaluation Culture
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.optimisation-scaling, safety.interpretability-evals] }
      rampWeeks: 4
      effects:
        - { target: safety.interpretability-evals.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 5 }
    passive:
      id: ability.open-source-tooling-legacy
      label: Open-Source Tooling Legacy
      effects:
        - { target: aura.openPaperModelOrDatasetGain, operation: multiply, value: 1.15 }
    compact:
      id: compact.principled-dissent-when-warranted
      label: Principled Dissent When Warranted
      requirement: Complete one independent responsible-AI culture review every 52 weeks.
      check: { type: tagged-action-within, tags: [responsible-ai-culture-review], weeks: 52 }
      breachEvent: people.compact.principled-dissent-when-warranted
    paperHooks:
      ids: [paper.dropout, paper.masked-autoencoders]
    eventReactions:
      - { triggerTag: safety-budget-cut, line: "If evaluation is optional when the budget tightens, it was never part of the research plan. Put it back." }
      - { triggerTag: benchmark-record, line: "Has anyone outside this building reproduced it yet? Until then, treat the number as a rumour." }
      - { triggerTag: employee-dismissal-dispute, line: "Document the decision, the process, and the appeal. Research culture is also an experimental system." }
    feedLines:
      - Sammy asked whether the headline result had been independently reproduced, and the celebration paused briefly.
      - An open-source tool from years ago quietly kept an entire pipeline running without anyone noticing its age.
      - A researcher raised a responsible-AI concern in a meeting, and Sammy made sure it stayed on the agenda.
      - The evaluation protocol got one layer more rigorous, and one optimistic benchmark claim got one layer more honest.
      - Sammy opened the old tooling repository and found three modern pipelines still depending on it.
      - An editorial discussion ended with a clearer evaluation protocol and considerably fewer confident adjectives.
    portrait:
      assetId: portrait.researcher.sammy-benji
      brief: Steady 8-bit editorial portrait; man with grey-flecked hair and a serious, principled expression, beside an evaluation checklist with one item circled twice; deliberate and unhurried, not photoreal.
      altText: Pixel-art portrait of Sammy Benji beside an evaluation checklist with one item circled twice.
    sources:
