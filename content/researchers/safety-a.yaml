        - { target: lab.incident.hazard, operation: multiply, value: 0.90, stackingGroup: hazard-reduction }
    passive:
      id: ability.undefeated-defence-scepticism
      label: Undefeated Defence Scepticism
      effects:
        - { target: lab.evaluation.cashCost, operation: multiply, value: 0.92 }
    compact:
      id: compact.break-it-before-someone-else-does
      label: Break It Before Someone Else Does
      requirement: Complete one internal red-team attack every 52 weeks.
      check: { type: tagged-action-within, tags: [internal-red-team-attack], weeks: 52 }
      breachEvent: people.compact.break-it-before-someone-else-does
    paperHooks:
      ids: [paper.red-teaming-language-models, paper.constitutional-ai-harmlessness]
    eventReactions:
      - { triggerTag: jailbreak-viral, line: "Someone found this before we did. That is the actual failure, not the jailbreak itself." }
      - { triggerTag: security-breach, line: "Assume a technically excellent, patient attacker, and test against that, not against a casual one." }
      - { triggerTag: model-overconfidence, line: "An undefeated defence has usually just not been attacked by someone determined enough yet. I would like to try." }
    feedLines:
      - Nick's attack broke a defence the team had, until that morning, considered genuinely solid.
      - A published robustness claim survived exactly as long as it took Nick's team to actually sit down and attack it.
      - Nick's internal red team found the exploit weeks before it would otherwise have surfaced publicly, and rather more politely.
      - A defence Nick could not break within a week earned, for the first time in a while, his genuine and specific praise.
      - The security review found a gap between "no attack has succeeded yet" and "no determined attack has been tried."
      - Nick's namesake attack, years old now, is still the first thing a new defence gets measured against.
    portrait:
      assetId: portrait.researcher.nick-carlini
      brief: Sharp, methodical 8-bit editorial portrait; man with a focused, slightly mischievous expression, beside a defended model with one small crack found precisely where nobody had looked; exacting and relentless, not photoreal.
      altText: Pixel-art portrait of Nick Carlino beside a defended model with a small crack found precisely where nobody looked.
    sources:
