    rosterCardSummary: The AI-debate co-author who asks whether a human judge can still identify the better argument when both advocates are much smarter than the judge.
    biography: >-
      Geoffrey Irving designs oversight for the uncomfortable case where the systems being judged
      are more capable than the judge. After work in computational physics, computer graphics, and
      software, he led OpenAI's Reflection Team and co-authored "AI Safety via Debate" with Paul
      Christiano and Dario Amodei. The proposal has two agents argue opposing sides before a human,
      using competition to expose facts or flaws that the judge could not efficiently discover
      alone. Irving later led Google DeepMind's Scalable Alignment Team, working on AGI and
      language-model safety. He then moved into government, joining the United Kingdom's AI Safety
      Institute—now the AI Security Institute—and is its chief scientist. That route from
      laboratory protocol to public institution suits the research question: scalable oversight
      depends not only on a loss function, but on who runs the evaluation and who can act on
      its result. Geoffrey's debate has a referee, an evidence standard, and no assumption
      that eloquence equals truth. The smarter the advocates become, the more the judging
      rules need to be written.
