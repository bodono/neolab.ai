      and a way to propagate error information backwards through differentiable systems. He
      connected that machinery to learning and adaptive dynamic programming; the work later
      became part of the documented history of backpropagation. His subsequent career ranged from
      official econometric forecasting at the United States Department of Energy to many years as
      a programme director at the National Science Foundation. There he supported research on
      neural networks, intelligent control, adaptive systems and related areas that were not
      always at the peak of their fashion cycle. He also continued developing approximate dynamic
      programming and recurrent-learning methods. The historical record of backpropagation has
      several independent strands, but his thesis makes one point unusually clear: important
      ingredients can be written down long before the field has the compute, vocabulary or
      appetite to recognise them. The IEEE gave him its Neural Network Pioneer Award in 1995.
