      - id: fight
        labelKey: event.finance.authors-lawsuit.fight.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -5 }
        previewKey: event.finance.authors-lawsuit.fight.preview
        immediateEffects: []
        checks:
          - id: fair-use-ruling
            likelihoodPromise: { label: unlikely, successOutcomeIds: [upheld] }
            outcomes:
              - id: upheld
                minimumInclusive: 0
                maximumExclusive: 0.3
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 10 }
                  - { kind: add-modifier, target: lab.fundraising.offerCash, operation: multiply, value: 1.05, durationWeeks: 26, tags: [investor-mood] }
                memories:
                  - key: finance.authors-lawsuit.won
                    subjects: [{ type: player-lab }]
                    tags: [litigated, fair-use-win]
              - id: rejected
                minimumInclusive: 0.3
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -15 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 5 }
                memories:
                  - key: finance.authors-lawsuit.lost
                    subjects: [{ type: player-lab }]
                    tags: [litigated, fair-use-loss]
        memories: []
        confirmationRequired: false
      - id: purge
        labelKey: event.finance.authors-lawsuit.purge.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.finance.authors-lawsuit.purge.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [purged-books] }
          - { kind: set-flag, subject: { type: player-lab }, flag: "society:purged-books", value: true }
        checks:
          - id: court-view
            likelihoodPromise: { label: uncertain, successOutcomeIds: [mitigated] }
            outcomes:
              - id: mitigated
                minimumInclusive: 0
                maximumExclusive: 0.45
                effects: []
                memories:
