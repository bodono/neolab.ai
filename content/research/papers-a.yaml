    title: Neural Machine Translation by Jointly Learning to Align and Translate
    authors: [Dzmitry Bahdanau, Kyunghyun Cho, Yoshua Bengio]
    publicationYear: 2015
    venue: International Conference on Learning Representations
    primarySourceUrl: https://arxiv.org/abs/1409.0473
    arxiv: "1409.0473"
    historicalNote: >-
      First posted in 2014 and presented at ICLR 2015, this paper introduced a learned soft
      alignment mechanism that became known as attention.
    education:
      playerSummary: >-
        Instead of forcing an entire source sentence through one fixed-length vector, this model
        let the decoder look back at the most relevant encoder states for each generated word.
        The learned soft alignment improved translation and made the model's shifting focus
        partly visible. Attention began as a remedy for an encoder-decoder bottleneck and became
        a central organising idea in modern AI.
      archiveExplanation: >-
        Early neural machine translation compressed a whole source sentence into one vector
        before decoding began. That vector had to preserve every detail needed for every output
        word, so performance deteriorated on longer sentences. Bahdanau, Cho and Bengio replaced
        the bottleneck with a learned, differentiable search over the encoder's sequence of
        representations.

        At each decoding step, the model computes soft weights indicating which source positions
        are relevant, combines their representations into a context vector, and uses that context
        to predict the next target word. The whole mechanism trains jointly with translation.
        Visualising the weights produced plausible word alignments, although attention weights
        should not automatically be treated as complete causal explanations of a model's decision.

        The paper's impact travelled far beyond translation. Attention offered a flexible way to
        retrieve information from a set of representations and focus computation conditionally.
        Researchers applied it to captioning, speech, memory and eventually self-attention, where
        positions in one sequence attend to other positions in that same sequence. The transformer
        later discarded recurrence almost entirely and built its architecture around attention.
        Neolab.ai keeps these steps separate: this discovery improves sequence products and
        creates interpretable-looking alignment maps, but the much larger parallel-computation
        payoff requires the later transformer paper.
