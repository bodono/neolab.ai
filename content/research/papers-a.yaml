    primarySourceUrl: https://arxiv.org/abs/1503.02531
    arxiv: "1503.02531"
    historicalNote: >-
      Posted in 2015, knowledge distillation showed how to transfer the behaviour of a large,
      expensive model into a small, cheap one, a technique now central to shipping models.
    education:
      playerSummary: >-
        Distillation trains a small "student" model to imitate a large "teacher" model, not just by
        copying the teacher's final answers but by matching the teacher's full distribution of
        confidences across all options. Those soft probabilities carry extra information, how the
        teacher weighs the runners-up, and learning from them lets a compact student capture much of
        a huge model's competence at a fraction of the serving cost.
      archiveExplanation: >-
        The insight is that a trained model's output over wrong answers is not garbage but a rich
        signal: a good digit classifier that assigns a 7 a small probability of being a 1 has encoded
        a real similarity. Training the student against these softened targets transfers that dark
        knowledge, so the student generalises better than one trained on hard labels alone.

        The practical consequence is enormous. Distillation decoupled the model you train from the
        model you serve, letting labs pour compute into a giant teacher and then ship a small,
        fast, cheap student to users. It underpins mobile deployment, model compression, and the
        common modern pattern of using a frontier model to generate training signal for smaller ones.

        Neolab.ai treats distillation as a deployment and efficiency multiplier: it lowers the
        compute cost of serving capable models and unlocks the compress-and-ship production pattern.
      insideBaseball: The wrong answers turned out to be where the teacher kept the good stuff. Every leaderboard immediately grew a much smaller sibling.
