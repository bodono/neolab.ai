  - id: researcher.daphne-kohler
    version: 1
    displayName: Daphne Kohler
    inspirationName: Daphne Koller
    inspirationSummary: Stanford graphical-model pioneer, Coursera co-founder, and insitro founder and CEO applying machine learning to drug discovery and development.
    epithet: The Bayes-to-Biotech Founder
    role: Probabilistic machine learning applied to biomedicine
    rosterCardSummary: A graphical-model pioneer who co-founded Coursera, then founded insitro to make machine learning answer drug-discovery questions rather than another benchmark.
    biography: >-
      Daphne Koller is a Stanford computer scientist, MacArthur Fellow and pioneer of probabilistic
      graphical models who carried machine learning into biology, education and drug discovery.
      After eighteen years on Stanford's faculty, she co-founded Coursera, whose online courses
      reached more than one hundred million learners. She later served as chief computing officer
      at Calico and founded insitro, where she is CEO and applies machine learning to discovering and
      developing medicines. The connecting idea is uncertainty: graphical models represent
      relationships among uncertain variables; biological data presents exactly that kind of
      tangled evidence. Her biography records more than 300 refereed publications and honours
      spanning computer science, biology and engineering. The work does not promise that every
      prediction will be right; it makes each one explicit enough to test, informative enough to
      revise, and attached to a dataset whose provenance survives the meeting.
    availability: { wave: frontier, earliestYear: 2019, poolWeight: 0.45 }
    contract: { band: major, baseSalaryPerCycle: 0.82, baseSigningCash: 8, auraCost: 12, overrideExplanation: Priced on overall measured research strength. }
