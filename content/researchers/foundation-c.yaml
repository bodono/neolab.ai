  - id: researcher.david-bley
    version: 1
    displayName: David Bley
    inspirationName: David Blei
    inspirationSummary: The latent Dirichlet allocation co-creator who made unlabelled document collections reveal their topics through probabilistic modelling.
    epithet: The Topic Cartographer
    role: Probabilistic topic modelling and Bayesian machine learning
    rosterCardSummary: The latent Dirichlet allocation co-creator who made unlabelled document collections reveal their topics through probabilistic modelling.
    biography: >-
      David Blei earned his doctorate at UC Berkeley, taught at Princeton from 2006 to 2014, and now
      holds a joint professorship in computer science and statistics at Columbia. With Andrew Ng and
      Michael I. Jordan he developed latent Dirichlet allocation, a probabilistic model that finds
      latent topics in a collection and represents each document as a mixture of them, without
      requiring topic labels in advance. LDA became a standard method for organising text and later
      informed applications in recommendation, genomics, images, and the social sciences. That work
      made the hidden structure explicit enough to inspect: documents contain topic proportions,
      topics contain word distributions, and inference estimates both. David later developed online
      variational inference, using minibatch updates to fit probabilistic models that would
      otherwise be stranded at small scale forever. David also developed scalable
      variational-inference methods for fitting rich probabilistic models to massive datasets. A
      pile of documents enters; a legible generative story about what they discuss comes out.
    availability: { wave: foundation, earliestYear: 2014, poolWeight: 0.55 }
    contract: { band: competitive, baseSalaryPerCycle: 0.49, baseSigningCash: 4, auraCost: 6, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 2, dataRepresentation: 5, reinforcementAgency: 0, multimodality: 2, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 0, interpretabilityEvals: 5, securityContainment: 0, training: 2, product: 1, management: 3, politics: 1 }
    traits: [trait.legible-generative-story, trait.topic-cartographer]
    signature:
      id: ability.latent-topic-discovery
      label: Latent Topic Discovery
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.reasoning-tools] }
      rampWeeks: 4
      effects:
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    passive:
      id: ability.human-legible-generative-model
      label: Human-Legible Generative Model
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 3 }
    compact:
      id: compact.a-model-a-domain-expert-can-read
      label: A Model a Domain Expert Can Read
      requirement: Complete one non-technical domain-expert review of a topic model every 52 weeks.
      check: { type: tagged-action-within, tags: [domain-expert-review], weeks: 52 }
      breachEvent: people.compact.a-model-a-domain-expert-can-read
    paperHooks:
      ids: [paper.variational-autoencoder, paper.retrieval-augmented-generation]
    eventReactions:
      - { triggerTag: interpretability-breakthrough, line: "Can a domain expert, not a machine-learning researcher, follow this generative story? If not, we are not done." }
      - { triggerTag: benchmark-saturation, line: "A better perplexity score is not the same as a more legible topic. Check which one actually improved." }
      - { triggerTag: dataset-shortcut, line: "The topics look suspiciously clean. Check whether the corpus was quietly curated to produce them." }
    feedLines:
      - David's latent topic model surfaced a theme in the corpus nobody on the team had noticed reading it manually.
      - A domain expert reviewed the topic model's output and, unusually, had almost nothing to correct.
      - The generative story behind the model fit on one slide, and David treated that as the actual achievement.
      - A student's more complex topic model scored higher and explained less, and David sent it back for revision.
      - David's model found the same latent structure in two completely unrelated document collections.
      - The joint statistics-and-computer-science appointment keeps producing exactly the arguments you would expect.
