      deep-learning team lead at Google DeepMind, and Google identifies him as a co-technical lead
      of Gemini. The path from sentences to imperfect-information strategy games to multimodal
      models is broad, but coherent: represent the problem faithfully, learn its dependencies, and
      scale the system that can act on them. Oriol's build order simply happens to begin with an
      encoder, a decoder, and enough compute to reach the late game. He has repeatedly turned
      methods from one domain into foundations for entirely different ones.
