      uniform network substantially improved image recognition, and became one of the most cited
      papers in the field.
    education:
      playerSummary: >-
        VGG made a simple, influential argument: build depth out of many small, identical 3x3
        convolution layers rather than a few large ones. Two stacked 3x3 filters see as much as one
        5x5 filter but with fewer parameters and more nonlinearity, and repeating this into a very
        deep, monotonous stack produced markedly better image recognition. Its regular design made it
        the default feature extractor for years.
      archiveExplanation: >-
        The paper's contribution is disciplined uniformity. By fixing the filter size at 3x3 and
        simply going deeper, VGG isolated depth as the variable that mattered and demonstrated its
        benefit cleanly. The resulting architecture was almost boringly regular, which is precisely
        why it travelled: its intermediate features transferred well to countless other tasks, and
        for years "use VGG features" was a reasonable first move for any vision problem.

        VGG also exposed the costs of naive depth. Its parameter count and memory footprint were
        heavy, motivating later work on more efficient architectures and on the degradation problem
        that residual networks would solve. As a stepping stone between AlexNet and ResNet it is
        pivotal, and its citation count reflects how much subsequent work built directly on it.

        Neolab.ai treats VGG as an architecture multiplier for vision and a prerequisite that
        strengthens the lab's image work and its transferable feature backbones.
