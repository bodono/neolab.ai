    eventReactions:
      - { triggerTag: scientific-ai-failure, line: "Check whether the model was made to learn a symmetry the physics already hands you for free." }
      - { triggerTag: architecture-fad, line: "An architecture that respects the problem's structure needs less data to learn the same thing. Prefer it." }
      - { triggerTag: benchmark-record, line: "A physicist would ask what invariance this result respects before believing the number." }
    feedLines:
      - Max encoded a known physical symmetry directly into the architecture, and the model needed noticeably less data.
      - The variational autoencoder's descendant, several generations removed, still traces back to his original derivation.
      - A graph neural network Max reviewed was quietly leaking translation invariance it should have respected exactly.
      - Max's equivariant layer treated a rotated input exactly as it should, without anyone telling it to.
      - A physics postdoc joined the team and remarked, approvingly, that the group still thinks in symmetries first.
      - The Distinguished Scientist title barely registers with Max next to a cleanly derived variational bound.
