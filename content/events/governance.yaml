draftSchema: 1
contentType: decision-events
pack: governance-a

# Security, misuse and governance: the decisions where a lab's interests and
# the world's diverge. Two flag chains:
# - Publishing binding thresholds (if-then commitments) makes the biology
#   uplift dilemma reachable without strong evals and three times likelier,
#   and retires the commitments event.
# - Signing the pause letter without pausing makes the right-to-warn demand
#   reachable at any culture level and three times likelier.
events:
  - id: event.rival.open-weights
    version: 1
    category: rival
    severity: decision
    phase: frontier
    trigger: { kind: opportunity }
    prerequisites: { type: compare, metric: player.ai.frontierCapability, op: gte, value: 35 }
    baseWeight: 5
    weightModifiers:
      - predicate: { type: compare, metric: player.aura.spendable, op: lt, value: 20 }
        multiplier: 2
      - predicate: { type: compare, metric: player.incidents.recentCount, op: gte, value: 1 }
        multiplier: 0.5
    cooldown: { group: governance-open-weights, weeks: 78 }
    unique: false
    expiryWeeks: 8
    defaultOptionId: keep-closed
    titleKey: event.rival.open-weights.title
    bodyKey: event.rival.open-weights.body
    educationKey: event.rival.open-weights.education
    evidence:
      - textKey: event.rival.open-weights.evidence.aura
        metric: player.aura.spendable
      - textKey: event.rival.open-weights.evidence.attention
        metric: player.politics.governmentAttention
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: staged-release
        labelKey: event.rival.open-weights.staged.label
        # Affordability is checked against the era-scaled cost.
        requirements: { type: always }
        disabledReasonKey: event.rival.open-weights.staged.disabled
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -3 }
        previewKey: event.rival.open-weights.staged.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 5 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 3 }
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 2 }
          - { kind: add-modifier, target: lab.research.all.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [staged-release] }
        checks: []
        memories:
          - key: governance.open-weights.staged
            subjects: [{ type: player-lab }]
            tags: [open-weights, staged-release]
        confirmationRequired: false
      - id: keep-closed
        labelKey: event.rival.open-weights.closed.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.rival.open-weights.closed.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 2 }
          - { kind: add-modifier, target: researcher.moraleTarget, operation: add, value: -3, durationWeeks: 26, tags: [weights-kept-closed] }
        checks: []
        memories:
          - key: governance.open-weights.closed
            subjects: [{ type: player-lab }]
            tags: [open-weights, kept-closed]
        confirmationRequired: false
      - id: full-release
        labelKey: event.rival.open-weights.full.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.rival.open-weights.full.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 15 }
          - { kind: add-modifier, target: lab.research.all.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [open-weights-community] }
          - { kind: add-modifier, target: researcher.moraleTarget, operation: add, value: 3, durationWeeks: 26, tags: [open-weights-community] }
          - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 0.95, durationWeeks: 26, tags: [open-weights-cannibalised] }
          - { kind: add-modifier, target: world.rival.progress, operation: multiply, value: 1.10, durationWeeks: 52, tags: [open-weights-diffusion] }
        checks:
          - id: misuse
            likelihoodPromise: { label: likely, successOutcomeIds: [quiet] }
            outcomes:
              - id: quiet
                minimumInclusive: 0
                maximumExclusive: 0.7
                effects: []
                memories:
                  - key: governance.open-weights.quiet
                    subjects: [{ type: player-lab }]
                    tags: [open-weights]
              - id: misuse-traced
                minimumInclusive: 0.7
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -10, auraChangeKind: loss }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 10 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -5 }
                memories:
                  - key: governance.open-weights.misuse-traced
                    subjects: [{ type: player-lab }]
                    tags: [open-weights, misuse, scandal]
        memories:
          - key: governance.open-weights.released
            subjects: [{ type: player-lab }]
            tags: [open-weights, irreversible]
        confirmationRequired: true
    followUps: []
    telemetryTags: [governance, open-weights, misuse, diffusion]

  - id: event.safety.uplift-eval
    version: 1
    category: safety
    severity: decision
    phase: frontier
    trigger: { kind: opportunity }
    # Only a lab that measures, or has promised to, finds out it cannot rule
    # this out. Chain: if-then commitments -> binding thresholds.
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 65 }
        - { type: any, items: [{ type: has-flag, flag: governance:published-binding-thresholds }, { type: compare, metric: player.safety.evalQuality, op: gte, value: 15 }] }
    baseWeight: 6
    weightModifiers:
      - predicate: { type: has-flag, flag: "governance:published-binding-thresholds" }
        multiplier: 3
    cooldown: { group: governance-uplift-eval, weeks: 78 }
    unique: false
    expiryWeeks: 8
    defaultOptionId: vetted-access
    titleKey: event.safety.uplift-eval.title
    bodyKey: event.safety.uplift-eval.body
    educationKey: event.safety.uplift-eval.education
    evidence:
      - textKey: event.safety.uplift-eval.evidence.evals
        metric: player.safety.evalQuality
      - textKey: event.safety.uplift-eval.evidence.culture
        metric: player.safety.safetyCulture
    tokenBindings:
      - { token: AI, source: player-ai-name }
    options:
      - id: strict-safeguards
        labelKey: event.safety.uplift-eval.strict.label
        # Affordability is checked against the era-scaled cost.
        requirements: { type: always }
        disabledReasonKey: event.safety.uplift-eval.strict.disabled
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -5 }
        previewKey: event.safety.uplift-eval.strict.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [alignment-tax] }
          - { kind: add-modifier, target: serving.computePerRequest, operation: multiply, value: 1.10, durationWeeks: 26, tags: [bio-safeguards] }
          - { kind: add-modifier, target: lab.revenue.all, operation: multiply, value: 0.95, durationWeeks: 26, tags: [bio-safeguards] }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.90, durationWeeks: 52, tags: [bio-safeguards] }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 5 }
          - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: 4 }
        checks: []
        memories:
          - key: governance.uplift-eval.strict
            subjects: [{ type: player-lab }]
            tags: [bio-risk, safeguards, precaution]
        confirmationRequired: false
      - id: vetted-access
        labelKey: event.safety.uplift-eval.vetted.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.safety.uplift-eval.vetted.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.market.demandCeiling, operation: multiply, value: 0.95, durationWeeks: 26, tags: [vetted-access] }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.95, durationWeeks: 26, tags: [vetted-access] }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 2 }
        checks: []
        memories:
          - key: governance.uplift-eval.vetted
            subjects: [{ type: player-lab }]
            tags: [bio-risk, access-control]
        confirmationRequired: false
      - id: ship-and-test
        labelKey: event.safety.uplift-eval.ship.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.safety.uplift-eval.ship.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.market.acquisitionRate, operation: multiply, value: 1.10, durationWeeks: 26, tags: [shipped-past-uplift-eval] }
          - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: -4 }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.10, durationWeeks: 39, tags: [shipped-past-uplift-eval] }
        checks:
          - id: outside-evaluation
            likelihoodPromise: { label: uncertain, successOutcomeIds: [unexamined] }
            outcomes:
              - id: unexamined
                minimumInclusive: 0
                maximumExclusive: 0.6
                effects: []
                memories:
                  - key: governance.uplift-eval.unexamined
                    subjects: [{ type: player-lab }]
                    tags: [bio-risk, shipped-anyway]
              - id: flagged-publicly
                minimumInclusive: 0.6
                maximumExclusive: 1
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 10 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -10 }
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -10, auraChangeKind: loss }
                memories:
                  - key: governance.uplift-eval.flagged
                    subjects: [{ type: player-lab }]
                    tags: [bio-risk, shipped-anyway, scandal]
        memories:
          - key: governance.uplift-eval.shipped
            subjects: [{ type: player-lab }]
            tags: [bio-risk, shipped-anyway, ignored-warning]
        confirmationRequired: true
    followUps: []
    telemetryTags: [governance, safety, bio-risk, evaluation]

