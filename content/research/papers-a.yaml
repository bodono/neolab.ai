      playerSummary: >-
        Ramesh and colleagues trained a transformer to autoregressively model a single combined
        sequence of text tokens followed by image tokens, so that generating an image from a
        caption became the same kind of next-token prediction the model already did for text. Given
        enough data and scale, the resulting system, DALL-E, produced plausible, often creative
        images for captions it had never specifically been trained to illustrate.
      archiveExplanation: >-
        Earlier text-to-image systems tended to be domain-specific, trained on narrow datasets with
        specialised architectures for each visual domain. Ramesh and colleagues instead compressed
        images into a sequence of discrete tokens using a separately trained image tokeniser, then
        trained an autoregressive transformer to model text tokens and image tokens as a single
        combined sequence, treating text-to-image generation as nothing more exotic than sequence
        continuation.

