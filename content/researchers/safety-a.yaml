  - id: researcher.neel-nandy
    version: 1
    displayName: Neel Nandy
    inspirationName: Neel Nanda
    inspirationSummary: Mechanistic-interpretability researcher who created TransformerLens and leads Google DeepMind’s effort to reverse-engineer learned algorithms inside neural networks.
    epithet: The Circuit Reverse-Engineer
    role: Mechanistic interpretability tooling and reverse engineering
    rosterCardSummary: The TransformerLens creator who wants every mysterious activation promoted into a named, testable algorithm with decent documentation.
    biography: >-
      Neel Nanda studied pure mathematics at Cambridge, worked in quantitative finance and then
      spent a year testing routes into AI safety. That exploration included internships
      at the Future of Humanity Institute, Google DeepMind and the Center for Human-Compatible AI.
      He later joined Anthropic, working on language-model interpretability with Chris Olah, and
      leads Google DeepMind’s mechanistic-interpretability team. Nanda created TransformerLens, an
      open-source library that exposes the internal activations of transformer language models and
      makes controlled interventions easier to run. He has also published
      teaching material, work on progress measures for grokking and research on sparse
      autoencoders. The goal is more ambitious than producing a colourful activation map: recover
      the actual algorithms and structures a network learned, name them and test whether that
      account predicts what the model does. TransformerLens made that style of investigation
      available to a much wider research community. In mechanistic interpretability, even a tensor
      is expected to explain what it was doing.
    availability: { wave: frontier, earliestYear: 2022, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.4, baseSigningCash: 3, auraCost: 5, overrideExplanation: Priced on overall measured research strength. }
