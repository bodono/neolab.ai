    biography: >-
      Cynthia Rudin has made a rigorous career from a plain demand: when decisions are high-stakes,
      use models people can understand. She is Duke University's Distinguished Professor of
      Computer Science and directs its Interpretable Machine Learning Lab, with appointments
      spanning computing, engineering, statistics, mathematics, and biostatistics. Her group builds
      sparse decision trees, scoring systems, interpretable neural networks, and matching methods
      that expose their reasoning while retaining competitive accuracy. The applications are
      consequential rather than decorative—healthcare, criminal justice, electrical-grid
      reliability, materials science, and causal inference. Rudin has shown repeatedly that an
      opaque model is not always the price of strong performance, and argues that post-hoc
      explanations can mislead precisely where accountability matters most. The work earned
      AAAI's 2022 Squirrel AI Award for Artificial Intelligence for the Benefit of Humanity and
      IJCAI's 2025 John McCarthy Award. Cynthia does not oppose complexity; she opposes making it
      somebody else's problem. Her preferred model arrives with its reasoning visible, not with a
      black box and a reassuring diagram drawn afterward. It lets practitioners inspect rules
      before those rules affect lives.
