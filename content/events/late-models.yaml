draftSchema: 1
contentType: decision-events
pack: late-models

# Late-game decisions for a lab whose models have reached the Autonomous
# Researcher tier (FC 65+: models that run research with little supervision)
# and the General Problem Solver tier (FC 80+: near-AGI, broadly competent):
# research nobody can review in time, a model that wants to keep shop, chips it
# designed itself, copies that may be passing notes, a request for legal
# standing and a model that wins every argument. Each fires once.
events:
  # --- Research: faster than its reviewers ----------------------------------
  - id: event.research.automated-researcher
    version: 1
    category: research
    severity: decision
    phase: any
    trigger: { kind: opportunity }
    prerequisites: { type: compare, metric: player.ai.frontierCapability, op: gte, value: 65 }
    baseWeight: 7
    # A lab with weak practical control is likelier to have let review slide.
    weightModifiers:
      - predicate:
          { type: compare, metric: player.safety.practicalControl, op: lt, value: 50 }
        multiplier: 2
    cooldown: { group: late-models-automated-researcher, weeks: 26 }
    unique: true
    expiryWeeks: 10
    defaultOptionId: review-sample
    titleKey: event.research.automated-researcher.title
    bodyKey: event.research.automated-researcher.body
    educationKey: event.research.automated-researcher.education
    evidence:
      - textKey: event.research.automated-researcher.evidence.control
        metric: player.safety.practicalControl
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: human-pace
        labelKey: event.research.automated-researcher.human-pace.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.automated-researcher.human-pace.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.90, durationWeeks: 26, tags: [human-review] }
          - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: 5 }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.95, durationWeeks: 52, tags: [human-review] }
        checks: []
        memories:
          - key: late-models.automated-researcher.human-pace
            subjects: [{ type: player-lab }]
            tags: [human-review, safety-first]
        confirmationRequired: false
      - id: review-sample
        labelKey: event.research.automated-researcher.sample.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.automated-researcher.sample.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 13, tags: [sampled-review] }
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 3 }
        checks:
          - id: sample-catches
            likelihoodPromise: { label: likely, successOutcomeIds: [representative] }
            outcomes:
              - id: representative
                minimumInclusive: 0
                maximumExclusive: 0.7
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: 2 }
                memories:
                  - key: late-models.automated-researcher.sampled
                    subjects: [{ type: player-lab }]
                    tags: [sampled-review]
              - id: missed
                minimumInclusive: 0.7
                maximumExclusive: 1
                effects:
                  - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.05, durationWeeks: 26, tags: [sampled-review] }
                memories:
                  - key: late-models.automated-researcher.sample-missed
                    subjects: [{ type: player-lab }]
                    tags: [sampled-review, missed-flaw]
        memories: []
        confirmationRequired: false
      - id: let-it-run
        labelKey: event.research.automated-researcher.run.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.automated-researcher.run.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.10, durationWeeks: 26, tags: [unreviewed-research] }
          - { kind: add-rating, subject: { type: player-lab }, rating: safetyCulture, amount: -3 }
          - kind: schedule-effects
            dueInWeeks: 26
            effects:
              - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: -5 }
              - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.15, durationWeeks: 39, tags: [unreviewed-research] }
        checks: []
        memories:
          - key: late-models.automated-researcher.let-run
            subjects: [{ type: player-lab }]
            tags: [unreviewed-research, oversight-lapsed]
        confirmationRequired: true
    followUps: []
    telemetryTags: [late-models, research, automated-research, oversight]

  # --- Market: the model that wants to keep shop ----------------------------
  - id: event.market.ai-shopkeeper
    version: 1
    category: market
    severity: decision
    phase: any
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 65 }
        - { type: compare, metric: player.ai.launched, op: eq, value: 1 }
