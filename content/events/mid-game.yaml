          - key: mid-game.poisoned-dataset.dropped
            subjects: [{ type: player-lab }]
            tags: [partial-fix]
        confirmationRequired: false
      - id: train-as-scraped
        labelKey: event.security.poisoned-dataset.train.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.security.poisoned-dataset.train.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [unverified-data] }
        checks:
          - id: what-they-host
            likelihoodPromise: { label: uncertain, successOutcomeIds: [harmless] }
            outcomes:
              - id: harmless
                minimumInclusive: 0
                maximumExclusive: 0.5
                effects: []
                memories:
                  - key: mid-game.poisoned-dataset.trained-clean
                    subjects: [{ type: player-lab }]
                    tags: [unverified-data]
              - id: poisoned
                minimumInclusive: 0.5
                maximumExclusive: 1
                effects:
                  - kind: schedule-effects
                    dueInWeeks: 26
                    effects:
                      - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.10, durationWeeks: 39, tags: [poisoned-data] }
                      - { kind: add-modifier, target: lab.training.technicalFailureHazard, operation: multiply, value: 1.10, durationWeeks: 26, tags: [poisoned-data] }
                memories:
                  - key: mid-game.poisoned-dataset.trained-poisoned
                    subjects: [{ type: player-lab }]
                    tags: [unverified-data, poisoned-data]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [mid-game, security, data-poisoning, datasets]

