  - id: researcher.pushmeet-kohly
    version: 1
    displayName: Pushmeet Kohly
    inspirationName: Pushmeet Kohli
    inspirationSummary: Google DeepMind vice president and Google Cloud chief scientist who founded AI for Science and leads work spanning proteins, materials, mathematics, software, and cybersecurity.
    epithet: The Lab-Within-the-Lab Builder
    role: AI for scientific discovery and research leadership
    rosterCardSummary: A research vice president who answered “perhaps we should do more AI for science” by building a lab within the lab—with proteins, materials, proofs, and a roadmap.
    biography: >-
      Pushmeet Kohli builds research organisations around AI for science. Pushmeet Kohli spent a
      decade at Microsoft Research, becoming Director of Research for the Cognition group, before
      joining Google DeepMind. He founded and leads its AI for Science and Strategic Initiatives
      unit and is now a Google DeepMind Vice President of Research and Chief Scientist of Google
      Cloud. The unit works across biology, materials, fusion, mathematics, software, and
      cybersecurity; its portfolio includes AlphaFold, AlphaGenome, AlphaProof, AlphaProteo,
      SynthID, AlphaCode, AlphaEvolve, and AI Co-Scientist. AlphaFold's success also led to the
      creation of Isomorphic Labs. The 2024 Nobel Prize in Chemistry recognised Demis Hassabis and
      John Jumper's AlphaFold work in protein-structure prediction; its paper accumulated more than
      40,000 citations. Kohli himself received the Sullivan Doctoral Thesis Award and was named to TIME's
      2023 list of the 100 most influential people in AI. Earlier, Kohli led
      work on robust and verified AI, adversarial testing, robust learning, and formal verification.
      The lab-within-the-lab epithet is less metaphor than org chart: when a scientific field looks
      ready for AI, Pushmeet's answer is a dedicated team, a roadmap, and enough institutional
      weight that it cannot become somebody's Friday-afternoon side project.
    availability: { wave: frontier, earliestYear: 2020, poolWeight: 0.40 }
