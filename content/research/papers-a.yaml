  - id: paper.transformer
    version: 1
    historicity: real
    gameOrder: 19
    title: Attention Is All You Need
    authors: [Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan N. Gomez, Łukasz Kaiser, Illia Polosukhin]
    publicationYear: 2017
    venue: Advances in Neural Information Processing Systems 30
    primarySourceUrl: https://papers.nips.cc/paper_files/paper/2017/hash/3f5ee243547dee91fbd053c1c4a845aa-Abstract.html
    historicalNote: >-
      The 2017 paper introduced the transformer for machine translation. Its wider dominance in
      language, vision, audio and multimodal AI emerged through extensive subsequent work.
    education:
      playerSummary: >-
        The transformer replaced recurrent sequence processing with stacked self-attention and
        feed-forward layers. Every position could directly combine information from other
        positions, while training across a sequence became highly parallel. The original results
        were in translation; the architecture's scalability later made it the foundation of
        large language models and much of modern generative AI.
      archiveExplanation: >-
        Recurrent networks process tokens in order, which makes their computation inherently
        sequential and creates long paths between distant parts of a sentence. Attention had
        already let decoders retrieve information from encoder states. Vaswani and colleagues
        asked whether an architecture could rely on attention throughout and dispense with
        recurrence and convolution entirely.

        The transformer uses self-attention so each position builds a weighted combination of
        other positions. Multiple heads can represent different relationships in parallel.
        Position information is added separately because the attention operation itself does not
        know token order. Stacked with feed-forward layers, residual connections and normalisation,
        the design achieved excellent translation quality while training much more parallelly
        than recurrent alternatives.

        The 2017 paper did not itself contain today's chatbots or prove that scaling would yield
        every later capability. Subsequent work combined transformers with self-supervised
        objectives, enormous datasets, much larger compute, instruction tuning, human feedback,
        retrieval and tools. The architecture was unusually compatible with that scale, which
        made its historical consequences enormous. Neolab.ai gives the transformer a major Aura
        reward and unlocks the modern scaling branch, but the player must still fund the data,
        infrastructure, evaluations and safety work that turn an elegant translation model into
        a frontier system.
      insideBaseball: Recurrence has been removed. The weekly architecture meeting remains sequential and cannot be parallelised.
    domainWeights:
      domain.architectures: 0.6
      domain.optimisation-scaling: 0.25
