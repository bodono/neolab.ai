    compact:
      id: compact.biology-grade-validation
      label: Biology-Grade Validation
      requirement: Complete one wet-lab or clinical validation review every 52 weeks.
      check: { type: tagged-action-within, tags: [wet-lab-validation], weeks: 52 }
      breachEvent: people.compact.biology-grade-validation
    paperHooks:
      ids: [paper.alphafold2-protein-structure, paper.adaptive-oncogene-silencing-platform]
    eventReactions:
      - { triggerTag: drug-discovery-breakthrough, line: "A promising model prediction and a validated therapeutic are two different milestones. Celebrate the one we actually reached." }
      - { triggerTag: scientific-ai-failure, line: "The model was wrong in a specific, informative way. Find out which assumption it corrects." }
      - { triggerTag: academia-industry-tension, line: "I did not leave the tenured chair to move slower. The validation standard does not get to move slower either." }
    feedLines:
      - Daphne's probabilistic model flagged a compound worth testing that a simpler heuristic had missed entirely.
      - A wet-lab result came back and, true to her compact, the announcement waited for exactly that.
      - The graphical model's failure mode pointed straight at an assumption about protein folding worth revisiting.
      - Daphne reviewed a drug-discovery pipeline and asked, first, what the model was still uncertain about.
      - A former student's paper cited her decades-old probabilistic-inference framework, applied to an entirely new disease.
      - The MacArthur citation sits in a drawer. The validated result sits on the company's homepage instead.
    portrait:
