capabilityDomains:
  - id: domain.architectures
    name: Architectures
    shortName: Architectures
    description: The structures that determine how models represent, route, remember, and transform information.
    colour: "#ff8a35"
    levelCostMultiplier: 1.0
  - id: domain.optimisation-scaling
    name: Optimisation and Scaling
    shortName: Optimisation
    description: Training algorithms, scaling methods, distributed computation, and techniques that turn resources into reliable progress.
    colour: "#ee6cae"
    levelCostMultiplier: 0.92
  - id: domain.reinforcement-agency
    name: Reinforcement Learning and Agency
    shortName: RL and Agency
    description: Learning through action, reward, planning, exploration, self-play, and increasingly autonomous behaviour.
    colour: "#5bc77b"
    levelCostMultiplier: 1.08
  - id: domain.multimodality
    name: Vision, Audio, and Multimodality
    shortName: Multimodality
    description: Perception and generation across images, audio, video, language, and combinations of modalities.
    colour: "#3699f6"
    levelCostMultiplier: 0.96
  - id: domain.reasoning-tools
    name: Reasoning and Tool Use
    shortName: Reasoning
    description: Multi-step problem solving, structured search, language-mediated reasoning, and the use of external tools.
    colour: "#efc14e"
    levelCostMultiplier: 1.04
  - id: domain.robotics-embodiment
    name: Robotics and Embodiment
    shortName: Robotics
    description: Learning in the physical world through control, imitation, adaptation, sensing, and interaction.
    colour: "#32b7ae"
    levelCostMultiplier: 1.2
  - id: domain.scientific-ai
    name: Scientific AI
    shortName: Scientific AI
    description: AI methods for modelling nature, proposing hypotheses, designing experiments, and accelerating discovery.
    colour: "#dd5f63"
    levelCostMultiplier: 1.14

safetyPrograms:
  - id: safety.alignment-control
    name: Alignment and Control
    description: Training objectives, oversight, corrigibility, control protocols, and methods for keeping powerful systems directed toward intended ends.
    colour: "#59c97c"
    levelCostMultiplier: 1.02
    outputModifierTarget: lab.research.alignment.output
  - id: safety.interpretability-evals
    name: Interpretability and Evals
    description: Understanding model internals and building measurements that can reveal capability, deception, bias, and dangerous behaviour.
    colour: "#4ea7ef"
    levelCostMultiplier: 1.0
    outputModifierTarget: lab.research.interpretability.output
  - id: safety.security-containment
    name: Security and Containment
    description: Access control, sandboxing, red teaming, incident response, model-weight security, and barriers to unauthorised action.
    colour: "#ae7ee8"
    levelCostMultiplier: 0.98
    outputModifierTarget: lab.research.security.output

