    inspirationSummary: Computational-neuroscience pioneer who co-invented Boltzmann machines and helped NETtalk learn text-to-speech from examples.
    epithet: The Brain as Existence Proof
    role: Computational neuroscience and physics-inspired learning
    rosterCardSummary: Co-invented the Boltzmann machine, helped a network learn to read aloud and keeps pointing at biology's inconvenient working prototype.
    biography: >-
      Terrence Sejnowski works at the boundary between neuroscience and machine learning. With
      Geoffrey Hinton he helped develop the Boltzmann machine, a stochastic recurrent network
      whose learning rule drew on statistical physics and allowed hidden units to acquire internal
      representations. With Charles Rosenberg he developed NETtalk, which learned to convert
      English text into speech from examples and made its training progress audible. He later
      contributed to independent-component analysis and other computational methods used in
      neuroscience. Sejnowski directs the Computational Neurobiology Laboratory at the Salk
      Institute, holds the Francis Crick Chair there and serves as Distinguished Professor at the
      University of California, San Diego. His work treats biological intelligence as a source of
      testable computational questions rather than a decorative metaphor. He was also the
      founding editor-in-chief of Neural Computation and has helped shape the NeurIPS research
      community. The brain remains the inconvenient working example in every architecture review.
