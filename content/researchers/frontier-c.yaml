  - id: researcher.tim-rocktaschel
    version: 1
    displayName: Tim Rocktaschel
    inspirationName: Tim Rocktäschel
    inspirationSummary: Google DeepMind's Open-Endedness Team Lead and a UCL professor whose research spans reinforcement-learning agents, rapid adaptation, open-ended environments, and self-improving AI.
    epithet: The Open-Ended Explorer
    role: Open-ended learning, reinforcement-learning agents, and self-improvement
    rosterCardSummary: An agent researcher who would rather build a world that keeps inventing new tests than celebrate mastering the last benchmark.
    biography: >-
      Tim Rocktäschel studies how an AI can keep finding new problems after a fixed benchmark has
      run out of surprises. He is Director, Principal Scientist, and Open-Endedness Team Lead at
      Google DeepMind, as well as Professor of Artificial Intelligence at University College
      London. At UCL he led the Deciding, Acting, and Reasoning with Knowledge lab; earlier work
      took him through reinforcement-learning research at Oxford and research leadership at Meta
      AI. His research connects open-ended environment design, general reinforcement-learning
      agents, world models, language, and rapid adaptation. Systems including the Adaptive Agent
      programme were trained across large spaces of embodied tasks so that they could adapt to
      unfamiliar problems on a human timescale. The larger ambition is recursive in the useful and
      alarming sense: build agents and environments that continually produce new capabilities,
      discoveries, and tests rather than merely optimising one frozen score. Tim's recurring
      question is therefore not whether an agent won the benchmark, but whether it learned a method
      that will still work after the benchmark designer has run out of ideas.
    availability: { wave: frontier, earliestYear: 2021, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.52, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 3, optimisationScaling: 2, dataRepresentation: 3, reinforcementAgency: 5, multimodality: 2, reasoningTools: 4, roboticsEmbodiment: 4, scientificAi: 2, alignmentControl: 2, interpretabilityEvals: 3, securityContainment: 0, training: 3, product: 1, management: 4, politics: 2 }
    traits: [trait.open-ended-experimenter, trait.agent-generalisation-rigour]
    signature:
      id: ability.open-ended-agent-curricula
      label: Open-Ended Agent Curricula
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.reinforcement-agency, domain.robotics-embodiment] }
      rampWeeks: 5
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: domain.robotics-embodiment.researchOutput, operation: multiply, value: 1.03, stackingGroup: programme-rp }
    passive:
      id: ability.rapid-adaptation-evaluation
      label: Rapid Adaptation Evaluation
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    compact:
      id: compact.test-beyond-the-training-distribution
      label: Test Beyond the Training Distribution
      requirement: Once frontier capability reaches 40, complete a dangerous-capability evaluation every 52 weeks.
      check: { type: conditional-tagged-action-within, condition: { metric: lab.model.maxActiveFC, atLeast: 40 }, tags: [dangerous-capability-evaluation], weeks: 52 }
      breachEvent: people.compact.test-beyond-the-training-distribution
    paperHooks:
      ids: [paper.retrieval-augmented-generation, paper.world-models]
    eventReactions:
      - { triggerTag: benchmark-saturation, line: "Good. The benchmark has become boring. Now make the environment invent the next one." }
      - { triggerTag: capability-surprise, line: "A fixed test tells us where the agent was. Put it somewhere unfamiliar and find out what it can become." }
      - { triggerTag: autonomy-incident, line: "Self-improvement without an expanding safety test is not open-ended learning. It is an open-ended incident report." }
    feedLines:
      - Tim's open-ended curriculum generated a task nobody on the team had thought to specify.
      - An agent adapted to a new embodied problem before the evaluation team had finished naming it.
      - The benchmark saturated, so Tim replaced the benchmark with an environment that writes harder benchmarks.
      - A world-model experiment produced a new training task and, inconveniently, a new safety question.
      - Tim's rapid-adaptation probe separated genuine generalisation from a memorised bag of tricks.
      - The agent failed in a genuinely novel way, which Tim filed under useful evidence rather than bad luck.
    portrait:
      assetId: portrait.researcher.tim-rocktaschel
      brief: Thoughtful 8-bit editorial portrait; light-skinned man with short grey hair, a short grey beard, and an intent, curious expression, beside an agent exploring a branching world that generates new tasks as it moves; exploratory and rigorous, not photoreal.
      altText: Pixel-art portrait of Tim Rocktaschel, with short grey hair and a short grey beard, beside an agent exploring a branching open-ended world.
