  # --- A public match against the human champion -----------------------------
  - id: event.research.public-match
    version: 1
    category: research
    severity: decision
    phase: foundation
    trigger: { kind: opportunity }
    prerequisites: { type: compare, metric: player.ai.frontierCapability, op: gte, value: 10 }
    baseWeight: 7
    # The stronger the system, the louder the calls for a match.
    weightModifiers:
      - predicate:
          { type: compare, metric: player.ai.frontierCapability, op: gte, value: 15 }
        multiplier: 2
    cooldown: { group: early-research-public-match, weeks: 26 }
    unique: true
    expiryWeeks: 13
    defaultOptionId: private-match
    titleKey: event.research.public-match.title
    bodyKey: event.research.public-match.body
    educationKey: event.research.public-match.education
    evidence:
      - textKey: event.research.public-match.evidence.aura
        metric: player.aura.spendable
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
      - { token: LEADER, source: player-leader-name }
    options:
      - id: keep-training
        labelKey: event.research.public-match.keep.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.public-match.keep.preview
        immediateEffects:
          - { kind: add-modifier, target: researcher.moraleTarget, operation: add, value: -3, durationWeeks: 26, tags: [match-postponed] }
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [match-postponed] }
        checks: []
        memories:
          - key: research.public-match.kept-training
            subjects: [{ type: player-lab }]
            tags: [declined-match]
        confirmationRequired: false
      - id: private-match
        labelKey: event.research.public-match.private.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -3 }
        previewKey: event.research.public-match.private.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 3 }
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 5 }
        checks: []
        memories:
          - key: research.public-match.private-match
            subjects: [{ type: player-lab }]
            tags: [private-match]
        confirmationRequired: false
      - id: public-match
        labelKey: event.research.public-match.public.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -5 }
        previewKey: event.research.public-match.public.preview
        immediateEffects: []
        checks:
          - id: match
            likelihoodPromise: { label: uncertain, successOutcomeIds: [won] }
            outcomes:
              - id: won
                minimumInclusive: 0
                maximumExclusive: 0.5
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 20 }
                  - { kind: add-modifier, target: lab.fundraising.offerCash, operation: multiply, value: 1.10, durationWeeks: 26, tags: [investor-mood] }
                memories:
                  - key: research.public-match.won
                    subjects: [{ type: player-lab }]
                    tags: [public-match, milestone]
              - id: lost
                minimumInclusive: 0.5
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -10 }
                  - { kind: add-modifier, target: lab.fundraising.offerCash, operation: multiply, value: 0.90, durationWeeks: 26, tags: [investor-mood] }
                memories:
                  - key: research.public-match.lost
                    subjects: [{ type: player-lab }]
                    tags: [public-match, public-loss]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [research, game-playing, publicity]

  # --- The carbon cost of training -----------------------------------------
