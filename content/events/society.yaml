draftSchema: 1
contentType: decision-events
pack: society-a

# How AI research is measured, and how AI lands on people: science, work,
# money, and the communities around the data centres.
#
# Two flag chains:
# - Purging the disputed books (authors-lawsuit) sets society:purged-books,
#   which makes the synthetic-data proposal three times as likely.
# - Declining the debate trial or optimising the companion for retention sets
#   society:products-first, which unlocks the safety lead's public resignation
#   even in a lab whose safety culture still looks healthy, and triples its
#   weight.
events:
  - id: event.research.benchmark-leak
    version: 1
    category: research
    severity: decision
    phase: foundation
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 1 }
        - { type: compare, metric: player.safety.evalQuality, op: lt, value: 70 }
    baseWeight: 6
    weightModifiers:
      - predicate:
          { type: compare, metric: player.safety.evalQuality, op: lt, value: 40 }
        multiplier: 2
    cooldown: { group: society-benchmark-leak, weeks: 104 }
    unique: true
    expiryWeeks: 8
    defaultOptionId: footnote
    titleKey: event.research.benchmark-leak.title
    bodyKey: event.research.benchmark-leak.body
    educationKey: event.research.benchmark-leak.education
    evidence:
      - textKey: event.research.benchmark-leak.evidence.evalquality
        metric: player.safety.evalQuality
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: re-evaluate
        labelKey: event.research.benchmark-leak.re-evaluate.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -5 }
        previewKey: event.research.benchmark-leak.re-evaluate.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 5 }
          - { kind: add-modifier, target: lab.research.all.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [benchmark-retest] }
        checks: []
        memories:
          - key: research.benchmark-leak.re-evaluated
            subjects: [{ type: player-lab }]
            tags: [honest-measurement, held-out-evaluation]
        confirmationRequired: false
      - id: footnote
        labelKey: event.research.benchmark-leak.footnote.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.benchmark-leak.footnote.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 5 }
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: -2 }
        checks: []
        memories:
          - key: research.benchmark-leak.footnoted
            subjects: [{ type: player-lab }]
            tags: [benchmark-contamination, partial-disclosure]
        confirmationRequired: false
      - id: publish
        labelKey: event.research.benchmark-leak.publish.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.benchmark-leak.publish.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 10 }
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: -4 }
        checks:
          - id: outside-scrutiny
            likelihoodPromise: { label: likely, successOutcomeIds: [unnoticed] }
            outcomes:
              - id: unnoticed
                minimumInclusive: 0
                maximumExclusive: 0.7
                effects: []
                memories:
                  - key: research.benchmark-leak.published
                    subjects: [{ type: player-lab }]
                    tags: [benchmark-contamination, inflated-claim]
              - id: exposed
                minimumInclusive: 0.7
                maximumExclusive: 1
                effects:
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -15 }
                memories:
                  - key: research.benchmark-leak.exposed
                    subjects: [{ type: player-lab }]
                    tags: [benchmark-contamination, inflated-claim, scandal]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [research, evaluation, benchmark-contamination]

