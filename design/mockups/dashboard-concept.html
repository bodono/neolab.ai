  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          &lt;rect x=&quot;224&quot; y=&quot;62&quot; width=&quot;28&quot; height=&quot;70&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;rect x=&quot;260&quot; y=&quot;62&quot; width=&quot;28&quot; height=&quot;70&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;rect x=&quot;296&quot; y=&quot;62&quot; width=&quot;22&quot; height=&quot;70&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;rect x=&quot;193&quot; y=&quot;70&quot; width=&quot;18&quot; height=&quot;5&quot; fill=&quot;var(--viz-series-1)&quot;/&gt;
          &lt;rect x=&quot;229&quot; y=&quot;70&quot; width=&quot;18&quot; height=&quot;5&quot; fill=&quot;var(--viz-series-1)&quot;/&gt;
          &lt;rect x=&quot;265&quot; y=&quot;70&quot; width=&quot;18&quot; height=&quot;5&quot; fill=&quot;var(--viz-series-1)&quot;/&gt;
          &lt;rect x=&quot;301&quot; y=&quot;70&quot; width=&quot;12&quot; height=&quot;5&quot; fill=&quot;var(--viz-series-1)&quot;/&gt;
          &lt;text x=&quot;253&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--foreground)&quot;&gt;DATA CENTER WEST&lt;/text&gt;
        &lt;/g&gt;

        &lt;g id=&quot;neo-dc-wing&quot; aria-label=&quot;Data center expansion site&quot; opacity=&quot;0.2&quot;&gt;
          &lt;rect x=&quot;338&quot; y=&quot;76&quot; width=&quot;82&quot; height=&quot;72&quot; fill=&quot;var(--viz-series-1)&quot; opacity=&quot;0.45&quot;/&gt;
          &lt;rect x=&quot;350&quot; y=&quot;90&quot; width=&quot;24&quot; height=&quot;45&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;rect x=&quot;382&quot; y=&quot;90&quot; width=&quot;24&quot; height=&quot;45&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;text id=&quot;neo-dc-wing-label&quot; x=&quot;379&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--foreground)&quot;&gt;EXPANSION SITE&lt;/text&gt;
        &lt;/g&gt;

        &lt;g aria-label=&quot;Alignment and evaluation institute&quot;&gt;
          &lt;rect x=&quot;438&quot; y=&quot;66&quot; width=&quot;116&quot; height=&quot;82&quot; fill=&quot;var(--viz-series-3)&quot; opacity=&quot;0.25&quot;/&gt;
          &lt;rect x=&quot;450&quot; y=&quot;80&quot; width=&quot;92&quot; height=&quot;6&quot; fill=&quot;var(--viz-series-3)&quot;/&gt;
          &lt;rect x=&quot;454&quot; y=&quot;98&quot; width=&quot;24&quot; height=&quot;18&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;rect x=&quot;486&quot; y=&quot;98&quot; width=&quot;24&quot; height=&quot;18&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;rect x=&quot;518&quot; y=&quot;98&quot; width=&quot;16&quot; height=&quot;18&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;rect x=&quot;484&quot; y=&quot;123&quot; width=&quot;24&quot; height=&quot;25&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;text x=&quot;496&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--foreground)&quot;&gt;ALIGNMENT INSTITUTE&lt;/text&gt;
        &lt;/g&gt;

        &lt;g id=&quot;neo-robotics-building&quot; aria-label=&quot;Robotics laboratory construction site&quot; opacity=&quot;0.2&quot;&gt;
          &lt;rect x=&quot;578&quot; y=&quot;82&quot; width=&quot;116&quot; height=&quot;66&quot; fill=&quot;var(--viz-series-4)&quot; opacity=&quot;0.5&quot;/&gt;
          &lt;rect x=&quot;590&quot; y=&quot;96&quot; width=&quot;92&quot; height=&quot;5&quot; fill=&quot;var(--viz-series-4)&quot;/&gt;
          &lt;rect x=&quot;600&quot; y=&quot;111&quot; width=&quot;26&quot; height=&quot;20&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;rect x=&quot;640&quot; y=&quot;107&quot; width=&quot;30&quot; height=&quot;41&quot; fill=&quot;var(--background)&quot;/&gt;
          &lt;text id=&quot;neo-robotics-label&quot; x=&quot;636&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--foreground)&quot;&gt;ROBOTICS SITE&lt;/text&gt;
        &lt;/g&gt;

        &lt;g class=&quot;neo-person-a&quot; aria-label=&quot;Researcher walking across campus&quot;&gt;
          &lt;rect x=&quot;82&quot; y=&quot;166&quot; width=&quot;8&quot; height=&quot;9&quot; fill=&quot;var(--foreground)&quot;/&gt;
          &lt;rect x=&quot;80&quot; y=&quot;175&quot; width=&quot;12&quot; height=&quot;14&quot; fill=&quot;var(--viz-series-2)&quot;/&gt;
          &lt;rect x=&quot;80&quot; y=&quot;189&quot; width=&quot;4&quot; height=&quot;8&quot; fill=&quot;var(--foreground)&quot;/&gt;
          &lt;rect x=&quot;88&quot; y=&quot;189&quot; width=&quot;4&quot; height=&quot;8&quot; fill=&quot;var(--foreground)&quot;/&gt;
        &lt;/g&gt;
        &lt;g class=&quot;neo-person-b&quot; aria-label=&quot;Safety researcher walking across campus&quot;&gt;
          &lt;rect x=&quot;544&quot; y=&quot;166&quot; width=&quot;8&quot; height=&quot;9&quot; fill=&quot;var(--foreground)&quot;/&gt;
          &lt;rect x=&quot;542&quot; y=&quot;175&quot; width=&quot;12&quot; height=&quot;14&quot; fill=&quot;var(--viz-series-3)&quot;/&gt;
          &lt;rect x=&quot;542&quot; y=&quot;189&quot; width=&quot;4&quot; height=&quot;8&quot; fill=&quot;var(--foreground)&quot;/&gt;
          &lt;rect x=&quot;550&quot; y=&quot;189&quot; width=&quot;4&quot; height=&quot;8&quot; fill=&quot;var(--foreground)&quot;/&gt;
        &lt;/g&gt;
        &lt;g id=&quot;neo-robotics-person&quot; class=&quot;neo-person-c&quot; aria-label=&quot;Robotics engineer walking across campus&quot; opacity=&quot;0&quot;&gt;
          &lt;rect x=&quot;570&quot; y=&quot;166&quot; width=&quot;8&quot; height=&quot;9&quot; fill=&quot;var(--foreground)&quot;/&gt;
          &lt;rect x=&quot;568&quot; y=&quot;175&quot; width=&quot;12&quot; height=&quot;14&quot; fill=&quot;var(--viz-series-4)&quot;/&gt;
          &lt;rect x=&quot;568&quot; y=&quot;189&quot; width=&quot;4&quot; height=&quot;8&quot; fill=&quot;var(--foreground)&quot;/&gt;
          &lt;rect x=&quot;576&quot; y=&quot;189&quot; width=&quot;4&quot; height=&quot;8&quot; fill=&quot;var(--foreground)&quot;/&gt;
        &lt;/g&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-controls neo-campus-actions&quot; aria-label=&quot;Facility investments&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;neo-build-robotics&quot;&gt;Build robotics lab · $18m&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;neo-expand-dc&quot;&gt;Expand data center · $12m&lt;/button&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;neolab-dashboard-concept&#x27;);
      let cash = 42.3;
      let compute = 18400;
      let aura = 64;
      let monthlyCosts = 6.6;
      let roboticsBuilt = false;
      let dcExpanded = false;
      const slotState = {
        1: { name: &#x27;Ian LeMon&#x27;, role: &#x27;Architectures · Vision&#x27;, salary: 0.25 },
        2: { name: &#x27;Geoff Hintoff&#x27;, role: &#x27;Deep learning · Aura&#x27;, salary: 0.25 },
        3: null,
        4: &#x27;locked&#x27;,
        5: &#x27;locked&#x27;
      };
      const segmentIds = [&#x27;market&#x27;, &#x27;capability&#x27;, &#x27;safety&#x27;, &#x27;evals&#x27;];
      const progressEls = [
        root.querySelector(&#x27;#neo-cap-progress&#x27;),
        root.querySelector(&#x27;#neo-safe-progress&#x27;),
        root.querySelector(&#x27;#neo-eval-progress&#x27;)
      ];
      const progressLabels = [
        root.querySelector(&#x27;#neo-cap-progress-label&#x27;),
        root.querySelector(&#x27;#neo-safe-progress-label&#x27;),
        root.querySelector(&#x27;#neo-eval-progress-label&#x27;)
      ];
      const servingRange = root.querySelector(&#x27;#neo-serving-range&#x27;);
      const capRange = root.querySelector(&#x27;#neo-cap-range&#x27;);
      const evalRange = root.querySelector(&#x27;#neo-eval-range&#x27;);

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getFinancials() {
        const serving = Number(servingRange.value);
        const income = 3 + serving * 0.12;
        return { income, costs: monthlyCosts, net: income - monthlyCosts };
      }

      function signedMoney(value) {
        return (value &gt;= 0 ? &#x27;+&#x27; : &#x27;−&#x27;) + &#x27;$&#x27; + Math.abs(value).toFixed(1) + &#x27;m&#x27;;
      }

      function updateResources() {
        const finance = getFinancials();
        root.querySelector(&#x27;#neo-cash&#x27;).textContent = &#x27;$&#x27; + cash.toFixed(1) + &#x27;m&#x27;;
        root.querySelector(&#x27;#neo-compute&#x27;).textContent = compute.toLocaleString(&#x27;en-US&#x27;);
        root.querySelector(&#x27;#neo-aura&#x27;).textContent = String(aura);
        root.querySelector(&#x27;#neo-income&#x27;).textContent = &#x27;+$&#x27; + finance.income.toFixed(1) + &#x27;m&#x27;;
        root.querySelector(&#x27;#neo-costs&#x27;).textContent = &#x27;−$&#x27; + finance.costs.toFixed(1) + &#x27;m&#x27;;
        root.querySelector(&#x27;#neo-net&#x27;).textContent = signedMoney(finance.net);
        root.querySelector(&#x27;#neo-runway&#x27;).textContent = finance.net &gt;= 0
          ? &#x27;Cashflow positive at current allocation&#x27;
          : Math.max(1, Math.floor(cash / Math.abs(finance.net))) + &#x27; months runway&#x27;;
      }

      function applyAllocation() {
        const serving = Number(servingRange.value);
        const research = 100 - serving;
        const capShare = Number(capRange.value);
        const evalShare = Number(evalRange.value);
        const capability = research * capShare / 100;
        const safetyPool = research - capability;
        const evaluations = safetyPool * evalShare / 100;
        const safety = safetyPool - evaluations;
        const values = [serving, capability, safety, evaluations];

        segmentIds.forEach((id, index) =&gt; {
          root.querySelector(&#x27;#neo-seg-&#x27; + id).style.width = values[index] + &#x27;%&#x27;;
          root.querySelector(&#x27;#neo-val-&#x27; + id).textContent = values[index].toFixed(1) + &#x27;%&#x27;;
        });
        root.querySelector(&#x27;#neo-allocation-bar&#x27;).setAttribute(
          &#x27;aria-label&#x27;,
          `Compute allocation: serving ${values[0].toFixed(1)}%, capabilities ${values[1].toFixed(1)}%, safety ${values[2].toFixed(1)}%, evaluations ${values[3].toFixed(1)}%`
        );
        root.querySelector(&#x27;#neo-serving-output&#x27;).textContent = serving + &#x27;%&#x27;;
        root.querySelector(&#x27;#neo-cap-output&#x27;).textContent = capShare + &#x27;%&#x27;;
        root.querySelector(&#x27;#neo-eval-output&#x27;).textContent = evalShare + &#x27;%&#x27;;

        const finance = getFinancials();
        const researchMultiplier = research / 55;
        const evidence = evaluations &gt;= 14 ? &#x27;stronger, still incomplete&#x27; : evaluations &gt;= 7 ? &#x27;partial&#x27; : &#x27;sparse&#x27;;
        root.querySelector(&#x27;#neo-projection&#x27;).textContent =
          signedMoney(finance.net) + &#x27;/month net · &#x27; +
          &#x27;Research &#x27; + researchMultiplier.toFixed(1) + &#x27;× · Safety evidence: &#x27; + evidence;

        const progress = [
          clamp(44 + capability * 0.72, 12, 94),
          clamp(18 + safety * 2.1, 12, 94),
          clamp(20 + evaluations * 3.0, 12, 94)
        ];
        const labels = [
          capability &gt;= 42 ? &#x27;Breakthrough likely&#x27; : capability &gt;= 25 ? &#x27;Promising&#x27; : &#x27;Slow progress&#x27;,
          safety &gt;= 18 ? &#x27;Promising&#x27; : safety &gt;= 9 ? &#x27;Mixed results&#x27; : &#x27;Understaffed&#x27;,
          evaluations &gt;= 14 ? &#x27;Broad coverage&#x27; : evaluations &gt;= 7 ? &#x27;Coverage gaps&#x27; : &#x27;Major blind spots&#x27;
        ];
        progressEls.forEach((el, index) =&gt; { el.style.width = progress[index] + &#x27;%&#x27;; });
        progressLabels.forEach((el, index) =&gt; { el.textContent = labels[index]; });
        updateResources();
      }

      function updateSlotCount() {
        const states = Object.values(slotState);
        const occupied = states.filter((state) =&gt; state &amp;&amp; state !== &#x27;locked&#x27;).length;
        const unlocked = states.filter((state) =&gt; state !== &#x27;locked&#x27;).length;
        root.querySelector(&#x27;#neo-slot-count&#x27;).textContent = occupied + &#x27; occupied · &#x27; + unlocked + &#x27;/8 slots unlocked&#x27;;
      }

      function setSlotEmpty(slot) {
        slotState[slot] = null;
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-portrait&#x27;).textContent = &#x27;＋&#x27;;
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-portrait&#x27;).setAttribute(&#x27;aria-label&#x27;, &#x27;Vacant researcher slot&#x27;);
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-name&#x27;).textContent = &#x27;Vacant&#x27;;
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-role&#x27;).textContent = &#x27;Recruit a star researcher&#x27;;
        const action = root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-action&#x27;);
        action.textContent = &#x27;Recruit&#x27;;
        action.setAttribute(&#x27;data-slot-action&#x27;, &#x27;recruit&#x27;);
        action.disabled = false;
        updateSlotCount();
      }

      function setSlotPerson(slot, name, role, salary) {
        slotState[slot] = { name, role, salary };
        const initials = name.split(&#x27; &#x27;).map((part) =&gt; part.charAt(0)).join(&#x27;&#x27;).slice(0, 2);
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-portrait&#x27;).textContent = initials;
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-portrait&#x27;).setAttribute(&#x27;aria-label&#x27;, &#x27;Portrait of &#x27; + name);
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-name&#x27;).textContent = name;
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-role&#x27;).textContent = role;
        const action = root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-action&#x27;);
        action.textContent = &#x27;Remove&#x27;;
        action.setAttribute(&#x27;data-slot-action&#x27;, &#x27;remove&#x27;);
        action.disabled = false;
        updateSlotCount();
      }

      function unlockSlot(slot, description) {
        if (slotState[slot] !== &#x27;locked&#x27;) return;
        setSlotEmpty(slot);
        root.querySelector(&#x27;#neo-slot-&#x27; + slot + &#x27;-role&#x27;).textContent = description;
      }

      function showTalentMarket(show) {
        root.querySelector(&#x27;#neo-talent-market&#x27;).hidden = !show;
        root.querySelector(&#x27;#neo-open-market&#x27;).setAttribute(&#x27;aria-expanded&#x27;, show ? &#x27;true&#x27; : &#x27;false&#x27;);
      }

      root.querySelectorAll(&#x27;[data-slot-action]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const slot = Number(button.getAttribute(&#x27;data-slot&#x27;));
          const action = button.getAttribute(&#x27;data-slot-action&#x27;);
          if (action === &#x27;remove&#x27; &amp;&amp; slotState[slot] &amp;&amp; slotState[slot] !== &#x27;locked&#x27;) {
            monthlyCosts = Math.max(0, monthlyCosts - slotState[slot].salary);
            setSlotEmpty(slot);
            root.querySelector(&#x27;#neo-market-status&#x27;).textContent = &#x27;Former researchers may become available to rival labs&#x27;;
            updateResources();
          } else if (action === &#x27;recruit&#x27;) {
            showTalentMarket(true);
          }
        });
      });

      root.querySelector(&#x27;#neo-open-market&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        showTalentMarket(root.querySelector(&#x27;#neo-talent-market&#x27;).hidden);
      });

      root.querySelectorAll(&#x27;[data-candidate]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const vacantSlot = Object.keys(slotState).find((slot) =&gt; slotState[slot] === null);
          const cost = Number(button.getAttribute(&#x27;data-cost&#x27;));
          const auraCost = Number(button.getAttribute(&#x27;data-aura&#x27;));
          if (!vacantSlot) {
            root.querySelector(&#x27;#neo-market-status&#x27;).textContent = &#x27;No unlocked slot available—invest in facilities&#x27;;
            return;
          }
          if (cash &lt; cost || aura &lt; auraCost) {
            root.querySelector(&#x27;#neo-market-status&#x27;).textContent = &#x27;Insufficient cash or Aura&#x27;;
            return;
          }
          cash -= cost;
          aura -= auraCost;
          monthlyCosts += 0.25;
          setSlotPerson(
            Number(vacantSlot),
            button.getAttribute(&#x27;data-candidate&#x27;),
            button.getAttribute(&#x27;data-role&#x27;),
            0.25
          );
          root.querySelector(&#x27;#neo-market-status&#x27;).textContent = button.getAttribute(&#x27;data-candidate&#x27;) + &#x27; joined the lab&#x27;;
          button.textContent = &#x27;Recruited&#x27;;
          button.disabled = true;
          updateResources();
        });
      });

      root.querySelector(&#x27;#neo-open-funding&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const panel = root.querySelector(&#x27;#neo-funding-panel&#x27;);
        panel.hidden = !panel.hidden;
        root.querySelector(&#x27;#neo-open-funding&#x27;).setAttribute(&#x27;aria-expanded&#x27;, panel.hidden ? &#x27;false&#x27; : &#x27;true&#x27;);
      });

      root.querySelectorAll(&#x27;[data-funding]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const auraCost = Number(button.getAttribute(&#x27;data-aura-cost&#x27;));
          if (aura &lt; auraCost) {
            root.querySelector(&#x27;#neo-funding-status&#x27;).textContent = &#x27;Insufficient Aura for this pitch&#x27;;
            return;
          }
          cash += Number(button.getAttribute(&#x27;data-amount&#x27;));
          aura -= auraCost;
          root.querySelector(&#x27;#neo-funding-status&#x27;).textContent = button.getAttribute(&#x27;data-funding&#x27;) + &#x27; secured; new obligations added&#x27;;
          button.textContent = &#x27;Funding secured&#x27;;
          button.disabled = true;
          updateResources();
        });
      });

      root.querySelector(&#x27;#neo-buy-compute&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        if (cash &lt; 4) return;
        cash -= 4;
        compute += 2000;
        monthlyCosts += 0.3;
        root.querySelector(&#x27;#neo-buy-compute&#x27;).textContent = &#x27;Buy 2,000 more GPUs · $4m&#x27;;
        updateResources();
      });

      root.querySelector(&#x27;#neo-review-event&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;#neo-event-layer&#x27;).hidden = false;
      });

      root.querySelectorAll(&#x27;[data-event-choice]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const choice = button.getAttribute(&#x27;data-event-choice&#x27;);
          const result = choice === &#x27;root&#x27;
            ? &#x27;GPT received root access; research acceleration is active&#x27;
            : choice === &#x27;sandbox&#x27;
              ? &#x27;GPT received sandboxed tools; the security team is monitoring its work&#x27;
              : &#x27;GPT access request denied; research continues at normal speed&#x27;;
          root.querySelector(&#x27;#neo-event-layer&#x27;).hidden = true;
          root.querySelector(&#x27;#neo-decision-feed&#x27;).textContent = result;
        });
      });

      [servingRange, capRange, evalRange].forEach((range) =&gt; {
        range.addEventListener(&#x27;input&#x27;, applyAllocation);
      });

      root.querySelector(&#x27;#neo-build-robotics&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        if (roboticsBuilt || cash &lt; 18) return;
        roboticsBuilt = true;
        cash -= 18;
        monthlyCosts += 0.7;
        root.querySelector(&#x27;#neo-robotics-building&#x27;).setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
        root.querySelector(&#x27;#neo-robotics-person&#x27;).setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
        root.querySelector(&#x27;#neo-robotics-label&#x27;).textContent = &#x27;ROBOTICS LAB&#x27;;
        event.currentTarget.textContent = &#x27;Robotics lab online&#x27;;
        event.currentTarget.disabled = true;
        root.querySelector(&#x27;#neo-campus-count&#x27;).textContent = (dcExpanded ? &#x27;5&#x27; : &#x27;4&#x27;) + &#x27; facilities online&#x27;;
        unlockSlot(4, &#x27;Robotics specialist slot&#x27;);
        updateResources();
      });

      root.querySelector(&#x27;#neo-expand-dc&#x27;).addEventListener(&#x27;click&#x27;, (event) =&gt; {
        if (dcExpanded || cash &lt; 12) return;
        dcExpanded = true;
        cash -= 12;
        compute += 6000;
        monthlyCosts += 0.9;
        root.querySelector(&#x27;#neo-dc-wing&#x27;).setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
        root.querySelector(&#x27;#neo-dc-wing-label&#x27;).textContent = &#x27;DATA CENTER WEST II&#x27;;
        root.querySelector(&#x27;#neo-compute&#x27;).textContent = compute.toLocaleString(&#x27;en-US&#x27;);
        event.currentTarget.textContent = &#x27;Data center expanded&#x27;;
        event.currentTarget.disabled = true;
        root.querySelector(&#x27;#neo-campus-count&#x27;).textContent = (roboticsBuilt ? &#x27;5&#x27; : &#x27;4&#x27;) + &#x27; facilities online&#x27;;
        updateResources();
      });

      updateResources();
      applyAllocation();
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

    }

  const handleFocusIn = (event) =&gt; {

    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
