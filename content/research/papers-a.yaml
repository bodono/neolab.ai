        domain-specific approaches even in a zero-shot setting, generating recognisable, often
        imaginative images for captions describing combinations the model had not been explicitly
        trained on, such as unusual object pairings. It was an early, striking demonstration that
        the same scale-and-simplicity recipe driving language models could work for cross-modal
        generation too.

        Image quality and prompt fidelity still lagged what later, diffusion-based text-to-image
        systems would achieve. Neolab.ai treats this as a major multimodality unlock opening the
        text-to-image generation branch that the player's later, higher-fidelity generative
        research builds on.
