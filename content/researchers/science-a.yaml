  - id: researcher.katie-bowman
    version: 1
    displayName: Katie Bowman
    inspirationName: Katie Bouman
    inspirationSummary: Caltech computational-imaging researcher and Event Horizon Telescope collaborator who reconstructs the invisible from sparse, noisy measurements.
    epithet: The Sparse-Signal Imager
    role: Computational imaging and algorithm-sensor co-design
    rosterCardSummary: A Caltech computational-imaging professor who helped photograph a black hole, then spent the viral-news cycle patiently pointing back at the entire telescope collaboration.
    biography: >-
      Katie Bouman is a Caltech professor whose research combines algorithms and sensing systems
      to reconstruct phenomena that conventional cameras cannot directly capture. During her
      doctorate at MIT she joined the Event Horizon Telescope collaboration and developed imaging
      methods for its sparse, noisy radio measurements. She had previously studied electrical
      engineering at the University of Michigan and later completed postdoctoral work at the
      Harvard-Smithsonian Center for Astrophysics. She was one of roughly 200 scientists and
      engineers whose work produced the first image of a black hole, announced in 2019. At
      Caltech, her computational-imaging research has continued across astronomy and other
      scientific settings, including methods that recover information hidden in images or videos.
      Her doctoral work developed CHIRP, an algorithm for reconstructing images from sparse
      telescope measurements; the collaboration later compared several independent methods before
      releasing the result. Her group now develops computational cameras that jointly design
      sensing hardware, data collection and reconstruction algorithms.
      The central design principle is co-operation between sensor and algorithm: measurements are
      collected with the eventual reconstruction in mind, and the reconstruction respects how the
      measurements were made. The same principle applies to the credit line; the image is singular,
      but the team behind it was emphatically not.
    availability: { wave: frontier, earliestYear: 2019, poolWeight: 0.45 }
    contract: { band: major, baseSalaryPerCycle: 0.64, baseSigningCash: 6, auraCost: 9, overrideExplanation: Priced on overall measured research strength. }
