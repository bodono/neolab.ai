    venue: KDD
    primarySourceUrl: https://arxiv.org/abs/1603.02754
    arxiv: "1603.02754"
    historicalNote: >-
      Posted in 2016, XGBoost gave gradient-boosted decision trees a fast, scalable, easy-to-use
      implementation that dominated tabular-data competitions and applied machine learning for years.
    education:
      playerSummary: >-
        Not every problem is best solved by deep learning. For tabular data, spreadsheets of numbers
        and categories, gradient-boosted decision trees often win, and XGBoost made them fast,
        scalable, and pleasant to use. It builds an ensemble by adding one small tree at a time, each
        correcting the previous ensemble's errors, with careful regularisation and systems
        engineering that let it handle large datasets efficiently.
      archiveExplanation: >-
        Boosting combines many weak models into a strong one by training each new tree to fix the
        residual mistakes of the current ensemble. XGBoost's contribution was less a new idea than a
        superbly engineered one: a regularised objective that controls overfitting, clever handling of
        sparse and missing values, and cache-aware, parallel, out-of-core implementation that made it
        dramatically faster and more scalable than predecessors.

        The practical impact was immense. XGBoost became the default winning method across data-science
        competitions and a workhorse throughout industry for fraud detection, ranking, forecasting and
        risk modelling, a reminder that much of the real-world value of machine learning has come from
        structured data rather than images or text. Its citation count rivals the famous deep-learning
        papers precisely because so many practitioners reach for it first.

