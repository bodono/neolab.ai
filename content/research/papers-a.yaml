  - id: paper.variational-autoencoder
    version: 1
    historicity: real
    gameOrder: 8
    title: Auto-Encoding Variational Bayes
    authors: [Diederik P. Kingma, Max Welling]
    publicationYear: 2014
    venue: International Conference on Learning Representations
    primarySourceUrl: https://arxiv.org/abs/1312.6114
    arxiv: "1312.6114"
    historicalNote: >-
      First posted in 2013 and presented at ICLR 2014, this paper introduced the method now
      widely known as the variational autoencoder.
    education:
      playerSummary: >-
        Variational autoencoders made flexible latent-variable generative models trainable with
        ordinary stochastic gradient methods. A learned inference network approximates hidden
        causes for each example, while a reparameterisation trick lets gradients pass through
        random sampling. VAEs joined probabilistic modelling to neural networks and created a
        durable toolkit for representation learning and generation.
      archiveExplanation: >-
        A latent-variable model imagines that observed data was produced from hidden factors.
        Learning such a model requires reasoning backward from an observation to plausible
        hidden values, but exact Bayesian inference is usually intractable for expressive neural
        generators. Traditional approximate methods could also be too slow or specialised for
        large datasets.

        Kingma and Welling introduced an efficient approach that learns two networks together.
        The encoder, or recognition model, approximates the posterior distribution over latent
        variables given an observation. The decoder models how those variables generate data.
        Their reparameterisation expresses a random sample as a differentiable transformation
        of fixed noise, allowing low-variance gradient estimates and ordinary minibatch
        optimisation of a variational lower bound.

        The resulting variational autoencoder can learn smooth latent spaces, generate new
        examples and perform efficient amortised inference. Its samples were often blurrier than
        those of later adversarial or diffusion systems, and the choice of objective brings
        characteristic tradeoffs between reconstruction and representation. Its deeper impact
        was conceptual and practical: probabilistic latent-variable modelling became modular
        neural-network engineering. The game unlocks a broad generative branch and makes
        representation experiments cheaper, but retains uncertainty about whether an elegant
        latent space corresponds to the factors that people actually care about.
      insideBaseball: Sampling is differentiable now, subject to an explanatory footnote which has achieved local sentience.
    domainWeights:
      domain.data-representation: 0.50
      domain.architectures: 0.25
      domain.optimisation-scaling: 0.25
    prerequisites:
      papers: [paper.backpropagation, paper.fast-deep-belief-nets]
      domainLevels:
        domain.data-representation: 14
        domain.optimisation-scaling: 10
    baseEffort: 110
    earliestPhase: deep-learning
    discovery:
      worldFirstAura: 10
      commercialValue: 7
      independentRediscovery: true
      diffusion: { openDelayWeeks: 13, openDurationWeeks: 26, controlledDelayWeeks: 26, controlledDurationWeeks: 39 }
