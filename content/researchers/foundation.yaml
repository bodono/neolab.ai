  - id: researcher.vladimir-vapnick
    version: 1
    displayName: Vladimir Vapnick
    inspirationName: Vladimir Vapnik
    inspirationSummary: Statistical-learning theorist behind capacity bounds and support-vector machines—first the generalisation question, then the classifier.
    epithet: The Theory Before the Data
    role: Statistical learning theory and margin-based methods
    rosterCardSummary: Built a theory of learning from finite data, then asked the benchmark to state its function class and show its generalisation papers.
    biography: >-
      Vladimir Vapnik trained in mathematics and spent nearly three decades at Moscow's Institute
      of Control Sciences, eventually leading its computer-science research department. His work
      on statistical learning theory examined when a model fitted to finite data can be expected
      to generalise. With Alexey Chervonenkis, he developed the capacity measure now known as VC
      dimension, connecting the complexity of a function class, sample size and generalisation
      bounds. After joining AT&T Bell Laboratories, he helped turn that theoretical programme
      into support-vector machines, margin-based methods that became widely used for
      classification and regression. He later held university appointments at Royal Holloway and
      Columbia. His books Statistical Learning Theory and The Nature of Statistical Learning
      Theory organised the framework for later researchers and practitioners. His
      empirical-risk-minimisation principle connected statistical bounds to practical learning
      procedures. The
      sequence is characteristic: define what can be learned, state the assumptions, then allow
      the algorithm onto the benchmark.
