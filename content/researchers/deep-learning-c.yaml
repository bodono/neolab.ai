    epithet: The Grammar of Meaning
    role: Natural language processing and computational linguistics
    rosterCardSummary: A Stanford NLP researcher whose GloVe work, textbooks, and public courses connect fluent models to linguistic structure and meaning.
    biography: >-
      Christopher Manning asks a fluent model what its sentence actually asserts. Christopher
      Manning founded the Stanford NLP Group and served as director of the Stanford Artificial
      Intelligence Laboratory from 2018 to 2024. His Stanford profile describes work on
      computational linguistics, information extraction, sentiment analysis, neural machine
      translation, question answering, and the relationship between linguistic structure and
      learned representations. He co-authored GloVe, which derives word vectors from global
      word-word co-occurrence statistics, and helped develop Stanford CoreNLP. His books cover
      statistical natural-language processing and information retrieval. His Stanford profile
      records two ACL Test of Time Awards, the 2024 IEEE John von Neumann Medal, and work on
      Stanford and Universal Dependencies. His Stanford courses have made modern NLP instruction
      broadly accessible. Manning's standing request is to inspect the structure beneath the
      fluent answer, identify what the words commit the model to, and please stop calling every
      confident paraphrase “reasoning” before the parse tree has arrived.
