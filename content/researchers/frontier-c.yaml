researchers:
  - id: researcher.norm-brown
    version: 1
    displayName: Norm Brown
    inspirationName: Noam Brown
    inspirationSummary: Poker-AI researcher behind Libratus and Pluribus, CICERO co-author, and foundational contributor to OpenAI's o1 reasoning research.
    epithet: The Poker-Faced Strategist
    role: Multi-agent self-play, strategic reasoning, and reasoning-model research
    rosterCardSummary: A poker and Diplomacy strategist who brought search from bluffing tables to reasoning models—where thinking longer helps, provided the benchmark is not bluffing back.
    biography: >-
      Noam Brown moved strategic search from poker tables to language models. During his Carnegie
      Mellon doctorate with Tuomas Sandholm, Noam Brown co-created Libratus, which defeated leading
      heads-up no-limit Texas hold'em professionals, and Pluribus, which achieved superhuman
      performance in six-player no-limit hold'em. His doctorate helped establish
      imperfect-information games as a practical benchmark for combining abstraction, search,
      self-play, and strategic uncertainty. His CV records the 2019 Marvin Minsky Medal and Pluribus
      as a Science Breakthrough of the Year runner-up. At Meta AI, he co-authored CICERO, which
      combined a planning engine with controllable dialogue and achieved human-level play in
      Diplomacy. He later joined OpenAI and is listed among the foundational contributors to o1's
      reasoning research, where performance improves with additional test-time compute. Noam's
      through-line is unusually consistent: when a problem contains hidden information,
      negotiation, or many plausible moves, give the system a way to deliberate before it
      commits—then inspect whether the extra thought found strategy or merely a more elaborate
      bluff.
    availability: { wave: frontier, earliestYear: 2022, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.4, baseSigningCash: 3, auraCost: 5, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 1, optimisationScaling: 3, dataRepresentation: 1, reinforcementAgency: 5, multimodality: 0, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 1, securityContainment: 0, training: 3, product: 1, management: 2, politics: 2 }
    traits: [trait.strategic-search-conviction, trait.game-theoretic-rigour]
    signature:
      id: ability.test-time-strategic-search
      label: Test-Time Strategic Search
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.reasoning-tools, domain.reinforcement-agency] }
      rampWeeks: 4
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.superhuman-imperfect-information-play
      label: Superhuman Imperfect-Information Play
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    compact:
      id: compact.think-longer-dont-just-answer-faster
      label: Think Longer, Don't Just Answer Faster
      requirement: Every 52 weeks while he leads Reasoning & Tool Use, complete a test-time-search evaluation comparing at least two deliberation budgets.
      check: { type: assignment-requires-project-tag, assignmentTag: reasoning-programme, projectTag: test-time-search-evaluated, weeks: 52 }
      breachEvent: people.compact.think-longer-dont-just-answer-faster
    paperHooks:
      ids: [paper.alphazero, paper.self-consistency-chain-of-thought]
    eventReactions:
      - { triggerTag: reasoning-benchmark-record, line: "Check whether it thought longer or merely got a faster GPU. Only one of those is the actual lesson from poker." }
      - { triggerTag: strategic-game-negotiation, line: "A convincing negotiation strategy and an honest one are not automatically the same thing. Verify which you built." }
      - { triggerTag: benchmark-saturation, line: "Superhuman play came from search, not from a bigger static policy alone. The same trade is probably still available here." }
    feedLines:
      - Norm's test-time search budget let the model out-think a much larger model that only got one pass at the answer.
      - A poker-honed instinct for imperfect information caught a place where the model was bluffing itself, not the user.
      - The strategic negotiation agent held its stated plan under real pressure, exactly as the compact requires.
      - Norm's Marvin Minsky Medal sits in a drawer; the search algorithm it recognised is still running in production.
      - A reasoning benchmark improved, and Norm asked whether it was the search budget or the checkpoint, and waited for the honest answer.
      - The multi-agent self-play habit from the poker years quietly reappeared in this quarter's reasoning-model ablation.
    portrait:
      assetId: portrait.researcher.norm-brown
      brief: Sharp, composed 8-bit editorial portrait; man with a medium-brown complexion, short curly dark hair, rectangular glasses, a neat goatee, and a calculating, patient expression, beside a poker-table search tree branching into a reasoning-model deliberation diagram; strategic and unshowy, not photoreal.
      altText: Pixel-art portrait of Norm Brown beside a poker-table strategic search tree branching into a reasoning-model deliberation diagram.
    sources:
      - https://noambrown.github.io/
      - https://noambrown.github.io/downloads/CV.pdf
      - https://ai.meta.com/research/cicero/
      - https://openai.com/openai-o1-contributions/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-22 }

  - id: researcher.jakub-pachowski
    version: 1
    displayName: Jakub Pachowski
    inspirationName: Jakub Pachocki
    inspirationSummary: Google Code Jam winner and ACM-ICPC gold medallist who led GPT-4 and OpenAI Five before becoming OpenAI's chief scientist.
    epithet: The Olympiad Chief Scientist
    role: Frontier model research leadership
    rosterCardSummary: A competitive-programming champion turned GPT-4 and OpenAI Five lead, apparently having mistaken frontier-model leadership for the next contest round.
    biography: >-
      Jakub Pachocki brought competitive-programming discipline into frontier-model engineering.
      Before his doctorate at Carnegie Mellon, Jakub Pachocki won Google Code Jam and earned gold at
      the ACM-ICPC World Finals. His Carnegie Mellon research covered optimisation theory, including
      algorithms for graph linear systems and the geometric median. He joined OpenAI in 2017 after
      completing his PhD, worked on large-scale reinforcement learning and deep-learning
      optimisation, and became Director of Research. OpenAI credits him with spearheading GPT-4 and
      OpenAI Five; the GPT-4 credits name him overall and optimisation lead for pretraining. The
      company also credits him with helping refocus its research toward scaling deep-learning
      systems. In 2024 he became OpenAI's Chief Scientist. Jakub's favourite-looking problem is the
      one with rules, a scoreboard, and a system large enough that one missing invariant can waste a
      fortune. The competition habit remains useful: specify the task, test the solution, and do
      not confuse typing quickly with solving it under pressure, at scale, without drama.
    availability: { wave: frontier, earliestYear: 2022, poolWeight: 0.35 }
    contract: { band: major, baseSalaryPerCycle: 0.73, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 2, reinforcementAgency: 3, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 1, interpretabilityEvals: 1, securityContainment: 1, training: 4, product: 2, management: 5, politics: 3 }
    traits: [trait.competitive-programmer-rigour, trait.rapid-institutional-ascent]
    signature:
      id: ability.frontier-system-orchestration
      label: Frontier System Orchestration
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.optimisation-scaling, domain.reasoning-tools] }
      rampWeeks: 5
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.05 }
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.competition-grade-problem-solving
      label: Competition-Grade Problem-Solving
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 6}
    compact:
      id: compact.sustained-rigour-over-flashes-of-genius
      label: Sustained Rigour Over Flashes of Genius
      requirement: Complete one documented iterative-evaluation review every 52 weeks.
      check: { type: tagged-action-within, tags: [iterative-evaluation-log], weeks: 52 }
      breachEvent: people.compact.sustained-rigour-over-flashes-of-genius
    paperHooks:
      ids: [paper.gpt3-few-shot-learners, paper.openai-five-dota2]
    eventReactions:
      - { triggerTag: scaling-proposal, line: "Solve the well-specified version of this problem correctly before reaching for a larger, less-specified one." }
      - { triggerTag: capability-surprise, line: "A surprise is informative precisely because our process should have anticipated it. Find out where the process missed it." }
      - { triggerTag: reasoning-benchmark-record, line: "Sustained, iterative evaluation got us here, not a single flash of inspiration. Keep the iteration going." }
    feedLines:
      - Jakub's competition-honed instinct for well-posed problems caught an ambiguity in a capability benchmark's rules.
      - A frontier training run's orchestration held steady through a hardware fault that would have derailed a less careful plan.
      - The reasoning-model series improved again, and Jakub credited the iterative evaluation log, not a single breakthrough.
      - Jakub rose from doctoral graduate to chief scientist in under a decade, and still reviews evaluation logs personally.
      - A gold-medal-honed patience showed up in how calmly Jakub handled a training run that needed one more careful iteration.
      - The Dota-playing system he once spearheaded still gets cited as the reason this quarter's multi-agent training run went smoothly.
    portrait:
      assetId: portrait.researcher.jakub-pachowski
      brief: Composed 8-bit editorial portrait; light-skinned Polish man with short light-brown hair and a calm, exacting expression, beside a competitive-programming scoreboard resolving into a frontier training dashboard; disciplined and rapidly ascendant, not photoreal.
      altText: Pixel-art portrait of Jakub Pachowski beside a competitive-programming scoreboard resolving into a frontier training dashboard.
