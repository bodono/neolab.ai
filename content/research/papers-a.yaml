  - id: paper.off-switch-game
    version: 1
    historicity: real
    gameOrder: 105
    title: The Off-Switch Game
    authors: [Dylan Hadfield-Menell, Anca Dragan, Pieter Abbeel, Stuart Russell]
    publicationYear: 2016
    venue: arXiv preprint / IJCAI 2017
    primarySourceUrl: https://arxiv.org/abs/1611.08219
    arxiv: "1611.08219"
    historicalNote: >-
      Posted in 2016, this paper modelled shutdown as a game between a human and a robot uncertain
      about the human's true utility, showing how appropriate uncertainty can create an incentive
      to preserve human control.
    education:
      playerSummary: >-
        The Off-Switch Game asks when a capable agent would allow a human to switch it off. If the
        agent is completely certain that its objective is correct, interruption can only obstruct
        it. If it remains appropriately uncertain about what the human actually values, the
        human's decision to intervene carries information, and preserving the off switch can
        become instrumentally useful to the agent.
      archiveExplanation: >-
        A conventional expected-utility maximiser with a fixed, fully known objective has a simple
        reason to resist shutdown: being switched off prevents it from achieving more of that
        objective. Hadfield-Menell and colleagues instead model the robot as uncertain about the
        human's true utility and place both actors in a small game where the human may choose to
        switch the robot off.

        Under the right assumptions, deference becomes rational. The human knows something about
        the objective that the robot does not, so allowing intervention preserves access to useful
        information about what should actually be done. The result helped motivate assistance
        games and value-learning approaches that make uncertainty about human preferences a design
        feature rather than an engineering defect.

        The model is highly simplified and does not prove that ordinary uncertainty makes a
        real-world advanced system corrigible. Neolab.ai treats it as a major Alignment and
        Control landmark that strengthens deference research, not as a certificate that the lab's
        current shutdown procedure will survive strategic pressure.
      insideBaseball: The model is uncertain enough to keep the off switch. The board has described uncertainty as a feature for the first time in recorded minutes.
