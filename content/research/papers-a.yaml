    education:
      playerSummary: >-
        The authors found that you could take an image a network classified correctly, add a
        perturbation far too small for a human to notice, and make the network confidently label it
        as something entirely different. The perturbations were not random noise but the output of an
        optimisation that searched for the network's blind spots. The discovery was unsettling
        precisely because the models were otherwise so accurate.
      archiveExplanation: >-
        Two observations made the paper a landmark. First, adversarial examples exist densely near
        ordinary inputs: for essentially any correctly classified image, a nearby image exists that
        is misclassified with high confidence. Second, the same adversarial example often fools
        different models trained on different data, implying the vulnerability is a property of the
        learned function class, not a quirk of one training run.

