          - { kind: add-modifier, target: lab.market.acquisitionRate, operation: multiply, value: 0.5, durationWeeks: 52, tags: [deployment-restriction, complied] }
          - { kind: add-modifier, target: lab.product.durationWeeks, operation: multiply, value: 1.25, durationWeeks: 52, tags: [deployment-restriction, complied] }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.6, durationWeeks: 52, tags: [deployment-restriction, complied] }
        checks: []
        memories:
          - key: government.restriction.complied
