    displayName: Tomas Mikoloff
    inspirationName: Tomas Mikolov
    inspirationSummary: Neural-language-model and word2vec pioneer whose efficient representation-learning methods made linguistic relationships visible as geometry and shaped modern natural-language processing.
    epithet: The Vector Linguist
    role: Language modelling, representation learning, and efficient foundational AI
    rosterCardSummary: The word-vector pioneer who put kings, queens, cities, and countries into one geometric space and then waited patiently for everyone to stop doing arithmetic with royalty.
    biography: >-
      Tomáš Mikolov made neural language representations both practical and famous. His early work
      advanced recurrent neural-network language models, and at Google he led the development of
      word2vec: efficient continuous bag-of-words and skip-gram methods that learned useful word
      embeddings from enormous text corpora. The resulting vector spaces exposed regularities in
      syntax and meaning, giving natural-language processing a compact reusable representation
      layer. His recurrent-neural-network language models and freely released RNNLM toolkit had
      already shown that comparatively simple neural systems could learn strong statistical
      structure from text at practical scale. That work helped move language modelling away from
      manually assembled features and toward learned distributed representations well before the
      current generation of giant models. He later worked at Microsoft and Facebook AI Research on language modelling,
      representation learning, and systems capable of learning with less supervision. At the Czech
      Institute of Informatics, Robotics and Cybernetics he leads foundational-AI research focused
      on more autonomous and continually learning systems. Tomas's enduring preference is for
      methods simple enough to scale and efficient enough that the interesting structure appears
      before the compute budget files a complaint.
