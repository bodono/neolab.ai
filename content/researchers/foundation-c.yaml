  - id: researcher.max-willing
    version: 1
    displayName: Max Willing
    inspirationName: Max Welling
    inspirationSummary: A physicist-turned-machine-learning pioneer who co-created the variational autoencoder and graph convolutional networks, then brought both to AI for science.
    epithet: The Variational Physicist
    role: Bayesian deep learning, variational methods, and equivariant neural networks
    rosterCardSummary: A physicist-turned-machine-learning pioneer who co-created the variational autoencoder and graph convolutional networks, then brought both to AI for science.
    biography: >-
      Max Welling completed a theoretical-physics doctorate with Nobel laureate Gerard 't Hooft,
      then moved into machine learning through postdoctoral work with Pietro Perona and Geoffrey
      Hinton. He became professor of machine learning at the University of Amsterdam in 2013 and is
      also a Distinguished Scientist at Microsoft Research AI4Science. With Diederik Kingma he
      co-created the variational autoencoder, joining neural networks to variational Bayesian
      inference. The VAE's reparameterisation trick made a stochastic latent-variable model
      trainable by gradient descent, coupling an encoder, decoder, and variational lower bound. With
      Thomas Kipf he developed a scalable graph convolutional network, while later work made neural
      architectures respect rotations and other symmetries by construction. Graph convolutions
      passed local messages over structure; equivariant layers shared features across
      transformations, avoiding repeated lessons about rotation entirely. Max treats symmetry as
      free information supplied by the problem. Training a model to relearn it from scratch would be
      mathematically legal, but fiscally rude.
    availability: { wave: foundation, earliestYear: 2014, poolWeight: 0.50 }
    contract: { band: competitive, baseSalaryPerCycle: 0.49, baseSigningCash: 4, auraCost: 6, overrideExplanation: Priced on overall measured research strength. }
