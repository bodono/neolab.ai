      playerSummary: >-
        Wei and a large cross-institutional author list surveyed language-model capabilities that
        are essentially absent in smaller models but appear, sometimes fairly abruptly, once model
        scale crosses a certain threshold, meaning their emergence could not be predicted simply by
        extrapolating smaller models' performance curves. The paper argued this unpredictability
        itself was an important property for the field to take seriously.
      archiveExplanation: >-
        Many capability improvements from scaling language models are smooth and predictable: a
        bit more compute buys a bit better performance along a well-behaved curve. Wei and
        colleagues catalogued a different pattern across many published benchmarks: certain
        abilities showed near-random performance in smaller models and then improved sharply once
        model scale passed a certain threshold, a pattern they termed emergent because it was not
        visible as a continuation of smaller models' trends.

