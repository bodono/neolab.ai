        Clark and colleagues replaced the standard masked-language-model objective, predicting
        which word was hidden, with a more sample-efficient one: a small generator network
        proposes plausible replacement tokens, and the main model is trained to detect which
        tokens in the resulting text were replaced. Because every token, not just the masked ones,
        provides a training signal, the approach matched strong baselines using substantially less
        compute.
      archiveExplanation: >-
        Masked language modelling only produces a learning signal from the small fraction of
        tokens that were masked out, making pretraining compute-inefficient. Clark and colleagues
        instead trained a small generator network to propose plausible replacement tokens for
        some positions in the text, then trained the main discriminator model to classify every
        token in the resulting sequence as original or replaced. Since every position, not only
        the corrupted ones, now contributed to the training loss, the discriminator learned far
        more per unit of compute.

