  - id: researcher.timo-brooks
    version: 1
    displayName: Timo Brooks
    inspirationName: Tim Brooks
    inspirationSummary: InstructPix2Pix inventor and Sora co-creator who moved instruction-following diffusion from editable images to minute-long video world simulation.
    epithet: The One-Minute World Builder
    role: Video generation and world-simulation research leadership
    rosterCardSummary: A Berkeley-trained researcher who taught images to obey editing instructions, then gave a video model one uninterrupted minute to keep the laws of physics straight.
    biography: >-
      Tim Brooks works on generative models that must obey an instruction for longer than a single
      impressive frame. At Berkeley AI Research, advised by Alyosha Efros, Tim Brooks invented
      InstructPix2Pix: a diffusion model trained on examples generated with GPT-3 and Stable
      Diffusion to edit images from written instructions. He previously contributed to Pixel camera
      machine learning at Google and video generation at NVIDIA. After his PhD he joined OpenAI and
      co-created Sora; its technical report listed Brooks and Bill Peebles first among co-authors.
      Sora generated high-definition clips up to a minute long and framed video generation as a
      route toward simulating the physical world. Sora's training representation compressed video
      into latent patches, letting one transformer learn across differing durations, resolutions,
      and aspect ratios. He later worked on world models and multimodal generation for Gemini at
      Google DeepMind and now develops multimodal generative models at Meta Superintelligence Labs.
      His photography has won awards from National Geographic, Nature's Best Photography, and the
      National Wildlife Federation; he has also performed at Broadway's Beacon Theatre and received
      an international award for a cappella beatboxing. Tim's quality bar is gently inconvenient:
      the object should still exist, face the same way, and remember the lighting several seconds
      after the demo clip's prettiest frame.
    availability: { wave: frontier, earliestYear: 2023, poolWeight: 0.40 }
    contract: { band: competitive, baseSalaryPerCycle: 0.45, baseSigningCash: 4, auraCost: 6, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 2, reinforcementAgency: 0, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 1, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 0, securityContainment: 0, training: 3, product: 3, management: 3, politics: 1 }
    traits: [trait.world-simulator-ambition, trait.instruction-following-precision]
    signature:
      id: ability.temporally-consistent-video-generation
      label: Temporally Consistent Video Generation
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality] }
      rampWeeks: 5
      effects:
        - { target: domain.multimodality.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 5 }
    passive:
      id: ability.instruction-following-image-editing
      label: Instruction-Following Image Editing
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    compact:
      id: compact.physical-consistency-over-single-frame-quality
      label: Physical Consistency Over Single-Frame Quality
      requirement: Complete one temporal-and-physical-consistency evaluation every 52 weeks.
      check: { type: tagged-action-within, tags: [temporal-physical-consistency-evaluation], weeks: 52 }
      breachEvent: people.compact.physical-consistency-over-single-frame-quality
    paperHooks:
      ids: [paper.latent-diffusion-high-resolution-synthesis, paper.masked-autoencoders]
    eventReactions:
      - { triggerTag: benchmark-record, line: "One beautiful frame is easy. Show me the object staying in the same place ten seconds later." }
      - { triggerTag: architecture-fad, line: "Following a plain instruction reliably is a harder, more useful problem than generating one more impressive still image." }
      - { triggerTag: talent-poaching, line: "The world-simulator ambition travels with me. It rarely fits neatly inside one company's roadmap for long." }
    feedLines:
      - Timo's temporal-consistency check caught an object that quietly teleported three frames into a generated clip.
      - The instruction-following editing model followed a plainly worded correction that a text-to-image model would have ignored.
      - A generated video clip held a consistent light source for the full minute, which the team still treats as an achievement.
      - Timo's "world simulator" framing keeps showing up in how the team talks about the next physical-consistency benchmark.
      - A camera-quality trick from his search-company days quietly improved this quarter's video-generation sharpness.
      - The video model's causal consistency held under an adversarial prompt specifically designed to break continuity.
    portrait:
      assetId: portrait.researcher.timo-brooks
      brief: Focused 8-bit editorial portrait; light-skinned man with curly brown hair, a short beard, and a warm, ambitious expression, beside a video timeline holding one consistent object across several frames; world-building and precise, not photoreal.
      altText: Pixel-art portrait of Timo Brooks beside a video timeline holding a consistent object across several frames.
    sources:
      - https://www.timothybrooks.com/about/
      - https://instruct-pix2pix.timothybrooks.com/
      - https://openai.com/index/sora/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-22 }

  - id: researcher.billy-peebles
    version: 1
    displayName: Billy Peebles
    inspirationName: Bill Peebles
    inspirationSummary: Diffusion Transformer co-author and Sora research lead who replaced the U-Net backbone with transformer patches and scaled the design from images to video.
    epithet: The Patchwork World-Builder
    role: Diffusion transformer architectures and video generation research leadership
    rosterCardSummary: The researcher who removed diffusion models' customary U-Net, replaced it with a plain transformer, and watched the scaling curve improve rather than file a complaint.
    biography: >-
      Bill Peebles tested a piece of diffusion-model orthodoxy by removing it. With Saining Xie,
      Bill Peebles introduced the Diffusion Transformer, or DiT, replacing the usual U-Net backbone
      with a transformer operating on latent image patches. Peebles studied at MIT with Antonio
      Torralba and completed his Berkeley AI Research doctorate with Alyosha Efros. His DiT
      experiments found that larger models, measured by forward-pass compute, consistently improved
      image quality and that the largest set a new ImageNet benchmark. At OpenAI, he co-led the
      original Sora research with Tim Brooks. Sora treated videos as sequences of spacetime patches
      and used a diffusion-transformer architecture to generate clips with complex scenes, camera
      motion, and persistence over time. Peebles now heads Sora's video-generation and
      world-simulation effort. Bill Peebles's method is admirably direct: before adding a specialised
      component, remove it, measure what breaks, and remain professionally unsurprised when the
      scaling plot prefers the simpler architecture. He also interned at FAIR, Adobe Research, and
      NVIDIA before joining OpenAI.
    availability: { wave: frontier, earliestYear: 2023, poolWeight: 0.40 }
    contract: { band: competitive, baseSalaryPerCycle: 0.59, baseSigningCash: 5, auraCost: 8, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 2, reinforcementAgency: 0, multimodality: 5, reasoningTools: 0, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 4, interpretabilityEvals: 0, securityContainment: 0, training: 3, product: 2, management: 3, politics: 1 }
    traits: [trait.test-the-architectural-assumption, trait.spacetime-patch-thinker]
    signature:
      id: ability.diffusion-transformer-scaling
      label: Diffusion Transformer Scaling
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.architectures, domain.multimodality] }
      rampWeeks: 4
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.04 }
    passive:
      id: ability.predictable-scaling-with-compute
      label: Predictable Scaling With Compute
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4}
    compact:
      id: compact.test-the-backbone-assumption
      label: Test the Backbone Assumption
      requirement: Every 52 weeks while he leads Architectures, complete a backbone-necessity ablation.
      check: { type: assignment-requires-project-tag, assignmentTag: architecture-programme, projectTag: backbone-necessity-ablation, weeks: 52 }
      breachEvent: people.compact.test-the-backbone-assumption
    paperHooks:
      ids: [paper.vision-transformer, paper.denoising-diffusion-probabilistic-models]
    eventReactions:
      - { triggerTag: architecture-fad, line: "Remove the convolutional backbone and see what actually breaks. It is often less than people assume." }
      - { triggerTag: compute-windfall, line: "The transformer backbone scales more predictably with added compute. Spend the windfall where the scaling curve is honest." }
      - { triggerTag: benchmark-record, line: "Check whether the gain came from more spacetime patches or a genuinely new architectural idea." }
    feedLines:
      - Billy removed the convolutional backbone entirely, and the diffusion model's quality curve got more predictable, not worse.
      - The video model reasoned over another few thousand spacetime patches and kept a camera motion consistent across the clip.
      - Billy's backbone-necessity ablation, once again, found the assumed component was doing less than everyone believed.
      - A scaling curve for the diffusion transformer held its shape at a size nobody had specifically tested it at yet.
      - The launch credited Billy and a close collaborator by name, which the team treats as entirely fair.
      - A patch-based framing from Billy's earlier vision-architecture work quietly became this quarter's video-generation default.
    portrait:
      assetId: portrait.researcher.billy-peebles
      brief: Sharp 8-bit editorial portrait; light-skinned man with short brown hair, round glasses, and a curious expression, beside a video clip broken into spacetime patches feeding a transformer; scalable and precise, not photoreal.
      altText: Pixel-art portrait of Billy Peebles beside a video clip broken into spacetime patches feeding a transformer.
    sources:
      - https://www.wpeebles.com/
      - https://arxiv.org/abs/2212.09748
      - https://openai.com/index/video-generation-models-as-world-simulators/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-22 }

  - id: researcher.aidan-gomes
    version: 1
    displayName: Aidan Gomes
    inspirationName: Aidan Gomez
    inspirationSummary: Transformer co-author, Oxford DPhil, and Cohere co-founder and CEO who carried a NIPS deadline sprint into enterprise language-model building.
    epithet: The Enterprise Transformer
    role: Transformer architectures and enterprise AI laboratory leadership
    rosterCardSummary: A transformer co-author who slept in the office for the NIPS deadline, then co-founded Cohere while completing an Oxford doctorate—apparently deadlines scale too.
    biography: >-
      Aidan Gomez helped write the transformer paper before most people had decided it needed a
      name. At 20, while interning at Google Brain, Aidan Gomez joined the eight-author team behind
      "Attention Is All You Need." TIME reports that they slept in the office while racing to meet
      the NIPS 2017 deadline; the paper introduced the transformer architecture for sequence
      modelling. He studied at the University of Toronto, then completed a doctorate at Oxford
      under Yarin Gal and Yee Whye Teh. In 2019, during that doctorate, he co-founded Cohere and
      became its CEO. His Oxford profile also records earlier Google Brain work with Geoffrey Hinton
      and Łukasz Kaiser, and the founding of FOR.ai to connect academic and industrial researchers.
      Cohere builds enterprise AI models and products, while Cohere Labs runs an open-science
      research community. He chose enterprise deployment to close the gap between models explored
      in theory and AI systems used in customers' daily work. Aidan's career has retained the energy
      of that deadline night, except the submission system now has customers, security reviews, and
      a board.
    availability: { wave: frontier, earliestYear: 2020, poolWeight: 0.40 }
    contract: { band: competitive, baseSalaryPerCycle: 0.59, baseSigningCash: 5, auraCost: 8, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 2, reinforcementAgency: 0, multimodality: 1, reasoningTools: 3, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 1, interpretabilityEvals: 1, securityContainment: 3, training: 3, product: 4, management: 5, politics: 4 }
    traits: [trait.enterprise-grade-discipline, trait.founding-conviction]
