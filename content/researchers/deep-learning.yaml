    role: Recurrent networks, credit assignment, and research history
    rosterCardSummary: An LSTM co-creator whose long-memory research advances sequence models and helps specialised knowledge travel farther through the lab.
    biography: >-
      Jürgen Schmidhuber gives a recurrent network permission to remember what happened several
      chapters ago. Jürgen Schmidhuber co-authored long short-term memory with Sepp Hochreiter in
      1997, introducing gated memory cells designed to address long-range error flow in recurrent
      networks. His research pages also document work on artificial curiosity, reinforcement
      learning, self-referential systems, compression, and general problem solvers. He served as
      director of the Swiss AI Lab IDSIA and later joined King Abdullah University of Science and
      Technology as a professor of artificial intelligence. His publications also cover neural
      compression and universal problem solvers. Across this broad programme, the through-line is
      long-horizon credit assignment and learning systems that improve their own procedures. His
      pages trace that programme across decades. Jürgen's own record keeps the chronology unusually
      visible: the sequence may be long, but the citation graph insists that history had an order
      too.
