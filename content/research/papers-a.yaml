    historicalNote: >-
      Posted in 2023, DPO simplified alignment from human preferences by removing the separate reward
      model and reinforcement-learning loop, making preference tuning far easier to run.
    education:
      playerSummary: >-
        Aligning a model to human preferences with RLHF is powerful but fiddly: you train a separate
        reward model, then use reinforcement learning to optimise against it, a process that is
        unstable and hard to tune. DPO shows you can skip both steps. With a bit of algebra, the
        preference data can be turned into a simple classification-style loss that adjusts the model
        directly, achieving similar alignment far more stably and cheaply.
      archiveExplanation: >-
        The paper's elegant result is that the optimal policy under the usual RLHF objective has a
        closed-form relationship to the reward, which lets you express the reward implicitly in terms
        of the policy itself. Substituting this back turns preference learning into a single
        supervised objective on pairs of preferred and dispreferred responses, no reward model and no
        RL rollouts required.

        The practical effect was to democratise preference tuning. A technique that had needed a
        specialised, temperamental pipeline became a stable training run within reach of far more
        teams, accelerating the proliferation of instruction-tuned and preference-aligned models and
        shifting a great deal of subsequent alignment research onto the simpler footing.

        Neolab.ai treats DPO as an alignment-and-productisation multiplier that raises the lab's
        alignment research output and makes preference tuning cheaper to apply.
      insideBaseball: It turned out the reward model was hiding inside the policy the whole time, which the reward-model team received with professional grace.
