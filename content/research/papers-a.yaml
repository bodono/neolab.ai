  - id: paper.alphafold-protein-structure-potentials
    version: 1
    historicity: real
    gameOrder: 135
    title: Improved protein structure prediction using potentials from deep learning
    authors: [Andrew W. Senior, Richard Evans, John Jumper, James Kirkpatrick, Laurent Sifre, Tim Green, Chongli Qin, Augustin Žídek, Alexander W. R. Nelson, Alex Bridgland, Hugo Penedones, Stig Petersen, Karen Simonyan, Steve Crossan, Pushmeet Kohli, David T. Jones, David Silver, Koray Kavukcuoglu, Demis Hassabis]
    publicationYear: 2020
    venue: Nature
    primarySourceUrl: https://www.nature.com/articles/s41586-019-1923-7
    doi: 10.1038/s41586-019-1923-7
    historicalNote: >-
      The first AlphaFold, which won CASP13 in 2018 and was published in Nature in 2020. It
      predicted inter-residue distance distributions with a deep network and then optimised a
      structure against them, a decisive but still two-stage approach that AlphaFold 2 replaced.
    education:
      playerSummary: >-
        AlphaFold 1 treated protein folding as a distance-prediction problem: a deep residual
        network read a sequence and its evolutionary relatives, predicted a probability
        distribution over the distance between every pair of residues, and a separate optimiser
        then found the shape that best satisfied those predicted distances. It won CASP13 by a
        clear margin and established that learned statistical potentials beat decades of
        hand-built physics for this problem, without yet producing structures at experimental
        accuracy.
      archiveExplanation: >-
        Predicting a protein's folded shape from its amino-acid sequence had resisted fifty years
        of effort. The dominant approaches built energy functions from physical chemistry and
        searched for a minimum, or assembled fragments from known structures, and both plateaued
        well short of usefulness for unsolved proteins.

        AlphaFold 1 changed what was being predicted. Instead of a structure directly, the network
        predicted a full probability distribution over the distance separating each pair of
        residues, learned from the co-evolutionary signal in multiple sequence alignments. Those
        distributions were then converted into a differentiable potential and a structure was
        optimised against it by gradient descent. The separation is the point: a learned statistical
        potential replaced a hand-designed physical one, and the optimiser only had to satisfy it.

        The two-stage design was also its limit. The network never saw the structure it was
        producing, so it could not reason about geometry directly, and accuracy remained short of
        experimental methods. AlphaFold 2 collapsed the two stages into a single end-to-end model
        that reasons over structure while it predicts, which is why this paper reads as a decisive
        proof of the approach rather than the solution itself. Neolab.ai treats it as the unlock
        that opens learned structural biology, with the accuracy that changed the field arriving in
        the successor it makes possible.
      insideBaseball: Fifty years of physics-based energy functions, beaten by predicting how far apart two things probably are.
    domainWeights:
      domain.scientific-ai: 0.60
      domain.architectures: 0.25
      domain.optimisation-scaling: 0.15
    prerequisites:
