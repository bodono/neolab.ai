researchers:
  - id: researcher.lucas-kaiser
    version: 1
    displayName: Lucas Kaiser
    inspirationName: Łukasz Kaiser
    inspirationSummary: Transformer and Tensor2Tensor co-creator whose work helped turn attention-based sequence models into the general-purpose architecture behind modern language and multimodal systems.
    epithet: The Attention Engineer
    role: Transformer architectures, sequence modelling, and frontier-model systems
    rosterCardSummary: A transformer architect who helped prove that attention could carry the sequence alone, thereby condemning the rest of computing to explain what a head is.
    biography: >-
      Łukasz Kaiser helped create the architecture that reorganised modern AI. At Google Brain he
      co-authored “Attention Is All You Need,” introducing the Transformer as a sequence model built
      around attention rather than recurrence or convolution. He also co-created Tensor2Tensor,
      which made strong sequence-model recipes easier to reproduce across translation, language,
      image, and speech tasks. Later work at OpenAI included code models and frontier multimodal
      systems, carrying the same concern for architectures that scale cleanly across tasks. His
      wider research includes neural theorem proving, discrete latent-variable models, and
      multilingual language systems, repeatedly turning specialised problems into reusable
      architectures. Tensor2Tensor itself paired a research library with a catalogue of datasets,
      making comparison and replication part of the engineering rather than an afterthought. His
      research combines mathematical competition instincts, practical systems engineering, and a
      preference for ideas simple enough to become infrastructure. The lab should be warned that
      once Łukasz removes an unnecessary component, an entire field may spend the next five years
      naming increasingly elaborate versions of what remains.
    availability: { wave: foundation, earliestYear: 2017, poolWeight: 0.40 }
    contract: { band: major, baseSalaryPerCycle: 0.75, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 4, dataRepresentation: 4, reinforcementAgency: 1, multimodality: 3, reasoningTools: 4, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 1, interpretabilityEvals: 2, securityContainment: 0, training: 4, product: 3, management: 3, politics: 1 }
    traits: [trait.architectural-simplicity, trait.sequence-systems-rigour]
    signature:
      id: ability.attention-first-architecture
      label: Attention-First Architecture
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.architectures, domain.reasoning-tools] }
      rampWeeks: 5
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.03, stackingGroup: programme-rp }
    passive:
      id: ability.reusable-sequence-recipes
      label: Reusable Sequence Recipes
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.02 }
    compact:
      id: compact.ablate-before-you-ornament
      label: Ablate Before You Ornament
      requirement: Every 52 weeks while leading architecture research, complete a plain-baseline comparison before adding another mechanism.
      check: { type: assignment-requires-project-tag, assignmentTag: architecture-programme, projectTag: plain-baseline-comparison, weeks: 52 }
      breachEvent: people.compact.ablate-before-you-ornament
    paperHooks:
      ids: [paper.transformer, paper.codex-evaluating-code-models]
    eventReactions:
      - { triggerTag: architecture-fad, line: "Remove the fashionable part and rerun it. If the score stays, we have learned something inexpensive." }
      - { triggerTag: scaling-proposal, line: "A scalable recipe should survive contact with a second task before it receives a larger cluster." }
      - { triggerTag: reasoning-benchmark-record, line: "Attention helped build the result. It did not exempt us from checking what the model attended to." }
    feedLines:
      - Lucas removed a recurrent component, and the sequence model improved out of apparent relief.
      - The architecture team turned one careful attention ablation into three fewer months of speculation.
      - A Tensor2Tensor-era instinct for reusable recipes made the new model work on a second modality before lunch.
      - Lucas asked for the plain baseline; the meeting became shorter and the result became stronger.
      - The transformer scaling plan now has fewer moving parts and considerably more GPUs attached to it.
      - An attention head acquired a fashionable name, and Lucas quietly labelled it head 17 in the spreadsheet.
    portrait:
      assetId: portrait.researcher.lucas-kaiser
      brief: Composed 8-bit editorial portrait; light-skinned Polish man with a high receding hairline, very short dark-brown hair, no glasses, and a clean-shaven face, beside an attention map replacing a recurrent sequence diagram; precise and understated, not photoreal.
      altText: Pixel-art portrait of Lucas Kaiser, a clean-shaven man with very short dark hair and a high receding hairline, beside a transformer attention map.
    sources:
      - https://arxiv.org/abs/1706.03762
      - https://github.com/tensorflow/tensor2tensor
      - https://openai.com/index/openai-codex/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-08-12 }

  - id: researcher.aaron-van-den-oord
    version: 1
    displayName: Aaron van den Oord
    inspirationName: Aäron van den Oord
    inspirationSummary: Google DeepMind research scientist and generative-model pioneer whose work on PixelRNN, PixelCNN, WaveNet, VQ-VAE, and contrastive predictive coding reshaped how machines generate and represent images, speech, and other signals.
    epithet: The Generative Signal Architect
    role: Generative media, representation learning, neural audio, and multimodal systems
    rosterCardSummary: A generative-model pioneer who taught neural networks to draw pixels and speak in waveforms, one prediction at a time, before anyone had arranged a sensible inference budget.
    biography: >-
      Aäron van den Oord is a research scientist at Google DeepMind whose work helped turn
      generative modelling from an impressive image experiment into a foundation for modern audio,
      representation learning, and multimodal media. He led the research behind PixelRNN and
      PixelCNN, then asked whether the same autoregressive idea could predict raw sound. The result
      was WaveNet, which generated speech one audio sample at a time and rapidly moved from a
      two-week prototype to voices used across Google products. He subsequently co-created VQ-VAE,
      giving neural networks learned discrete representations, and introduced contrastive
      predictive coding as a way to learn useful structure by predicting the future in latent
      space. Those ideas now recur throughout speech, image, video, and multimodal generation,
      while his later Google DeepMind work includes core contributions to Imagen 3. The common
      instinct is to find the representation that makes an apparently impossible signal tractable.
      Aäron can make the machine breathe naturally; the finance team would still prefer that it do
      so in fewer than 24,000 sequential decisions per second.
    availability: { wave: foundation, earliestYear: 2016, poolWeight: 0.40 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1, baseSigningCash: 9, auraCost: 14, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 4, dataRepresentation: 5, reinforcementAgency: 1, multimodality: 5, reasoningTools: 3, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 1, interpretabilityEvals: 3, securityContainment: 0, training: 5, product: 4, management: 4, politics: 1 }
    traits: [trait.generative-signal-instinct, trait.discrete-representation-craft]
    signature:
      id: ability.learn-the-codebook
      label: Learn the Codebook
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.data-representation, domain.multimodality] }
      rampWeeks: 5
      effects:
        - { target: domain.data-representation.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: domain.multimodality.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    passive:
      id: ability.prototype-to-voice
      label: Prototype to Voice
      effects:
        - { target: lab.product.durationWeeks, operation: add, value: -1 }
    compact:
      id: compact.listen-to-the-samples
      label: Listen to the Samples
      requirement: Every 52 weeks while leading multimodal research, complete a cross-modality generative evaluation rather than trusting the aggregate score.
      check: { type: assignment-requires-project-tag, assignmentTag: multimodal-programme, projectTag: cross-modality-technique-evaluated, weeks: 52 }
      breachEvent: people.compact.listen-to-the-samples
    paperHooks:
      ids: [paper.wavenet-raw-audio]
    eventReactions:
      - { triggerTag: multimodal-breakthrough, line: "Good. Now inspect the samples. An average score has never had to listen to itself breathe." }
      - { triggerTag: scaling-proposal, line: "Scale the model after we know which representation is carrying the signal." }
      - { triggerTag: product-launch, line: "A prototype becomes a product when it can generate the next second before the listener has left the room." }
    feedLines:
      - Aaron replaced a continuous bottleneck with a learned codebook and the representation became more useful by becoming discrete.
      - The audio model learned when to breathe; the team is trying not to interpret this as a request for office space.
      - A PixelCNN experiment produced a beautiful image one inconvenient prediction at a time.
      - The multimodal team listened to the samples and discovered what the aggregate score had politely omitted.
      - Contrastive prediction found useful structure without asking anyone to label every frame.
      - Aaron compressed a difficult signal into a representation the next model could finally afford to understand.
    portrait:
      assetId: portrait.researcher.aaron-van-den-oord
      brief: Warm 8-bit editorial portrait; light-skinned Belgian man with thick short swept dark-brown hair, a neatly trimmed short dark-brown beard and moustache, no glasses, and a calm friendly expression, beside an audio waveform resolving into a discrete codebook and a grid of generated pixels; thoughtful and technically playful, not photoreal.
      altText: Pixel-art portrait of Aaron van den Oord, with swept dark-brown hair and a short dark-brown beard, beside a waveform resolving into discrete codes and generated pixels.
    sources:
      - https://avdnoord.github.io/homepage/
      - https://deepmind.google/research/wavenet/
      - https://arxiv.org/abs/1711.00937
      - https://arxiv.org/abs/1807.03748
      - https://storage.googleapis.com/deepmind-media/imagen/imagen_3_tech_report_update_dec2024_v2.pdf
      - https://www.innovatorsunder35.com/the-list/%C3%A4ron-van-den-oord/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-08-27 }

  - id: researcher.judea-perle
    version: 1
    displayName: Judea Perle
    inspirationName: Judea Pearl
    inspirationSummary: Turing Award-winning pioneer of Bayesian networks and causal inference whose work gave AI a formal language for asking not only what correlates, but what would happen if we intervened.
    epithet: The Causal Revolutionary
    role: Causal reasoning, probabilistic models, and scientific inference
    rosterCardSummary: The causal-inference pioneer who insists that prediction is not explanation, especially when the regression has begun behaving like a philosophy department.
    biography: >-
      Judea Pearl gave artificial intelligence a practical mathematics for reasoning under
      uncertainty and a formal language for causality. At UCLA he developed foundational methods
      for Bayesian networks, probabilistic graphical models, and belief propagation, then helped
      establish causal diagrams, interventions, and counterfactual reasoning as a distinct
      scientific toolkit. The Association for Computing Machinery awarded him the 2011 Turing
      Award for fundamental contributions to artificial intelligence through probabilistic and
      causal reasoning. His books range from the technical “Probabilistic Reasoning in Intelligent
      Systems” and “Causality” to “The Book of Why,” written with Dana Mackenzie. Pearl's hierarchy
      of association, intervention, and counterfactuals is a standing reminder that predicting an
      outcome is not the same as understanding how to change it. The framework now shapes work in
      epidemiology, economics, social science, and machine learning wherever interventions matter
      and controlled experiments are unavailable. He also helped make graphical models into a
      common language through which statisticians, computer scientists, and domain experts could
      argue precisely about assumptions. Judea will accept a beautiful
      correlation as evidence that the team has found a beautiful correlation, and no more.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.28 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1, baseSigningCash: 9, auraCost: 14, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 1, dataRepresentation: 5, reinforcementAgency: 2, multimodality: 0, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 5, alignmentControl: 2, interpretabilityEvals: 4, securityContainment: 0, training: 1, product: 1, management: 4, politics: 4 }
    traits: [trait.causal-identification-discipline, trait.counterfactual-insistence]
    signature:
      id: ability.ladder-of-causation
      label: Ladder of Causation
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.data-representation, domain.reasoning-tools, domain.scientific-ai] }
      rampWeeks: 6
      effects:
        - { target: domain.data-representation.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: domain.scientific-ai.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    passive:
      id: ability.causal-evidence-discipline
      label: Causal Evidence Discipline
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 6 }
    compact:
      id: compact.intervene-dont-merely-predict
      label: Intervene, Don't Merely Predict
      requirement: Every 52 weeks while leading reasoning or scientific AI, complete a causal intervention test rather than another correlational benchmark.
      check: { type: assignment-requires-project-tag, assignmentTag: reasoning-programme, projectTag: causal-intervention-test, weeks: 52 }
      breachEvent: people.compact.intervene-dont-merely-predict
    paperHooks:
      ids: [paper.world-models, paper.alphafold2-protein-structure]
    eventReactions:
      - { triggerTag: scientific-breakthrough, line: "Now intervene on the mechanism. A discovery should survive more than admiration." }
      - { triggerTag: benchmark-record, line: "The model predicts the answer. We have not yet shown that it understands what would change the answer." }
      - { triggerTag: capability-surprise, line: "A surprise is an invitation to redraw the causal graph, not to add another adjective to the press release." }
    feedLines:
      - Judea replaced a leaderboard argument with a causal diagram and three uncomfortable intervention tests.
      - The model predicted the trial perfectly, then failed the counterfactual; the distinction is now on every whiteboard.
      - A belief-propagation review found the hidden assumption carrying most of the scientific claim.
      - Judea asked what would happen under intervention, and the benchmark stopped looking finished.
      - The causal graph acquired one fewer arrow and the research claim acquired considerably more credibility.
      - A correlation survived the meeting, but only after being clearly labelled as one.
    portrait:
      assetId: portrait.researcher.judea-perle
      brief: Distinguished 8-bit editorial portrait; elderly light-skinned man with short grey hair, a full short grey beard and moustache, and dark rectangular glasses, beside a causal graph whose arrows lead from observation to intervention to counterfactual; warm, exacting, and unmistakably scholarly, not photoreal.
      altText: Pixel-art portrait of Judea Perle, an elderly man with short grey hair, a grey beard, and dark glasses, beside a causal diagram.
    sources:
      - https://samueli.ucla.edu/people/judea-pearl/
      - https://amturing.acm.org/award_winners/pearl_2658896.cfm
      - https://bayes.cs.ucla.edu/WHY/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-08-12 }

  - id: researcher.timothy-lillicroft
    version: 1
    displayName: Timothy Lillicroft
    inspirationName: Timothy Lillicrap
    inspirationSummary: Google DeepMind research director and reinforcement-learning scientist whose work on continuous control, actor-critic agents, planning, and neuroscience connects capable agents to the mechanisms that produce them.
    epithet: The Continuous Controller
    role: Reinforcement learning, continuous control, planning, and agent neuroscience
    rosterCardSummary: A reinforcement-learning researcher who taught agents to control continuous actions, then asked whether the brain had been quietly running a better experiment all along.
    biography: >-
      Timothy Lillicrap studies how agents learn to act, plan, and reason. At Google DeepMind he has
      led research spanning continuous-control reinforcement learning, model-based planning,
      biologically inspired learning, and the computational principles shared by brains and
      machines. He co-authored Deep Deterministic Policy Gradient, which brought actor-critic deep
      reinforcement learning to high-dimensional continuous action spaces, and contributed to the
      research programmes behind AlphaGo, AlphaZero, AlphaStar, and MuZero. His work also examines
      credit assignment and alternatives to strict backpropagation, using neuroscience not as
      decoration but as a source of testable computational ideas. Trained in systems neuroscience
      and neuroinformatics, he has kept biological learning mechanisms in productive conversation
      with the engineering demands of deep networks. That perspective makes questions about memory,
      credit, and planning mechanisms rather than labels pasted onto an agent after it succeeds.
      Recent research connects learned
      world models and reinforcement learning to reasoning in games and beyond. Timothy tends to
      regard a discrete action menu as a polite simplification offered by the environment, and not
      one the real world is obliged to provide.
    availability: { wave: foundation, earliestYear: 2016, poolWeight: 0.36 }
    contract: { band: major, baseSalaryPerCycle: 0.75, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 3, optimisationScaling: 3, dataRepresentation: 3, reinforcementAgency: 5, multimodality: 1, reasoningTools: 4, roboticsEmbodiment: 4, scientificAi: 3, alignmentControl: 2, interpretabilityEvals: 3, securityContainment: 0, training: 4, product: 1, management: 4, politics: 1 }
    traits: [trait.continuous-control-instinct, trait.neuroscience-bridge-building]
    signature:
      id: ability.continuous-actor-critic
      label: Continuous Actor-Critic
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.reinforcement-agency, domain.robotics-embodiment] }
      rampWeeks: 5
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: domain.robotics-embodiment.researchOutput, operation: multiply, value: 1.03, stackingGroup: programme-rp }
    passive:
      id: ability.planning-agent-diagnostics
      label: Planning-Agent Diagnostics
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    compact:
      id: compact.test-the-agent-off-policy
      label: Test the Agent Off Policy
      requirement: Every 52 weeks while leading agent research, complete an off-policy robustness evaluation in an unfamiliar environment.
      check: { type: assignment-requires-project-tag, assignmentTag: reinforcement-programme, projectTag: off-policy-robustness-evaluation, weeks: 52 }
      breachEvent: people.compact.test-the-agent-off-policy
    paperHooks:
      ids: [paper.alphago, paper.muzero-learned-model-planning]
    eventReactions:
      - { triggerTag: autonomy-incident, line: "The policy found an action we failed to put on the evaluation menu. That is our measurement failure first." }
      - { triggerTag: benchmark-saturation, line: "Move it into a continuous environment. The tidy action space has been doing more work than the agent." }
      - { triggerTag: capability-surprise, line: "Find the learned model behind the behaviour. Surprises become useful once they have a mechanism." }
    feedLines:
      - Timothy's continuous-control agent stopped wobbling and started making the robotics team nervous for more interesting reasons.
      - An off-policy probe found a strategy the benchmark's tidy action menu had concealed.
      - The world model predicted its own control failure one rollout before the hardware discovered it.
      - A neuroscience-inspired credit-assignment experiment survived contact with the engineering dashboard.
      - Timothy replaced a scripted manoeuvre with a learned policy and then doubled the evaluation budget.
      - The agent planned through an unfamiliar game; Timothy immediately asked for a less game-like world.
    portrait:
      assetId: portrait.researcher.timothy-lillicroft
      brief: Focused 8-bit editorial portrait; light-skinned man with long dark hair tied back, a dark moustache and short goatee, no glasses, and a black shirt, beside a continuous-control trajectory curling through a game and robotics workspace; thoughtful and distinctly masculine, not photoreal.
      altText: Pixel-art portrait of Timothy Lillicroft, a man with tied-back dark hair, a moustache, and a short goatee, beside a continuous-control trajectory.
    sources:
      - https://contrastiveconvergence.net/
      - https://events.stanford.edu/event/mbct-seminar-timothy-lillicrap-talk-title-tba
      - https://arxiv.org/abs/1509.02971
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-08-12 }

  - id: researcher.trevor-darnell
    version: 1
    displayName: Trevor Darnell
    inspirationName: Trevor Darrell
    inspirationSummary: Berkeley computer-vision professor and BAIR leader whose research spans recognition, multimodal learning, domain adaptation, embodied perception, and systems that connect visual understanding to the world.
    epithet: The Visual Generalist
    role: Computer vision, multimodal learning, domain adaptation, and embodied perception
    rosterCardSummary: A computer-vision institution builder who would like the model to recognise the object, explain the context, and still work after someone changes the camera.
    biography: >-
      Trevor Darrell has helped shape modern computer vision from object recognition to multimodal
      and embodied intelligence. He is a professor at UC Berkeley, where his research covers visual
      recognition, machine learning, multimodal perception, domain adaptation, and human-centred
      systems. Before Berkeley he served on the MIT faculty, working across computer vision,
      graphics, and perceptual interfaces. At Berkeley he has helped build large collaborative
      research communities, including the Berkeley Artificial Intelligence Research laboratory,
      while advising generations of researchers across vision and machine learning. He has also
      connected academic research to practical systems through work on autonomous driving,
      human-centred AI, and technology transfer, without reducing vision to a product demo. The
      breadth matters: recognition, language, robotics, and interfaces all test whether a visual
      representation survives contact with another part of intelligence. His work asks
      models to survive changes of domain, viewpoint, data source, and task rather than merely
      recognise a familiar benchmark from a flattering angle. Trevor is happy for a model to have
      a point of view; he would simply prefer that its entire competence not depend on keeping it.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.34 }
    contract: { band: major, baseSalaryPerCycle: 0.75, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 3, optimisationScaling: 2, dataRepresentation: 4, reinforcementAgency: 2, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 4, scientificAi: 2, alignmentControl: 1, interpretabilityEvals: 3, securityContainment: 0, training: 3, product: 3, management: 5, politics: 3 }
    traits: [trait.domain-shift-scepticism, trait.vision-institution-builder]
    signature:
      id: ability.domain-robust-perception
      label: Domain-Robust Perception
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality, domain.robotics-embodiment] }
      rampWeeks: 5
      effects:
        - { target: domain.multimodality.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: domain.robotics-embodiment.researchOutput, operation: multiply, value: 1.03, stackingGroup: programme-rp }
    passive:
      id: ability.cross-domain-review
      label: Cross-Domain Review
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    compact:
      id: compact.change-the-camera
      label: Change the Camera
      requirement: Every 52 weeks while leading vision research, complete an out-of-domain visual evaluation using a different data source or sensor.
      check: { type: assignment-requires-project-tag, assignmentTag: vision-programme, projectTag: out-of-domain-vision-evaluation, weeks: 52 }
      breachEvent: people.compact.change-the-camera
    paperHooks:
      ids: [paper.imagenet-database, paper.faster-rcnn-object-detection]
    eventReactions:
      - { triggerTag: benchmark-record, line: "Excellent. Now change the camera, the lighting, the country, and the annotator." }
      - { triggerTag: embodiment-failure, line: "Recognition without embodied context is a very confident caption attached to the wrong world." }
      - { triggerTag: architecture-fad, line: "Show me the domain shift. The backbone can wait until we know what actually broke." }
    feedLines:
      - Trevor changed the camera and the benchmark record became an ordinary Tuesday.
      - A domain-adaptation pass recovered performance on data nobody had polished for publication.
      - The vision model recognised the object and, after further prompting from Trevor, the room it was actually in.
      - A cross-lab review connected the robotics and multimodal teams before their datasets acquired incompatible ontologies.
      - Trevor's out-of-domain test found that the model's celebrated robustness ended at the campus boundary.
      - The revised perception stack now works in bad lighting, which has reduced the prestige of several demos.
    portrait:
      assetId: portrait.researcher.trevor-darnell
      brief: Confident 8-bit editorial portrait; light-skinned man with thick short-to-medium dark brown hair greying at the temples, no glasses, and a clean-shaven face, beside multiple cameras viewing one object across changing domains; broad, practical, and professorial, not photoreal.
      altText: Pixel-art portrait of Trevor Darnell, a clean-shaven man with thick dark hair greying at the temples, beside a cross-domain computer-vision display.
    sources:
      - https://www2.eecs.berkeley.edu/Faculty/Homepages/darrell.html
      - https://bair.berkeley.edu/
      - https://people.eecs.berkeley.edu/~trevor/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-08-12 }

  - id: researcher.rob-fergan
    version: 1
    displayName: Rob Fergan
    inspirationName: Rob Fergus
    inspirationSummary: NYU computer-vision professor and pioneering deep-learning researcher whose work spans visual recognition, unsupervised representation learning, computational photography, and adversarial examples.
    epithet: The Feature Detective
    role: Visual representation learning, recognition, and adversarial vision
    rosterCardSummary: A visual-learning pioneer who has spent years asking neural networks what they see, then checking whether one carefully placed pixel changes the testimony.
    biography: >-
      Rob Fergus is a professor of computer science at New York University whose work helped bring
      learned representations back to the centre of computer vision. His research spans object
      recognition, unsupervised and self-supervised learning, computational photography,
      generative models, and the analysis of what deep networks learn. He contributed to the early
      deep-learning revival in vision and later helped expose the surprising fragility of neural
      networks through work on adversarial examples. He was also a founding research leader at
      Facebook AI Research, connecting academic vision research to large-scale machine-learning
      systems. Earlier work on object categories, scene understanding, and computational
      photography helped replace hand-designed visual pipelines with learned ones while retaining
      a scientist's interest in what each stage represents. His students and collaborators have
      carried that combination of strong models and diagnostic curiosity across modern vision.
      Across these projects, the consistent habit is to inspect internal features rather
      than treating accuracy as a sufficient explanation. Rob will admire a model's perception
      right up to the moment a small perturbation persuades it that the fire engine is a toaster.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.38 }
    contract: { band: major, baseSalaryPerCycle: 0.75, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 4, optimisationScaling: 2, dataRepresentation: 5, reinforcementAgency: 0, multimodality: 5, reasoningTools: 1, roboticsEmbodiment: 1, scientificAi: 1, alignmentControl: 1, interpretabilityEvals: 4, securityContainment: 1, training: 3, product: 3, management: 4, politics: 1 }
    traits: [trait.feature-visualisation-curiosity, trait.adversarial-image-scepticism]
    signature:
