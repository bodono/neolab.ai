    feedLines:
      - Zico's robustness review sent a proposed launch back for one more adversarial test before it reached the board.
      - A department-head's institutional authority quietly resolved a dispute between two teams over a safety review's scope.
      - Zico's committee seat meant a risky decision got scrutinised by someone with real robustness research behind the scepticism.
      - A student from Zico's CMU lab caught an adversarial vulnerability the internal security team's own review had missed.
      - The Safety and Security Committee's recommendation carried real weight this quarter, and Zico's name was on it.
