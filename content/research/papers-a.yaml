    title: "GPipe: Easy Scaling with Micro-Batch Pipeline Parallelism"
    authors: [Yanping Huang, Youlong Cheng, Ankur Bapna, Orhan Firat, Mia Xu Chen, Dehao Chen, HyoukJoong Lee, Jiquan Ngiam, Quoc V. Le, Yonghui Wu, Zhifeng Chen]
    publicationYear: 2018
    venue: arXiv preprint / NeurIPS 2019
    primarySourceUrl: https://arxiv.org/abs/1811.06965
    arxiv: "1811.06965"
    historicalNote: >-
      Posted in 2018, this paper split a network into sequential stages across accelerators and
      pipelined micro-batches through them, scaling a transformer to 83.9 billion parameters at
      the time.
    education:
      playerSummary: >-
        Huang and colleagues split a deep network into sequential groups of layers placed on
        separate accelerators, then pipelined many small micro-batches through those stages so
        devices stayed busy rather than waiting idly for each other. The technique scaled a
        transformer model to 83.9 billion parameters, a roughly 300-fold increase over what fit on
        a single accelerator at the time.
      archiveExplanation: >-
        The most direct way to split a model larger than one accelerator's memory across several
        devices is to place different groups of layers on different accelerators. Naively, this
        leaves most devices idle most of the time, since each waits for the previous stage to
        finish an entire batch before starting. Huang and colleagues instead split each mini-batch
        into many smaller micro-batches and pipelined them through the sequential stages, so
        multiple devices could be usefully working on different micro-batches simultaneously,
        synchronising gradients only once per full mini-batch.

        This pipeline-parallel approach scaled a transformer model to 83.9 billion parameters
        across 128 accelerator partitions, an enormous increase over single-device limits, while
        requiring minimal changes to the underlying model code. Combined with intra-layer
        parallelism techniques published around the same time, pipelining became one of the
        standard tools for training extremely large models.

        Pipeline parallelism introduces "bubble" idle time at the start and end of each pipeline
        fill, and deep pipelines can add latency even when throughput improves. Neolab.ai treats
        this as a core optimisation-scaling unlock, complementary to intra-layer parallelism,
        underpinning the player's frontier-scale training infrastructure.
      insideBaseball: The micro-batches move through the pipeline like a assembly line. The line workers, notably, are GPUs and do not unionise.
