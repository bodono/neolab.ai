rules:
  skillScale: { min: 0, max: 5 }
  visibleDomainScale: { min: 0, max: 100 }
  paperDomainWeightTolerance: 0.0001
  unfundedDomainsProduceProgress: false
  production:
    # 400 TFLOP/s equals the former 100 opening-era Kepler GPU calibration.
    teraflopScaleDivisor: 400
    # Research output = baseCoefficient * (teraflops / teraflopScaleDivisor) ^ gpuExponent
    #
    # Tuned 2026-07-30 to accelerate the opening without touching the late game,
    # which is untested. Only the EXPONENT can do that: the divisor contributes a
    # constant factor (400/D)^gpuExponent, so changing it is the same uniform
    # scaling as changing baseCoefficient, at every fleet size.
    #
    # Lowering the exponent flattens the curve and the coefficient is raised to
    # pin the top back where it was. Low-end gain is exactly
    # (T_high / T_low) ^ (0.68 - gpuExponent); across the observed programme
    # range of roughly 800 to 200,000 TF/s that is about 2x at the opening, 1.3x
    # mid-game, and 1.0x at the end.
    #
    # Note this also flattens returns to scale: a large fleet is worth
    # relatively less than it was, so a small lab competes better against a
    # compute-rich rival. That is a strategy change, not only a pace change.
    baseCoefficient: 0.675
    gpuExponent: 0.56
    lowLevelRpPerPoint: 50
    # Capability research must remain purchasable near level 80 because it is
    # the dominant input to FC-88 candidacy. Safety research has only three
    # programmes rather than seven capability domains and previously saturated
    # long before the endgame, so it uses a deliberately steeper curve. The
    # small per-programme multipliers remain within +/-2%; the branch-level
    # curve, rather than a hidden fixed discount, now creates the cost gap.
    levelCostGrowth: 1.1
    safetyLevelCostGrowth: 1.15
    levelCostGrowthFromLevel: 20
    levelCostBands:
      - { afterLevel: 0, multiplier: 1.0 }
    generalResearcherContribution: 0.0125
    talentMultiplier: { min: 0.8, max: 2.2 }
    facilityContribution: 0.03
    facilityMultiplierMax: 1.6
    weeklyVariance: { min: 0.90, mode: 1.0, max: 1.10 }
    modelAssistBase: 1.0
    contextSwitchMultiplier: 0.95
  genericAdvanceThresholds: [20, 40, 60, 80, 100]
