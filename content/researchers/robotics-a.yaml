  - id: researcher.dieter-foxx
    version: 1
    displayName: Dieter Foxx
    inspirationName: Dieter Fox
    inspirationSummary: University of Washington professor, Ai2 senior research director, and co-author of Probabilistic Robotics, the textbook on perception and control under uncertainty.
    epithet: The Robot's Probabilistic Satnav
    role: Robot perception, state estimation, and manipulation research leadership
    rosterCardSummary: A University of Washington professor whose probabilistic-robotics textbook taught a generation of robots—and roboticists—to admit when they do not quite know where they are.
    biography: >-
      Dieter Fox taught robots, and many roboticists, to represent uncertainty instead of tidying
      it out of the diagram. Dieter Fox is a University of Washington professor, head of its
      Robotics and State Estimation Lab, and Senior Research Director at Ai2, where he works on
      foundation models for robotics. He joined the University of Washington in 2000 after a
      doctorate at the University of Bonn, later directed Intel Labs Seattle, and led NVIDIA's
      Seattle robotics research lab from 2017 to 2025. His research connects probabilistic state
      estimation and perception with mapping, tracking, manipulation, activity recognition, and
      control. With Sebastian Thrun and Wolfram Burgard, he co-authored "Probabilistic Robotics," a
      textbook organised around perception and control under uncertainty. He is a fellow of AAAI,
      ACM, and IEEE, and has received the IEEE Robotics and Automation Society's Pioneer Award and
      IJCAI's John McCarthy Award for his work. Dieter's robots are allowed to say "I do not know
      where I am"—provided they attach a probability distribution and a plan for finding out.
    availability: { wave: frontier, earliestYear: 2019, poolWeight: 0.45 }
    contract: { band: major, baseSalaryPerCycle: 0.64, baseSigningCash: 6, auraCost: 9, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 1, dataRepresentation: 3, reinforcementAgency: 1, multimodality: 5, reasoningTools: 1, roboticsEmbodiment: 5, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 2, securityContainment: 0, training: 3, product: 2, management: 4, politics: 2 }
    traits: [trait.probabilistic-state-estimation, trait.textbook-author-of-a-generation]
