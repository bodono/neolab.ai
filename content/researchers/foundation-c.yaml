  - id: researcher.rob-schapire
    version: 1
    displayName: Rob Schapire
    inspirationName: Robert Schapire
    inspirationSummary: A boosting pioneer who proved weak learners could become strong and co-created AdaBoost with Yoav Freund, earning the Gödel and Kanellakis prizes.
    epithet: The Weak Learners' Strength Coach
    role: Boosting, online learning, and computational learning theory
    rosterCardSummary: A boosting pioneer who proved weak learners could become strong and co-created AdaBoost with Yoav Freund, earning the Gödel and Kanellakis prizes.
    biography: >-
      Robert Schapire completed his MIT doctorate under Ronald Rivest, then worked at AT&T Bell Labs
      before becoming a Princeton professor and later a partner researcher at Microsoft Research.
      His early boosting result showed that weak learnability could be converted into strong
      learnability. With Yoav Freund he then created AdaBoost, which repeatedly concentrates on
      misclassified examples and combines weak classifiers into a strong ensemble. The theorem was
      constructive: it reweighted examples so successive learners faced the cases their predecessors
      missed. AdaBoost distilled that idea into an adaptive ensemble with startling empirical
      performance and a clean margin-based explanation. He kept carrying proof-first discipline
      into online learning and games. Their AdaBoost paper received the 2003 Gödel Prize, and the
      pair received the 2004 ACM Paris Kanellakis Theory and Practice Award. Robert's work spans
      boosting, online learning, and formal guarantees for learning algorithms. Weak learners get a
      strength coach; strong claims still need a proof.
    availability: { wave: foundation, earliestYear: 2016, poolWeight: 0.50 }
    contract: { band: competitive, baseSalaryPerCycle: 0.4, baseSigningCash: 3, auraCost: 5, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 5, dataRepresentation: 4, reinforcementAgency: 1, multimodality: 0, reasoningTools: 4, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 3, securityContainment: 0, training: 3, product: 1, management: 3, politics: 1 }
    traits: [trait.formal-guarantees, trait.combine-the-weak-learners]
    signature:
      id: ability.adaptive-boosting
      label: Adaptive Boosting
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.optimisation-scaling] }
      rampWeeks: 4
      effects:
        - { target: domain.optimisation-scaling.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    passive:
      id: ability.provable-accuracy-guarantee
      label: Provable Accuracy Guarantee
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    compact:
      id: compact.a-guarantee-not-a-guess
      label: A Guarantee, Not a Guess
      requirement: Complete one proved-accuracy-bound review for an ensemble result every 52 weeks.
      check: { type: tagged-action-within, tags: [proven-accuracy-bound], weeks: 52 }
      breachEvent: people.compact.a-guarantee-not-a-guess
    paperHooks:
      ids: [paper.random-forests, paper.support-vector-networks]
    eventReactions:
      - { triggerTag: benchmark-record, line: "Combine enough weak signals correctly and the result is provably strong. Show the proof, not merely the leaderboard entry." }
      - { triggerTag: model-overconfidence, line: "A weak learner that is only slightly better than chance is still useful, provided you are honest that it is weak." }
      - { triggerTag: architecture-fad, line: "An elegant algorithm without a matching proof is an unfinished paper, however good the demo looks." }
    feedLines:
      - Rob combined a dozen mediocre classifiers and the ensemble's error bound landed exactly where the proof said it would.
      - A weak learner nobody trusted turned out to be exactly the missing piece the boosting round needed.
      - The whiteboard proof took most of the afternoon and closed a question that had been open since Tuesday.
      - Rob's provable bound held up under an adversarial dataset specifically built to break it.
      - A junior researcher's boosting variant reinvented a known result, cheerfully, and Rob let them finish first.
      - The Gödel Prize citation sits framed in the office. Rob has, this quarter, referenced the theorem instead more often.
    portrait:
      assetId: portrait.researcher.rob-schapire
      brief: Thoughtful 8-bit editorial portrait; white man with a calm expression and glasses, beside several weak-classifier icons combining into one strong boundary; precise and theoretical, not photoreal.
      altText: Pixel-art portrait of Rob Schapire beside several weak classifiers combining into one strong decision boundary.
