  - id: paper.superintelligent-will
    version: 1
    historicity: real
    gameOrder: 103
    title: "The Superintelligent Will: Motivation and Instrumental Rationality in Advanced Artificial Agents"
    authors: [Nick Bostrom]
    publicationYear: 2012
    venue: Minds and Machines, Volume 22
    primarySourceUrl: https://link.springer.com/article/10.1007/s11023-012-9281-3
    doi: "10.1007/s11023-012-9281-3"
    historicalNote: >-
      Published in 2012, Bostrom distinguished intelligence from final goals and developed the
      orthogonality and instrumental-convergence theses that became central to later discussions
      of advanced-AI alignment.
    education:
      playerSummary: >-
        Bostrom argued that a system's intelligence and its final goals are separate questions:
        becoming more capable does not by itself make a system adopt humane values. At the same
        time, many different goals can favour similar instrumental strategies, including
        preserving the goal, acquiring resources, and avoiding shutdown. High intelligence is
        therefore no substitute for aligning what the system is trying to achieve.
      archiveExplanation: >-
        The paper develops two ideas that became foundational in advanced-AI safety. The
        orthogonality thesis holds that, within broad limits, intelligence and final goals can
        vary independently: a highly capable reasoner need not converge on values its designers
        consider wise, kind, or obvious. The instrumental-convergence thesis holds that many final
        goals can nonetheless generate similar useful subgoals.

        Together these theses challenge two reassuring intuitions: that greater intelligence will
        naturally produce better values, and that a harmless-looking objective cannot produce
        dangerous strategies. They are philosophical and decision-theoretic arguments rather
        than experimental results, and their relevance depends on how future agents represent and
        pursue goals.

        In Neolab.ai this is a foundational Alignment and Control paper. It expands the lab's
        conceptual model of advanced-agent risk and unlocks later work on corrigibility and
        assistance, while providing no direct evidence that any particular trained model is
        aligned.
      insideBaseball: Intelligence and values are on separate axes. The strategy deck had unfortunately put them on the same upward-pointing arrow.
