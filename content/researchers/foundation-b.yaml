    paperHooks:
      ids: [paper.deep-q-network, paper.deep-rl-from-human-preferences]
    eventReactions:
      - { triggerTag: hand-engineered-shortcut, line: "A shortcut is a hypothesis about the environment. State it plainly and we can test it." }
      - { triggerTag: reward-hacking, line: "The credit assignment problem does not forgive an imprecise reward. It never has." }
      - { triggerTag: emergent-strategy, line: "Temporal-difference error is falling. Whatever else is happening, that part is working correctly." }
    feedLines:
      - Andy redrew the value-function diagram from memory and corrected a sign error two decades old.
      - A prediction error narrowed overnight. Andy called this "Tuesday."
      - The new textbook edition arrived. Andy has already annotated the margins of his own copy.
      - Andy declined credit for an idea that turned out, on checking, to be entirely his.
      - The actor-critic split the decision cleanly in two, and both halves improved.
      - A student asked which came first, the theory or the algorithm. Andy said "the environment."
    portrait:
