      Christopher Bishop is a Microsoft Technical Fellow and the founder of Microsoft Research's
      AI for Science organisation. Trained as a physicist, he worked in quantum field theory and
      controlled fusion before turning to machine learning, neural networks, and probabilistic
      inference. His books “Neural Networks for Pattern Recognition” and “Pattern Recognition and
      Machine Learning” became standard references for generations of researchers; “Deep Learning:
      Foundations and Concepts,” written with Hugh Bishop, carries that explanatory tradition into
      modern systems. He has led major Microsoft research organisations and helped make scientific
      discovery—from molecular modelling to materials and weather—a central application of AI.
      He is a Fellow of the Royal Society and the Royal Academy of Engineering, recognition spanning
      both the theory and practice of machine learning. His long research career has paired lucid
      exposition with institution building: the equations are expected to teach, and the research
      organisation is expected to make those equations useful in the physical world. Christopher's
      preferred research stack contains a physical principle, a calibrated
      probability, and a derivation legible enough that nobody can hide a miracle in line seven.
