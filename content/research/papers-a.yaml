        you need to guess where objects are, so the two tasks should share computation rather than
        duplicate it. The Region Proposal Network slides over the shared feature map, proposing boxes
        at multiple scales and aspect ratios, which the detection head then refines and labels. This
        unified, end-to-end design collapsed a clumsy multi-stage pipeline into one trainable system.

