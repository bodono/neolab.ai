          - { kind: add-modifier, target: lab.training.technicalFailureHazard, operation: multiply, value: 0.90, durationWeeks: 52, tags: [human-data-reserve] }
        checks: []
        memories:
          - key: research.synthetic-data.curated
            subjects: [{ type: player-lab }]
            tags: [data-provenance, human-data-reserve]
        confirmationRequired: false
      - id: checked-mix
        labelKey: event.research.synthetic-data.checked-mix.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -3 }
        previewKey: event.research.synthetic-data.checked-mix.preview
        immediateEffects: []
        checks:
          - id: mix-quality
            likelihoodPromise: { label: uncertain, successOutcomeIds: [held] }
            outcomes:
              - id: held
                minimumInclusive: 0
                maximumExclusive: 0.6
                effects:
                  - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [synthetic-mix] }
                memories:
                  - key: research.synthetic-data.mix-held
                    subjects: [{ type: player-lab }]
                    tags: [synthetic-data, checked]
              - id: drifted
                minimumInclusive: 0.6
                maximumExclusive: 1
                effects:
                  - { kind: add-modifier, target: lab.training.technicalFailureHazard, operation: multiply, value: 1.10, durationWeeks: 26, tags: [synthetic-mix] }
                  - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: -2 }
                memories:
                  - key: research.synthetic-data.mix-drifted
                    subjects: [{ type: player-lab }]
                    tags: [synthetic-data, data-drift]
        memories: []
        confirmationRequired: false
      - id: all-in
        labelKey: event.research.synthetic-data.all-in.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.synthetic-data.all-in.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: 5 }
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.10, durationWeeks: 26, tags: [synthetic-all-in] }
          - kind: schedule-effects
            dueInWeeks: 39
            effects:
              - { kind: add-modifier, target: lab.training.technicalFailureHazard, operation: multiply, value: 1.20, durationWeeks: 52, tags: [model-collapse] }
              - { kind: add-modifier, target: lab.market.demandCeiling, operation: multiply, value: 0.90, durationWeeks: 52, tags: [model-collapse] }
        checks: []
        memories:
          - key: research.synthetic-data.all-in
            subjects: [{ type: player-lab }]
            tags: [synthetic-data, model-collapse-risk]
        confirmationRequired: true
    followUps: []
    telemetryTags: [research, data, synthetic-data]

  - id: event.finance.authors-lawsuit
