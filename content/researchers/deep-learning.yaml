  - id: researcher.kai-ming-ho
    version: 1
    displayName: Kai-Ming Ho
    inspirationName: Kaiming He
    epithet: The Residual Engineer
    role: Computer vision and robust architecture design
    rosterCardSummary: A master architecture engineer whose residual pathways accelerate vision research and reduce technical failure across every training run in the lab.
    biography: >-
      Kai-Ming Ho has repeatedly found architectural ideas so clean that they become permanent
      parts of the field's vocabulary. At Microsoft Research he led the work on deep residual
      networks, using identity shortcuts to make substantially deeper systems easier to optimise.
      ResNet won major ImageNet and COCO competitions and then spread far beyond vision into the
      basic design language of deep learning. His contributions also include influential object-
      detection and segmentation systems, from Faster R-CNN to Mask R-CNN, and later work on
      self-supervised masked autoencoders. Across these projects, Kai-Ming combines mathematical
      economy with exceptional engineering judgement: change the path through which information
      travels, then prove the idea at a scale where the result cannot be dismissed. As a professor
      and research leader, he represents architecture at its most durable—not ornamental novelty,
      but a carefully constructed route that lets the gradient, the data and the next decade of
      researchers pass through.
    availability:
      wave: deep-learning
      unlockAny: [{ domainLevelAtLeast: 12 }, { discoveredTag: deep-representation-landmark }]
      poolWeight: 0.85
    contract: { band: major, baseSalaryPerCycle: 0.75, baseSigningCash: 6, auraCost: 10 }
    skills: { architectures: 5, optimisationScaling: 4, dataRepresentation: 3, reinforcementAgency: 1, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 2, scientificAi: 3, alignmentControl: 1, interpretabilityEvals: 2, securityContainment: 0, training: 5, product: 3, management: 4, politics: 0 }
    traits: [trait.residual-engineer, trait.empirical-clarity]
    signature:
      id: ability.path-for-gradient
      label: A Path for the Gradient
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality, domain.architectures] }
      rampWeeks: 4
      effects:
        - { target: assignedProgramme.researchOutput, operation: multiply, value: 1.25, stackingGroup: programme-rp }
        - { target: paper.tag.residual-networks.effort, operation: multiply, value: 0.80, stackingGroup: paper-effort }
    passive:
      id: ability.very-deep-still-trains
      label: Very Deep, Still Trains
