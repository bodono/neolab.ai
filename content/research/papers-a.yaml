  - id: paper.latent-diffusion-high-resolution-synthesis
    version: 1
    historicity: real
    gameOrder: 30
    title: High-Resolution Image Synthesis with Latent Diffusion Models
    authors: [Robin Rombach, Andreas Blattmann, Dominik Lorenz, Patrick Esser, Björn Ommer]
    publicationYear: 2022
    venue: IEEE Conference on Computer Vision and Pattern Recognition
    primarySourceUrl: https://arxiv.org/abs/2112.10752
    arxiv: "2112.10752"
    historicalNote: >-
      First posted in 2021 and presented at CVPR 2022, this paper ran the diffusion process in a
      compressed latent space, substantially reducing the compute needed for high-resolution
      generation; its public release became widely known as Stable Diffusion.
    education:
      playerSummary: >-
        Latent diffusion models run the denoising process inside a compact, pretrained latent
        space instead of directly on full-resolution pixels, dramatically reducing the compute
        needed to train and sample high-quality, high-resolution images. Cross-attention
        conditioning let the same architecture generate images from text prompts. The technique's
        efficiency helped bring high-fidelity text-to-image generation within reach of far more
        modest hardware budgets.
      archiveExplanation: >-
        Ordinary pixel-space diffusion models spend most of their computation on imperceptible
        high-frequency image detail, making high-resolution generation expensive to train and
        slow to sample. Rombach, Esser and colleagues instead first trained a perceptual
        autoencoder to compress images into a much smaller latent space, then ran the diffusion
        process entirely within that compact representation before decoding back to pixels.

        This latent-space diffusion preserved sample quality while sharply reducing computational
        cost, and the architecture added cross-attention layers that could condition generation
        on text, layout or other inputs, enabling flexible text-to-image synthesis, inpainting
        and super-resolution from one general framework. The efficiency gain was large enough
        that the released model, and its public weights, could run on a single consumer GPU.

        That accessibility was also the paper's most consequential practical effect: it took a
        capability previously requiring large training and inference budgets and made it broadly
        available, immediately raising urgent questions about consent, copyright, likeness and
        misuse that the field was not fully prepared to answer. Neolab.ai grants a very large
        product and generative-research boost, and specifically unlocks the sharper synthetic-
        media and provenance events that a much more accessible generation technology invites.
      insideBaseball: Training now fits on a research budget instead of a data-centre budget. Legal has scheduled a meeting titled, without apparent irony, “whose latent space is this.”
