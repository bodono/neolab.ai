    education:
      playerSummary: >-
        Tesauro trained a neural network to evaluate backgammon positions using temporal-difference
        learning, playing against itself millions of times with no human game records at all. The
        resulting program reached a standard competitive with the world's strongest human players
        and reportedly changed expert opening theory, decades before self-play became a familiar
        technique in game-playing AI.
      archiveExplanation: >-
        Temporal-difference learning updates a value estimate using the difference between
        successive predictions, rather than waiting for a final outcome, which suits long games
        with delayed rewards. Tesauro combined this with a neural network position evaluator and
        pure self-play: the program played millions of games against itself, adjusting its
        evaluation after every move using only the change in its own predictions.

        TD-Gammon reached a level competitive with the world's strongest human backgammon players,
        and several of its favoured strategies were reportedly adopted by expert human players
        after studying its games. This was among the earliest clear demonstrations that self-play
        with a learned value function, without any human game database, could reach elite strength
        in a nontrivial game.

        Backgammon's short-horizon dice-driven randomness made self-play evaluation considerably
        easier than it is in longer, more deterministic games. Neolab.ai treats this as the
        historical root of the self-play branch of reinforcement-agency research, a branch that
        the player's later game-playing research programmes build directly on.
