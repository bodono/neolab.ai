        while keeping the accuracy benefits of a very large parameter count activated only
        sparsely per token. The approach reached trillion-parameter model scale with up to seven
        times faster pretraining at matched compute.
      archiveExplanation: >-
        Earlier mixture-of-experts architectures typically routed each token to several experts at
        once, which improved quality but added considerable complexity, communication overhead,
        and training instability. Fedus, Zoph, and Shazeer's Switch Transformer routed each token
        to exactly one expert, dramatically simplifying the routing computation and communication
        pattern while preserving the core benefit: a model with an enormous total parameter count,
        only a small fraction of which is active for any given token.

