  - id: researcher.wojciech-zarembo
    version: 1
    displayName: Wojciech Zarembo
    inspirationName: Wojciech Zaremba
    inspirationSummary: OpenAI co-founder whose work includes domain-randomised robot learning, dexterous manipulation, and large-scale code models.
    epithet: The Sim-to-Real Believer
    role: Robot learning, sim-to-real transfer, and code-generation research leadership
    rosterCardSummary: An OpenAI co-founder whose sim-to-real discipline advances embodiment research, steadies results, and shortens the route from model to product.
    biography: >-
      Wojciech Zaremba would rather make the simulation stranger before making the real robot
      busier. Wojciech Zaremba completed his doctorate at New York University with Rob Fergus and
      became a founding member of OpenAI. His robotics research includes Dactyl, which trained a
      dexterous robotic hand with reinforcement learning in simulation and transferred the policy
      to physical hardware using domain randomisation. A later OpenAI project extended the method
      to solving a Rubik's Cube with a one-handed robot, using progressively harder randomised
      environments. His published work also spans recurrent networks and code-generation models.
      His CV also records research at Google Brain and Facebook AI Research before OpenAI. Across
      those projects, Zaremba widens the simulated variation, measures what survives the transfer,
      and resists tuning the laboratory around one cooperative robot. If the virtual cube has not
      changed colour, friction, and gravity several times, the real cube is not yet invited.
    availability: { wave: deep-learning, earliestYear: 2016, poolWeight: 0.50 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 2, dataRepresentation: 2, reinforcementAgency: 5, multimodality: 1, reasoningTools: 3, roboticsEmbodiment: 5, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 0, securityContainment: 0, training: 3, product: 2, management: 3, politics: 1 }
    traits: [trait.simulation-first-instinct, trait.competition-honed-precision]
    signature:
      id: ability.domain-randomised-sim-to-real
      label: Domain-Randomised Sim-to-Real
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.robotics-embodiment] }
