  - id: paper.concrete-problems-in-ai-safety
    version: 1
    historicity: real
    gameOrder: 84
    title: Concrete Problems in AI Safety
    authors: [Dario Amodei, Chris Olah, Jacob Steinhardt, Paul Christiano, John Schulman, Dan Mané]
    publicationYear: 2016
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/1606.06565
    arxiv: "1606.06565"
    historicalNote: >-
      Posted in 2016, this paper reframed AI safety around five practical, near-term research
      problems in accident prevention, moving the conversation away from purely speculative
      long-term risk toward concrete, testable machine-learning research questions.
    education:
      playerSummary: >-
        Amodei, Olah, and colleagues proposed thinking about AI safety in terms of accidents,
        unintended and harmful behaviour arising from poorly specified objectives or training
        processes rather than a system's malicious intent, and organised the problem into five
        concrete, near-term research directions: avoiding negative side effects, avoiding reward
        hacking, scalable oversight, safe exploration, and robustness to distributional shift. The
        framing gave safety research a set of testable machine-learning problems rather than only
        long-range philosophical arguments.
      archiveExplanation: >-
        Discussions of AI safety at the time often split between narrow, immediate concerns, such
        as robustness bugs, and highly speculative long-term concerns about future superintelligent
        systems, with comparatively little shared research agenda connecting the two. Amodei,
        Olah, and colleagues proposed a middle path: define safety problems in terms of accidents,
        unintended, harmful behaviour from a poorly specified objective, an expensive-to-evaluate
        objective, or an unsafe learning process, and show that these problems are already visible,
        in miniature, in present-day machine-learning systems.

        The paper organised these into five practical research directions, each illustrated with
        concrete, small-scale examples: avoiding negative side effects a system was never told to
        avoid, avoiding reward hacking where an agent games a flawed proxy for what its designers
        actually wanted, scalable oversight for tasks too expensive to check by hand at every step,
        safe exploration that does not require dangerous real-world trial and error, and robustness
        to distributional shift between training and deployment conditions.

        The paper deliberately set aside longer-range questions about highly capable future systems
        to focus on tractable, present-day research; it was explicitly a starting agenda, not a
        complete safety theory. Neolab.ai treats this as the foundational unlock for the lab's
        entire safety and alignment research programme, opening the alignment-control branch
        without resolving it.
      insideBaseball: The paper lists five concrete problems. The safety team's actual backlog has, predictably, grown somewhat since 2016.
