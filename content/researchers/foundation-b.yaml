  - id: researcher.jitendra-malek
    version: 1
    displayName: Jitendra Malek
    inspirationName: Jitendra Malik
    inspirationSummary: A Berkeley computer-vision pioneer behind anisotropic diffusion, normalized cuts, the Berkeley Segmentation Dataset, and R-CNN.
    epithet: The Grammar of Seeing
    role: Computer vision foundations and perceptual grouping
    rosterCardSummary: A Berkeley computer-vision pioneer behind anisotropic diffusion, normalized cuts, the Berkeley Segmentation Dataset, and R-CNN.
    biography: >-
      Jitendra Malik joined UC Berkeley in 1985 after a Stanford PhD and has spent the decades since
      teaching computers where one thing ends and another begins. With Pietro Perona he introduced
      anisotropic diffusion, which smooths an image without casually erasing its edges; with Jianbo
      Shi he developed normalized cuts for image segmentation. His Berkeley group also produced
      shape contexts, the Berkeley Segmentation Dataset, and R-CNN, linking perceptual grouping to
      modern recognition. The programme crossed computer graphics, biological vision, and machine
      learning, producing high-dynamic-range imaging alongside recognition systems and earning five
      test-of-time prizes across both CVPR and ICCV venues. The common rule is that computer vision
      should answer to human vision: psychophysics and physiology are evidence, not decorative
      metaphors. A leaderboard can say a model found the label. Jitendra still wants to know whether
      it saw the object.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.75 }
    contract: { band: major, baseSalaryPerCycle: 0.73, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 1, dataRepresentation: 4, reinforcementAgency: 1, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 4, scientificAi: 2, alignmentControl: 0, interpretabilityEvals: 2, securityContainment: 0, training: 3, product: 1, management: 4, politics: 1 }
