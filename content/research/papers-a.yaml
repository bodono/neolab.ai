  - id: paper.perceptron
    version: 1
    historicity: real
    gameOrder: 49
    title: "The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain"
    authors: [Frank Rosenblatt]
    publicationYear: 1958
    venue: Psychological Review
    primarySourceUrl: https://doi.org/10.1037/h0042519
    doi: "10.1037/h0042519"
    historicalNote: >-
      Published in 1958, this paper introduced the perceptron, the first precisely specified,
      computationally oriented model of a learning neural network, decades before the deep
      learning era it eventually helped inspire.
    education:
      playerSummary: >-
        Rosenblatt proposed a simple trainable network of threshold units that could learn to
        classify patterns from examples, adjusting its own connection weights rather than being
        explicitly programmed. It is the historical root of the connectionist tradition that,
        much later and after a long detour, became modern deep learning.
      archiveExplanation: >-
        Before the perceptron, most machine reasoning was rule-based: a designer wrote down the
        logic and the machine executed it. Rosenblatt instead proposed a network of simple
        threshold units connected by adjustable weights, and an update rule that nudged those
        weights toward correct classification after each training example. It was among the
        first computational systems whose behaviour was learned from data rather than specified
        in advance.

        The single-layer perceptron's practical scope turned out to be narrow. It could only
        separate patterns that were linearly separable, a limitation later demonstrated sharply
        by the XOR problem, and this critique contributed to a significant, multi-year slowdown
        in neural network research funding and enthusiasm.

        Neolab.ai treats the perceptron as a small, historically load-bearing unlock: it opens the
        earliest branch of the architecture tree and provides a foundation the player's later
        multi-layer and backpropagation-based research builds on, without providing much research
        power on its own.
      insideBaseball: The demonstration model could distinguish one punch card pattern from another. The lab's marketing department has since raised its ambitions somewhat.
