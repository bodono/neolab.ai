      - { triggerTag: government-hearing, line: "An independent test result survives that room better than any lab's self-assessment, including yours." }
    feedLines:
      - Bess's evaluation found the model could complete a resource-acquisition chain nobody had listed among its capabilities.
      - A pre-release audit came back with one finding, and the release date moved without an argument.
      - The autonomous-replication test suite gained a new stage, one real-world incident before it would have been needed.
      - A lab's confident "it cannot do that" was converted, methodically, into a designed test, and then into a correction.
      - Bess's independence turned out to be the deciding factor in a regulator's acceptance of the evidence.
      - The evaluation institute's findings were quoted verbatim in two rival labs' safety cases this quarter.
