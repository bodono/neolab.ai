      label: Secure Enterprise Language Models
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.architectures, safety.security-containment] }
      rampWeeks: 4
      effects:
        - { target: domain.optimisation-scaling.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 4 }
    passive:
      id: ability.transformer-co-author-credibility
      label: Transformer Co-Author Credibility
      effects:
        - { target: action.tag.coalition.auraCost, operation: multiply, value: 0.90, stackingGroup: cash-discount }
    compact:
      id: compact.trust-worthy-of-enterprise-data
      label: Trustworthy of Enterprise Data
      requirement: Complete one enterprise-data security and containment review every 52 weeks.
      check: { type: tagged-action-within, tags: [enterprise-data-security-review], weeks: 52 }
      breachEvent: people.compact.trust-worthy-of-enterprise-data
    paperHooks:
      ids: [paper.transformer, paper.retrieval-augmented-generation]
    eventReactions:
      - { triggerTag: enterprise-data-breach, line: "An enterprise trusted us with their data specifically because we built for exactly this scenario. Treat the review as the actual product." }
      - { triggerTag: talent-poaching, line: "I paused a doctorate to found this company. Losing a researcher to a rival lab does not reopen that particular door." }
      - { triggerTag: architecture-fad, line: "The transformer's generality was the easy part. Making it trustworthy with someone else's confidential data is the actual company." }
    feedLines:
      - Aidan's data-security review caught a leakage path before an enterprise customer's confidential data ever touched it.
      - A co-authorship from a night spent finishing a paper before a conference deadline still opens doors a decade later.
      - The enterprise partnership survived direct review by the customer's security team, which is the more meaningful milestone.
      - Aidan finally finished the paused doctorate, years into running the company, largely because he had promised his advisor he would.
      - A rival lab's flashier demo lost the enterprise deal to Aidan's less flashy, better-audited security review.
      - The founding conviction, secure enterprise AI over an impressive public demo, has not needed updating since 2019.
    portrait:
      assetId: portrait.researcher.aidan-gomes
      brief: Composed 8-bit editorial portrait; young man with shoulder-length dark hair, a full beard, round glasses, and small hoop earrings, beside a transformer diagram wrapped in a secure enterprise-data shield; disciplined and trustworthy, not photoreal.
      altText: Pixel-art portrait of Aidan Gomes beside a transformer architecture diagram wrapped in a secure enterprise data shield.
