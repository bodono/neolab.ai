    title: Learning Transferable Visual Models From Natural Language Supervision
    authors: [Alec Radford, Jong Wook Kim, Chris Hallacy, Aditya Ramesh, Gabriel Goh, Sandhini Agarwal, Girish Sastry, Amanda Askell, Pamela Mishkin, Jack Clark, Gretchen Krueger, Ilya Sutskever]
    publicationYear: 2021
    venue: International Conference on Machine Learning
    primarySourceUrl: https://arxiv.org/abs/2103.00020
    arxiv: "2103.00020"
    historicalNote: >-
      Posted and presented in 2021, CLIP trained paired image and text encoders on a very large
      set of internet image-caption pairs using a contrastive objective.
    education:
      playerSummary: >-
        CLIP trained an image encoder and a text encoder together so that matching images and
        captions land near each other in a shared representation space, learning from hundreds
        of millions of naturally occurring image-text pairs rather than a hand-labelled
        classification dataset. The resulting model could perform zero-shot image classification
        by comparing an image to natural-language descriptions of candidate categories, and it
        became foundational infrastructure for later multimodal and image-generation systems.
      archiveExplanation: >-
        Standard image classifiers learn a fixed, hand-chosen set of category labels and cannot
        easily generalise to categories they were never trained on. Radford and colleagues
        instead trained two encoders—one for images, one for text—using a contrastive objective
        that pulls matching image-caption pairs together in a shared embedding space and pushes
        mismatched pairs apart, using naturally occurring captioned images rather than curated
        labels.

        The resulting joint representation supported zero-shot classification: to classify an
        image among candidate categories, compare its embedding against the embeddings of
        natural-language descriptions of each category and pick the closest match, with no
        task-specific fine-tuning required. CLIP performed competitively with fully supervised
