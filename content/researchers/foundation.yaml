    epithet: The Physicist Who Found Memory
    role: Associative memory networks and physics-inspired computation
    rosterCardSummary: A physicist who turned associative memory into an energy landscape and gave every unstable network a more revealing question about where it settles.
    biography: >-
      John Hopfield arrived at neural computation from condensed-matter physics, and the crossing
      connected physics, chemistry, molecular biology and neuroscience. His earlier work included
      electron transfer and kinetic proofreading, a mechanism explaining how biological systems
      can achieve high accuracy. In the early 1980s he described recurrent networks whose dynamics
      move toward stable attractors, allowing stored patterns to be reconstructed from partial or
      corrupted input. By connecting associative memory to dynamical systems and an energy
      function, Hopfield networks gave researchers a physical language for reasoning about neural
      computation. He also helped establish Caltech's Computation and Neural Systems programme
      before returning to Princeton. In 2024 he shared the Nobel Prize in Physics with Geoffrey
      Hinton for foundational discoveries enabling machine learning with artificial neural
      networks. That career repeatedly made physical principles useful in fields that had not yet
      agreed they shared a problem. His characteristic question remains useful: not only what a
      system computes, but which states its dynamics make stable.
