    epithet: The Kernel and the Cause
    role: Kernel methods and causal inference in machine learning
    rosterCardSummary: A kernel-methods pioneer who moved on to causality and still wants to know what intervention would make the prediction change.
    biography: >-
      Bernhard Schölkopf studied physics, mathematics and philosophy before completing a
      doctorate in computer science. His research helped develop kernel methods, including
      support-vector and kernel principal-component techniques, and he co-authored Learning with
      Kernels, a standard account of the field. He is a director at the Max Planck Institute for
      Intelligent Systems in Tübingen, where his Department of Empirical Inference studies
      machine learning from statistical and causal perspectives. Earlier appointments included
      AT&T Bell Laboratories and Microsoft Research. That later programme asks when a model has
      captured mechanisms rather than associations, and how causal structure can support
      robustness, transfer and reasoning about interventions. Kernel methods and causal learning
      share a concern with structure that the raw observations do not announce by themselves. The
      department also applies machine learning to astronomy and gravitational-wave analysis. The
      lab version of the question is concise: what would have to change in the world for this
      prediction to change?
