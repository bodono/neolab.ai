    compact:
      id: compact.forecast-and-correct-in-public
      label: Forecast and Correct in Public
      requirement: Publish one revised, publicly scored capability-timeline estimate every 52 weeks.
      check: { type: tagged-action-within, tags: [public-timeline-estimate], weeks: 52 }
      breachEvent: people.compact.forecast-and-correct-in-public
    paperHooks:
      ids: [paper.gpt3-few-shot-learners, paper.training-compute-optimal-llms]
    eventReactions:
      - { triggerTag: capability-surprise, line: "Update the timeline, publish the update, and say plainly which part of the old estimate was wrong." }
      - { triggerTag: agi-declaration-pressure, line: "A definition of AGI is a tool for measurement, not a marketing department's applause line." }
      - { triggerTag: board-timeline-dispute, line: "I would rather be publicly corrected in three years than quietly vague today." }
    feedLines:
      - Shane revised his public timeline estimate again, and explained, without defensiveness, exactly why.
      - A capability jump landed close to his stated confidence interval, which he noted with visible relief.
      - The old definition of intelligence got cited in a policy hearing, more or less as originally written.
      - Shane declined to declare AGI achieved on stage, to a boardroom's very evident disappointment.
      - A junior researcher's forecasting method impressed him more than a flashier capability demo did that week.
      - The founding bet, made two decades ago, keeps looking slightly less audacious with each passing year.
