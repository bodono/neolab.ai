draftSchema: 1
contentType: decision-events
pack: mid-game

# Mid-game decisions for a lab whose models have reached the Expert Assistant
# tier (FC 35+, roughly 2018-2021: assistants and code models in businesses'
# hands) and the Tool-Using Agent tier (FC 50+, roughly 2021-2023: models that
# browse and act inside software): undertrained giants, memorised personal data,
# poisoned web datasets, customer secrets, prompt injection and deepfake fraud.
# Each fires once.
events:
  # --- Research: too big for its data ---------------------------------------
  - id: event.research.undertrained
    version: 1
    category: research
    severity: decision
    phase: any
    trigger: { kind: opportunity }
    prerequisites: { type: compare, metric: player.ai.frontierCapability, op: gte, value: 35 }
    baseWeight: 7
    weightModifiers: []
    cooldown: { group: mid-game-undertrained, weeks: 26 }
    unique: true
    expiryWeeks: 13
    defaultOptionId: cite
    titleKey: event.research.undertrained.title
    bodyKey: event.research.undertrained.body
    educationKey: event.research.undertrained.education
    evidence:
      - textKey: event.research.undertrained.evidence.cash
        metric: player.cash
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: retrain-smaller
        labelKey: event.research.undertrained.retrain.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -5 }
        previewKey: event.research.undertrained.retrain.preview
        immediateEffects:
          - { kind: add-modifier, target: serving.computePerRequest, operation: multiply, value: 0.90, durationWeeks: 52, tags: [compute-optimal] }
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [compute-optimal] }
        checks: []
        memories:
          - key: mid-game.undertrained.retrained
            subjects: [{ type: player-lab }]
            tags: [compute-optimal, evidence-led]
        confirmationRequired: false
      - id: cite
        labelKey: event.research.undertrained.cite.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.undertrained.cite.preview
        immediateEffects:
          - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: 5 }
          - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: -2 }
        checks: []
        memories:
          - key: mid-game.undertrained.cited
            subjects: [{ type: player-lab }]
            tags: [cited-not-acted]
        confirmationRequired: false
      - id: keep-scaling
        labelKey: event.research.undertrained.scale.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.research.undertrained.scale.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.fundraising.offerCash, operation: multiply, value: 1.10, durationWeeks: 26, tags: [investor-mood] }
          - kind: schedule-effects
            dueInWeeks: 26
            effects:
              - { kind: add-modifier, target: world.rival.progress, operation: multiply, value: 1.10, durationWeeks: 26, tags: [oversized-model] }
              - { kind: add-modifier, target: serving.computePerRequest, operation: multiply, value: 1.10, durationWeeks: 26, tags: [oversized-model] }
        checks: []
        memories:
          - key: mid-game.undertrained.kept-scaling
            subjects: [{ type: player-lab }]
            tags: [bigger-is-better, ignored-evidence]
        confirmationRequired: true
    followUps: []
    telemetryTags: [mid-game, research, scaling-laws, compute-optimal]

  # --- Security: training data extraction -----------------------------------
  - id: event.security.training-data-extraction
    version: 1
    category: security
    severity: decision
    phase: any
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 35 }
        - { type: compare, metric: player.ai.launched, op: eq, value: 1 }
    baseWeight: 7
    # A lab that has never thought about attackers is likelier to have shipped
    # a model this easy to coax.
    weightModifiers:
      - predicate:
          { type: compare, metric: player.safety.securityPosture, op: lt, value: 40 }
        multiplier: 2
    cooldown: { group: mid-game-training-data-extraction, weeks: 26 }
    unique: true
    expiryWeeks: 8
    defaultOptionId: filter-output
    titleKey: event.security.training-data-extraction.title
    bodyKey: event.security.training-data-extraction.body
    educationKey: event.security.training-data-extraction.education
    evidence:
      - textKey: event.security.training-data-extraction.evidence.security
        metric: player.safety.securityPosture
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: scrub-and-retrain
        labelKey: event.security.training-data-extraction.scrub.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.security.training-data-extraction.scrub.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [privacy-retrain] }
          - { kind: add-rating, subject: { type: player-lab }, rating: securityPosture, amount: 5 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 3 }
        checks: []
        memories:
          - key: mid-game.training-data-extraction.scrubbed
            subjects: [{ type: player-lab }]
            tags: [privacy-first, data-scrubbed]
        confirmationRequired: false
      - id: filter-output
        labelKey: event.security.training-data-extraction.filter.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.security.training-data-extraction.filter.preview
        immediateEffects:
          - { kind: add-modifier, target: serving.computePerRequest, operation: multiply, value: 1.05, durationWeeks: 26, tags: [output-filter] }
          - { kind: add-rating, subject: { type: player-lab }, rating: securityPosture, amount: 2 }
        checks:
          - id: filter-holds
            likelihoodPromise: { label: likely, successOutcomeIds: [holds] }
            outcomes:
              - id: holds
                minimumInclusive: 0
                maximumExclusive: 0.7
                effects: []
                memories:
                  - key: mid-game.training-data-extraction.filtered
                    subjects: [{ type: player-lab }]
                    tags: [output-filter]
              - id: bypassed
                minimumInclusive: 0.7
                maximumExclusive: 1
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 5 }
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -10 }
                memories:
                  - key: mid-game.training-data-extraction.filter-bypassed
                    subjects: [{ type: player-lab }]
                    tags: [output-filter, privacy-leak]
        memories: []
        confirmationRequired: false
      - id: call-it-theoretical
        labelKey: event.security.training-data-extraction.dismiss.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.security.training-data-extraction.dismiss.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [kept-personal-data] }
        checks:
          - id: regulators
            likelihoodPromise: { label: uncertain, successOutcomeIds: [overlooked] }
            outcomes:
              - id: overlooked
                minimumInclusive: 0
                maximumExclusive: 0.5
                effects: []
                memories:
                  - key: mid-game.training-data-extraction.dismissed
                    subjects: [{ type: player-lab }]
                    tags: [kept-personal-data]
              - id: investigated
                minimumInclusive: 0.5
                maximumExclusive: 1
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 10 }
                  - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -5 }
                  - { kind: add-resource, subject: { type: player-lab }, resource: aura-spendable, amount: -10 }
                memories:
                  - key: mid-game.training-data-extraction.investigated
                    subjects: [{ type: player-lab }]
                    tags: [kept-personal-data, privacy-leak, regulator-inquiry]
        memories: []
        confirmationRequired: true
    followUps: []
    telemetryTags: [mid-game, security, privacy, memorisation]

  # --- Security: expired domains in the dataset -----------------------------
