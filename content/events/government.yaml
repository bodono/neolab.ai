draftSchema: 1
contentType: decision-events
pack: government-a

# The four government interventions the politics ladder raises. Each option
# records a typed memory whose tag drives synchroniseGovernmentEventResponses;
# without these events a pending intervention never resolves and the ladder
# jams permanently.
events:
  - id: event.government.reporting-request
    version: 1
    category: politics
    severity: decision
    phase: any
    trigger: { kind: mandatory, detector: government-reporting, priority: 40 }
    # Variants are mutually exclusive and exhaustive: a clean, low-profile lab
    # gets the routine letter; see reporting-incident-file and
    # reporting-autonomy-review for the other two cases.
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.incidents.recentCount, op: lt, value: 1 }
        - { type: compare, metric: player.politics.governmentAttention, op: lt, value: 70 }
    baseWeight: 0
    weightModifiers: []
    cooldown: { group: government-intervention, weeks: 0 }
    unique: false
    expiryWeeks: 6
    defaultOptionId: stall
    titleKey: event.government.reporting.title
    bodyKey: event.government.reporting.body
    evidence:
      - textKey: event.government.reporting.evidence.pressure
        metric: player.politics.interventionPressure
      - textKey: event.government.reporting.evidence.trust
        metric: player.politics.governmentTrust
    tokenBindings:
      - { token: LAB, source: player-lab-name }
    options:
      - id: comply
        labelKey: event.government.reporting.comply.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -2 }
        previewKey: event.government.reporting.comply.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 7 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: -3 }
        checks: []
        memories:
          - key: government.reporting.complied
            subjects: [{ type: player-lab }]
            tags: [government-response:satisfied, transparency]
        confirmationRequired: false
      - id: minimal
        labelKey: event.government.reporting.minimal.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.government.reporting.minimal.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 2 }
          - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: -3 }
        checks: []
        memories:
          - key: government.reporting.minimal
            subjects: [{ type: player-lab }]
            tags: [government-response:negotiated, minimal-disclosure]
        confirmationRequired: false
      - id: stall
        labelKey: event.government.reporting.stall.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.government.reporting.stall.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: -8 }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 6 }
        checks: []
        memories:
          - key: government.reporting.stalled
            subjects: [{ type: player-lab }]
            tags: [government-response:failed, stonewalled]
        confirmationRequired: false
    followUps: []
    telemetryTags: [politics, government-ladder, reporting]

