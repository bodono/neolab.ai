researchers:
  - id: researcher.geoffrey-hintoff
    version: 1
    displayName: Geoffrey Hintoff
    inspirationName: Geoffrey Hinton
    epithet: The Godfather of Gradients
    role: Deep representations and architectures
    rosterCardSummary: A foundational deep-learning thinker whose representation research accelerates architectures and turns landmark publications into exceptional scientific prestige.
    biography: >-
      Geoffrey Hintoff has spent a remarkable career teaching machines to discover the internal
      representations that earlier generations of engineers had to specify by hand. After
      studying experimental psychology at Cambridge and artificial intelligence at Edinburgh,
      he pursued neural networks through years when the field's fashion pointed elsewhere. His
      work on backpropagation, distributed representations, Boltzmann machines, deep belief nets
      and neural language models helped prepare the ground for the modern deep-learning era.
      From the University of Toronto to the team behind the ImageNet breakthrough, Geoffrey
      combined unusual conceptual clarity with the patience to let unfashionable ideas mature.
      Recognition through the Turing Award and Nobel Prize reflects an influence that is both
      scientific and cultural: he did not merely improve a method, but helped an entire field
      recover the confidence to learn at depth.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.75 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.00, baseSigningCash: 9, auraCost: 14 }
    skills: { architectures: 5, optimisationScaling: 4, dataRepresentation: 5, reinforcementAgency: 1, multimodality: 3, reasoningTools: 2, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 2, interpretabilityEvals: 2, securityContainment: 0, training: 4, product: 1, management: 3, politics: 2 }
    traits: [trait.intellectual-courage, trait.representation-instinct]
    signature:
      id: ability.deep-representations
      label: Deep Representations
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.architectures, domain.data-representation] }
      rampWeeks: 4
      effects:
        - { target: assignedProgramme.researchOutput, operation: multiply, value: 1.18, stackingGroup: programme-rp }
        - { target: paper.tag.backpropagation.effort, operation: multiply, value: 0.85, stackingGroup: paper-effort }
        - { target: paper.tag.deep-representation.effort, operation: multiply, value: 0.85, stackingGroup: paper-effort }
    passive:
      id: ability.citation-gravity
      label: Citation Gravity
      effects:
        - { target: aura.worldFirstCapabilityPaperGain, operation: multiply, value: 1.10, stackingGroup: aura-gain }
    compact:
      id: compact.academic-latitude
      label: Academic Latitude
      requirement: Publish openly or under controlled publication at least one of every three discoveries made during his tenure.
      check: { type: ratio-at-least, numerator: discoveries.publishedOrControlled, denominator: discoveries.total, value: 0.333, graceDiscoveries: 2 }
      breachEvent: people.compact.academic-latitude
    paperHooks:
      ids: [paper.backpropagation, paper.fast-deep-belief-nets, paper.alexnet]
      affinityTags: [deep-representation, neural-language-models]
    facilityHooks: [facility.research-campus, facility.conference-centre]
    endgameHooks: [ending.open-science, ending.scientific-prosperity]
    eventReactions:
      - { triggerTag: research-fad, line: "The fashion cycle is informative mainly about the fashion cycle. Keep the experiment running." }
      - { triggerTag: secret-paper, line: "A secret result can protect an advantage. It cannot teach the field that the impossible is possible." }
      - { triggerTag: anomalous-representation, line: "Excellent. The model has learned something we did not name. Now comes the part where we find out what." }
    feedLines:
      - Geoffrey has drawn a latent space on the whiteboard and quietly improved the building's intellectual property value.
      - The representations are distributed. The credit, according to the citations desk, is less evenly so.
      - Geoffrey requested one more controlled experiment and no additional adjectives.
      - A seminar overran by 47 minutes because the first question was unusually good.
      - The architecture team has rediscovered an idea Geoffrey remembers being unpopular twice.
      - Geoffrey described the loss curve as “encouraging,” producing an immediate +12 to unofficial morale.
    portrait:
      assetId: portrait.researcher.geoffrey-hintoff
      brief: Warm 8-bit editorial portrait; older white man with silver hair, thoughtful expression and a dark collared shirt, beside a small orange gradient diagram; dignified, recognisable in spirit, not photoreal.
      altText: Pixel-art portrait of Geoffrey Hintoff, silver-haired and thoughtful, beside an orange neural-network gradient diagram.
    sources:
      - https://awards.acm.org/about/2018-turing
      - https://www.nobelprize.org/prizes/physics/2024/hinton/facts/
    portrayal: { fictionalized: true, endorsementImplied: false, legalStatus: legal-review-needed }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.ian-lemon
    version: 1
    displayName: Ian LeMon
    inspirationName: Yann LeCun
    epithet: The World-Modeller
    role: Vision, self-supervision, and learned world models
    rosterCardSummary: A convolutional pioneer and formidable advocate for self-supervised learning who makes vision research faster, more open, and far less label-hungry.
    biography: >-
      Ian LeMon has repeatedly expanded what a learning system can extract from the structure of
      the world itself. Trained in electrical engineering and computer science in France, he
      helped turn convolutional neural networks from an elegant idea into working technology for
      reading handwritten documents at industrial scale. His research across Bell Labs, New York
      University and major AI laboratories shaped computer vision, representation learning and
      the modern case for self-supervised systems that learn before labels arrive. Ian combines
      deep technical invention with an unusually energetic willingness to argue in public about
      first principles, especially when the prevailing consensus has become too comfortable.
      The Turing Award recognised his foundational role in deep learning. His larger contribution
      is a research temperament: build architectures that respect the structure of data, demand
      evidence at scale, and remain ambitious enough to model the world rather than merely name
      its objects.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.75 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.00, baseSigningCash: 9, auraCost: 14 }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 5, reinforcementAgency: 2, multimodality: 5, reasoningTools: 3, roboticsEmbodiment: 3, scientificAi: 1, alignmentControl: 2, interpretabilityEvals: 2, securityContainment: 0, training: 4, product: 3, management: 4, politics: 3 }
    traits: [trait.architectural-conviction, trait.open-science-advocate]
    signature:
      id: ability.learn-before-labels
      label: Learn Before the Labels Arrive
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality, domain.data-representation] }
      rampWeeks: 4
      effects:
        - { target: assignedProgramme.researchOutput, operation: multiply, value: 1.22, stackingGroup: programme-rp }
        - { target: assignedProgramme.unlabelledDataRecipe.cashCost, operation: multiply, value: 0.85, stackingGroup: cash-discount }
    passive:
      id: ability.open-weights-open-doors
      label: Open Weights, Open Doors
      effects:
        - { target: aura.openPaperModelOrDatasetGain, operation: multiply, value: 1.15, stackingGroup: aura-gain }
    compact:
      id: compact.publication-freedom
      label: Publication Freedom
      requirement: Complete one open paper, open dataset, or open model release every 26 weeks.
      check: { type: tagged-action-within, tags: [open-paper, open-dataset, open-model], weeks: 26 }
      breachEvent: people.compact.publication-freedom
    paperHooks:
      ids: [paper.lenet-document-recognition, paper.imagenet-database, paper.alexnet]
      affinityTags: [self-supervised-learning, world-models]
    facilityHooks: [facility.data-foundry, facility.robotics-lab]
    endgameHooks: [ending.open-science, ending.embodied-prosperity]
    eventReactions:
      - { triggerTag: benchmark-saturation, line: "Good. The benchmark has completed its service. We should now ask a question with more world in it." }
      - { triggerTag: labels-shortage, line: "There are a great many unlabeled observations outside. Most of reality has declined to fill in the form." }
      - { triggerTag: open-model-debate, line: "Openness is a real policy with real tradeoffs. It is not a decorative toggle labelled ‘community.’" }
    feedLines:
      - Ian has replaced three annotation meetings with a self-supervised objective and one much louder architecture meeting.
      - The vision model can identify 1,000 objects. Ian would like it to understand why any of them continue to exist off-camera.
      - A world-model diagram has escaped the whiteboard and occupied the corridor.
      - Ian rejected the phrase “mere perception” on both technical and rhetorical grounds.
      - The dataset arrived without labels. Ian called this “the realistic version.”
      - Open research produced a citation spike and a closed-door discussion about open research.
    portrait:
      assetId: portrait.researcher.ian-lemon
      brief: Energetic 8-bit editorial portrait; older white man with grey hair, dark shirt and expressive eyebrows, framed by blue convolution tiles and a tiny world-model globe; generous and playful, not photoreal.
      altText: Pixel-art portrait of Ian LeMon with grey hair, blue convolution tiles, and a small globe representing a learned world model.
    sources:
      - https://awards.acm.org/about/2018-turing
      - https://engineering.nyu.edu/faculty/yann-lecun
      - https://doi.org/10.1109/5.726791
    portrayal: { fictionalized: true, endorsementImplied: false, legalStatus: legal-review-needed }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.joshua-benji
    version: 1
    displayName: Joshua Benji
    inspirationName: Yoshua Bengio
    epithet: The Conscience of the Gradient
    role: Deep learning, reasoning, and safety
    rosterCardSummary: A foundational representation-learning scientist who rewards a genuinely balanced capability-and-safety programme and strengthens responsible disclosure and coalition science.
    biography: >-
      Joshua Benji helped give modern deep learning both its intellectual foundations and its
      moral seriousness. At the University of Montreal he built an extraordinary research
      community around neural networks, representation learning, generative models and neural
      language systems, persisting through years when the subject sat outside the mainstream.
      His scholarship clarified why depth and distributed representations matter, while his
      mentorship helped launch generations of researchers who reshaped the field. As founder of
      Mila and a recipient of the Turing Award, Joshua became one of the world's most influential
      scientific institution-builders. He has also used that standing to insist that rapid
      capability progress must be matched by research, democratic governance and international
      cooperation able to manage its risks. Few people combine such a strong claim to AI's
      technical renaissance with such visible determination to make its consequences worthy of
      the science.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.70 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.00, baseSigningCash: 9, auraCost: 14 }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 5, reinforcementAgency: 2, multimodality: 3, reasoningTools: 4, roboticsEmbodiment: 1, scientificAi: 2, alignmentControl: 5, interpretabilityEvals: 4, securityContainment: 1, training: 4, product: 1, management: 5, politics: 4 }
    traits: [trait.dual-mandate, trait.responsible-disclosure]
    signature:
      id: ability.dual-mandate
      label: Dual Mandate
      eligibleAssignments: [research-council]
      activation: { type: metric-between-for-weeks, metric: lab.allocation.rdSafetyShare, min: 0.35, max: 0.65, weeks: 4 }
      rampWeeks: 4
      effects:
        - { target: lab.research.capability.output, operation: multiply, value: 1.10, stackingGroup: global-rp }
        - { target: lab.research.safety.output, operation: multiply, value: 1.10, stackingGroup: global-rp }
    passive:
      id: ability.responsible-disclosure
      label: Responsible Disclosure
      effects:
        - { target: event.voluntarySeverity3AnomalyDisclosure.governmentTrust, operation: add, value: 3 }
        - { target: event.voluntarySeverity3AnomalyDisclosure.auraLoss, operation: multiply, value: 0.80 }
    compact:
      id: compact.safety-floor
      label: Safety Floor
      requirement: Keep at least 30% of R&D compute in safety whenever the lab operates an FC 60+ model.
      check: { type: conditional-metric-at-least, condition: { metric: lab.model.maxActiveFC, value: 60 }, metric: lab.allocation.rdSafetyShare, value: 0.30 }
      breachEvent: people.compact.safety-floor
    paperHooks:
      ids: [paper.fast-deep-belief-nets, paper.generative-adversarial-nets, paper.neural-attention-translation]
      affinityTags: [alignment, democratic-governance]
    facilityHooks: [facility.alignment-institute, facility.public-benefit-institute]
    endgameHooks: [ending.coalition-victory, ending.cooperative-stewardship]
    eventReactions:
      - { triggerTag: safety-budget-cut, line: "We should not describe the future as uncertain and then remove the part of the budget designed to learn about it." }
      - { triggerTag: voluntary-disclosure, line: "Candour is expensive once. Concealment compounds." }
      - { triggerTag: coalition-overture, line: "Cooperation is slower than unilateral action until the moment unilateral action requires everyone else's trust." }
    feedLines:
      - Joshua has submitted a research plan in which capabilities and safety are inconveniently located in the same spreadsheet.
      - A disclosure meeting ended with lower Aura, higher trust, and the rare sensation that accounting captured reality.
      - Joshua asked whether the race has a finish line or merely an externality.
      - The Research Council achieved balance for four consecutive weeks and briefly became mechanically inspirational.
      - A generative-model seminar concluded with three new experiments and one international institution.
      - Joshua described cooperation as technically demanding, which caused the technical team to become interested.
    portrait:
      assetId: portrait.researcher.joshua-benji
      brief: Thoughtful 8-bit editorial portrait; older white man with curly grey hair and a gentle expression, balanced green capability and safety graphs behind him; humane, scholarly, not photoreal.
      altText: Pixel-art portrait of Joshua Benji with curly grey hair between balanced green capability and safety graphs.
    sources:
      - https://awards.acm.org/about/2018-turing
      - https://mila.quebec/en/directory/yoshua-bengio
    portrayal: { fictionalized: true, endorsementImplied: false, legalStatus: legal-review-needed }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.faye-faye-lee
    version: 1
    displayName: Faye-Faye Lee
    inspirationName: Fei-Fei Li
    epithet: The Human Lens
    role: Computer vision, datasets, and human-centred AI
    rosterCardSummary: A visionary computer-science leader who turns datasets into durable research institutions and strengthens both visual intelligence and talent pipelines.
    biography: >-
      Faye-Faye Lee has a rare ability to see the human institution inside a technical
      breakthrough. Trained as a physicist before becoming a computer scientist, she helped
      create ImageNet, the large, carefully organised visual dataset whose challenge supplied
      the proving ground for modern deep computer vision. Her research ranges from recognising
      scenes and objects to understanding human activity, health and the relationship between
      perception and intelligence. At Stanford she has built programmes connecting frontier
      engineering to medicine, education, policy and a resolutely human-centred view of AI.
      Faye-Faye is also an exceptional mentor and institution-builder, widening the path into
      technical fields while insisting that data, labour and social context are part of the
      system being designed. She makes ambitious research feel more rigorous, not less humane,
      by asking who built the dataset, whom the model serves, and what new scientific possibility
      becomes visible once both questions are taken seriously.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.85 }
    contract: { band: major, baseSalaryPerCycle: 0.75, baseSigningCash: 6, auraCost: 10 }
    skills: { architectures: 3, optimisationScaling: 2, dataRepresentation: 5, reinforcementAgency: 1, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 3, scientificAi: 4, alignmentControl: 2, interpretabilityEvals: 4, securityContainment: 0, training: 3, product: 3, management: 5, politics: 4 }
    traits: [trait.dataset-institution-builder, trait.human-centred-mentor]
    signature:
      id: ability.dataset-is-an-institution
      label: A Dataset Is an Institution
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.data-representation, domain.multimodality] }
      rampWeeks: 4
      effects:
        - { target: assignedProgramme.researchOutput, operation: multiply, value: 1.20, stackingGroup: programme-rp }
        - { target: paper.tag.public-dataset.effort, operation: multiply, value: 0.80, stackingGroup: paper-effort }
    passive:
      id: ability.talent-pipeline
      label: Talent Pipeline
      effects:
        - { target: recruitment.tag.visionDataRoboticsHumanCentred.strength, operation: add, value: 8, stackingGroup: recruitment-strength }
    compact:
      id: compact.data-stewardship
      label: Data Stewardship
      requirement: Every data programme she leads must have a funded dataset charter.
      check: { type: assignment-requires-project-tag, assignmentTag: data-programme, projectTag: dataset-charter }
      attachedEffects:
        - { target: assignedProgramme.cashCost, operation: multiply, value: 1.05 }
        - { target: assignedProgramme.resultingEvalQuality, operation: add, value: 5 }
      breachEvent: people.compact.data-stewardship
    paperHooks:
      ids: [paper.imagenet-database, paper.alexnet, paper.word2vec]
      affinityTags: [visual-language, medical-imaging]
    facilityHooks: [facility.data-foundry, facility.scientific-laboratory]
    endgameHooks: [ending.medical-prosperity, ending.human-centred-transition]
    eventReactions:
      - { triggerTag: dataset-shortcut, line: "The model found the easiest signal. Our job was to ensure the easiest signal belonged to the problem." }
      - { triggerTag: annotation-labour, line: "The dataset is not raw material. It is a record of thousands of human judgements." }
      - { triggerTag: medical-opportunity, line: "A promising result becomes medicine only after the clinicians, patients and validation all enter the room." }
    feedLines:
      - Faye-Faye added a dataset charter. The dataset has acquired governance and, unexpectedly, better labels.
      - The vision team requested more images; Faye-Faye requested a better account of where the first images came from.
      - A student seminar produced two recruits and one research direction senior staff had missed.
      - The benchmark is large enough to change the field and documented enough to change the meeting.
      - Faye-Faye connected the robotics, medicine and perception teams with one carefully chosen lunch table.
      - Human-centred AI has again required the presence of humans, delaying the purely automated slide deck.
    portrait:
      assetId: portrait.researcher.faye-faye-lee
      brief: Warm 8-bit editorial portrait; East Asian woman with long dark hair and a confident, generous expression, beside a mosaic of labelled image tiles and a small human silhouette; scholarly and bright, not photoreal.
      altText: Pixel-art portrait of Faye-Faye Lee beside a mosaic of labelled images and a small human figure.
    sources:
      - https://profiles.stanford.edu/fei-fei-li
      - https://www.image-net.org/static_files/papers/imagenet_cvpr09.pdf
    portrayal: { fictionalized: true, endorsementImplied: false, legalStatus: legal-review-needed }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.andrew-n-gee
    version: 1
    displayName: Andrew N. Gee
    inspirationName: Andrew Ng
    epithet: The Great Translator
    role: Applied ML, products, and education
    rosterCardSummary: An exceptional educator and applied-AI builder who shortens responsible productisation and makes the lab dramatically easier for new researchers to join.
    biography: >-
      Andrew N. Gee is one of artificial intelligence's great translators: between research and
      products, universities and industry, and difficult mathematics and the millions of people
      capable of learning it when given a generous teacher. A Stanford professor with influential
      work in machine learning, robotics and perception, he founded major industrial AI teams and
      helped take deep learning from a specialist discipline to a practical engineering movement.
      As a co-founder of Coursera and the creator of widely used AI courses, Andrew has taught an
      extraordinary global audience and expanded the field's talent base more effectively than
      many national programmes. His applied organisations have helped teams identify where
      machine learning creates real value and where a demo still needs data, reliability and
      disciplined iteration. Andrew's optimism is not vague. It arrives as a curriculum, a
      product checklist, and a working plan for enabling the next ten thousand builders.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 1.00 }
    contract: { band: major, baseSalaryPerCycle: 0.75, baseSigningCash: 6, auraCost: 10 }
    skills: { architectures: 3, optimisationScaling: 3, dataRepresentation: 4, reinforcementAgency: 2, multimodality: 4, reasoningTools: 3, roboticsEmbodiment: 4, scientificAi: 2, alignmentControl: 2, interpretabilityEvals: 3, securityContainment: 0, training: 4, product: 5, management: 5, politics: 3 }
    traits: [trait.exceptional-educator, trait.applied-instinct]
    signature:
      id: ability.ship-it-responsibly
      label: Ship It Responsibly
      eligibleAssignments: [productisation]
      activation: { type: assigned-project-kind, value: productisation }
      rampWeeks: 4
      effects:
        - { target: assignedProject.duration, operation: multiply, value: 0.80, stackingGroup: project-duration }
        - target: assignedProject.resultingProductQuality
          operation: add
          value: 5
          activation: { type: source-model-attribute-at-least, attribute: reliability, value: 50 }
    passive:
      id: ability.everyone-can-learn-this
      label: Everyone Can Learn This
      effects:
        - { target: hiring.generalResearcherCohort.cashCost, operation: multiply, value: 0.90, stackingGroup: cash-discount }
        - { target: talentMarket.refreshCandidateCount, operation: add, value: 1, activation: { type: ui-capacity-available } }
    compact:
      id: compact.teach-the-lab
      label: Teach the Lab
      requirement: Complete an internal course or public technical explainer every 26 weeks.
      check: { type: tagged-action-within, tags: [internal-course, public-explainer], weeks: 26 }
      fulfilmentEffects:
        - { target: researcher.assignmentAvailability, operation: block, value: 1, durationWeeks: 1 }
        - { target: lab.aura.spendable, operation: add, value: 2 }
      breachEvent: people.compact.teach-the-lab
    paperHooks:
      ids: [paper.lenet-document-recognition, paper.alexnet, paper.deep-q-network]
      affinityTags: [online-education, practical-deep-learning]
    facilityHooks: [facility.conference-centre, facility.robotics-lab]
    endgameHooks: [ending.broad-prosperity, ending.education-transition]
    eventReactions:
      - { triggerTag: prototype-demo, line: "Wonderful. Now let us discover whether the customer has the same distribution as the demo." }
      - { triggerTag: hiring-bottleneck, line: "Talent is not a fixed natural resource. We can teach more people." }
      - { triggerTag: product-fire, line: "First stabilise the system. Then write the lesson while the lesson is still honest." }
    feedLines:
      - Andrew converted a research notebook into a course and the course into three qualified applicants.
      - The demo works, the checklist exists, and Product has been gently informed these are separate achievements.
      - An internal lecture titled “Machine Learning Yearning, Again” reached standing-room capacity.
      - Andrew found a valuable use case hiding beneath four layers of fashionable terminology.
      - The new cohort completed onboarding 10% cheaper and 40% more enthusiastically.
      - A public explainer earned +2 Aura and approximately 200,000 ambitious homework submissions.
    portrait:
      assetId: portrait.researcher.andrew-n-gee
      brief: Friendly 8-bit editorial portrait; East Asian man with short dark hair and an open smile, in front of a chalkboard that connects a neural network to a small deployed product; welcoming and crisp, not photoreal.
      altText: Pixel-art portrait of Andrew N. Gee before a chalkboard linking a neural network diagram to a deployed product.
    sources:
      - https://profiles.stanford.edu/andrew-ng
      - https://www.coursera.org/about/leadership
    portrayal: { fictionalized: true, endorsementImplied: false, legalStatus: legal-review-needed }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.geoff-deen
    version: 1
    displayName: Geoff Deen
    inspirationName: Jeff Dean
    epithet: The Systems Architect
    role: Distributed systems and ML infrastructure
    rosterCardSummary: A legendary systems engineer whose cluster designs turn physical GPUs into greater training throughput and make serious infrastructure substantially cheaper to build.
    biography: >-
      Geoff Deen has a gift for building the invisible systems on which whole technological eras
      come to depend. After formative work on compilers and performance, he became a central
      architect of the distributed infrastructure that allowed web-scale services to operate
      reliably: MapReduce, Bigtable and generations of production systems whose names became
      part of computer science's working vocabulary. He later helped lead the shift toward large-
      scale machine learning, contributing to neural systems, TensorFlow and specialised AI
      hardware. Geoff's reputation combines exceptional technical range with an almost folkloric
      ability to find the bottleneck that everyone else had accepted as physics. His deepest
      contribution is leverage. A clean abstraction or well-designed cluster lets thousands of
      engineers and researchers attempt work that was previously impractical. In a frontier lab,
      that makes him less a support function than a new law of computational nature.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.65 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.00, baseSigningCash: 9, auraCost: 14 }
    skills: { architectures: 3, optimisationScaling: 5, dataRepresentation: 4, reinforcementAgency: 1, multimodality: 2, reasoningTools: 2, roboticsEmbodiment: 1, scientificAi: 2, alignmentControl: 1, interpretabilityEvals: 1, securityContainment: 3, training: 5, product: 4, management: 5, politics: 1 }
    traits: [trait.warehouse-scale-thinking, trait.bottleneck-instinct]
    signature:
      id: ability.cluster-is-the-algorithm
      label: The Cluster Is the Algorithm
      eligibleAssignments: [training-run]
      activation: { type: assigned-project-kind, value: training-run }
      rampWeeks: 4
      effects:
        - { target: assignedTrainingRun.workloadThroughput, operation: multiply, value: 1.18, stackingGroup: training-throughput }
    passive:
      id: ability.build-once-scale-twice
      label: Build Once, Scale Twice
      effects:
        - { target: facility.tag.data-centre.upfrontCashCost, operation: multiply, value: 0.90, stackingGroup: cash-discount }
        - { target: facility.tag.inference-centre.upfrontCashCost, operation: multiply, value: 0.90, stackingGroup: cash-discount }
    compact:
      id: compact.serious-infrastructure
      label: Serious Infrastructure
      requirement: Maintain Engineering Quality 60+ or complete Data Centre I within 26 weeks of hiring.
      check: { type: any, items: [{ metric: lab.engineering.quality, atLeast: 60 }, { completedFacility: facility.data-centre-1, withinWeeksOfHire: 26 }] }
      breachEvent: people.compact.serious-infrastructure
    paperHooks:
      ids: [paper.word2vec, paper.sparse-mixture-of-experts, paper.transformer]
      affinityTags: [distributed-training, accelerator-design]
    facilityHooks: [facility.data-centre, facility.inference-centre, facility.accelerator-design-lab]
    endgameHooks: [ending.compute-abundance, ending.infrastructure-stewardship]
    eventReactions:
