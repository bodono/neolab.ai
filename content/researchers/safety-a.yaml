      id: ability.mechanistic-circuit-reverse-engineering
      label: Mechanistic Circuit Reverse-Engineering
      eligibleAssignments: [safety-program]
      activation: { type: assignment-id-in, values: [safety.interpretability-evals] }
      rampWeeks: 4
      effects:
        - { target: safety.interpretability-evals.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.transformerlens-open-tooling
      label: TransformerLens Open Tooling
      effects:
        - { target: lab.research.diffusionRate, operation: add, value: 0.25 }
    compact:
      id: compact.name-the-algorithm-dont-approximate-it
      label: Name the Algorithm, Don't Approximate It
      requirement: Identify and document one named model circuit or algorithm every 52 weeks.
      check: { type: tagged-action-within, tags: [named-circuit-identification], weeks: 52 }
      breachEvent: people.compact.name-the-algorithm-dont-approximate-it
    paperHooks:
      ids: [paper.toy-models-of-superposition, paper.zoom-in-introduction-to-circuits]
    eventReactions:
      - { triggerTag: anomalous-representation, line: "Do not settle for a correlation. Find the actual circuit and name the algorithm it is running." }
      - { triggerTag: interpretability-breakthrough, line: "Release the tooling alongside the finding. The next breakthrough should not have to rebuild this from scratch." }
      - { triggerTag: existential-risk-debate, line: "I took a year to explore this question properly before committing to it. The seriousness has not worn off since." }
    feedLines:
      - Neel's team reverse-engineered a circuit that had, until now, only ever been described as a vague correlation.
      - The open-source interpretability library got a pull request from a lab that had, months earlier, dismissed the approach.
      - A grokking progress measure from Neel's research flagged a phase change in training nobody had been watching for.
      - Neel declined to call a finding complete until the underlying algorithm could actually be named and demonstrated.
      - A donation pledge from Neel's effective-altruism commitment quietly outpaced his own salary increase this year.
      - The mechanistic interpretability team's whiteboard filled with named circuits, several with genuinely memorable names.
    portrait:
      assetId: portrait.researcher.neel-nandy
