    authors: [Jan Leike, David Krueger, Tom Everitt, Miljan Martic, Vishal Maini, Shane Legg]
    publicationYear: 2018
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/1811.07871
    arxiv: "1811.07871"
    historicalNote: >-
      Posted in 2018, this paper outlined reward modeling, learning a reward function from human
      interaction and optimising it with reinforcement learning, as a research direction for
      scaling agent alignment to complex, general domains.
    education:
      playerSummary: >-
        Leike and colleagues outlined a research direction centred on reward modeling: rather than
        hand-specifying a reward function, learn one from interaction with a human overseer, then
        train an agent to optimise that learned reward with reinforcement learning. The paper
        candidly discussed the key challenges expected when scaling this approach to complex,
        general-purpose domains, and possible mitigations for each.
      archiveExplanation: >-
        Hand-specifying a reward function that captures everything a human actually wants, across
        complex, open-ended domains, is extremely difficult, and small misspecifications tend to
        be exploited by a sufficiently capable optimiser. Leike and colleagues proposed instead
        learning the reward function itself from interaction with a human, then using standard
        reinforcement learning to optimise the resulting learned reward, an approach they termed
        reward modeling.

        The paper's contribution was as much diagnostic as prescriptive: it laid out the specific
        challenges expected when scaling reward modeling to complex domains, including reward
        hacking against an imperfect learned reward, unacceptable behaviour during training before
        the reward model is trustworthy, and the difficulty of evaluating whether a highly capable
        agent's behaviour is actually aligned with what was intended, alongside candidate
        mitigations such as adversarial training and interpretability tools.

        The paper explicitly presented an open research direction with unresolved challenges, not a
        solved technique, and later work would need to establish whether the proposed mitigations
        actually held up at scale. Neolab.ai treats this as a foundational alignment-control unlock
        that opens the reward-modeling branch of the player's safety research.
      insideBaseball: The reward function is learned rather than hand-written. The hand-written version of this research roadmap has already needed several revisions.
