  - id: paper.resnet
    version: 1
    historicity: real
    gameOrder: 16
    title: Deep Residual Learning for Image Recognition
    authors: [Kaiming He, Xiangyu Zhang, Shaoqing Ren, Jian Sun]
    publicationYear: 2016
    venue: IEEE Conference on Computer Vision and Pattern Recognition
    primarySourceUrl: https://openaccess.thecvf.com/content_cvpr_2016/html/He_Deep_Residual_Learning_CVPR_2016_paper.html
    historicalNote: >-
      The CVPR 2016 paper introduced residual networks, won the conference's best paper award,
      and supplied an architecture pattern that spread far beyond image recognition.
    education:
      playerSummary: >-
        ResNets add shortcut connections that let a stack of layers learn a residual change
        relative to its input. Information and gradients can follow a direct path when extra
        transformations are unnecessary. This simple reformulation made substantially deeper
        networks easier to optimise, achieved exceptional image-recognition results, and became
        a reusable architectural principle across modern deep learning.
      archiveExplanation: >-
        Deeper networks should in principle express more useful functions, yet simply stacking
        layers eventually produced higher training error, not just worse test performance. The
        additional layers were making optimisation harder. He, Zhang, Ren and Sun reframed a
        block so it learns a residual function: instead of directly approximating a desired
        mapping, the block learns the change from its input, while an identity shortcut carries
        that input forward.

        These shortcuts add little computation and create direct routes for information and
        gradients. The authors successfully trained networks up to 152 layers on ImageNet and
        obtained winning results in the 2015 ImageNet and COCO competitions. The core pattern
        proved portable; residual connections now appear in vision, language, speech and many
        scientific architectures.

        A shortcut does not guarantee that arbitrary depth is useful, and later systems refined
        block design, normalisation and scaling. The breakthrough was to turn depth from an
        optimisation liability into a manageable design dimension. In Neolab.ai, ResNet grants
        a large vision and architecture boost and lowers technical training risk, but it also
        increases the appetite for much larger experiments. The lab has not received free
        intelligence. It has received a reliable path through which more layers—and a larger
        compute invoice—can contribute.
      insideBaseball: The 152-layer network trains successfully. Facilities has interpreted this as a request for 152 additional racks.
