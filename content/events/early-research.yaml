        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 1.05, durationWeeks: 26, tags: [cheap-labels] }
        checks:
          - id: reporting
            likelihoodPromise: { label: uncertain, successOutcomeIds: [unreported] }
            outcomes:
              - id: unreported
                minimumInclusive: 0
                maximumExclusive: 0.6
                effects: []
                memories:
                  - key: people.crowd-labelling.lowest-rate
                    subjects: [{ type: player-lab }]
