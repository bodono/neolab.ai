  - id: researcher.kai-ming-ho
    version: 1
    displayName: Kai-Ming Ho
    inspirationName: Kaiming He
    inspirationSummary: ResNet lead author and contributor to Faster R-CNN, Mask R-CNN, MoCo, and masked autoencoders; MIT professor and Google DeepMind scientist.
    epithet: The Residual Engineer
    role: Computer vision and robust architecture design
    rosterCardSummary: ResNet's lead author inspires an architecture engineer whose residual pathways accelerate vision research and reduce technical failures across training.
    biography: >-
      Kaiming He gives a very deep network a shorter route home. Kaiming He led the ResNet paper,
      which used residual connections to make substantially deeper image-recognition systems
      easier to optimise and won the 2015 ImageNet and COCO competitions described in the paper.
      His research also includes Faster R-CNN and Mask R-CNN for object detection and segmentation,
      MoCo for contrastive representation learning, and masked autoencoders for scalable
      self-supervision. His MIT biography identifies him as a tenured EECS professor and a
      part-time Distinguished Scientist at Google DeepMind. Across those projects, the recurring
      move is economical: change how information or gradients travel, then test the change on a
      benchmark large enough to be useful. He tests economical architectural changes at
      consequential empirical scale, with a quiet suspicion that the best new component may be the
      one that mostly lets the old signal pass.
