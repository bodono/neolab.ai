    education:
      playerSummary: >-
        A big obstacle to understanding neural networks is that individual neurons are polysemantic:
        one neuron fires for many unrelated concepts, so you cannot read the network by reading its
        neurons. This work used a sparse autoencoder to decompose a production model's internal
        activity into millions of cleaner, more interpretable features, concepts like specific people,
        places, code constructs, and abstract ideas, and showed these features could be used to steer
        the model's behaviour.
      archiveExplanation: >-
        The technique trains a sparse dictionary that re-expresses the model's dense, tangled
        activations as combinations of many features, each of which activates only rarely and tends to
        correspond to a single human-recognisable concept. Scaling this from toy models to a deployed
        assistant was the milestone: it demonstrated that interpretability could operate at the frontier
        rather than only on small research systems.

        The features were not merely observational. The authors could amplify or suppress them and see
        predictable behavioural changes, evidence that the features are causally meaningful handles on
        what the model is doing, including safety-relevant features related to deception, bias, and
        dangerous content. It gave weight to the hope that frontier models might eventually be audited
        from the inside rather than only tested from the outside.

        Neolab.ai treats this as a major interpretability milestone that improves evidence quality and
        the lab's ability to see inside its own models.
