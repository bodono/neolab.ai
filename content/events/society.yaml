        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -15 }
        previewKey: event.finance.authors-lawsuit.settle.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [alignment-tax] }
          - { kind: add-modifier, target: lab.market.demandCeiling, operation: multiply, value: 1.05, durationWeeks: 52, tags: [licensed-data] }
        checks: []
        memories:
          - key: finance.authors-lawsuit.settled
            subjects: [{ type: player-lab }]
            tags: [settled, data-provenance, licensed-data]
