      - Sebastian Bodenstein
      - David Silver
      - Oriol Vinyals
      - Andrew W. Senior
      - Koray Kavukcuoglu
      - Pushmeet Kohli
      - Demis Hassabis
    publicationYear: 2021
    venue: Nature
    primarySourceUrl: https://doi.org/10.1038/s41586-021-03819-2
    doi: 10.1038/s41586-021-03819-2
    historicalNote: >-
      Published in 2021 and recognised by the 2024 Nobel Prize in Chemistry, this paper described
      AlphaFold2's highly accurate protein structure predictions at the fourteenth Critical
      Assessment of protein Structure Prediction.
    education:
      playerSummary: >-
        AlphaFold2 predicted the three-dimensional structure of a protein from its amino-acid
        sequence with an accuracy competitive with painstaking experimental methods, at the
        fourteenth Critical Assessment of protein Structure Prediction. Its Evoformer network
        jointly reasoned over evolutionary sequence relationships and spatial structure, and its
        confidence estimates let researchers judge which predictions to trust. The result reduced
        a fundamental bottleneck across structural biology, drug discovery and protein
        engineering.
      archiveExplanation: >-
        A protein's function follows from its three-dimensional shape, but determining that shape
        experimentally, through methods such as X-ray crystallography or cryo-electron microscopy,
        can take months or years and does not succeed for every protein. Predicting structure
        directly from sequence had been a longstanding open problem, with steady but incremental
        progress across decades of the CASP competition.

        Jumper, Hassabis and a large DeepMind team built AlphaFold2 around an architecture,
        Evoformer, that jointly processes evolutionary information from related sequences
        alongside a representation of pairwise residue relationships, iteratively refining both
        together with the predicted structure. At CASP14, the system's predictions were
        accurate enough, for a large share of targets, to be competitive with experimental
        methods, a result the assessment organisers and the field broadly described as
        transformative. The model also produces a per-residue confidence estimate, letting users
        judge how much to trust a given region of a prediction.

        AlphaFold2 does not replace experimental structural biology, predicts a single dominant
        structure rather than every biologically relevant conformation a protein may adopt, and
        performs less reliably on some categories such as complexes and disordered regions. Its
        practical impact was nonetheless immense: freely released structure predictions for
        virtually the entire catalogued proteome accelerated research across biology and
        medicine. In Neolab.ai this is the first major discovery in the Scientific AI domain,
        substantially advancing prosperity readiness for the Medicine programme and any later
        biological research the lab attempts.
      insideBaseball: The confidence metric is called pLDDT. The biology team has adopted it informally as a mood indicator for the entire wet lab.
