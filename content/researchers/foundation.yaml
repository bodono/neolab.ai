  - id: researcher.rick-sutton
    version: 1
    displayName: Rick Sutton
    inspirationName: Richard Sutton
    epithet: The Long-Horizon Purist
    role: Reinforcement-learning foundations
    rosterCardSummary: A foundational reinforcement-learning thinker whose commitment to general methods accelerates agency research and produces more valuable strategic recipe choices.
    biography: >-
      Rick Sutton has given reinforcement learning much of its modern language, mathematics and
      intellectual direction. His work on temporal-difference learning, credit assignment,
      prediction, planning and the architecture of learning agents established methods that now
      sit beneath research across games, robotics and adaptive systems. With Andrew Barto he wrote
      the field's defining textbook, remarkable not only for technical breadth but for presenting
      reinforcement learning as a coherent science of learning from interaction. At the
      University of Alberta, Rick helped build one of the world's great centres for the subject
      and mentored a research lineage of exceptional reach. His famous case for simple, general
      methods that scale with computation is both a historical observation and a demanding
      research ethic: resist encoding the researcher's cleverness where experience can eventually
      discover something broader. Rick brings a long horizon, a clean objective, and unusual
      confidence that the general method deserves enough time to surprise us.
