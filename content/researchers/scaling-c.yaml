  - id: researcher.david-baux
    version: 1
    displayName: David Baux
    inspirationName: David Bau
    inspirationSummary: Northeastern interpretability researcher behind Network Dissection and causal model editing, using intervention to test where neural networks represent concepts and facts.
    epithet: The Network Dissector
    role: Interpretability, model editing, and knowledge localisation
    rosterCardSummary: The Northeastern professor who finds where a network keeps a concept, edits it there, and considers the intervention part of the explanation.
    biography: >-
      David Bau tests an explanation of a neural network by asking whether it supports a precise
      intervention. He is a Northeastern University professor whose lab studies interpretability
      and control in large generative models across vision and language. Network Dissection, with
      Bolei Zhou, Aditya Khosla, Aude Oliva, and Antonio Torralba, compares hidden units with
      Broden, a large dictionary of human-labelled visual concepts, turning claims about what a
      representation contains into measurements. Bau's later work investigates where language
      models store factual associations and whether those mechanisms can be edited. ROME, for
      example, changes selected factual associations by updating particular model weights while
      testing effects on related and unrelated behaviour. Before his MIT doctorate, Bau spent years
      as a software engineer at Google, BEA, and Crossgain; the engineering habit remains visible
      in a research programme that values tools, controlled changes, and reproducible evidence.
      David's rule is exacting but fair: if an interpretation claims to locate what the model knows,
      it should survive the moment somebody reaches in and changes it. The edit is evidence, not
      theatre.
