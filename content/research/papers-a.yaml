    education:
      playerSummary: >-
        WaveNet models sound at the most fundamental level, predicting the audio waveform one sample
        at a time, tens of thousands of times per second. By stacking dilated convolutions that let
        each prediction see a wide swath of preceding audio without becoming impossibly slow to
        train, it produced speech markedly more natural than the concatenative and parametric systems
        that preceded it, and could also generate music.
      archiveExplanation: >-
        Generating raw audio is hard because meaningful structure spans many timescales at once, from
        the shape of a single phoneme to the rhythm of a sentence, and there are a great many samples
