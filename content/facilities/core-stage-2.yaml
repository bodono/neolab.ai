    summary: A building-wide institutional memory that means nobody in the lab ever again derives something a colleague derived last Tuesday. The lab spent nine figures to stop recomputing what the person in the next room already knew, and considers this money well spent.
    modifiers:
      - { target: lab.research.diffusionRate, operation: add, value: 0.6 }
      - { target: lab.research.all.output, operation: multiply, value: 1.1 }

