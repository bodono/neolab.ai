  - id: researcher.zico-kolder
    version: 1
    displayName: Zico Kolder
    inspirationName: Zico Kolter
    inspirationSummary: Carnegie Mellon machine-learning chair whose work on robust optimisation and adversarial robustness now informs board-level AI safety oversight.
    epithet: The Robustness Department Head
    role: Adversarial robustness and AI safety governance
    rosterCardSummary: The Carnegie Mellon department head who brings adversarial robustness from the theorem board into the boardroom.
    biography: >-
      Zico Kolter is a professor and head of Carnegie Mellon University’s Machine Learning
      Department, with research spanning robust optimisation, adversarial robustness and the
      security of learned systems. He completed his doctorate at Stanford and a postdoctoral
      fellowship at MIT before joining Carnegie Mellon, where his appointments connect machine
      learning with computer science, robotics and software research. His technical work asks how
      systems behave under perturbation rather than only on the friendly examples used to build
      them, including methods for certifying or improving robustness. In 2024, Kolter joined
      OpenAI’s board of directors and its Safety and Security Committee, bringing that research
      background into oversight of frontier-model decisions. The two roles fit together:
      robustness is not a label granted by the designer but a claim that should survive an
      adversary. Whether the venue is a classifier, a committee paper or a launch review, the proof
      is expected to bring its own stress test.
