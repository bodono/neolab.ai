      transformer models with billions of parameters train efficiently across hundreds of GPUs.
    education:
      playerSummary: >-
        Shoeybi and colleagues introduced a simple way to split individual transformer layers
        across multiple GPUs, rather than only splitting different layers onto different devices,
        letting language models with billions of parameters train efficiently without requiring a
        new compiler or specialised framework. The technique sustained high hardware utilisation
        across hundreds of GPUs.
      archiveExplanation: >-
        Training a language model larger than a single accelerator's memory requires splitting the
        model somehow across devices. Prior approaches mostly split whole layers across different
        devices in a pipeline, which can leave devices idle waiting on each other. Shoeybi and
        colleagues instead split the matrix multiplications within individual transformer layers
        across GPUs, an intra-layer model-parallel approach requiring only a handful of extra
        communication operations inserted into an otherwise ordinary training loop.

        This let the team train transformer models with billions of parameters across 512 GPUs
        while sustaining a high fraction of theoretical peak performance, without needing a new
        compiler, a custom framework, or a fundamental rewrite of the training code. The technique
        was explicitly designed to be complementary to pipeline-based parallelism rather than
        competing with it, and the combination became a standard part of how the very largest
        models were subsequently trained.

        Intra-layer parallelism requires fast interconnects between the GPUs sharing a layer,
        limiting how far it scales on its own without combining it with other parallelism
        strategies. Neolab.ai treats this as a core optimisation-scaling unlock underpinning the
        player's largest frontier training runs.
      insideBaseball: The matrix multiplication is split across GPUs mid-layer. The compute budget spreadsheet was not designed with this level of granularity in mind.
