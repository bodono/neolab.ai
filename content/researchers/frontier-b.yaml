researchers:
  - id: researcher.shane-legge
    version: 1
    displayName: Shane Legge
    inspirationName: Shane Legg
    inspirationSummary: DeepMind co-founder and Chief AGI Scientist who co-authored a formal measure of universal intelligence and a framework separating AGI performance, generality, and autonomy.
    epithet: The Definition Collector
    role: AGI measurement, capability forecasting, and research leadership
    rosterCardSummary: A DeepMind co-founder who collected dozens of definitions of intelligence, then helped build the laboratory trying to satisfy all of them.
    biography: >-
      Shane Legg co-founded DeepMind in 2010 with Demis Hassabis and Mustafa Suleyman, helping
      organise the company around research toward general-purpose intelligence. Long before “AGI”
      became a product-plan heading, he and Marcus Hutter assembled dozens of definitions of
      intelligence and proposed a formal measure based on an agent's performance across
      environments. He later served as DeepMind's chief scientist and now leads its AGI Safety
      Council as co-founder and Chief AGI Scientist. His recent co-authored work on Levels of AGI
      separates performance, generality and autonomy, creating a vocabulary for comparing systems
      and their risks without treating one benchmark as the whole answer. The classification invites
      an unavoidable gag: before anyone announces AGI, the claim needs a
      definition, a level, an autonomy regime, and a footnote that survives peer review. The meeting
      is rescheduled pending a measurable noun.
    availability: { wave: frontier, earliestYear: 2018, poolWeight: 0.40 }
    contract: { band: lab-defining, baseSalaryPerCycle: 0.97, baseSigningCash: 9, auraCost: 14, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 4, dataRepresentation: 1, reinforcementAgency: 3, multimodality: 2, reasoningTools: 5, roboticsEmbodiment: 1, scientificAi: 2, alignmentControl: 5, interpretabilityEvals: 2, securityContainment: 1, training: 2, product: 2, management: 5, politics: 4 }
    traits: [trait.disciplined-forecaster, trait.founding-conviction]
