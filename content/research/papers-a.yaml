        control and driving-simulator tasks, and the approach dramatically reduced how much real
        environment interaction was needed to train a working policy. It offered an influential,
        clean template for separating a world model from a decision-making policy, a division of
        labour that much later, far larger world-model and agent research explicitly built on.

        The learned world model's fidelity limited how complex an environment it could usefully
        stand in for, and errors in the model could mislead the policy trained inside it. Neolab.ai
        treats this as a foundational reinforcement-agency and architecture unlock for the model-based
        planning branch of later research.
