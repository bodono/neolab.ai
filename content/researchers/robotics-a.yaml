  - id: researcher.raia-hadsall
    version: 1
    displayName: Raia Hadsall
    inspirationName: Raia Hadsell
    inspirationSummary: Google DeepMind vice president and Frontier AI co-lead whose policy distillation, progressive networks, and elastic weight consolidation tackle catastrophic forgetting.
    epithet: The Catastrophic-Forgetting Rememberer
    role: Continual learning, robotics, and frontier AI research leadership
    rosterCardSummary: A frontier-research leader who has spent a decade ensuring that when a robot learns one impressive new skill, it does not quietly forget the previous impressive skill.
    biography: >-
      Raia Hadsell has made a career of asking what a model forgot while everyone else celebrates
      what it learned. Raia Hadsell is a Google DeepMind Vice President of Research and co-leads its
      Frontier AI unit. She arrived at AI via a degree in religion and philosophy at Reed College,
      earned her NYU doctorate with Yann LeCun on deep learning for mobile-robot vision, then worked
      at Carnegie Mellon's Robotics Institute and SRI International. She joined DeepMind in 2014,
      when it was a 50-person startup newly acquired by Google. Her continual-learning research
      includes policy distillation, progressive neural networks, and elastic weight consolidation,
      which protects parameters important to earlier tasks as a network learns new ones. Her
      dissertation on long-range vision for off-road robots won NYU's 2009 Outstanding Dissertation
      award; she later became TMLR's founding editor-in-chief and a UK government AI Ambassador,
      linking frontier research with responsible science and security. She also works on
      reinforcement learning, robotics, control, and navigation. Raia's release checklist therefore
      contains one extra question: did the new capability arrive alone, or did it quietly evict
      three old ones while everyone was watching the demo?
    availability: { wave: frontier, earliestYear: 2019, poolWeight: 0.40 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 2, dataRepresentation: 2, reinforcementAgency: 5, multimodality: 1, reasoningTools: 1, roboticsEmbodiment: 5, scientificAi: 0, alignmentControl: 1, interpretabilityEvals: 1, securityContainment: 0, training: 3, product: 2, management: 5, politics: 3 }
    traits: [trait.continual-learning-champion, trait.frontier-unit-co-leader]
    signature:
      id: ability.catastrophic-forgetting-prevention
      label: Catastrophic Forgetting Prevention
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.robotics-embodiment, domain.reinforcement-agency] }
      rampWeeks: 4
      effects:
        - { target: domain.robotics-embodiment.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.self-improving-foundation-agent
      label: Self-Improving Foundation Agent
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.04, stackingGroup: programme-rp }
    compact:
      id: compact.retain-the-old-skill-while-learning-the-new-one
      label: Retain the Old Skill While Learning the New One
      requirement: Complete one prior-task retention check every 52 weeks.
      check: { type: tagged-action-within, tags: [prior-task-retention-check], weeks: 52 }
      breachEvent: people.compact.retain-the-old-skill-while-learning-the-new-one
    paperHooks:
      ids: [paper.rt-1-robotics-transformer, paper.world-models]
    eventReactions:
      - { triggerTag: robot-demo-failure, line: "Check whether the robot forgot an old skill while learning this new one. That failure mode is easy to miss until it's expensive." }
      - { triggerTag: capability-surprise, line: "A new capability that quietly costs an old one is not a clean gain. Verify the retention before celebrating the addition." }
      - { triggerTag: talent-poaching, line: "I joined this lab when it was fifty people. The continual-learning problem has stayed the same size relative to how the lab has grown." }
    feedLines:
      - Raia's retention check caught a robot that had quietly forgotten an old manipulation skill while learning a new one.
      - The self-improving foundation agent picked up a new task from a hundred demonstrations and kept every prior one intact.
      - Raia's elastic weight consolidation technique, years old now, is still doing quiet work inside this quarter's continual-learning pipeline.
      - A bipedal robot learned to play agile soccer without forgetting how to simply walk, exactly as the compact requires.
      - The Frontier AI unit shipped a contribution to a major model, and Raia's continual-learning fingerprints were on it.
      - Raia joined a fifty-person startup a decade ago. The catastrophic-forgetting problem she was solving then is, tellingly, the same one now.
    portrait:
      assetId: portrait.researcher.raia-hadsall
      brief: Composed 8-bit editorial portrait; pale white woman with vivid blue shoulder-length hair, rectangular glasses, and a thoughtful, determined expression, beside a robot retaining an old skill while acquiring a new one; balanced and enduring, not photoreal.
      altText: Pixel-art portrait of Raia Hadsall beside a robot retaining an old skill while acquiring a new one, both lit equally.
    sources:
      - https://raiahadsell.com/index.html
      - https://deepmind.google/blog/article/enabling-continual-learning-in-neural-networks
