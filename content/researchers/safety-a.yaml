      ids: [paper.constitutional-ai-harmlessness, paper.gpt3-few-shot-learners]
    eventReactions:
      - { triggerTag: model-overconfidence, line: "The model should be honest about what it does not know. That is a character trait, and character traits are trained, not wished for." }
      - { triggerTag: jailbreak-viral, line: "A good character holds under pressure. If it only behaves when the prompt is polite, we specified compliance, not character." }
      - { triggerTag: ai-self-designed-eval, line: "Ask what kind of entity we are asking it to be, then check the training actually asks for that. The gap between those two is my whole job." }
    feedLines:
      - Amanda rewrote one clause of the model's character specification and an entire class of evasive answers disappeared.
      - A philosophy seminar broke out in the fine-tuning meeting, and for once everyone agreed it was load-bearing.
      - The model handled an emotionally difficult conversation with a care nobody could quite point to in the training data, except Amanda.
      - A thirty-thousand-word character document got longer, more precise, and, the evaluators confirm, noticeably more effective.
      - Amanda declined to make the model more flattering, on the grounds that honesty is a kindness with a longer horizon.
      - The infinite-ethics dissertation comes up rarely; the habit of taking hard questions seriously comes up constantly.
