        neurons, the features they detect, and the weighted connections between them, researchers
        can find genuinely meaningful, human-understandable algorithms embedded in a network's
        weights, which they termed circuits. The paper proposed that such circuits and the features
        composing them recur across different models and tasks, suggesting a shared, discoverable
        structure underlying seemingly opaque networks.
      archiveExplanation: >-
        Much interpretability research before this treated a trained network largely as an
        input-output function to be probed from the outside, through saliency maps or ablation
        studies, without closely examining its internal structure. Olah and colleagues instead
        proposed zooming directly into that structure: identifying individual neurons that
        reliably detect specific, human-nameable features, such as curve detectors in a vision
        model, and tracing the weighted connections between such neurons to find circuits,
        small computational subgraphs implementing an identifiable algorithm.

        The paper made three linked, deliberately speculative claims: that such features are a
        fundamental unit of neural network computation, that circuits made of connected features
        implement genuine algorithms rather than mere correlations, and that analogous features and
        circuits recur across different models and tasks, suggesting real, discoverable structure
        rather than arbitrary, model-specific noise.

        The approach required painstaking manual analysis of individual neurons and circuits, and
        scaling it to enormous modern models remained an open challenge the authors explicitly
        flagged rather than solved. Neolab.ai treats this as the founding unlock of the lab's
        mechanistic-interpretability research branch.
      insideBaseball: A curve detector neuron is found, named, and traced through the network. Naming it took considerably less time than agreeing on the name.
