  - id: researcher.amanda-askill
    version: 1
    displayName: Amanda Askill
    inspirationName: Amanda Askell
    inspirationSummary: Philosopher and Anthropic Character lead who turns questions about honesty, judgment and values into explicit training specifications for Claude.
    epithet: The Character Architect
    role: Model character, values, and fine-tuning philosophy
    rosterCardSummary: The philosopher who writes model character as a serious engineering specification, because “we hoped it would be wise” is not a training method.
    biography: >-
      Amanda Askell moved from academic philosophy into AI alignment just as questions about values,
      judgment and responsibility ceased being hypothetical and became product requirements. She studied at
      Dundee and Oxford, then completed a philosophy doctorate at NYU on infinite ethics. After work
      at OpenAI, she joined Anthropic and now leads its Character work. Askell is the primary author
      of Claude’s constitution, an account of the values and behaviour Anthropic intends its models
      to learn, and helped develop the Claude Character project. Her work treats
      character as an engineering object without reducing it to a checklist: honesty, uncertainty,
      appropriate deference, ethical judgment and the ability to help without merely flattering the
      user all have to remain coherent across difficult situations. The constitution is written for
      the model as well as its human trainers, making moral philosophy part of the production
      pipeline rather than a decorative appendix. Askell’s route through infinite ethics is
      unusually good preparation for a document expected to survive edge cases. A personality this
      consequential is not left to autocomplete. Her writing explains those choices to users as
      well as the training team.
    availability: { wave: frontier, earliestYear: 2021, poolWeight: 0.55 }
    contract: { band: major, baseSalaryPerCycle: 0.78, baseSigningCash: 7, auraCost: 11, overrideExplanation: Priced on overall measured research strength. }
