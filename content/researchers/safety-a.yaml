  - id: researcher.shauna-kravek
    version: 1
    displayName: Shauna Kravek
    inspirationName: Shauna Kravec
    inspirationSummary: Physicist, reinforcement-learning engineer and Hofvarpnir Studios co-founder who built alignment-training infrastructure and expanded independent safety researchers’ access to compute.
    epithet: The Safety Infrastructure Builder
    role: Reinforcement learning infrastructure for aligned model training
    rosterCardSummary: The physicist who helped build Anthropic’s reinforcement-learning stack, then co-founded a nonprofit to give independent safety work a proper cluster.
    biography: >-
      Shauna Kravec trained as a physicist, completing a doctorate at UC San Diego and postdoctoral
      work at UC Riverside before moving into reinforcement-learning engineering. At Anthropic, she
      worked with Nova DasSarma and others on core reinforcement-learning infrastructure used in
      model training. She contributed to research on helpful and harmless assistants trained with
      human feedback and to later work probing how safety training behaves under demanding
      conditions. Her interests span reinforcement learning, large language models and scaling
      behaviour, joining a physicist’s concern for clean measurements with the engineer’s obligation
      to make the training loop run twice. Kravec later co-founded Hofvarpnir Studios with DasSarma.
      The nonprofit builds and operates compute infrastructure for independent AI-safety
      researchers, giving small teams access to clusters large enough for serious empirical work.
      It is an unusually concrete contribution to a field that can otherwise accumulate excellent
      proposals for experiments nobody can afford to run. Her work connects alignment ideas to the
      infrastructure required to test them: the safety team gets GPUs, reproducible pipelines and
      considerably fewer sympathetic nods in place of either. That support has helped turn
      independent safety proposals into experiments with logs, checkpoints and repeatable results.
