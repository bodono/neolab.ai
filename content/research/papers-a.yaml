  - id: paper.weak-to-strong-generalization
    version: 1
    historicity: real
    gameOrder: 138
    title: "Weak-to-Strong Generalization: Eliciting Strong Capabilities With Weak Supervision"
    authors: [Collin Burns, Pavel Izmailov, Jan Hendrik Kirchner, Bowen Baker, Leo Gao, Leopold Aschenbrenner, Yining Chen, Adrien Ecoffet, Manas Joglekar, Jan Leike, Ilya Sutskever, Jeff Wu]
    publicationYear: 2023
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/2312.09390
    arxiv: "2312.09390"
    historicalNote: >-
      Published in December 2023, this paper proposed studying superhuman alignment today by
      substituting a weak model for the human supervisor, making the hard case of supervising a
      system more capable than its overseer available to experiment rather than only to argument.
    education:
      playerSummary: >-
        The alignment problem that matters is supervising a model more capable than its supervisor,
        which cannot be studied directly because no such model exists to supervise. The authors
        proposed an analogy that can be run today: fine-tune a strong model on labels produced by a
        deliberately weak one, and measure how much of the strong model's latent ability survives.
        It largely does, which is encouraging, but the recovered performance falls short of what
        good labels would give, and that gap is the open problem.
      archiveExplanation: >-
        Techniques such as reinforcement learning from human feedback assume the supervisor can tell
        good behaviour from bad. That assumption fails precisely where it matters most, for a system
        whose reasoning outruns its overseer's ability to check it. The difficulty had been argued
        about for years without being measured, because the experiment appeared to require a model
        nobody had.

        The paper's move was to replace the missing future pair with an available present one. Use a
        weak model as the supervisor and a strong model as the student: fine-tune the strong model
        on the weak model's labels and ask how much of the strong model's own latent capability it
        recovers. This turns an argument into an experiment with a number attached.

        The result cuts both ways honestly. Strong students generalise well beyond their weak
        supervisors rather than merely imitating their mistakes, which is genuine cause for
        optimism. But they recover only part of the performance that ground-truth labels would
        yield, and simple methods close only some of that gap. The authors are explicit that the
        analogy is imperfect, since a weak model is not a human and the failure modes may differ.
        Neolab.ai treats it as an alignment-science unlock: it improves what the lab's supervision
        can extract from a capable model without pretending the supervision gap has been closed.
      insideBaseball: The good news is the strong model figured out what you meant. The bad news is you now have to explain how you know that.
    domainWeights:
      safety.alignment-control: 0.50
      domain.reasoning-tools: 0.30
      domain.reinforcement-agency: 0.20
    prerequisites:
      papers: [paper.deep-rl-from-human-preferences, paper.transformer]
      domainLevels:
        safety.alignment-control: 26
