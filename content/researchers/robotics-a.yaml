      label: Probabilistic Robot Perception
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.robotics-embodiment] }
      rampWeeks: 4
      effects:
        - { target: domain.robotics-embodiment.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.research.program.base:domain.robotics-embodiment.weeklyVarianceWidth, operation: multiply, value: 0.90, stackingGroup: variance-width }
    passive:
      id: ability.textbook-trained-talent-pipeline
      label: Textbook-Trained Talent Pipeline
      effects:
        - { target: researcher.loyalty, operation: add, value: 4 }
    compact:
      id: compact.model-the-uncertainty-explicitly
      label: Model the Uncertainty Explicitly
      requirement: Complete one explicit state-uncertainty report every 52 weeks.
      check: { type: tagged-action-within, tags: [explicit-state-uncertainty-report], weeks: 52 }
      breachEvent: people.compact.model-the-uncertainty-explicitly
    paperHooks:
      ids: [paper.rt-1-robotics-transformer, paper.dactyl-dexterous-in-hand-manipulation]
    eventReactions:
      - { triggerTag: robot-demo-failure, line: "Check the state estimate's uncertainty before blaming the manipulation policy. Often the robot simply did not know where it was." }
      - { triggerTag: simulation-transfer, line: "A deterministic simulation hides exactly the estimation uncertainty a real sensor will hand you. Model it explicitly instead." }
      - { triggerTag: talent-poaching, line: "Half the roboticists at the table learned state estimation from a textbook I co-wrote. That fact rarely helps them negotiate." }
    feedLines:
      - Dieter's uncertainty estimate flagged a state the robot's sensors were, correctly, unsure about before it caused a failure.
      - A manipulation policy improved noticeably once it was given an honest probabilistic state estimate to act on.
      - The textbook from years ago is still the first thing a new robotics hire is quietly expected to have already read.
      - Dieter's perception pipeline caught a sensor fault by noticing its confidence estimate had, correctly, collapsed.
      - A hiring negotiation stalled briefly on the fact that the candidate had, in fact, learned the field from Dieter's own book.
      - The explicit uncertainty report the compact requires caught a mapping error the deterministic version had confidently missed.
    portrait:
      assetId: portrait.researcher.dieter-foxx
      brief: Grounded 8-bit editorial portrait; older white man with short grey hair and a calm, methodical expression, beside a robot map with a probabilistic uncertainty cloud around its estimated position; foundational and precise, not photoreal.
      altText: Pixel-art portrait of Dieter Foxx beside a robot's map with a probabilistic uncertainty cloud around its estimated position.
    sources:
