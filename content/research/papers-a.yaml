    title: Training language models to follow instructions with human feedback
    authors: [Long Ouyang, Jeff Wu, Xu Jiang, Diogo Almeida, Carroll L. Wainwright, Pamela Mishkin, Chong Zhang, Sandhini Agarwal, Katarina Slama, Alex Ray, John Schulman, Jacob Hilton, Fraser Kelton, Luke Miller, Maddie Simens, Amanda Askell, Peter Welinder, Paul Christiano, Jan Leike, Ryan Lowe]
    publicationYear: 2022
    venue: Advances in Neural Information Processing Systems 35
    primarySourceUrl: https://arxiv.org/abs/2203.02155
    arxiv: "2203.02155"
    historicalNote: >-
      Posted in 2022, this paper described InstructGPT, fine-tuned from GPT-3 using supervised
      demonstrations and reinforcement learning from human feedback so its outputs better matched
      what people actually asked for.
    education:
      playerSummary: >-
        InstructGPT fine-tuned a GPT-3-scale model in two stages: first on human-written examples
        of good responses to instructions, then further using reinforcement learning against a
        reward model trained on human rankings of model outputs. The resulting model was
        preferred by human raters over a much larger base model on typical user instructions,
        showing that alignment with what people actually want could matter as much as raw scale.
      archiveExplanation: >-
        Raw language models trained only to predict internet text will readily continue a prompt
        in unhelpful, evasive or unsafe directions, because next-token prediction optimises for
        plausible text, not for satisfying a user's actual request. Ouyang, Christiano, Leike and
        colleagues addressed this gap directly, building on the human-preference reinforcement-
        learning technique from earlier work.

        Their recipe combined supervised fine-tuning on human-written demonstrations of desired
        behaviour with reinforcement learning from human feedback: human labellers ranked model
        outputs, a reward model learned from those rankings, and policy optimisation then tuned
        the language model against that learned reward. In blind human evaluation, outputs from
        the resulting InstructGPT model—orders of magnitude smaller—were preferred over outputs
        from the original, much larger base model on ordinary user prompts.

        The paper also reported real remaining problems: the tuned model could still produce
        toxic or false content, sometimes followed instructions too literally, and inherited
        biases from both its pretraining data and its human raters' judgements. Its central
        lesson was nonetheless significant: substantial gains in perceived helpfulness and safety
        could come from a comparatively modest amount of targeted human feedback, not only from
        more parameters. In Neolab.ai this discovery is the direct capability lineage behind
        instruction-following products, and it strengthens preference-based alignment techniques
        precisely where naive scaling alone does not reach.
      insideBaseball: Human raters prefer the smaller, fine-tuned model's answers by a wide margin. The larger model's team has asked whether the raters were fully briefed on the parameter count.
