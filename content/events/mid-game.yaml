  # --- Security: prompt injection --------------------------------------------
  - id: event.security.prompt-injection
    version: 1
    category: security
    severity: decision
    phase: any
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 50 }
        - { type: compare, metric: player.ai.launched, op: eq, value: 1 }
    baseWeight: 7
    # Weak practical control means an agent with fewer guard rails to break.
    weightModifiers:
      - predicate:
          { type: compare, metric: player.safety.practicalControl, op: lt, value: 40 }
        multiplier: 2
    cooldown: { group: mid-game-prompt-injection, weeks: 26 }
    unique: true
    expiryWeeks: 10
    defaultOptionId: train-to-resist
    titleKey: event.security.prompt-injection.title
    bodyKey: event.security.prompt-injection.body
    educationKey: event.security.prompt-injection.education
    evidence:
      - textKey: event.security.prompt-injection.evidence.control
        metric: player.safety.practicalControl
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: ask-before-acting
        labelKey: event.security.prompt-injection.confirm.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.security.prompt-injection.confirm.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.market.acquisitionRate, operation: multiply, value: 0.90, durationWeeks: 26, tags: [confirm-actions] }
          - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: 5 }
          - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 0.95, durationWeeks: 52, tags: [confirm-actions] }
        checks: []
        memories:
          - key: mid-game.prompt-injection.ask-first
            subjects: [{ type: player-lab }]
            tags: [confirm-actions, safety-first]
        confirmationRequired: false
      - id: train-to-resist
        labelKey: event.security.prompt-injection.train.label
        requirements: { type: always }
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -3 }
        previewKey: event.security.prompt-injection.train.preview
        immediateEffects:
          - { kind: add-rating, subject: { type: player-lab }, rating: securityPosture, amount: 3 }
        checks:
          - id: next-trick
            likelihoodPromise: { label: uncertain, successOutcomeIds: [holds] }
            outcomes:
              - id: holds
                minimumInclusive: 0
                maximumExclusive: 0.5
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: practicalControlStrength, amount: 2 }
                memories:
                  - key: mid-game.prompt-injection.resisted
                    subjects: [{ type: player-lab }]
                    tags: [injection-training]
              - id: new-trick
                minimumInclusive: 0.5
                maximumExclusive: 1
                effects:
                  - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.05, durationWeeks: 26, tags: [injection-training] }
                memories:
                  - key: mid-game.prompt-injection.new-trick
                    subjects: [{ type: player-lab }]
                    tags: [injection-training, new-attack]
        memories: []
        confirmationRequired: false
      - id: hands-free
        labelKey: event.security.prompt-injection.ship.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.security.prompt-injection.ship.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.market.acquisitionRate, operation: multiply, value: 1.10, durationWeeks: 26, tags: [hands-free-agent] }
          - kind: schedule-effects
            dueInWeeks: 26
            effects:
              - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.10, durationWeeks: 39, tags: [hands-free-agent] }
              - { kind: add-rating, subject: { type: player-lab }, rating: governmentAttention, amount: 5 }
        checks: []
        memories:
          - key: mid-game.prompt-injection.hands-free
            subjects: [{ type: player-lab }]
            tags: [hands-free-agent, injection-ignored]
        confirmationRequired: true
    followUps: []
    telemetryTags: [mid-game, security, prompt-injection, agents]

