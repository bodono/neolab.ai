  - id: researcher.alex-graven
    version: 1
    displayName: Alex Graven
    inspirationName: Alex Graves
    inspirationSummary: Connectionist temporal classification creator and Neural Turing Machine co-inventor whose work advances sequence learning and differentiable memory.
    epithet: The Sequence Whisperer
    role: Recurrent sequence modelling and differentiable memory
    rosterCardSummary: A sequence-learning pioneer whose connectionist and addressable-memory systems advance reasoning research and make experimental results less erratic.
    biography: >-
      Alex Graves teaches a network when to remember, when to emit, and where it left the useful
      state. Alex Graves completed his doctorate with Jürgen Schmidhuber at IDSIA and later worked
      with Geoffrey Hinton at the University of Toronto before joining DeepMind. His research page
      records the creation of connectionist temporal classification, which trains sequence models
      without requiring a pre-segmented alignment between inputs and labels. He applied recurrent
      networks to speech, handwriting recognition, and handwriting generation, then co-authored
      Neural Turing Machines, coupling a neural controller to an external differentiable memory.
      Later work on differentiable neural computers expanded that memory-based approach to
      structured reasoning tasks. His sequence work also includes deep bidirectional LSTMs for
      speech recognition and multidimensional recurrent networks for handwriting recognition.
      Across that programme, Graves gives the model a memory it can address, tests whether it uses
      that memory, and declines to hand-align the labels merely because the experiment calendar is
      becoming impatient.
    availability: { wave: deep-learning, earliestYear: 2015, poolWeight: 0.55 }
    contract: { band: major, baseSalaryPerCycle: 0.78, baseSigningCash: 7, auraCost: 11, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 3, reinforcementAgency: 1, multimodality: 5, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 2, securityContainment: 0, training: 3, product: 1, management: 2, politics: 0 }
    traits: [trait.memory-as-first-class, trait.sequence-whisperer]
    signature:
      id: ability.differentiable-external-memory
      label: Differentiable External Memory
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.architectures, domain.reasoning-tools] }
      rampWeeks: 4
      effects:
        - { target: domain.reasoning-tools.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 3 }
    passive:
      id: ability.connectionist-temporal-classification
      label: No Hand-Aligned Labels
      effects:
        - { target: lab.research.program.base:domain.reasoning-tools.weeklyVarianceWidth, operation: multiply, value: 0.88 }
    compact:
      id: compact.give-the-model-a-memory-it-can-address
      label: Give the Model a Memory It Can Address
      requirement: While he leads Reasoning & Tools, complete one explicit-memory or retrieval validation every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: reasoning-programme, projectTag: explicit-addressable-memory, weeks: 52 }
      breachEvent: people.compact.give-the-model-a-memory-it-can-address
    paperHooks:
      ids: [paper.long-short-term-memory, paper.neural-turing-machines]
    eventReactions:
      - { triggerTag: reasoning-benchmark-record, line: "Ask whether the model is reasoning or merely holding more context in a bigger hidden state. Those are different achievements." }
      - { triggerTag: architecture-fad, line: "A model that cannot address its own memory will eventually run out of thoughts to hold. Build the address book in." }
      - { triggerTag: benchmark-saturation, line: "The handwriting looked human because the memory held the right stroke, at the right moment, for long enough." }
    feedLines:
      - Alex's memory-augmented network learned to sort a sequence it was never explicitly taught to sort.
      - The differentiable memory's read head found exactly the stored value the reasoning step needed, unprompted.
      - A generated handwriting sample passed a casual inspection that a human handwriting sample would also have passed.
      - Alex's connectionist temporal classification method quietly still underlies a speech pipeline three architectures later.
      - The Neural Turing Machine's memory tape held a value across a hundred steps, exactly as designed a decade ago.
      - A younger researcher asked why the model needed explicit memory at all. Alex showed them, patiently, what happens without it.
    portrait:
      assetId: portrait.researcher.alex-graven
      brief: Quiet 8-bit editorial portrait; white man with short light-brown hair and a thoughtful expression, beside a neural network reading from and writing to an external memory tape; patient and architectural, not photoreal.
      altText: Pixel-art portrait of Alex Graven beside a neural network reading from and writing to an external memory tape.
    sources:
