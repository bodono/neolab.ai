abilityRules:
  reassignmentRamp: [0.25, 0.50, 0.75, 1.00]
  unhousedStrengthMultiplier: 0.50
  sabbaticalDisablesSignature: true
  sabbaticalDisablesPassive: false
  initialSlots: 3
  hardMaximumSlots: 8

compactRules:
  defaultRollingWindowWeeks: 26
  breachEffects:
    - { target: researcher.moraleTarget, operation: add, value: -20 }
    - { target: researcher.loyalty, operation: add, value: -10 }
    - { target: researcher.departurePressure, operation: add, value: 15 }
  consequenceDelivery: visible-event

portrayalRules:
  fictionalizedDisplayNames: true
  endorsementImplied: false
  compactsAreFictionalGameContracts: true
  releaseRequiresLegalReview: true
  releaseRequiresPortraitReview: true
