researchers:
  - id: researcher.alexei-dosovsky
    version: 1
    displayName: Alexei Dosovsky
    inspirationName: Alexey Dosovitskiy
    inspirationSummary: Vision Transformer lead author who showed that an image could be split into patches and processed by a largely standard transformer.
    epithet: The Patch Prophet
    role: Vision transformers and architecture unification
    rosterCardSummary: The Vision Transformer lead author who gave image patches the same architectural rights as tokens and watched computer vision reorganise itself.
    biography: >-
      Alexey Dosovitskiy began in pure mathematics before moving into computer vision and machine
      learning at the University of Freiburg. At Google Research, he led “An Image is Worth 16×16
      Words,” the paper that introduced the Vision Transformer. The model divides an image into a
      sequence of patches and sends them through a standard transformer, replacing many assumptions
      built into convolutional networks. With sufficient pre-training data, it matched or exceeded
      convolutional baselines and helped make attention-based backbones central to vision. The
      result was valuable not because images secretly were sentences, but
      because a general architecture could learn more visual structure than many researchers had
      expected it to. Dosovitskiy’s work makes removal a serious experimental method: take away the
      cherished inductive bias, scale the comparison properly and see whether the benchmark sends a
      condolence card. In this case, the patches managed very well.
    availability: { wave: scaling, earliestYear: 2019, poolWeight: 0.65 }
    contract: { band: competitive, baseSalaryPerCycle: 0.49, baseSigningCash: 4, auraCost: 6, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 3, reinforcementAgency: 0, multimodality: 5, reasoningTools: 2, roboticsEmbodiment: 1, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 1, securityContainment: 0, training: 4, product: 2, management: 2, politics: 0 }
    traits: [trait.elegant-removal, trait.architecture-unifier]
    signature:
      id: ability.patches-not-pixels
      label: Patches, Not Pixels
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality, domain.architectures] }
      rampWeeks: 4
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.one-backbone-many-modalities
      label: One Backbone, Many Modalities
      effects:
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.041, stackingGroup: training-throughput }
    compact:
      id: compact.test-the-assumption
      label: Test the Assumption
      requirement: While he leads Architectures, complete one inductive-bias ablation every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: architecture-programme, projectTag: inductive-bias-ablation, weeks: 52 }
      breachEvent: people.compact.test-the-assumption
    paperHooks:
      ids: [paper.vision-transformer, paper.clip-language-supervised-vision]
    eventReactions:
      - { triggerTag: architecture-fad, line: "Before adding a new inductive bias, remove one first and see what actually breaks." }
      - { triggerTag: benchmark-saturation, line: "The architecture did not change. The data did. That distinction matters." }
      - { triggerTag: compute-windfall, line: "Given more compute, the simpler architecture usually wins. It rarely feels like a satisfying answer." }
    feedLines:
      - Alexei removed the last convolutional layer and the model's performance quietly improved.
      - A patch-embedding diagram appeared on the whiteboard, replacing three separate modality-specific ones.
      - The ablation removed a beloved inductive bias. The result did not miss it.
      - Alexei's team trained the same architecture on twice the data and got a genuinely different model.
      - A colleague asked why a plain transformer should work here too. Alexei asked why it wouldn't.
      - The unified backbone now handles a task nobody originally built it for, slightly to everyone's surprise.
    portrait:
      assetId: portrait.researcher.alexei-dosovsky
      brief: Clean 8-bit editorial portrait; white man with very short sandy-brown hair and thin-framed glasses, beside an image cleanly divided into a patch grid feeding a single attention diagram; minimalist and precise, not photoreal.
      altText: Pixel-art portrait of Alexei Dosovsky beside an image divided into a patch grid feeding an attention diagram.
    sources:
      - https://arxiv.org/abs/2010.11929
      - https://lmb.informatik.uni-freiburg.de/people/dosovits/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.jonathan-hoe
    version: 1
    displayName: Jonathan Hoe
    inspirationName: Jonathan Ho
    inspirationSummary: Generative-modelling researcher whose Denoising Diffusion Probabilistic Models paper established iterative denoising as a powerful route to image generation.
    epithet: The Noise Whisperer
    role: Diffusion-based generative modelling
    rosterCardSummary: The diffusion-model pioneer who turned “remove a little noise” into enough careful steps to generate an image.
    biography: >-
      Jonathan Ho is the lead author of “Denoising Diffusion Probabilistic Models,” the 2020 paper
      that helped establish diffusion as a central approach to generative modelling. Ho and his
      co-authors trained a network to reverse a fixed process that gradually adds noise to data.
      Sampling then begins with noise and repeatedly applies the learned reverse steps until an
      image appears. The method produced high-quality samples without the adversarial training used
      by GANs and connected the model to ideas from score matching and nonequilibrium
      thermodynamics. Ho’s later work helped improve diffusion sample quality and conditional
      control. The elegant part is the decomposition: no single step must paint the whole picture;
      each is responsible for making the current noise slightly less convincing. Thousands of
      modest corrections later, noise itself has acquired a remarkably successful creative career.
    availability: { wave: scaling, earliestYear: 2020, poolWeight: 0.70 }
    contract: { band: major, baseSalaryPerCycle: 0.73, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 5, dataRepresentation: 4, reinforcementAgency: 1, multimodality: 5, reasoningTools: 1, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 0, interpretabilityEvals: 5, securityContainment: 0, training: 4, product: 2, management: 1, politics: 0 }
    traits: [trait.patient-decomposition, trait.stable-training-instinct]
    signature:
      id: ability.one-small-step-at-a-time
      label: One Small Step at a Time
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.multimodality] }
      rampWeeks: 4
      effects:
        - { target: domain.multimodality.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.stable-by-construction
      label: Stable by Construction
      effects:
        - { target: lab.training.technicalFailureHazard, operation: multiply, value: 0.977, stackingGroup: hazard-reduction }
    compact:
      id: compact.no-adversarial-shortcuts
      label: No Adversarial Shortcuts
      requirement: While he leads Multimodality, complete one non-adversarial objective validation every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: generative-programme, projectTag: non-adversarial-objective, weeks: 52 }
      breachEvent: people.compact.no-adversarial-shortcuts
    paperHooks:
      ids: [paper.denoising-diffusion-probabilistic-models, paper.latent-diffusion-high-resolution-synthesis]
    eventReactions:
      - { triggerTag: unstable-training, line: "Adversarial instability is a design choice, not a law of generative modelling. Consider not making it." }
      - { triggerTag: synthetic-media, line: "The samples are only as responsible as the release policy attached to them." }
      - { triggerTag: architecture-fad, line: "Decompose the hard problem into easy steps first. It is rarely as slow as it sounds." }
    feedLines:
      - Jonathan added one more denoising step and the sample quality improved, again, marginally and reliably.
      - The training curve stayed stable through the whole run, which the team has started to find suspicious.
      - A generated sample survived scrutiny that would have caught an adversarial artifact immediately.
      - Jonathan explained the forward noising process for the fourth time this week, patiently, once more.
      - The latent-space version trained in a fraction of the compute, and Jonathan called this "expected."
      - A colleague asked if diffusion was slow. Jonathan asked if correct was slow.
    portrait:
      assetId: portrait.researcher.jonathan-hoe
      brief: Calm 8-bit editorial portrait; East Asian man with short black hair, round glasses and a light moustache and goatee, beside an image resolving gradually out of noise across several panels; patient and methodical, not photoreal.
      altText: Pixel-art portrait of Jonathan Hoe beside an image gradually resolving out of noise across several panels.
    sources:
      - https://arxiv.org/abs/2006.11239
      - https://www.jonathanho.me/
      - https://arxiv.org/abs/2105.05233
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.jared-kapler
    version: 1
    displayName: Jared Kapler
    inspirationName: Jared Kaplan
    inspirationSummary: Physicist, Anthropic co-founder and scaling-laws lead author who turned model size, data and compute into quantities a frontier laboratory could plan around.
    epithet: The Power-Law Planner
    role: Scaling laws and frontier training strategy
    rosterCardSummary: The physicist who fitted power laws to model size, data and compute, then co-founded a laboratory obliged to budget accordingly.
    biography: >-
      Jared Kaplan trained as a theoretical physicist and became a professor at Johns Hopkins
      before applying the search for simple quantitative laws to neural networks. At OpenAI, he led
      “Scaling Laws for Neural Language Models,” which found smooth power-law relationships between
      language-model loss and model size, dataset size and training compute across several orders
      of magnitude. Those equations gave frontier teams a practical way to forecast returns and
      allocate a fixed compute budget for both research and deployment. Kaplan later co-founded
      Anthropic and serves as its chief
      science officer. He helped pioneer Constitutional AI, which trains models against explicit
      written principles, and worked with Amanda Askell to establish the Claude Character project
      and shape Claude’s constitution. His career links capability forecasting and alignment rather
      than treating safety as the paragraph after the scaling chart. The physicist’s habit remains
      visible: name the variables, fit the curve, state the assumptions, and do not bring Finance a
      frontier run whose units have gone missing.
    availability: { wave: scaling, earliestYear: 2021, poolWeight: 0.55 }
    contract: { band: major, baseSalaryPerCycle: 0.92, baseSigningCash: 8, auraCost: 13, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 3, optimisationScaling: 5, dataRepresentation: 3, reinforcementAgency: 2, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 2, alignmentControl: 5, interpretabilityEvals: 2, securityContainment: 1, training: 4, product: 1, management: 4, politics: 3 }
    traits: [trait.quantitative-forecaster, trait.safety-as-scaling-problem]
    signature:
      id: ability.compute-optimal-planning
      label: Compute-Optimal Planning
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.optimisation-scaling] }
      rampWeeks: 4
      effects:
        - { target: domain.optimisation-scaling.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.044, stackingGroup: training-throughput }
    passive:
      id: ability.forecastable-returns
      label: Forecastable Returns
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 6}
    compact:
      id: compact.capability-and-safety-together
      label: Capability and Safety Together
      requirement: Keep at least 20% of R&D compute in safety while he leads Optimisation & Scaling.
      check: { type: conditional-metric-at-least, condition: { assignmentDomain: base:domain.optimisation-scaling }, metric: lab.allocation.rdSafetyShare, value: 0.20 }
      breachEvent: people.compact.capability-and-safety-together
    paperHooks:
      ids: [paper.scaling-laws-language-models, paper.constitutional-ai-harmlessness]
    eventReactions:
      - { triggerTag: scaling-proposal, line: "Show me the curve this run is meant to sit on, not merely the budget it is meant to spend." }
      - { triggerTag: safety-budget-cut, line: "A capability forecast without a matching safety forecast is half a plan." }
      - { triggerTag: ai-self-designed-eval, line: "Let the model propose the harder test. Verify independently before trusting the harder score." }
    feedLines:
      - Jared fit a new curve to the training runs and revised next quarter's compute request accordingly.
      - The written constitution gained a clause after a model politely found a loophole in the previous one.
      - A physicist's instinct for units caught an off-by-an-order-of-magnitude error in a compute budget.
      - Jared's forecast predicted the loss within a rounding error, and Finance is still recovering.
      - The self-critique stage caught an issue the human reviewers had, reasonably, missed.
      - "A scaling proposal was returned with one polite question: \"and the safety curve?\""
    portrait:
      assetId: portrait.researcher.jared-kapler
      brief: Precise 8-bit editorial portrait; white man with short brown hair and rectangular glasses, beside a smooth power-law curve and a small written constitution scroll; quantitative and principled, not photoreal.
      altText: Pixel-art portrait of Jared Kapler beside a smooth scaling-law curve and a small constitution scroll.
    sources:
      - https://www.hertzfoundation.org/people/jared-kaplan/
      - https://arxiv.org/abs/2001.08361
      - https://www.anthropic.com/constitution
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.john-schulmann
    version: 1
    displayName: John Schulmann
    inspirationName: John Schulman
    inspirationSummary: OpenAI co-founder and reinforcement-learning researcher who developed TRPO and PPO, then led post-training work behind ChatGPT.
    epithet: The Policy Optimizer
    role: Policy-gradient reinforcement learning and human-feedback alignment
    rosterCardSummary: The PPO creator whose deliberately modest policy updates became an unexpectedly expansive part of modern model post-training.
    biography: >-
      John Schulman studied physics at Caltech and completed a doctorate at UC Berkeley with Pieter
      Abbeel. His research introduced Trust Region Policy Optimization, which constrains each
      reinforcement-learning policy update, and Proximal Policy Optimization, a simpler clipped
      objective that became one of the field’s most widely used algorithms. PPO proved practical
      across large training systems. Schulman co-founded
      OpenAI, led the creation of ChatGPT and, from 2022 to 2024, co-led the post-training team that
      developed models for ChatGPT and the OpenAI API. That work joined policy optimisation with
      reward models and human feedback, making reinforcement learning a central part of
      instruction-following systems. He later spent time on Anthropic’s Alignment Science team. The
      recurring engineering idea is disciplined movement: make an update large enough to learn,
      but not so large that yesterday’s useful policy disappears. PPO’s clipped step has enjoyed a
      remarkably unclipped career.
    availability: { wave: scaling, earliestYear: 2017, poolWeight: 0.60 }
    contract: { band: major, baseSalaryPerCycle: 0.87, baseSigningCash: 8, auraCost: 12, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 2, optimisationScaling: 3, dataRepresentation: 2, reinforcementAgency: 5, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 2, scientificAi: 0, alignmentControl: 5, interpretabilityEvals: 2, securityContainment: 0, training: 4, product: 2, management: 3, politics: 2 }
    traits: [trait.stability-first, trait.human-feedback-architect]
    signature:
      id: ability.clipped-and-stable
      label: Clipped and Stable
      eligibleAssignments: [capability-program, safety-program]
      activation: { type: assignment-domain-in, values: [domain.reinforcement-agency, safety.alignment-control] }
      rampWeeks: 4
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.training.technicalFailureHazard, operation: multiply, value: 0.977 }
    passive:
      id: ability.rlhf-pipeline
      label: RLHF Pipeline
      effects:
        - { target: lab.product.durationWeeks, operation: add, value: -1 }
    compact:
      id: compact.stable-updates-only
      label: Stable Updates Only
      requirement: While he leads RL & Agency, complete one stability-constrained objective validation every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: reinforcement-programme, projectTag: stability-constrained-objective, weeks: 52 }
      breachEvent: people.compact.stable-updates-only
    paperHooks:
      ids: [paper.instructgpt-following-instructions, paper.deep-rl-from-human-preferences]
    eventReactions:
      - { triggerTag: reward-hacking, line: "Constrain the update step before you trust the reward. An unconstrained policy will find the reward's weak point." }
      - { triggerTag: instruction-following-failure, line: "Check whether the reward model actually reflects what the rater meant, not merely what they clicked." }
      - { triggerTag: safety-budget-cut, line: "The stability constraint is not decorative. Remove it and you have removed the thing keeping the update modest." }
    feedLines:
      - John clipped the policy update and a training run that used to diverge stopped doing that this time.
      - The reward model's rankings agreed with the human raters again, which is the entire point of checking.
      - A trust-region proof from years ago resolved a very current disagreement in ten minutes.
      - John's team shipped a smaller, cheaper, better-behaved model and let the numbers make the case.
      - The clipped objective is, once again, doing exactly what the much more complicated version also did.
      - A new alignment technique arrived for review. John asked, first, whether it was provably stable.
    portrait:
      assetId: portrait.researcher.john-schulmann
      brief: Calm 8-bit editorial portrait; white man with short brown hair and a plain shirt, beside a policy-update diagram constrained inside a soft trust-region boundary; precise and unshowy, not photoreal.
      altText: Pixel-art portrait of John Schulmann beside a policy-update diagram constrained within a trust-region boundary.
    sources:
      - https://arxiv.org/abs/1707.06347
      - https://arxiv.org/abs/2203.02155
      - https://joschu.net/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.vladimir-mnich
    version: 1
    displayName: Vladimir Mnich
    inspirationName: Volodymyr Mnih
    inspirationSummary: Google DeepMind researcher and DQN lead author who combined deep vision with reinforcement learning to master Atari games from raw pixels.
    epithet: The Atari Pioneer
    role: Deep reinforcement learning from raw perception
    rosterCardSummary: The DQN lead author who asked one neural network to learn dozens of Atari games directly from pixels, without reading any manuals.
    biography: >-
      Volodymyr Mnih studied computing science at the University of Alberta with Csaba Szepesvári,
      then completed a machine-learning doctorate at the University of Toronto under Geoffrey
      Hinton. At Google DeepMind, he led the work on the Deep Q-Network, or DQN, which combined a
      convolutional network with reinforcement learning and learned directly from Atari screen
      pixels and game scores. Experience replay reduced correlations in the training data, while a
      separate target network helped stabilise learning. The resulting agent achieved
      human-comparable performance across dozens of games with the same architecture, algorithm and
      hyperparameters rather than a bespoke controller for each title. Published in Nature in 2015,
      the result became a landmark in deep reinforcement learning. It demonstrated that perception
      and action could be learned together at useful scale. One architecture, many games, no
      instruction booklet: the score counter had become a research supervisor in disguise.
    availability: { wave: scaling, earliestYear: 2015, poolWeight: 0.70 }
    contract: { band: competitive, baseSalaryPerCycle: 0.59, baseSigningCash: 5, auraCost: 8, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 4, optimisationScaling: 2, dataRepresentation: 2, reinforcementAgency: 5, multimodality: 3, reasoningTools: 2, roboticsEmbodiment: 1, scientificAi: 0, alignmentControl: 1, interpretabilityEvals: 1, securityContainment: 0, training: 4, product: 0, management: 2, politics: 0 }
    traits: [trait.general-recipe, trait.stabilised-training]
    signature:
      id: ability.experience-replay-discipline
      label: Experience Replay Discipline
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.reinforcement-agency] }
      rampWeeks: 4
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
    passive:
      id: ability.one-architecture-many-games
      label: Generality, Not High Score
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 3 }
    compact:
      id: compact.no-game-specific-tuning
      label: No Game-Specific Tuning
      requirement: While he leads RL & Agency, complete one shared-architecture, multi-environment validation every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: reinforcement-programme, projectTag: shared-architecture-multi-environment, weeks: 52 }
      breachEvent: people.compact.no-game-specific-tuning
    paperHooks:
      ids: [paper.deep-q-network, paper.alphago]
    eventReactions:
      - { triggerTag: reward-hacking, line: "The agent optimised the score exactly as instructed. Check the instruction before blaming the agent." }
      - { triggerTag: emergent-strategy, line: "It found the tunnel strategy because the tunnel strategy was, in fact, in the reward's interest." }
      - { triggerTag: unstable-training, line: "Add the target network back. The instability was solved for a reason." }
    feedLines:
      - Vladimir retrained the same architecture on a different game and it worked on the first attempt, again.
      - The target network stabilised a training run that had, without it, been quietly diverging.
      - An agent discovered an exploit in the scoring system, and Vladimir called this "the reward function's homework."
      - The replay buffer decorrelated a sequence of transitions that had been confusing the optimiser.
      - Vladimir declined to hand-tune the hyperparameters for the new environment, on principle.
      - The same shared architecture cleared a benchmark nobody had specifically built it for.
    portrait:
      assetId: portrait.researcher.vladimir-mnich
      brief: Focused 8-bit editorial portrait; white man with short dark hair, beside a retro game screen feeding directly into a compact convolutional network diagram; disciplined and unflashy, not photoreal.
      altText: Pixel-art portrait of Vladimir Mnich beside a retro game screen feeding into a convolutional network diagram.
    sources:
      - https://doi.org/10.1038/nature14236
      - https://www.cs.toronto.edu/~vmnih/
    portrayal: { fictionalized: true, endorsementImplied: false }
    review: { biography: source-drafted, mechanics: gdd-locked, tone: draft, reviewedOn: 2026-07-21 }

  - id: researcher.doina-precupe
    version: 1
    displayName: Doina Precupe
    inspirationName: Doina Precup
    inspirationSummary: McGill, Mila and Google DeepMind reinforcement-learning leader whose work on options gave agents a principled way to reason over extended actions.
    epithet: The Options Architect
    role: Reinforcement learning, temporal abstraction, and applied research leadership
    rosterCardSummary: The options-framework pioneer who gives reinforcement-learning agents plans longer than one nervous action at a time.
    biography: >-
      Doina Precup is a professor at McGill University, a Canada CIFAR AI Chair at Mila and a
      principal scientist leading Google DeepMind’s Montreal research team. Her work focuses on
      reinforcement learning, planning under uncertainty and temporal abstraction. With Richard
      Sutton and Satinder Singh, she developed the options framework, which lets an agent reason
      about extended courses of action rather than selecting every primitive move in isolation.
      Precup also studies applications of machine learning in health care. She co-founded the AI4Good
      Lab and the Eastern European Machine Learning Summer School to broaden access to the field.
      Across those
      projects, elegant theory is expected to survive contact with a consequential decision. An
      “option” may be formal mathematics, but it also lets the agent maintain a plan for longer than
      one nervous twitch.
    availability: { wave: scaling, earliestYear: 2017, poolWeight: 0.75 }
    contract: { band: lab-defining, baseSalaryPerCycle: 0.97, baseSigningCash: 9, auraCost: 14, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 1, optimisationScaling: 2, dataRepresentation: 2, reinforcementAgency: 5, multimodality: 1, reasoningTools: 5, roboticsEmbodiment: 2, scientificAi: 3, alignmentControl: 5, interpretabilityEvals: 3, securityContainment: 0, training: 3, product: 1, management: 5, politics: 3 }
    traits: [trait.temporal-abstraction, trait.applied-rigour]
    signature:
      id: ability.options-over-actions
      label: Options Over Actions
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.reinforcement-agency] }
      rampWeeks: 4
      effects:
        - { target: domain.reinforcement-agency.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.research.program.base:domain.reinforcement-agency.weeklyVarianceWidth, operation: multiply, value: 0.80, stackingGroup: variance-width }
    passive:
      id: ability.responsible-translation
      label: Responsible Translation
      effects:
        - { target: action.tag.coalition.auraCost, operation: multiply, value: 0.85 }
    compact:
      id: compact.theory-meets-application
      label: Theory Meets Application
      requirement: While she leads RL & Agency, complete one applied companion project every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: reinforcement-programme, projectTag: applied-companion-project, weeks: 52 }
      breachEvent: people.compact.theory-meets-application
    paperHooks:
      ids: [paper.deep-q-network, paper.alphazero]
    eventReactions:
      - { triggerTag: healthcare-deployment, line: "An elegant policy is not a clinical policy until it has answered for its uncertainty." }
      - { triggerTag: hand-engineered-shortcut, line: "Consider the option, not merely the action. Some structure is worth abstracting rather than hard-coding." }
      - { triggerTag: student-departure, line: "Good. Take the applied rigour with you and hold onto it." }
    feedLines:
      - Doina reframed the long-horizon problem as a sequence of options, and the plan finally converged.
      - A health-application pilot returned results and, more importantly, honest uncertainty bounds.
      - The Montreal office produced a paper and a deployed pilot in the same quarter, deliberately.
      - Doina asked whether the temporal abstraction was principled or merely convenient. It was, on inspection, both.
      - A mentee's dissertation defence went well, in no small part because of the applied companion project.
      - The variance in the RL programme's output narrowed without anyone loosening the question it was answering.
    portrait:
