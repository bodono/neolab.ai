        - { target: lab.compute.workloadThroughput, operation: multiply, value: 1.04 }
    passive:
      id: ability.hardware-aware-research-judgement
      label: Hardware-Aware Research Judgement
      effects:
        - { target: lab.evidence.displayedQuality, operation: add, value: 4}
    compact:
      id: compact.report_the_result_at_matched_resources
      label: Report the Result at Matched Resources
      requirement: Complete one matched-resource capability comparison every 52 weeks.
      check: { type: tagged-action-within, tags: [matched-resource-comparison], weeks: 52 }
      breachEvent: people.compact.report-the-result-at-matched-resources
