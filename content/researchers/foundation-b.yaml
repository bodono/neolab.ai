      check: { type: assignment-requires-project-tag, assignmentTag: vision-programme, projectTag: perceptual-grounding-note, weeks: 52 }
      breachEvent: people.compact.answer-to-biology
    paperHooks:
      ids: [paper.imagenet-database, paper.vision-transformer]
    eventReactions:
      - { triggerTag: benchmark-saturation, line: "A saturated benchmark has taught us what it can. Ask what the eye still notices that the metric does not." }
      - { triggerTag: dataset-shortcut, line: "The model has found the easiest correlation, not the structure of the scene. These are rarely the same thing." }
      - { triggerTag: student-departure, line: "Good. Go build the thing I would have insisted was impossible." }
    feedLines:
      - Jitendra asked why the model segmented the shadow as an object, and nobody had a clean answer yet.
      - A visiting alumnus returned to give a talk and thanked, by name, an objection from eleven years ago.
      - The grouping algorithm found the boundary a human observer also reports seeing first.
      - Jitendra rejected "it works" as a complete sentence in three separate meetings this week.
      - A perceptual grounding note was requested and, eventually, improved the actual result.
      - The advising list has again produced a researcher whose name is now on someone else's roster card.
    portrait:
      assetId: portrait.researcher.jitendra-malek
      brief: Distinguished 8-bit editorial portrait; older South Asian man with grey hair and glasses, beside an image segmented into clean perceptual regions and a small tree of advisees; scholarly and exacting, not photoreal.
      altText: Pixel-art portrait of Jitendra Malek beside a perceptually segmented image and a small advisor tree.
