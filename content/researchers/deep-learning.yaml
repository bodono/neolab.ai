      - Niki sketched a variant of the original architecture on a napkin and it, predictably, also worked.
      - The scaled model shipped a week early. Niki has already asked what ships next.
      - A co-founder meeting ran long because the architecture kept generating better product ideas than agenda items.
      - Niki rejected an elegant proof of concept for lacking, in her words, "an actual user."
      - The attention heads specialised in a way nobody explicitly designed, and Niki wrote it down anyway.
      - A junior engineer asked what it felt like to co-author the paper. Niki asked what they were building next.
