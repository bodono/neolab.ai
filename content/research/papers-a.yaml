papers:
  - id: paper.backpropagation
    version: 1
    historicity: real
    gameOrder: 1
    title: Learning representations by back-propagating errors
    authors: [David E. Rumelhart, Geoffrey E. Hinton, Ronald J. Williams]
    publicationYear: 1986
    venue: Nature
    primarySourceUrl: https://doi.org/10.1038/323533a0
    doi: 10.1038/323533a0
    historicalNote: >-
      This paper appeared in 1986. Neolab.ai deliberately allows a lab beginning in 2012 to
      rediscover older foundations; the real year remains prominent in the archive.
    education:
      playerSummary: >-
        Backpropagation made it practical to train multi-layer neural networks by sending a
        model's output error backward through its layers. Each connection receives a useful
        signal about how it contributed to the mistake. The underlying ingredients had a
        longer history, but this paper became a landmark demonstration that hidden internal
        representations could be learned rather than laboriously specified by hand.
      archiveExplanation: >-
        A neural network learns by changing its numerical weights, but a network with hidden
        layers creates a difficult bookkeeping problem: the correct answer tells us that the
        whole system was wrong, not which hidden connection deserves how much blame.
        Rumelhart, Hinton and Williams described a clear, efficient procedure for propagating
        the output error backward through differentiable layers. The chain rule turns that
        single error into a gradient for every weight, after which gradient descent can make a
        small improving update.

        The idea did not spring from nowhere, and the history of reverse-mode differentiation
        and neural-network learning includes important earlier work. The 1986 Nature paper was
        nevertheless unusually influential because it paired the method with compelling
        demonstrations of learned internal representations. Units inside a network could
        organise useful features without a programmer assigning every feature in advance.

        Backpropagation is not itself an architecture, a guarantee of good generalisation, or
        a recipe for intelligence. It is the credit-assignment engine that made much later
        deep learning trainable. Convolutional networks, recurrent models, transformers and
        many modern scientific systems all rely on variations of automatic differentiation
        and gradient-based optimisation. In the game's research graph it is therefore a
        prerequisite, not a superpower: the laboratory has learned how to improve a deep
        system, and must still discover what to build and what data or objective to give it.
      insideBaseball: The gradients are flowing. Management has requested a dashboard proving they are flowing strategically.
    domainWeights:
      domain.architectures: 0.45
      domain.optimisation-scaling: 0.35
      domain.data-representation: 0.20
    prerequisites:
      domainLevels:
        domain.architectures: 4
        domain.optimisation-scaling: 3
    baseEffort: 70
    earliestPhase: foundation
