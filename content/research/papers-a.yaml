  - id: paper.lora-low-rank-adaptation
    version: 1
    historicity: real
    gameOrder: 118
    title: "LoRA: Low-Rank Adaptation of Large Language Models"
    authors: [Edward J. Hu, Yelong Shen, Phillip Wallis, Zeyuan Allen-Zhu, Yuanzhi Li, Shean Wang, Lu Wang, Weizhu Chen]
    publicationYear: 2021
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/2106.09685
    arxiv: "2106.09685"
    historicalNote: >-
      Posted in 2021, LoRA made it cheap to specialise huge pretrained models by training only a
      small number of extra parameters, enabling an ecosystem of lightweight fine-tunes.
    education:
      playerSummary: >-
        Fully fine-tuning a large model means updating all of its billions of weights and storing a
        whole new copy for every task, which is expensive. LoRA freezes the original model and
        instead learns a small pair of low-rank matrices injected into each layer. These add up to a
        tiny fraction of the parameters, yet capture most of the benefit of full fine-tuning, and can
        be swapped in and out like interchangeable adapters.
      archiveExplanation: >-
        LoRA rests on the observation that the weight change needed to adapt a big model to a new task
        tends to have low intrinsic rank: it lives in a much smaller subspace than the full weight
        matrix. So rather than learn the full update, LoRA learns its compact low-rank factors. At
        inference the adapter can be merged into the weights, adding no latency, or kept separate so
        many task-specific adapters share one frozen base model.

        The efficiency gains reshaped practice. Specialising a frontier model dropped from a
        server-farm undertaking to something a small team could do, storage per task shrank by orders
        of magnitude, and serving many customised variants from a single base became routine.

        Neolab.ai treats LoRA as a productisation and efficiency multiplier: it lowers the cost of
        adapting and shipping specialised models and unlocks the adapter-based customisation pattern.
      insideBaseball: The full-parameter update was mostly zeroes wearing a trenchcoat. Finance was delighted; storage, relieved.
