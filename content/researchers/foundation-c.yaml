  - id: researcher.andrew-zissermann
    version: 1
    displayName: Andrew Zissermann
    inspirationName: Andrew Zisserman
    inspirationSummary: Oxford Visual Geometry Group founder, multi-view-geometry pioneer, and VGGNet co-creator whose stacks of 3×3 filters became a durable vision baseline.
    epithet: The Vision Geometer
    role: Computer vision, multi-view geometry, and visual recognition at scale
    rosterCardSummary: Oxford Visual Geometry Group founder, multi-view-geometry pioneer, and VGGNet co-creator whose stacks of 3×3 filters became a durable vision baseline.
    biography: >-
      Andrew Zisserman trained in theoretical physics at Cambridge before becoming a principal
      architect of modern computer vision. He founded Oxford's Visual Geometry Group and helped
      establish the theory and practical algorithms of multiple-view reconstruction, co-authoring
      the standard text Multiple View Geometry in Computer Vision with Richard Hartley. With Karen
      Simonyan he later built VGGNet from repeated 3×3 convolutions: the 16- and 19-layer models
      placed first in localisation and second in classification at ILSVRC 2014, then became durable
      baselines across vision research. His geometry work made cameras and scenes recoverable from
      multiple images by formalising epipolar constraints, correspondence, and reconstruction. The
      group then pushed into image and video retrieval, object and action recognition, and large
      datasets, while releasing models others could reuse rather than merely admire for wider
      scientific use. He is also a Distinguished Scientist at Google DeepMind. When a plain stack of
      small filters keeps surviving the next architectural fashion, the geometry may be trying to
      tell you something.
