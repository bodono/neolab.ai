  - id: paper.model-agnostic-meta-learning
    version: 1
    historicity: real
    gameOrder: 136
    title: Model-Agnostic Meta-Learning for Fast Adaptation of Deep Networks
    authors: [Chelsea Finn, Pieter Abbeel, Sergey Levine]
    publicationYear: 2017
    venue: International Conference on Machine Learning 34
    primarySourceUrl: https://arxiv.org/abs/1703.03400
    arxiv: "1703.03400"
    historicalNote: >-
      Introduced at ICML 2017, MAML framed meta-learning as finding an initialisation from which a
      few gradient steps suffice on a new task, and did so without adding any architecture of its
      own, which is what the "model-agnostic" in the title claims.
    education:
      playerSummary: >-
        MAML asks a different question from ordinary training: rather than finding weights that
        solve a task, it looks for an initialisation from which a handful of gradient steps solves
        a new task. Training optimises through that inner adaptation, so the objective is explicitly
        how well the model learns rather than how well it currently performs. Because the method
        touches only the initialisation, it applies to any model trained by gradient descent, which
        is what makes it model-agnostic.
      archiveExplanation: >-
        Deep networks are sample-hungry, and much of the cost is paid again for every new task.
        Approaches to few-shot learning before MAML tended to bolt on machinery: a metric space to
        compare examples in, or a recurrent controller trained to emit weight updates. Each worked,
        and each committed the practitioner to a particular architecture.

        MAML removed the machinery. It optimises the initial parameters so that one or a few
        gradient steps on a small sample of a new task produce good performance on that task. The
        training loop therefore differentiates through the adaptation step itself: the outer
        objective is the post-adaptation loss, so the gradient answers the question of which
        starting point makes learning fast rather than which starting point is already good.

        The consequences are practical and conceptual at once. Practically, it applies unchanged to
        classification, regression and reinforcement learning, because it assumes nothing beyond
        gradient descent. Conceptually, it reframed adaptability as something a training objective
        can target directly rather than a property one hopes emerges. The second-order gradients it
        requires are expensive, and much later work chased cheaper approximations, but the framing
        outlasted the specific algorithm. In Neolab.ai it opens fast-adaptation research and lifts
        the lab's agent work, where re-training for every new task is the binding cost.
      insideBaseball: The gradient of the gradient. Someone in the room asks whether this is going to be expensive, and it is.
    domainWeights:
      domain.reinforcement-agency: 0.45
      domain.robotics-embodiment: 0.30
      domain.optimisation-scaling: 0.25
    prerequisites:
      papers: [paper.deep-q-network]
      domainLevels:
        domain.reinforcement-agency: 20
    breakthroughRequirement: { programme: domain.reinforcement-agency, level: 45 }
    earliestPhase: scaling
    discovery:
      worldFirstAura: 10
