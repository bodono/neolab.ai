researchers:
  - id: researcher.karen-simonian
    version: 1
    displayName: Karén Simonian
    inspirationName: Karén Simonyan
    inspirationSummary: VGGNet co-creator and research leader whose work contributed to AlphaGo Zero, AlphaFold, Flamingo, Inflection AI, and Microsoft AI.
    epithet: The Deep Filter Stacker
    role: Deep vision architectures and large-scale generative modelling leadership
    rosterCardSummary: A VGGNet co-creator who builds deep backbones once, then watches several research teams discover new reasons to reuse them.
    biography: >-
      Karén Simonyan stacks small filters until a reusable visual backbone appears. During his
      Oxford doctorate, Karén Simonyan co-authored VGGNet with Andrew Zisserman. Its repeated 3×3
      convolutions produced a deep, simple architecture whose released models became widely reused
      in computer vision. The VGG entry placed first in ILSVRC 2014 localisation and second in
      classification, and released models invited rapid reuse elsewhere. Simonyan co-founded Vision
      Factory, joined DeepMind after its acquisition,
      and contributed to research behind AlphaGo Zero, AlphaFold, and Flamingo, a visual-language
      model designed to handle several vision-and-language tasks. He later co-founded Inflection AI
      as chief scientist, then joined Microsoft in 2024 as chief scientist of Microsoft AI. Across
      that work, Simonyan's through-line is to build a general backbone, validate it carefully, and
      let several teams reuse it. Karén's diagrams grow deeper one small block at a time; the
      downstream-project list tends to grow faster.
    availability: { wave: deep-learning, earliestYear: 2016, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.49, baseSigningCash: 4, auraCost: 6, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 3, dataRepresentation: 3, reinforcementAgency: 2, multimodality: 4, reasoningTools: 1, roboticsEmbodiment: 0, scientificAi: 1, alignmentControl: 0, interpretabilityEvals: 1, securityContainment: 0, training: 4, product: 3, management: 4, politics: 3 }
    traits: [trait.general-purpose-backbone, trait.serial-breakthrough-contributor]
    signature:
      id: ability.large-scale-deep-learning-team
      label: Large-Scale Deep Learning Team
      eligibleAssignments: [capability-program]
      activation: { type: assignment-domain-in, values: [domain.architectures] }
      rampWeeks: 5
      effects:
        - { target: domain.architectures.researchOutput, operation: multiply, value: 1.05, stackingGroup: programme-rp }
        - { target: lab.evidence.displayedQuality, operation: add, value: 5 }
    passive:
      id: ability.backbone-reused-everywhere
      label: Backbone Reused Everywhere
      effects:
        - { target: lab.research.diffusionRate, operation: add, value: 0.25 }
    compact:
      id: compact.build-the-general-backbone-first
      label: Build the General Backbone First
      requirement: While he leads Architectures, complete one validation across at least two unrelated downstream tasks every 52 weeks.
      check: { type: assignment-requires-project-tag, assignmentTag: architecture-programme, projectTag: cross-task-validation, weeks: 52 }
      breachEvent: people.compact.build-the-general-backbone-first
    paperHooks:
      ids: [paper.vision-transformer, paper.flamingo-visual-language-model]
    eventReactions:
      - { triggerTag: architecture-fad, line: "Build the backbone general enough and three other teams will find the fad's use case for you." }
      - { triggerTag: benchmark-record, line: "One leaderboard is a result. A backbone reused by five teams is an architecture." }
      - { triggerTag: scaling-proposal, line: "A general architecture pays for itself across every team that reuses it. Budget it accordingly." }
    feedLines:
      - Karén's backbone architecture got reused by a team working on a problem nobody expected it to solve.
      - A downstream team's breakthrough traced back, several layers removed, to an architecture Karén built years earlier.
      - The large-scale deep learning team shipped its third unrelated success this quarter, off the same shared backbone.
      - Karén declined to over-specialise the architecture for one product, on the grounds that generality compounds.
      - A new research team integrated within a week, largely because the underlying architecture was already shared.
      - Karén stacked another small filter onto the diagram. Three downstream groups immediately found uses for it.
    portrait:
      assetId: portrait.researcher.karen-simonian
      brief: Composed 8-bit editorial portrait; Armenian man with dark hair and a confident expression, beside a deep architecture diagram branching into several unrelated downstream applications; foundational and versatile, not photoreal.
      altText: Pixel-art portrait of Karén Simonian beside a deep architecture diagram branching into several downstream applications.
    sources:
