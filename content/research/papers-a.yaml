    title: "Constitutional AI: Harmlessness from AI Feedback"
    authors: [Yuntao Bai, Saurav Kadavath, Sandipan Kundu, Amanda Askell, Jackson Kernion, Andy Jones, Anna Chen, Anna Goldie, Azalia Mirhoseini, Cameron McKinnon, Carol Chen, Catherine Olsson, Christopher Olah, Danny Hernandez, Dawn Drain, Deep Ganguli, Dustin Li, Eli Tran-Johnson, Ethan Perez, Jamie Kerr, Jared Kaplan, Jackson Kernion, Jared Mueller, Jeeyoon Hyun, Joshua Landau, Kamal Ndousse, Landon Goldberg, Liane Lovitt, Nelson Elhage, Nicholas Schiefer, Noemi Mercado, Nova DasSarma, Robert Lasenby, Robin Larson, Sam Ringer, Scott Johnston, Shauna Kravec, Sheer El Showk, Stanislav Fort, Tamera Lanham, Timothy Telleen-Lawton, Tom Conerly, Tom Henighan, Tristan Hume, Samuel R. Bowman, Zac Hatfield-Dodds, Ben Mann, Dario Amodei, Nicholas Joseph, Sam McCandlish, Tom Brown, Jared Kaplan]
    publicationYear: 2022
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/2212.08073
    arxiv: "2212.08073"
    historicalNote: >-
      Posted in December 2022, this paper trained a harmlessness-focused assistant primarily
      using AI-generated feedback guided by a written set of principles, reducing reliance on
      large volumes of human-labelled harmful-content comparisons.
    education:
      playerSummary: >-
        This paper trained a more harmless assistant by having a model critique and revise its
        own outputs against a written set of principles, then used AI-generated preference
        judgements—rather than large amounts of human labelling of harmful content—to further
        train the system with reinforcement learning. The explicit written principles made the
        resulting behaviour more inspectable and adjustable than a purely example-based approach,
        while substantially reducing the amount of harmful content human raters needed to review.
      archiveExplanation: >-
        Reinforcement learning from human feedback typically requires substantial human labelling
        of harmful or borderline model outputs, which is costly and exposes labellers to
        distressing content. Bai, Askell, Olah and a large Anthropic research team proposed
        Constitutional AI: supply the model with an explicit written set of principles, then use
        the model itself, guided by those principles, to critique and revise its own outputs
        during a supervised stage, and to generate preference comparisons during a subsequent
        reinforcement-learning stage.

        This two-stage recipe—supervised self-critique followed by reinforcement learning from
        AI-generated feedback rather than human-generated feedback for harmlessness—produced an
        assistant that was both more harmless and, notably, less evasive than purely human-
        feedback-trained baselines, which sometimes learned to deflect any sensitive question
        rather than engage helpfully with it. Because the guiding principles were written down
        explicitly, the resulting behaviour was more transparent and more directly editable than
        behaviour implicitly encoded in thousands of individual human labels.

        The approach still depends on the underlying model's capability to critique itself
        usefully and does not remove the need for careful human oversight of the principles
        themselves and the resulting behaviour. Neolab.ai treats this as a genuine alignment-
        technique advance: it strengthens safety-relevant capability research and reduces the
        human-review burden of harmlessness training, while the fidelity of any AI-generated
        feedback remains only as trustworthy as the evaluation infrastructure watching it.
      insideBaseball: The model has been asked to critique its own answer against a written constitution. The constitution's second draft was, itself, substantially revised by committee.
