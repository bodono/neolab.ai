      theoretical and practical footing.
    education:
      playerSummary: >-
        Schulman and colleagues developed a policy-optimisation method that constrains each update
        to stay within a "trust region" of the previous policy, giving theoretical guarantees of
        monotonic improvement and, in practice, far more reliable training on continuous-control
        and Atari-style tasks than earlier policy-gradient methods.
      archiveExplanation: >-
        Naively large policy-gradient updates can catastrophically worsen a policy, since the data
        used to estimate the gradient was collected under the old policy and may not describe the
        new one well. Schulman and colleagues bounded each update using a constraint on how far the
        new policy's behaviour could drift from the old one, expressed via KL-divergence, and
        derived a practical algorithm, trust region policy optimization, implementing this
        constrained update with strong theoretical guarantees of monotonic improvement.

        The resulting method reliably trained large neural network policies on difficult continuous
        control tasks, such as simulated robotic locomotion and swimming, as well as Atari games
        played directly from pixels, at a time when policy-gradient methods were still viewed as
        comparatively fragile and hard to tune.

        The full trust-region computation was relatively expensive per update, which motivated
        simpler approximations soon afterward. Neolab.ai treats this as the theoretical foundation
        beneath the player's later, cheaper policy-optimisation research, meaningfully strengthening
        reinforcement-agency research quality.
      insideBaseball: The policy is not permitted to wander far from where it started. The travel-expense policy enforces a similar constraint, less elegantly.
