        or sorting a sequence, directly from input-output examples.
      archiveExplanation: >-
        Standard recurrent networks store everything they know in a fixed-size hidden state, which
        makes precise, long-range memory awkward. Graves, Wayne, and Danihelka instead coupled a
        controller network to an external memory matrix, with differentiable read and write
        "heads" that could attend to memory locations by content or by a shifting mechanism
        reminiscent of a Turing machine's tape.

