  - id: researcher.andy-barto
    version: 1
    displayName: Andy Barto
    inspirationName: Andrew Barto
    inspirationSummary: A co-founder of modern reinforcement learning whose work with Richard Sutton on temporal-difference methods and its standard textbook earned the 2024 Turing Award.
    epithet: The Co-Architect of Reinforcement
    role: Reinforcement-learning foundations
    rosterCardSummary: A founding reinforcement-learning theorist whose work with Richard Sutton built temporal-difference methods, policy gradients, and the field's standard textbook.
    biography: >-
      Andrew Barto helped build the language in which reinforcement learning is still spoken. At the
      University of Massachusetts Amherst, he and his doctoral student Richard Sutton turned
      learning from delayed reward into a general computational framework. Together and with other
      collaborators they developed temporal-difference learning, policy-gradient methods, and ways
      for neural networks to represent learned functions. They also combined learning with planning,
      letting agents acquire models of environments, and later connected temporal-difference ideas
      back to dopamine signals in neuroscience. Their 1998 book, Reinforcement Learning: An
      Introduction, became the field's standard reference. Barto and Sutton received the 2024 ACM
      A.M. Turing Award for this conceptual and algorithmic foundation. The prize arrived decades
      after the work began; the algorithms had already spent the intervening years collecting
      rewards.
    availability: { wave: foundation, earliestYear: 2012, poolWeight: 0.75 }
    contract: { band: lab-defining, baseSalaryPerCycle: 1.11, baseSigningCash: 10, auraCost: 16, overrideExplanation: Priced on overall measured research strength. }
