      architectures built around learning from interaction. With Andrew Barto he wrote
      Reinforcement Learning: An Introduction, a standard textbook that organised the field's
      mathematics, algorithms and central questions into a coherent account. His work repeatedly
      returns to methods that learn from experience and improve as computation becomes available,
      rather than relying mainly on hand-coded domain knowledge. His broader interests include
      animal-learning theory and representing knowledge directly in terms of an agent's
      experience. His Dyna architecture integrated learning, planning and acting in a single
      adaptive agent. That stance gives his research a long time horizon and a simple challenge
      to every elaborate shortcut: if the general method gets more data and more compute, which
      approach is still standing?
