  - id: paper.wasserstein-gan
    version: 1
    historicity: real
    gameOrder: 58
    title: Wasserstein GAN
    authors: [Martin Arjovsky, Soumith Chintala, Léon Bottou]
    publicationYear: 2017
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/1701.07875
    arxiv: "1701.07875"
    historicalNote: >-
      Posted in 2017, this paper replaced the standard generative adversarial objective with a
      Wasserstein-distance formulation, substantially improving GAN training stability.
    education:
      playerSummary: >-
        Arjovsky, Chintala, and Bottou reformulated adversarial training around the Wasserstein,
        or earth-mover's, distance between real and generated data distributions, giving the
        discriminator a smoother, more informative signal to train against. The change
        substantially reduced the notorious instability and mode collapse of earlier generative
        adversarial networks.
      archiveExplanation: >-
        Standard generative adversarial training pits a generator against a discriminator using a
        divergence measure that can vanish or behave erratically when the two distributions barely
        overlap, which was a major source of the training instability and mode collapse that
        plagued early GANs. Arjovsky, Chintala, and Bottou proposed measuring the distance between
        distributions using the Wasserstein distance instead, which remains meaningful and
        smoothly varying even when distributions do not overlap.

        Implementing this required constraining the discriminator, now functioning as a critic, to
        be Lipschitz-continuous, which the original paper enforced through weight clipping. The
        resulting training curves were far more interpretable and correlated more reliably with
        sample quality, and mode collapse became noticeably less common, giving practitioners a
        real debugging signal where before there had often been only guesswork.

