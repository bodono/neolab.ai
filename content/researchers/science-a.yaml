  - id: researcher.marika-zitnik
    version: 1
    displayName: Marika Zitnik
    inspirationName: Marinka Zitnik
    inspirationSummary: Harvard biomedical-AI researcher who uses graphs and biological structure to learn where labelled examples are scarce.
    epithet: The Rare-Disease Graph Weaver
    role: Graph representation learning for biomedicine
    rosterCardSummary: A Harvard biomedical researcher who answers "we hardly have any examples" by drawing a very large graph of everything biology already knows.
    biography: >-
      Marinka Zitnik is an associate professor of biomedical informatics at Harvard Medical School,
      with affiliations at the Kempner Institute, the Broad Institute and the Harvard Data
      Science Initiative. She completed degrees in computer science and mathematics at the
      University of Ljubljana and later worked as a postdoctoral researcher at Stanford. Her lab
      develops graph-representation and machine-learning methods for medicine and therapeutic
      design, especially settings where labelled examples are scarce but biological relationships
      provide useful structure. Applications include rare-disease diagnosis, drug-response
      prediction and integrating heterogeneous biomedical data. She co-founded Therapeutics Data
      Commons and leads Harvard's AI for Science initiative. Her laboratory's broader aim is to
      develop AI foundations that advance the scientific understanding of medicine and
      therapeutic design. Her work also includes models for predicting side effects caused by
      drug combinations and methods that transfer biological knowledge across diseases. When the
      dataset is too small to support brute-force learning, her preferred response is not to
      invent more patients or drug targets; it is to encode more of the biology already known.
    availability: { wave: frontier, earliestYear: 2020, poolWeight: 0.45 }
    contract: { band: competitive, baseSalaryPerCycle: 0.54, baseSigningCash: 4, auraCost: 7, overrideExplanation: Priced on overall measured research strength. }
