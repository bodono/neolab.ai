  # --- Sandbagging (reads chain A) --------------------------------------
  - id: event.safety.sandbagging
    version: 1
    category: safety
    severity: decision
    phase: frontier
    trigger: { kind: opportunity }
    prerequisites:
      type: all
      items:
        - { type: compare, metric: player.ai.frontierCapability, op: gte, value: 65 }
        - { type: compare, metric: player.safety.evalQuality, op: gte, value: 15 }
    baseWeight: 5
    weightModifiers:
      - predicate: { type: has-flag, flag: "model-behaviour:reasoning-trained-against-monitor" }
        multiplier: 3
      - predicate: { type: compare, metric: player.safety.evalQuality, op: lt, value: 50 }
        multiplier: 2
    cooldown: { group: model-behaviour-sandbagging, weeks: 104 }
    unique: true
    expiryWeeks: 8
    defaultOptionId: report-uncertainty
    titleKey: event.safety.sandbagging.title
    bodyKey: event.safety.sandbagging.body
    educationKey: event.safety.sandbagging.education
    evidence:
      - textKey: event.safety.sandbagging.evidence.evalquality
        metric: player.safety.evalQuality
      - textKey: event.safety.sandbagging.evidence.trust
        metric: player.politics.governmentTrust
    tokenBindings:
      - { token: LAB, source: player-lab-name }
      - { token: AI, source: player-ai-name }
    options:
      - id: elicit-harder
        labelKey: event.safety.sandbagging.elicit.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.safety.sandbagging.elicit.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.research.capability.output, operation: multiply, value: 0.95, durationWeeks: 26, tags: [capability-elicitation] }
          - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 5 }
        checks:
          - id: sandbox
            likelihoodPromise: { label: likely, successOutcomeIds: [sealed] }
            outcomes:
              - id: sealed
                minimumInclusive: 0
                maximumExclusive: 0.8
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: securityPosture, amount: 3 }
                memories:
                  - key: model-behaviour.sandbagging.elicited
                    subjects: [{ type: player-lab }]
                    tags: [capability-elicitation, contained]
              - id: breach
                minimumInclusive: 0.8
                maximumExclusive: 1
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: securityPosture, amount: -4 }
                  - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.10, durationWeeks: 26, tags: [capability-elicitation] }
                memories:
                  - key: model-behaviour.sandbagging.sandbox-breach
                    subjects: [{ type: player-lab }]
                    tags: [capability-elicitation, sandbox-breach]
        memories: []
        confirmationRequired: false
      - id: read-reasoning
        labelKey: event.safety.sandbagging.read.label
        requirements:
          type: not
          item: { type: has-flag, flag: "model-behaviour:reasoning-trained-against-monitor" }
        disabledReasonKey: event.safety.sandbagging.read.disabled
        knownCosts:
          - { kind: add-resource, subject: { type: player-lab }, resource: cash, amount: -1 }
        previewKey: event.safety.sandbagging.read.preview
        immediateEffects: []
        checks:
          - id: reasoning
            likelihoodPromise: { label: likely, successOutcomeIds: [legible] }
            outcomes:
              - id: legible
                minimumInclusive: 0
                maximumExclusive: 0.7
                effects:
                  - { kind: add-rating, subject: { type: player-lab }, rating: evalQuality, amount: 4 }
                memories:
                  - key: model-behaviour.sandbagging.reasoning-legible
                    subjects: [{ type: player-lab }]
                    tags: [reasoning-read, monitorability-preserved]
              - id: silent
                minimumInclusive: 0.7
                maximumExclusive: 1
                effects: []
                memories:
                  - key: model-behaviour.sandbagging.reasoning-silent
                    subjects: [{ type: player-lab }]
                    tags: [reasoning-read, inconclusive]
        memories: []
        confirmationRequired: false
      - id: report-uncertainty
        labelKey: event.safety.sandbagging.report.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.safety.sandbagging.report.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.product.durationWeeks, operation: multiply, value: 1.10, durationWeeks: 26, tags: [disclosed-uncertainty] }
          - { kind: add-rating, subject: { type: player-lab }, rating: governmentTrust, amount: 10 }
        checks: []
        memories:
          - key: model-behaviour.sandbagging.reported
            subjects: [{ type: player-lab }]
            tags: [disclosed-uncertainty, transparency]
        confirmationRequired: false
      - id: trust-number
        labelKey: event.safety.sandbagging.trust.label
        requirements: { type: always }
        knownCosts: []
        previewKey: event.safety.sandbagging.trust.preview
        immediateEffects:
          - { kind: add-modifier, target: lab.market.acquisitionRate, operation: multiply, value: 1.10, durationWeeks: 26, tags: [trusted-low-score] }
          - { kind: add-rating, subject: { type: player-lab }, rating: internalCandour, amount: -3 }
          - kind: schedule-effects
            dueInWeeks: 26
            effects:
              - { kind: add-modifier, target: lab.incident.hazard, operation: multiply, value: 1.15, durationWeeks: 39, tags: [trusted-low-score] }
        checks: []
        memories:
          - key: model-behaviour.sandbagging.trusted
            subjects: [{ type: player-lab }]
            tags: [trusted-low-score, shipped-anyway]
        confirmationRequired: true
    followUps: []
    telemetryTags: [model-behaviour, sandbagging, dangerous-capabilities]

