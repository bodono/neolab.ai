      from diverse feedback, preserve uncertainty about those objectives, collaborate with people,
      and behave cautiously when confidence is unwarranted. The agenda spans robot hand-offs,
      assistance, autonomous driving, recommender systems, games, and language models. Dragan now
      heads AI Safety and Alignment at Google DeepMind while on leave from Berkeley, leading teams
      responsible for current Gemini safety and for keeping safety progress alongside advancing
      capabilities. Her honours include a Sloan Fellowship, NSF CAREER award, and PECASE. Anca's
      contribution is both technical and organisational: alignment is not a final inspection after
      capability work. It is the interaction in which the system learns, checks, and
      sometimes has the good sense to ask what the human meant.
