  - id: paper.batch-normalization
    version: 1
    historicity: real
    gameOrder: 15
    title: "Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift"
    authors: [Sergey Ioffe, Christian Szegedy]
    publicationYear: 2015
    venue: International Conference on Machine Learning
    primarySourceUrl: https://proceedings.mlr.press/v37/ioffe15.html
    historicalNote: >-
      Published at ICML 2015, batch normalisation quickly became a standard component of deep
      convolutional networks, even as explanations of exactly why it helps continued to evolve.
    education:
      playerSummary: >-
        Batch normalisation standardises intermediate activations using minibatch statistics and
        then learns an appropriate scale and offset. It allowed higher learning rates, reduced
        sensitivity to initialisation and dramatically shortened training in the reported image
        models. The technique became ubiquitous, although later work questioned whether its
        original “internal covariate shift” explanation captured the whole story.
      archiveExplanation: >-
        The distribution entering an internal layer changes as earlier layers learn. Ioffe and
        Szegedy argued that this “internal covariate shift” makes deep optimisation harder: every
        layer must continually adapt to moving inputs. Their batch-normalisation operation uses
        the mean and variance of a minibatch to standardise a layer's activations, then applies
        learned scale and shift parameters so the network retains expressive freedom.

        In the paper's experiments, batch normalisation supported much higher learning rates,
        reduced the need for careful initialisation, sometimes reduced reliance on dropout, and
        reached a target accuracy in far fewer training steps. It rapidly became a default part
        of many convolutional architectures and helped enable very deep visual networks.

        Subsequent research showed that the mechanism is subtler than simply holding every
        internal distribution fixed. Smoother optimisation, scale effects and noise from batch
        statistics all contribute to its behaviour. Its performance also depends on batch size
        and differs between training and inference, motivating other normalisation methods. This
        is a useful scientific lesson: a technique can be robustly valuable while its first
        explanatory story remains incomplete. Neolab.ai rewards the practical acceleration and
        reliability, while an inside-baseball event lets researchers debate the causal narrative
        without making the player's already-completed training runs retroactively stop working.
      insideBaseball: Training is fourteen times faster. The explanation has entered a longer optimisation schedule.
