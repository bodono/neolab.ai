  - id: researcher.danny-zhou
    version: 1
    displayName: Danny Zhou
    inspirationName: Denny Zhou
    inspirationSummary: Founder of the Google Brain and DeepMind reasoning team whose work on chain-of-thought, self-consistency, and least-to-most prompting helped make intermediate reasoning a practical LLM method.
    epithet: The Reasoning Team Founder
    role: Large language model reasoning research leadership
    rosterCardSummary: The reasoning-team founder who gave language models scratch paper, several attempts, and increasingly fewer excuses.
    biography: >-
      Denny Zhou founded the Reasoning Team at Google Brain, later Google DeepMind, around the
      proposition that large language models should generate new knowledge from what they already
      know. His collaborations helped establish several methods now central to language-model
      reasoning. Chain-of-thought prompting elicits intermediate steps; self-consistency samples
      several reasoning paths and selects the answer they support most consistently; least-to-most
      prompting decomposes a hard problem into simpler ones solved in sequence. Zhou's group also
      worked on instruction tuning, self-debugging, tool-making, and using language models as
      optimisers. Together these projects changed the practical question from whether a pretrained
      model contains useful reasoning capability to how that capability can be elicited, checked,
      and improved. Denny gives the model the computational equivalent of scratch paper, asks it to
      try more than once, and remains interested in whether the routes agree. Scale supplies the
      ingredients; his work is about getting them to form an argument rather than a longer
      completion. Each method makes reasoning observable without claiming it infallible.
    availability: { wave: scaling, earliestYear: 2021, poolWeight: 0.50 }
    contract: { band: major, baseSalaryPerCycle: 0.73, baseSigningCash: 6, auraCost: 10, overrideExplanation: Priced on overall measured research strength. }
    skills: { architectures: 5, optimisationScaling: 2, dataRepresentation: 1, reinforcementAgency: 0, multimodality: 0, reasoningTools: 5, roboticsEmbodiment: 0, scientificAi: 0, alignmentControl: 5, interpretabilityEvals: 5, securityContainment: 0, training: 3, product: 1, management: 4, politics: 2 }
