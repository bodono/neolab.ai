  - id: paper.sparse-mixture-of-experts
    version: 1
    historicity: real
    gameOrder: 18
    title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer"
    authors: [Noam Shazeer, Azalia Mirhoseini, Krzysztof Maziarz, Andy Davis, Quoc V. Le, Geoffrey E. Hinton, Jeff Dean]
    publicationYear: 2017
    venue: International Conference on Learning Representations
    primarySourceUrl: https://arxiv.org/abs/1701.06538
    arxiv: "1701.06538"
    historicalNote: >-
      The 2017 work realised large-scale conditional computation using a learned gate and many
      sparsely activated expert subnetworks.
    education:
      playerSummary: >-
        Sparse mixture-of-experts models increase parameter capacity without using every
        parameter for every example. A learned gate routes each input to a small subset of
        specialised feed-forward experts. This paper demonstrated models with enormous capacity
        and relatively modest compute per example, establishing a scaling technique that later
        became important in very large language models.
      archiveExplanation: >-
        Model capacity usually grows together with computation: add parameters and every example
        must pass through more arithmetic. Conditional computation promises a different tradeoff.
        A model can contain many components while activating only the ones relevant to a given
        input. Earlier versions of this idea were difficult to train efficiently on modern
        parallel hardware.

        Shazeer and colleagues introduced a sparsely gated mixture-of-experts layer containing up
        to thousands of feed-forward subnetworks. A trainable gate selects only a small number of
        experts for each example. Auxiliary objectives encourage balanced routing so a few experts
        do not receive all the work. Integrated between recurrent layers, the system reached up
        to 137 billion parameters and improved language modelling and translation with much less
        than proportional computational cost.

        Sparse activation does not make parameters or infrastructure free. Expert routing can
        collapse, communication between devices can dominate, memory use remains substantial,
        and serving systems become more complex. The core insight nevertheless changed the
        frontier scaling menu: capacity and per-token computation could be partly decoupled. In
        Neolab.ai the paper improves effective training capacity and serving economics after a
        serious systems investment. It also unlocks routing-collapse incidents, because an
        outrageously large network deserves an outrageously specific way to be broken.
      insideBaseball: Only two experts wake for each token. All 2,048 experts have nevertheless requested headcount plans.
    domainWeights:
      domain.architectures: 0.45
      domain.optimisation-scaling: 0.45
      domain.data-representation: 0.10
