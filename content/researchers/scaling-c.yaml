  - id: researcher.jacob-steinhart
    version: 1
    displayName: Jacob Steinhart
    inspirationName: Jacob Steinhardt
    inspirationSummary: Berkeley statistician, Concrete Problems in AI Safety co-author, and Transluce founder who turns safety, forecasting, and model understanding into measurable public work.
    epithet: The Forecast Calibrator
    role: ML safety, robustness, and open model-understanding infrastructure
    rosterCardSummary: "A Berkeley statistician who makes safety claims, capability forecasts, and model explanations submit to the same awkward ritual: write them down and score them later."
    biography: >-
      Jacob Steinhardt makes AI safety concrete enough to measure and public enough to challenge.
      He is an associate professor of Statistics and EECS at UC Berkeley and founder and CEO of
      Transluce, a nonprofit building open tools for understanding frontier AI systems. After a
      Stanford doctorate with Percy Liang and a postdoc at OpenAI, Steinhardt co-authored
      "Concrete Problems in AI Safety" with Dario Amodei, Chris Olah, Paul Christiano, John
      Schulman, and Dan Mané. The paper organised accident risk around practical problems including
      reward hacking, scalable supervision, safe exploration, and distributional shift. His
      Berkeley research has since covered robustness, latent representations, emergent behaviour,
      model measurement, and forecasting. In one programme, professional forecasters made
      time-stamped predictions about future AI benchmark results, then had to live through the
      unusually healthy experience of being scored. Transluce extends that accountability to model
      understanding through open technical infrastructure. Jacob's preferred claim has a precise
      definition, a confidence interval, and a future date on which nobody gets to remember, in
      hindsight, only the predictions that aged well.
