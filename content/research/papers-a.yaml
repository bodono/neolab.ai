  - id: paper.ai-safety-via-debate
    version: 1
    historicity: real
    gameOrder: 86
    title: AI safety via debate
    authors: [Geoffrey Irving, Paul Christiano, Dario Amodei]
    publicationYear: 2018
    venue: arXiv preprint
    primarySourceUrl: https://arxiv.org/abs/1805.00899
    arxiv: "1805.00899"
    historicalNote: >-
      Posted in 2018, this paper proposed training agents through self-play in a zero-sum debate
      game judged by a human, as a route to scalable oversight of agents whose reasoning exceeds
      what a human judge could directly verify.
    education:
      playerSummary: >-
        Irving, Christiano, and Amodei proposed training two agents to debate a question or a
        proposed action, each arguing a side and pointing out flaws in the other's argument, with a
        human judging only the debate's outcome rather than verifying every step of either agent's
        reasoning directly. The proposal aimed to make sound oversight possible even once an
        agent's reasoning grows too complex or specialised for a human to check unaided.
      archiveExplanation: >-
        As agents grow more capable, a human overseer may no longer be able to directly verify
        every step of their reasoning, creating a scalable-oversight problem: how do you supervise
        a system smarter, in some relevant sense, than the person supervising it? Irving,
        Christiano, and Amodei proposed a game-theoretic answer: train two copies of an agent to
        debate opposite sides of a question through self-play, each incentivised to expose flaws
        or dishonesty in the other's argument, with a human judge deciding only which debater made
        the more convincing, truthful case.

        The hope was that lying or unsupported claims become easier for an opposing debater to
        expose than to make convincingly in the first place, so that optimal play in the debate
        game would push both agents toward truthful, well-supported argument even on questions the
        human judge alone could not have verified from scratch, similar in spirit to how a
        courtroom cross-examination can surface truth a judge could not derive unaided.

        The proposal's soundness depends on assumptions about debate dynamics that were, at
        publication, theoretical and only partially tested empirically, and later work would need
        to establish how well the mechanism actually holds under realistic conditions. Neolab.ai
        treats this as an alignment-control unlock opening the scalable-oversight branch of safety
        research.
      insideBaseball: Two copies of the same model argue opposite sides and a human judges the winner. Several board meetings already resemble this format without the safety benefits.
