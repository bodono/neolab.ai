        Howard and colleagues built compact convolutional networks around depthwise-separable
        convolutions, which factor a standard convolution into much cheaper separate steps, and
        introduced simple width and resolution controls so a single architecture family could be
        tuned to fit a given latency or size budget. This made strong image models practical on
        phones and embedded devices rather than only in data centres.
